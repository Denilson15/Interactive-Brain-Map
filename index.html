<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="description"
            content="Interactive 3D brain map for studying neuroscience, psychology and medicine."
        />
        <title>Interactive Brain Map</title>
    </head>
    <body data-stage="loading">
        <div class="app">
            <header class="app-header">
                <div class="app-brand">
                    <h1 class="brand" data-i18n="title">
                        Interactive Brain Map
                    </h1>
                    <p class="stats" id="stats"></p>
                </div>
                <div
                    class="segmented lang"
                    role="group"
                    aria-label="Language / Idioma"
                >
                    <button type="button" data-lang="en" aria-pressed="true">
                        EN
                    </button>
                    <button type="button" data-lang="es" aria-pressed="false">
                        ES
                    </button>
                </div>
            </header>

            <section class="workspace">
                <div class="stage" id="stage">
                    <canvas
                        id="brain"
                        aria-label="Rotatable 3D model of the human brain"
                    ></canvas>
                    <div class="labels" id="labels"></div>
                    <div class="tip" id="tip" hidden></div>
                    <div class="toolbar">
                        <button
                            class="button button--stage"
                            id="upBtn"
                            type="button"
                            title="Go up one level (Esc)"
                            data-i18n-title="upTitle"
                        >
                            <svg
                                class="icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path d="M12 19V5M5 12l7-7 7 7" />
                            </svg>
                            <span data-i18n="up">Up a level</span>
                        </button>
                        <button
                            class="button button--stage more-button"
                            id="moreBtn"
                            type="button"
                            aria-expanded="false"
                            aria-controls="tbMore"
                        >
                            <span data-i18n="controls">Controls</span>
                            <svg
                                class="icon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </button>
                        <div class="toolbar-more" id="tbMore">
                            <label class="slider" for="spread">
                                <span data-i18n="spread">Spread</span>
                                <input
                                    id="spread"
                                    type="range"
                                    min="0"
                                    max="100"
                                    value="0"
                                />
                            </label>
                            <label class="slider" for="opac">
                                <span data-i18n="opacity">Opacity</span>
                                <input
                                    id="opac"
                                    type="range"
                                    min="0"
                                    max="100"
                                    value="20"
                                />
                            </label>
                            <label class="slider" for="bright">
                                <span data-i18n="brightness">Brightness</span>
                                <input
                                    id="bright"
                                    type="range"
                                    min="0"
                                    max="100"
                                    value="50"
                                />
                            </label>
                            <button
                                class="button button--stage"
                                id="lblBtn"
                                type="button"
                                aria-pressed="true"
                                data-i18n="labels"
                            >
                                Labels
                            </button>
                            <button
                                class="button button--stage one-color"
                                id="oneColorBtn"
                                type="button"
                                aria-pressed="false"
                                title="Show the whole brain in one color"
                                data-i18n-title="oneColorTitle"
                            >
                                <span
                                    class="one-color-dot"
                                    aria-hidden="true"
                                ></span>
                                <span
                                    class="one-color-label"
                                    data-i18n="oneColor"
                                    >One color</span
                                >
                            </button>
                            <button
                                class="button button--stage"
                                id="resetBtn"
                                type="button"
                            >
                                <svg
                                    class="icon"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >
                                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                                    <path d="M3 3v5h5" />
                                </svg>
                                <span data-i18n="reset">Reset view</span>
                            </button>
                        </div>
                    </div>
                    <p class="stage-hint" id="hint" data-i18n="hint">
                        Drag to rotate. Scroll or pinch to zoom. Select a part
                        to open it; press Esc to go back up.
                    </p>
                    <div class="stage-legend" id="condbar" hidden></div>
                    <!-- Shown from the first paint until the model is built.
                         Replaced by #stageError if the 3D view can't run. -->
                    <div class="stage-status" id="stageStatus" role="status">
                        <p class="stage-status-title" id="stageStatusTitle">
                            <span data-i18n="loadingTitle"
                                >Loading the 3D brain</span
                            >
                        </p>
                        <progress
                            id="stageProgress"
                            max="100"
                            value="0"
                            aria-labelledby="stageStatusTitle"
                        ></progress>
                        <p class="stage-status-note" data-i18n="loadingNote">
                            You can read and search while it loads.
                        </p>
                        <noscript>
                            <p class="stage-status-note">
                                The 3D brain needs JavaScript. Turn it on in
                                your browser settings to explore the model.
                            </p>
                        </noscript>
                    </div>
                    <div
                        class="stage-status stage-error"
                        id="stageError"
                        role="alert"
                        hidden
                    ></div>
                </div>
                <div class="section-map" id="chips"></div>
            </section>

            <aside class="panel">
                <div
                    class="grab"
                    id="grab"
                    role="button"
                    tabindex="0"
                    aria-label="Resize panel"
                >
                    <span></span>
                </div>
                <div class="tabs" role="tablist">
                    <button
                        class="tab"
                        role="tab"
                        type="button"
                        id="tab-browse"
                        aria-selected="false"
                        data-i18n="tabBrowse"
                    >
                        Browse
                    </button>
                    <button
                        class="tab"
                        role="tab"
                        type="button"
                        id="tab-region"
                        aria-selected="true"
                        data-i18n="tabRegion"
                    >
                        Region
                    </button>
                    <button
                        class="tab"
                        role="tab"
                        type="button"
                        id="tab-psych"
                        aria-selected="false"
                        data-i18n="tabPsych"
                    >
                        Psychology
                    </button>
                    <button
                        class="tab"
                        role="tab"
                        type="button"
                        id="tab-disease"
                        aria-selected="false"
                        data-i18n="tabDisease"
                    >
                        Diseases
                    </button>
                    <button
                        class="tab"
                        role="tab"
                        type="button"
                        id="tab-gloss"
                        aria-selected="false"
                        data-i18n="tabGloss"
                    >
                        Dictionary
                    </button>
                </div>
                <p class="notice" id="notice" role="status" hidden></p>
                <div class="view" id="view-browse" role="tabpanel" hidden>
                    <h2 class="section-title" data-i18n="browseEyebrow">
                        Every section of the brain
                    </h2>
                </div>
                <div class="view" id="view-region" role="tabpanel"></div>
                <div class="view" id="view-psych" role="tabpanel" hidden></div>
                <div
                    class="view"
                    id="view-disease"
                    role="tabpanel"
                    hidden
                ></div>
                <div class="view" id="view-gloss" role="tabpanel" hidden>
                    <label for="gq" class="field" data-i18n="glossSearch"
                        >Search terms, regions and conditions</label
                    >
                    <input
                        class="search"
                        id="gq"
                        type="search"
                        placeholder="e.g. synapse, putamen, PTSD"
                        data-i18n-ph="glossPh"
                        autocomplete="off"
                    />
                    <div class="filter-row" id="gfilters"></div>
                    <div class="filter-row recent" id="recent"></div>
                    <p class="meta count" id="gcount"></p>
                    <ul class="list dictionary" id="glist"></ul>
                </div>
            </aside>
        </div>

        <div
            class="popover pop"
            id="pop"
            role="dialog"
            aria-live="polite"
            hidden
        ></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
