<script>
window.I18N_ES=window.I18N_ES||{nodes:{},conds:{},glossary:{}};
Object.assign(window.I18N_ES.conds,{
'disease:alzheimers':{name:'Enfermedad de Alzheimer',short:'Alzheimer',aka:['enfermedad de alzheimer','alzheimer','alzheimers','mal de alzheimer','demencia tipo alzheimer'],
 summary:'La enfermedad de Alzheimer es una enfermedad cerebral progresiva y la causa más frecuente de demencia. Se acumulan dos proteínas anómalas: el beta-amiloide forma placas entre las neuronas y la tau forma ovillos dentro de ellas. Las neuronas y las sinapsis se pierden gradualmente, primero en las regiones de la memoria del lóbulo temporal medial y después en gran parte de la corteza. Los cambios cerebrales comienzan 15–20 años antes de los síntomas.',
 overview:['La enfermedad de Alzheimer es una enfermedad neurodegenerativa progresiva y la causa más frecuente de demencia, responsable de un estimado del 60–80 % de los casos. Destruye lentamente la memoria, el pensamiento y, con el tiempo, la capacidad de realizar las tareas cotidianas.',
  'La definen dos proteínas anómalas. El beta-amiloide se agrupa en placas entre las neuronas, y la tau, que normalmente estabiliza el esqueleto interno de las neuronas, se pliega mal y forma ovillos dentro de ellas. El amiloide se acumula primero, 15–20 años antes de los síntomas; la tau se propaga a lo largo de redes conectadas y se corresponde estrechamente con los síntomas y la pérdida neuronal. La inflamación causada por la microglía y el daño de los vasos sanguíneos pequeños se suman a la lesión.',
  'Como la tau suele propagarse desde el lóbulo temporal medial hacia fuera, la enfermedad sigue un orden reconocible: primero la memoria reciente, luego el lenguaje, las habilidades espaciales y el juicio, y por último funciones básicas como caminar y tragar.'],
 brain:{entorhinal:'La puerta de entrada al hipocampo suele ser la primera área cortical en desarrollar ovillos de tau. Su pérdida corta el flujo de información nueva hacia la memoria y altera las células de cuadrícula, lo que podría explicar por qué desorientarse es una señal temprana.',
  hippocampus:'Forma los recuerdos nuevos. Su atrofia temprana, visible en la resonancia magnética, causa la dificultad característica para recordar conversaciones y sucesos recientes mientras los recuerdos antiguos se conservan.',
  pcc:'Es un nodo de la red neuronal por defecto. La reducción del metabolismo aquí es uno de los hallazgos más tempranos en la PET, relacionado con problemas de orientación y de memoria autobiográfica.',
  precuneus:'Es una de las primeras áreas en acumular amiloide; su menor función afecta la imaginación visual y la autoconciencia.',
  lc:'La tau suele aparecer aquí años antes que en cualquier otro lugar. La pérdida de noradrenalina podría contribuir a los problemas de atención, los cambios de ánimo y la inflamación.',
  angular:'Cuando la enfermedad se extiende a la corteza parietal, las personas tienen dificultades con las tareas espaciales, la lectura, la escritura y los números.',
  temporal:'La atrofia se extiende por el lóbulo temporal y causa dificultad para encontrar palabras y pérdida de conocimientos.',
  latvent:'Se agrandan a medida que el tejido circundante se reduce, un marcador visible de atrofia cerebral en las imágenes.',
  frontal:'La afectación frontal en las etapas tardías altera el juicio, la planificación y la conducta.'},
 symptoms:['Olvidar conversaciones y sucesos recientes','Repetir preguntas e historias','Perderse en lugares conocidos','Dificultad para planificar, manejar el dinero y realizar tareas complejas','Dificultad para encontrar palabras','Extraviar objetos y no poder reconstruir los pasos','Cambios de ánimo y de personalidad, aislamiento, ansiedad','En etapas avanzadas: pérdida del habla, la movilidad y la deglución, y necesidad de cuidados a tiempo completo'],
 diagnosis:'El diagnóstico combina la historia aportada por la persona y su familia, pruebas cognitivas (como el MoCA) y estudios para descartar otras causas como enfermedad tiroidea, déficit de vitamina B12, depresión y efectos de medicamentos. La resonancia magnética muestra patrones de atrofia. Los biomarcadores permiten ahora el diagnóstico en vida: PET de amiloide y de tau, pruebas en líquido cefalorraquídeo y análisis de sangre cada vez más precisos de tau fosforilada (como la p-tau217).',
 types:['Preclínica: hay amiloide y tau, sin síntomas.','Deterioro cognitivo leve debido al Alzheimer: problemas de memoria perceptibles, con la independencia conservada.','Demencia leve: se necesita ayuda con tareas complejas como las finanzas.','Demencia moderada: ayuda con las actividades diarias, confusión, cambios de conducta.','Demencia grave: pérdida de la comunicación y la movilidad.','El Alzheimer de inicio temprano (antes de los 65 años) representa alrededor del 5–10 % de los casos; las variantes atípicas comienzan con síntomas visuales (atrofia cortical posterior), del lenguaje o conductuales.'],
 causes:['La edad es el factor de riesgo más fuerte. La variante APOE ε4 multiplica el riesgo por unas 3 con una copia y mucho más con dos. Mutaciones raras en APP, PSEN1 o PSEN2 causan la forma familiar de inicio temprano, y el síndrome de Down aumenta el riesgo porque el cromosoma 21 contiene el gen APP.','La Comisión Lancet estima que hasta alrededor del 45 % de los casos de demencia en el mundo podrían retrasarse o prevenirse actuando sobre factores de riesgo modificables, como la pérdida auditiva, la presión arterial alta, la diabetes, el tabaquismo, la inactividad física, el bajo nivel educativo, la depresión, el aislamiento social, el consumo excesivo de alcohol, la contaminación del aire, el colesterol LDL alto y la pérdida de visión no tratada.'],
 treatment:['Los inhibidores de la colinesterasa (donepezilo, rivastigmina, galantamina) y la memantina mejoran modestamente los síntomas durante un tiempo.','Los anticuerpos antiamiloide, lecanemab y donanemab, eliminan las placas y frenan el deterioro aproximadamente entre una cuarta parte y un tercio a lo largo de 18 meses en la enfermedad temprana. Requieren confirmar la presencia de amiloide y vigilancia periódica con resonancia magnética, y conllevan riesgo de edema o sangrado cerebral (ARIA), mayor en portadores de APOE ε4.','La atención no farmacológica es fundamental: ejercicio, participación social, audífonos, control de la presión arterial y la diabetes, un hogar seguro, apoyo a los cuidadores y planificación anticipada de los cuidados.'],
 course:'El Alzheimer progresa a lo largo de un promedio de unos 8–10 años tras el diagnóstico, con gran variación. Las personas suelen vivir bien durante años en las primeras etapas. La muerte suele deberse a complicaciones como la neumonía.',
 prevalence:'Más de 7 millones de estadounidenses de 65 años o más; la demencia afecta a unos 57 millones de personas en todo el mundo.',
 fact:'Alois Alzheimer describió la enfermedad en 1906 tras examinar el cerebro de su paciente Auguste Deter.'},
'disease:parkinsons':{name:'Enfermedad de Parkinson',short:'Parkinson',aka:['enfermedad de parkinson','parkinson','parkinsons','mal de parkinson'],
 summary:'La enfermedad de Parkinson es un trastorno progresivo causado principalmente por la pérdida de las neuronas productoras de dopamina de la sustancia negra. En las neuronas se acumulan agregados de la proteína alfa-sinucleína, llamados cuerpos de Lewy. Sin suficiente dopamina en el cuerpo estriado, los ganglios basales no pueden liberar el movimiento con normalidad, lo que causa lentitud, rigidez y temblor.',
 overview:['La enfermedad de Parkinson es un trastorno neurodegenerativo progresivo conocido sobre todo por sus síntomas motores: lentitud, rigidez, temblor y problemas de equilibrio. Surgen cuando mueren las neuronas productoras de dopamina de la sustancia negra, lo que priva al cuerpo estriado de la dopamina que necesita para liberar el movimiento.',
  'Es mucho más que un trastorno del movimiento. Los agregados de alfa-sinucleína llamados cuerpos de Lewy se propagan por el sistema nervioso, a menudo comenzando en el intestino y la parte baja del tronco encefálico o en el bulbo olfatorio años antes de los síntomas motores. La pérdida del olfato, el estreñimiento, escenificar los sueños, la depresión y la ansiedad pueden preceder al diagnóstico en una década o más.'],
 brain:{sn:'Contiene las neuronas dopaminérgicas que abastecen al cuerpo estriado. Su muerte elimina la señal que permite un movimiento fluido y de amplitud adecuada, lo que causa lentitud y rigidez. Los síntomas aparecen cuando ya se ha perdido una gran parte de estas neuronas.',
  putamen:'La parte motora del cuerpo estriado pierde su aporte de dopamina primero y de forma más grave, por lo que los ganglios basales no pueden liberar el movimiento con normalidad.',
  gp:'Sin dopamina, su salida se vuelve hiperactiva y frena el movimiento a través del tálamo.',
  stn:'Se vuelve hiperactivo en el Parkinson y es la principal diana de la estimulación cerebral profunda.',
  olfactory:'Está entre las primeras áreas afectadas, lo que explica la pérdida temprana del olfato.',
  medulla:'En el modelo de estadificación de Braak, la patología de Lewy comienza en la parte baja del tronco encefálico, lo que se relaciona con el estreñimiento y los problemas autonómicos.',
  lc:'La pérdida de neuronas noradrenérgicas contribuye a la depresión, los problemas de atención y la presión arterial baja al ponerse de pie.',
  pons:'La afectación de los circuitos del sueño REM elimina la parálisis muscular durante los sueños, lo que causa el trastorno de conducta del sueño REM.'},
 symptoms:['Temblor en reposo, que a menudo empieza en una mano','Bradicinesia: lentitud y movimientos cada vez más pequeños','Rigidez','Marcha arrastrando los pies, congelamiento y problemas de equilibrio','Voz baja, letra pequeña, menor expresión facial','Pérdida del olfato, estreñimiento, escenificar los sueños','Depresión, ansiedad, apatía','Más adelante: deterioro cognitivo, alucinaciones'],
 diagnosis:'El diagnóstico es clínico y se basa en la bradicinesia junto con temblor o rigidez; una buena respuesta a la levodopa lo respalda. Un DaTscan puede mostrar la pérdida de terminales dopaminérgicas. Una prueba más reciente en piel o líquido cefalorraquídeo (ensayo de amplificación de semillas) puede detectar alfa-sinucleína anómala.',
 types:['Los subtipos con predominio de temblor y con inestabilidad postural/alteración de la marcha tienen evoluciones distintas.','El Parkinson de inicio juvenil comienza antes de los 50 años y es con más frecuencia genético.','Los "parkinsonismos atípicos" relacionados incluyen la atrofia multisistémica, la parálisis supranuclear progresiva y la demencia con cuerpos de Lewy.'],
 causes:['La edad es el principal factor de riesgo. Alrededor del 10–15 % de los casos se relacionan con genes como LRRK2, GBA1 y SNCA. La exposición a pesticidas, algunos solventes, los traumatismos craneales y vivir en zonas rurales aumentan el riesgo; el tabaquismo y la cafeína se asocian a un menor riesgo.'],
 treatment:['La levodopa (con carbidopa) es el medicamento más eficaz. Otros incluyen los agonistas dopaminérgicos, los inhibidores de la MAO-B y los inhibidores de la COMT. Con los años pueden aparecer fluctuaciones motoras y discinesias.','La estimulación cerebral profunda del núcleo subtalámico o del globo pálido ayuda a pacientes seleccionados, y el ultrasonido focalizado es una opción para el temblor. El ejercicio, la fisioterapia, la terapia del habla y el tratamiento de los síntomas no motores son esenciales.'],
 course:'El Parkinson progresa lentamente a lo largo de muchos años. La mayoría de las personas tienen muchos años de buen funcionamiento con tratamiento; las etapas avanzadas pueden traer caídas, problemas para tragar y demencia.',
 prevalence:'Más de 10 millones de personas en todo el mundo, y en aumento a medida que la población envejece.',
 fact:'Los síntomas motores suelen aparecer solo cuando ya se ha perdido una gran parte de las neuronas dopaminérgicas nigrales, a menudo estimada en un 50–80 %.'},
'disease:huntingtons':{name:'Enfermedad de Huntington',short:'Huntington',aka:['enfermedad de huntington','huntington','corea de huntington','mal de huntington'],
 summary:'La enfermedad de Huntington es un trastorno hereditario que destruye neuronas del cuerpo estriado y, más tarde, de la corteza. Causa movimientos incontrolados (corea), deterioro cognitivo y síntomas psiquiátricos, y suele comenzar entre los 30 y los 50 años.',
 overview:['La enfermedad de Huntington es un trastorno neurodegenerativo hereditario causado por una expansión de repeticiones CAG en el gen HTT. La proteína huntingtina mutante resultante es tóxica para las neuronas, especialmente para las neuronas espinosas medianas del cuerpo estriado.',
  'Causa una tríada de problemas motores (sobre todo la corea), deterioro cognitivo y síntomas psiquiátricos, que suelen comenzar entre los 30 y los 50 años. Como es autosómica dominante, cada hijo de un progenitor afectado tiene un 50 % de probabilidad de heredarla, y las pruebas genéticas plantean decisiones personales complejas.'],
 brain:{caudate:'Sufre la pérdida neuronal más temprana y grave. La vía indirecta, que suprime los movimientos no deseados, falla primero y deja libre la corea.',
  putamen:'La pérdida neuronal grave altera el control motor.',
  gp:'La alteración de la salida de los ganglios basales agrava los problemas de movimiento.',
  latvent:'Se agrandan a medida que el caudado se reduce, un signo clásico en las imágenes.',
  dlpfc:'El adelgazamiento cortical y la pérdida de los circuitos frontoestriatales causan problemas ejecutivos y apatía.'},
 symptoms:['Corea: movimientos involuntarios que parecen de danza','Torpeza y problemas de equilibrio','Dificultad para planificar, organizar y hacer varias cosas a la vez','Depresión, irritabilidad, apatía y conductas compulsivas','Más adelante: rigidez, dificultad para tragar y para hablar'],
 diagnosis:'El diagnóstico se confirma con una prueba genética de las repeticiones CAG; 40 o más repeticiones causan la enfermedad. Las pruebas predictivas en familiares en riesgo se realizan tras un cuidadoso asesoramiento genético.',
 causes:['Una expansión de repeticiones CAG en el gen HTT, heredada con un patrón autosómico dominante. Las repeticiones más largas causan un inicio más temprano y pueden alargarse aún más cuando se transmiten por vía paterna.'],
 treatment:['Todavía no hay cura. La tetrabenazina, la deutetrabenazina y la valbenazina reducen la corea; los antidepresivos y los antipsicóticos tratan los síntomas psiquiátricos. La fisioterapia, la terapia ocupacional, la terapia del habla y el asesoramiento genético son importantes. Hay terapias de silenciamiento génico en ensayos clínicos.'],
 course:'La enfermedad progresa a lo largo de unos 15–20 años desde el inicio de los síntomas.',
 prevalence:'Alrededor de 3–7 por cada 100.000 personas de ascendencia europea; es menos frecuente en otras poblaciones.',
 fact:'El cantante folk Woody Guthrie murió de la enfermedad de Huntington en 1967.'},
'disease:als':{name:'Esclerosis lateral amiotrófica',short:'ELA',aka:['esclerosis lateral amiotrófica','ela','enfermedad de lou gehrig','enfermedad de la motoneurona','enfermedad de neurona motora'],
 summary:'La ELA es una enfermedad progresiva que destruye tanto las motoneuronas superiores de la corteza motora como las motoneuronas inferiores del tronco encefálico y la médula espinal. Los músculos se debilitan y se atrofian, y con el tiempo se afectan el habla, la deglución y la respiración. El pensamiento suele conservarse, aunque algunas personas desarrollan demencia frontotemporal.',
 overview:['La ELA es una enfermedad progresiva que destruye tanto las motoneuronas superiores de la corteza motora como las motoneuronas inferiores del tronco encefálico y la médula espinal. Sin estas neuronas, los músculos se debilitan y se atrofian, y con el tiempo se afectan el habla, la deglución y la respiración.',
  'El pensamiento suele conservarse, pero hasta la mitad de las personas presentan algún cambio cognitivo o conductual, y alrededor del 10–15 % desarrollan demencia frontotemporal, lo que refleja una genética compartida y la patología de TDP-43.'],
 brain:{m1:'Aquí degeneran las motoneuronas superiores, lo que causa rigidez, reflejos vivos y debilidad.',
  medulla:'Degeneran los núcleos motores de la lengua y la garganta, lo que causa habla arrastrada y dificultad para tragar (síntomas bulbares).',
  pons:'Se afectan los núcleos motores de la masticación y del movimiento facial.',
  premotor:'Afectación frontal dentro del espectro ELA–demencia frontotemporal.'},
 symptoms:['Debilidad en una mano, un brazo o una pierna','Contracciones musculares (fasciculaciones) y calambres','Rigidez y reflejos vivos','Habla arrastrada y dificultad para tragar','Debilidad respiratoria','Labilidad emocional (risa o llanto incontrolables) en algunas personas'],
 diagnosis:'El diagnóstico es clínico, apoyado por la electromiografía (EMG), que muestra la pérdida de motoneuronas inferiores, y por la exclusión de enfermedades que la imitan mediante resonancia magnética y análisis de sangre.',
 causes:['Alrededor del 90 % de los casos son esporádicos; el 10 % son familiares, con mayor frecuencia por los genes C9orf72, SOD1, TARDBP o FUS. En la mayoría de los casos aparecen agregados de TDP-43.'],
 treatment:['El riluzol y la edaravona frenan modestamente la progresión; el tofersén trata la ELA relacionada con SOD1. La atención multidisciplinaria, la ventilación no invasiva y las sondas de alimentación prolongan la supervivencia y mejoran la calidad de vida.'],
 course:'La supervivencia mediana es de unos 2–5 años desde el inicio de los síntomas, aunque alrededor del 10 % vive 10 años o más.',
 prevalence:'Cada año la desarrollan alrededor de 2 de cada 100.000 personas.',
 fact:'El Ice Bucket Challenge de 2014 recaudó más de 100 millones de dólares, lo que ayudó a financiar el descubrimiento del gen de la ELA NEK1.'},
'disease:ftd':{name:'Demencia frontotemporal',short:'DFT',aka:['demencia frontotemporal','dft','demencia semántica','degeneración lobular frontotemporal','enfermedad de pick'],
 summary:'La demencia frontotemporal es un grupo de trastornos en los que degeneran las neuronas de los lóbulos frontal y temporal. La variante conductual cambia la personalidad y la conducta; las variantes del lenguaje (afasias progresivas primarias) afectan el habla o el significado de las palabras. Suele comenzar entre los 45 y los 65 años.',
 overview:['La demencia frontotemporal es un grupo de trastornos en los que degeneran las neuronas de los lóbulos frontal y temporal. Suele comenzar entre los 45 y los 65 años y es una de las demencias más frecuentes en personas menores de 65 años.',
  'A diferencia del Alzheimer, la memoria suele estar relativamente conservada al principio. En cambio, los primeros signos son cambios en la personalidad, la conducta o el lenguaje, que con frecuencia se confunden con una enfermedad psiquiátrica o con una crisis de la mediana edad.'],
 brain:{vmpfc:'La atrofia en la variante conductual elimina la regulación social y emocional, lo que causa desinhibición y falta de juicio.',
  ofc:'Su atrofia se relaciona con compulsiones, cambios en la alimentación y decisiones impulsivas.',
  antinsula:'Su pérdida temprana se relaciona con una menor empatía y menor conciencia de los sentimientos de los demás.',
  acc:'Su daño contribuye a la apatía.',
  tpole:'La atrofia en la variante semántica erosiona el significado de las palabras y los objetos.',
  broca:'La atrofia en la variante no fluente hace que el habla sea entrecortada y esforzada.'},
 symptoms:['Desinhibición y conducta socialmente inapropiada','Apatía y pérdida de empatía','Conductas compulsivas y cambios en la alimentación','Dificultad para planificar','Pérdida del significado de las palabras (variante semántica)','Habla entrecortada y esforzada (variante no fluente)'],
 diagnosis:'El diagnóstico usa criterios clínicos, pruebas neuropsicológicas, resonancia magnética que muestra atrofia frontal y/o temporal y, a veces, PET y pruebas genéticas.',
 types:['DFT variante conductual.','Afasia progresiva primaria variante semántica.','Afasia progresiva primaria variante no fluente/agramatical.','Se superpone con la ELA, la parálisis supranuclear progresiva y el síndrome corticobasal.'],
 causes:['Proteínas tau o TDP-43 anómalas. Hasta alrededor de un tercio de los casos son hereditarios, con mayor frecuencia por los genes C9orf72, MAPT o GRN.'],
 treatment:['Todavía no hay tratamiento modificador de la enfermedad. Los ISRS pueden reducir los síntomas conductuales; la terapia del lenguaje y el apoyo a los cuidadores son fundamentales.'],
 course:'La progresión varía, con una supervivencia media de unos 6–11 años desde el inicio de los síntomas.',
 prevalence:'Una de las demencias más frecuentes en personas menores de 65 años.'},
'disease:dlb':{name:'Demencia con cuerpos de Lewy',short:'DCLewy',aka:['demencia con cuerpos de lewy','demencia por cuerpos de lewy','dcl','cuerpos de lewy'],
 summary:'La demencia con cuerpos de Lewy se debe a agregados de alfa-sinucleína (cuerpos de Lewy) que se propagan por la corteza y el tronco encefálico. Combina demencia con fluctuaciones del estado de alerta, alucinaciones visuales vívidas, trastorno de conducta del sueño REM y parkinsonismo.',
 overview:['La demencia con cuerpos de Lewy se debe a agregados de alfa-sinucleína (cuerpos de Lewy) que se propagan por la corteza y el tronco encefálico. Combina demencia con fluctuaciones del estado de alerta, alucinaciones visuales vívidas, trastorno de conducta del sueño REM y parkinsonismo.',
  'A menudo se diagnostica erróneamente como Alzheimer o Parkinson. Acertar es importante porque las personas con DCLewy pueden tener reacciones graves, a veces mortales, a muchos medicamentos antipsicóticos.'],
 brain:{v2v3:'La menor actividad de la corteza de asociación visual se relaciona con las alucinaciones visuales detalladas.',
  sn:'La pérdida de neuronas dopaminérgicas causa parkinsonismo.',
  pons:'La afectación de los circuitos del sueño REM hace que la persona escenifique sus sueños.',
  lc:'Afectación temprana del tronco encefálico.',
  pcc:'Está relativamente conservada en comparación con la precuña, lo que produce el "signo de la isla cingulada" en las imágenes.'},
 symptoms:['Fluctuaciones de la atención y del estado de alerta','Alucinaciones visuales detalladas','Escenificar los sueños','Rigidez y lentitud similares a las del Parkinson','Problemas con las tareas visoespaciales'],
 diagnosis:'Criterios clínicos junto con pruebas de apoyo como el DaTscan, estudios del sueño que muestran sueño REM sin parálisis y gammagrafía cardíaca con MIBG.',
 causes:['En su mayor parte desconocidas; la edad es el principal factor de riesgo. Las variantes de GBA y APOE aumentan el riesgo.'],
 treatment:['Los inhibidores de la colinesterasa a menudo mejoran la cognición y las alucinaciones. Los antipsicóticos deben usarse con gran precaución. La levodopa puede ayudar al movimiento, pero puede empeorar las alucinaciones.'],
 course:'Progresiva, con una supervivencia media de unos 5–8 años tras el diagnóstico.',
 prevalence:'Posiblemente la segunda demencia degenerativa más frecuente después del Alzheimer.'},
'disease:vascdem':{name:'Demencia vascular',short:'Demencia vascular',aka:['demencia vascular','deterioro cognitivo vascular','demencia multiinfarto'],
 summary:'La demencia vascular es un deterioro cognitivo causado por la reducción del flujo sanguíneo al cerebro, ya sea por ictus importantes, por muchos ictus pequeños silenciosos o por daño de los vasos pequeños de la sustancia blanca profunda. A menudo causa lentitud del pensamiento y problemas de planificación antes que pérdida de memoria, y con frecuencia coexiste con el Alzheimer.',
 overview:['La demencia vascular es un deterioro cognitivo causado por la reducción del flujo sanguíneo al cerebro, ya sea por ictus importantes, por muchos ictus pequeños silenciosos o por daño de los vasos pequeños de la sustancia blanca. A menudo causa lentitud del pensamiento y problemas de planificación antes que pérdida de memoria, y con frecuencia coexiste con el Alzheimer (demencia mixta).'],
 brain:{callosum:'El daño de la sustancia blanca desconecta regiones cerebrales y enlentece el procesamiento.',
  latvent:'Los cambios de la sustancia blanca se agrupan alrededor de los ventrículos en la resonancia magnética.',
  caudate:'Los ictus pequeños (lacunares) suelen afectar a núcleos profundos y alteran los circuitos frontosubcorticales.',
  thalamus:'Las lagunas talámicas pueden causar problemas de memoria.',
  dlpfc:'La desconexión de los circuitos frontales causa enlentecimiento ejecutivo.'},
 symptoms:['Lentitud del pensamiento','Dificultad para planificar y organizar','Deterioro escalonado tras los ictus','Problemas para caminar','Cambios del estado de ánimo, sobre todo apatía y depresión'],
 diagnosis:'Requiere deterioro cognitivo con evidencia de enfermedad cerebrovascular en la resonancia magnética y una relación plausible entre ambos.',
 causes:['Presión arterial alta, diabetes, tabaquismo, colesterol alto, fibrilación auricular e ictus previos.'],
 treatment:['Controlar los factores de riesgo vascular y prevenir nuevos ictus. Los inhibidores de la colinesterasa aportan beneficios pequeños.'],
 course:'A menudo escalonado, con una evolución muy influida por el control de los factores de riesgo.',
 prevalence:'La segunda causa más frecuente de demencia, a menudo combinada con el Alzheimer.'},
'disease:psp':{name:'Parálisis supranuclear progresiva',short:'PSP',aka:['parálisis supranuclear progresiva','psp','síndrome de steele-richardson-olszewski'],
 summary:'La parálisis supranuclear progresiva es una taupatía que daña el tronco encefálico, los ganglios basales y los lóbulos frontales. Al principio suele confundirse con la enfermedad de Parkinson, pero causa caídas tempranas, rigidez del tronco y dificultad para mover los ojos, sobre todo al mirar hacia abajo.',
 overview:['La parálisis supranuclear progresiva es una taupatía que daña el tronco encefálico, los ganglios basales y los lóbulos frontales. Al principio suele confundirse con el Parkinson, pero causa caídas tempranas, rigidez del tronco y dificultad para mover los ojos, sobre todo al mirar hacia abajo.'],
 brain:{midbrain:'Su atrofia produce el "signo del colibrí" en la resonancia magnética y daña los centros de la mirada vertical.',
  stn:'Pérdida neuronal.',
  gp:'Pérdida neuronal.',

  frontal:'La afectación frontal causa apatía y problemas ejecutivos.'},
 symptoms:['Caídas hacia atrás tempranas e inexplicables','Dificultad para mover los ojos hacia arriba y hacia abajo','Postura rígida y erguida','Habla arrastrada y dificultad para tragar','Apatía y lentitud del pensamiento'],
 diagnosis:'Criterios clínicos apoyados por una resonancia magnética que muestra atrofia del mesencéfalo.',
 causes:['Acumulación anómala de tau; la causa se desconoce.'],
 treatment:['No hay tratamiento modificador de la enfermedad. La fisioterapia, la terapia del habla y la terapia ocupacional ayudan.'],
 course:'Progresiva a lo largo de unos 6–9 años.',
 prevalence:'Alrededor de 5–7 por cada 100.000 personas.'},
'disease:cjd':{name:'Enfermedad de Creutzfeldt-Jakob',short:'ECJ',aka:['enfermedad de creutzfeldt-jakob','ecj','creutzfeldt-jakob','enfermedad priónica','prion','encefalopatía espongiforme'],
 summary:'La ECJ es una enfermedad priónica rara, de progresión rápida y mortal. Las proteínas priónicas mal plegadas obligan a las proteínas normales a plegarse mal, lo que hace que en el tejido cerebral aparezcan pequeños agujeros (cambio espongiforme). La mayoría de las personas mueren en el plazo de un año desde el inicio de los síntomas.',
 overview:['La ECJ es una enfermedad priónica rara, de progresión rápida y mortal. Las proteínas priónicas mal plegadas obligan a las proteínas normales a plegarse mal, lo que causa muerte neuronal y pequeños agujeros en el tejido cerebral (cambio espongiforme). La mayoría de las personas mueren en el plazo de un año desde el inicio de los síntomas.'],
 brain:{caudate:'Una señal brillante en la resonancia magnética de difusión es una pista diagnóstica.',
  putamen:'Señal brillante en la resonancia magnética de difusión.',
  frontal:'Patrón en cinta cortical ("cortical ribboning") en la resonancia magnética a lo largo de la corteza.',
  parietal:'Afectación cortical.',
  pulvinar:'El signo del pulvinar es característico de la variante de la ECJ.'},
 symptoms:['Demencia que empeora rápidamente','Mioclonías','Problemas de coordinación y de visión','Cambios de conducta'],
 diagnosis:'Resonancia magnética, EEG y la prueba RT-QuIC en líquido cefalorraquídeo, que detecta priones mal plegados con gran precisión.',
 types:['Esporádica (alrededor del 85 %).','Genética (10–15 %), por mutaciones en PRNP.','Adquirida, incluidas la iatrogénica y la variante de la ECJ relacionada con la EEB ("enfermedad de las vacas locas").'],
 causes:['Proteína priónica mal plegada, que surge de forma espontánea, se hereda o se adquiere.'],
 treatment:['No hay cura; la atención se centra en el confort. Una esterilización estricta evita la transmisión a través del instrumental quirúrgico.'],
 course:'Rápida; la mayoría de las personas mueren en el plazo de un año.',
 prevalence:'Alrededor de 1–2 casos por millón de personas cada año.'},
'disease:ms':{name:'Esclerosis múltiple',short:'EM',aka:['esclerosis múltiple','em','esclerosis en placas'],
 summary:'La esclerosis múltiple es una enfermedad autoinmune en la que el sistema inmunitario ataca la mielina, el aislante que rodea las fibras nerviosas, en el cerebro, la médula espinal y los nervios ópticos. Las zonas inflamadas forman placas que alteran las señales. La mayoría de las personas comienzan con una forma remitente-recurrente; algunas pasan después a un curso progresivo.',
 overview:['La esclerosis múltiple es una enfermedad autoinmune crónica en la que las células inmunitarias atacan la mielina, el aislante que rodea las fibras nerviosas, en el cerebro, la médula espinal y los nervios ópticos. Las zonas inflamadas forman placas (lesiones) donde las señales se enlentecen o fallan, lo que causa síntomas que dependen de su localización.',
  'La mayoría de las personas comienzan con una EM remitente-recurrente, con brotes seguidos de recuperación. Con el tiempo, la pérdida continua de fibras nerviosas puede causar una progresión gradual. Las terapias modificadoras de la enfermedad actuales han reducido drásticamente los brotes y la discapacidad.'],
 brain:{callosum:'Las lesiones en el cuerpo calloso, a menudo orientadas perpendicularmente a los ventrículos ("dedos de Dawson"), son características y enlentecen la comunicación entre los hemisferios.',
  latvent:'Las lesiones se agrupan en la sustancia blanca alrededor de los ventrículos, donde pequeñas venas entran en el cerebro, y alteran muchas vías a la vez.',
  pons:'Las lesiones del tronco encefálico causan visión doble, mareo y entumecimiento facial.',
  cerebhemi:'Las lesiones cerebelosas causan temblor y falta de coordinación.'},
 symptoms:['Pérdida de visión o dolor en un ojo (neuritis óptica)','Entumecimiento, hormigueo o debilidad','Fatiga','Problemas de equilibrio y mareo','Problemas de vejiga','Dificultades de pensamiento y de memoria','Empeoramiento de los síntomas con el calor (fenómeno de Uhthoff)'],
 diagnosis:'Los criterios de McDonald usan lesiones en la resonancia magnética diseminadas en el espacio y en el tiempo, y pueden usar las bandas oligoclonales en el líquido cefalorraquídeo, tras descartar enfermedades que la imitan.',
 types:['Síndrome clínico aislado.','EM remitente-recurrente (la más frecuente al inicio).','EM secundaria progresiva.','EM primaria progresiva (alrededor del 10–15 %).'],
 causes:['Susceptibilidad genética combinada con el entorno. La infección por el virus de Epstein-Barr parece ser un desencadenante casi necesario. La vitamina D baja, el tabaquismo y la obesidad en la adolescencia aumentan el riesgo.'],
 treatment:['Las terapias modificadoras de la enfermedad (como ocrelizumab, natalizumab, ofatumumab y otras) reducen los brotes y las lesiones nuevas. Los corticoides acortan los brotes. La rehabilitación y el tratamiento de los síntomas ayudan en la vida diaria.'],
 course:'Muy variable; muchas personas con tratamiento actual mantienen un buen funcionamiento durante décadas.',
 prevalence:'Alrededor de 2,8 millones de personas en todo el mundo; es unas dos a tres veces más frecuente en mujeres.',
 fact:'Un estudio de 2022 con 10 millones de militares estadounidenses halló que la infección por Epstein-Barr multiplicaba el riesgo de EM por unas 32.'},
'disease:ischemic':{name:'Ictus isquémico',short:'Ictus isquémico',aka:['ictus isquémico','accidente cerebrovascular isquémico','acv isquémico','infarto cerebral','derrame cerebral','embolia cerebral','trombosis cerebral'],
 summary:'Un ictus isquémico ocurre cuando un coágulo o una arteria estrechada interrumpe el flujo sanguíneo a una parte del cerebro y la priva de oxígeno. Alrededor del 85 % de los ictus son isquémicos. Los síntomas dependen de la arteria obstruida; la arteria cerebral media, que irriga gran parte de la superficie externa del cerebro, es la afectada con más frecuencia.',
 overview:['Un ictus isquémico ocurre cuando un coágulo o una arteria estrechada interrumpe el flujo sanguíneo a una parte del cerebro. Sin oxígeno ni glucosa, las neuronas del núcleo del infarto mueren en minutos, mientras que una zona circundante llamada penumbra puede salvarse si el flujo sanguíneo se restablece rápidamente.',
  'Los síntomas dependen de la arteria obstruida. La arteria cerebral media, que irriga gran parte de la superficie externa del cerebro, es la afectada con más frecuencia. Los ictus isquémicos representan alrededor del 85 % de los ictus.'],
 brain:{m1:'Los ictus de la arteria cerebral media suelen dañar la corteza motora y causan debilidad en el lado opuesto del cuerpo.',
  s1:'Su daño causa pérdida de sensibilidad en el lado opuesto.',
  broca:'Los ictus del lado izquierdo pueden causar afasia expresiva.',
  wernicke:'Los ictus del lado izquierdo pueden causar afasia receptiva.',
  putamen:'Los pequeños ictus lacunares profundos pueden causar debilidad motora pura.',
  ventthal:'Los ictus talámicos causan pérdida sensitiva o dolor crónico.'},
 symptoms:['Caída repentina de un lado de la cara','Debilidad de un brazo o una pierna en un lado','Dificultad para hablar o confusión','Pérdida repentina de la visión','Mareo repentino o pérdida del equilibrio'],
 diagnosis:'La TC o la resonancia magnética urgentes distinguen el ictus isquémico del hemorrágico; la angiografía por TC detecta las obstrucciones de grandes vasos.',

'disease:ich':{name:'Ictus hemorrágico',short:'Ictus hemorrágico',aka:['ictus hemorrágico','accidente cerebrovascular hemorrágico','acv hemorrágico','hemorragia intracerebral','hemorragia cerebral','derrame cerebral'],

'disease:epilepsy':{name:'Epilepsia',short:'Epilepsia',aka:['epilepsia','epilepsia del lóbulo temporal','trastorno convulsivo','convulsiones','crisis epilépticas'],

'disease:cluster':{name:'Cefalea en racimos',short:'Cefalea en racimos',aka:['cefalea en racimos','cefaleas en racimos','cefalea en brotes','cefalea de horton'],

  'Su sincronía de reloj, tanto diaria como estacional, apunta al reloj interno del cerebro. A diferencia de las personas con migraña, que se quedan quietas, las personas con cefalea en racimos suelen estar inquietas y caminar de un lado a otro durante las crisis.'],
 brain:{hypothalamus:'El hipotálamo posterior se activa durante las crisis y podría desencadenarlas, lo que explica su horario regular y los síntomas autonómicos como el lagrimeo y la secreción nasal.',

 diagnosis:'Diagnóstico clínico basado en el patrón de las crisis; la resonancia magnética descarta otras causas.',

'disease:tbi':{name:'Traumatismo craneoencefálico y conmoción cerebral',short:'TCE',aka:['traumatismo craneoencefálico','tce','lesión cerebral traumática','conmoción cerebral','conmociones cerebrales','concusión'],

 overview:['Un traumatismo craneoencefálico es un daño causado por una fuerza externa, como una caída, un choque, un impacto deportivo o una explosión. Una conmoción cerebral es un TCE leve. El cerebro se mueve dentro del cráneo, lo que contusiona su superficie donde choca con las crestas óseas y estira las fibras nerviosas largas.',
  'Tras el impacto se produce una cascada de cambios químicos: desequilibrios iónicos, crisis energética e inflamación, por lo que el cerebro queda vulnerable durante días o semanas y por eso se recomienda reposo seguido de un retorno gradual a la actividad.'],
 brain:{ofc:'La cara inferior del lóbulo frontal roza contra el suelo óseo del cráneo, lo que causa contusiones que pueden alterar el juicio, el control de impulsos y la personalidad.',
  tpole:'La parte anterior del lóbulo temporal golpea la fosa media del cráneo, lo que afecta a la memoria y las emociones.',

  brainstem:'Las fuerzas de rotación intensas pueden lesionar el tronco encefálico y afectar al nivel de conciencia.'},
 symptoms:['Dolor de cabeza y mareo','Confusión y problemas de memoria','Náuseas','Sensibilidad a la luz y al ruido','Dificultad para concentrarse y dormir','Cambios de humor e irritabilidad'],
 diagnosis:'La escala de coma de Glasgow gradúa la gravedad; la tomografía computarizada o la resonancia magnética detectan hemorragias o inflamación. La conmoción cerebral es un diagnóstico clínico, ya que las imágenes suelen ser normales.',
 types:['TCE leve (conmoción cerebral), moderado y grave.'],
 causes:['Caídas, accidentes de tráfico, agresiones, deportes y explosiones militares.'],
 treatment:['Conmoción cerebral: breve reposo relativo y luego retorno gradual a la actividad y a la escuela o el trabajo. TCE moderado o grave: atención de urgencia, control de la presión dentro del cráneo y después rehabilitación.'],
 course:'La mayoría de las conmociones se resuelven en semanas; algunas personas tienen síntomas persistentes. La recuperación de un TCE moderado o grave puede llevar meses o años.',
 prevalence:'Decenas de millones de personas en todo el mundo cada año.'},

 overview:['La ETC es una enfermedad progresiva por tau vinculada a años de impactos repetidos en la cabeza, incluidos muchos que nunca causan síntomas de conmoción. Se ha encontrado en deportistas de deportes de contacto y en veteranos militares, y actualmente solo puede confirmarse después de la muerte.',
  'Su sello distintivo es la acumulación de tau alrededor de pequeños vasos sanguíneos en el fondo de los surcos, los lugares que más sufren con los impactos.'],

 symptoms:['Problemas de memoria','Impulsividad y agresividad','Depresión y apatía','Confusión','Más tarde, demencia y parkinsonismo'],

 course:'Progresiva a lo largo de años o décadas.',

 overview:['El glioblastoma es el cáncer cerebral primario más frecuente y agresivo en adultos. Crece a partir de las células gliales e infiltra el tejido cerebral circundante, por lo que no puede extirparse por completo.'],
 brain:{frontal:'Una de las localizaciones más frecuentes.',

 symptoms:['Dolores de cabeza, a menudo peores por la mañana','Convulsiones','Cambios de personalidad o de memoria','Debilidad o problemas del habla o de la visión, según la localización','Náuseas'],

Object.assign(window.I18N_ES.glossary,{
'cerebral cortex':['corteza cerebral','La capa externa del cerebro, delgada y plegada, de unos 2–4 mm de grosor y formada principalmente por sustancia gris. Se encarga de la mayoría de las funciones superiores, como el pensamiento, el lenguaje y la percepción.',['corteza','cortical','corticales','córtex']],
'cerebrum':['cerebro','La parte más grande del encéfalo, formada por los hemisferios izquierdo y derecho y sus lóbulos.',['telencéfalo','cerebral','cerebrales']],

'lobe':['lóbulo','Una de las grandes divisiones de cada hemisferio: frontal, parietal, temporal y occipital, además de la ínsula, que queda oculta. Reciben el nombre de los huesos del cráneo que los cubren.',['lóbulos']],
'gyrus':['circunvolución','Un pliegue elevado en la superficie del cerebro. Al plegarse en circunvoluciones, cabe más corteza dentro del cráneo.',['circunvoluciones','giro','giros','circunvolución precentral','circunvolución poscentral']],

'lateral sulcus':['surco lateral','La hendidura profunda a lo largo del costado del cerebro que separa el lóbulo temporal de los lóbulos frontal y parietal. También se llama cisura de Silvio.',['cisura de silvio','cisura lateral']],
'brodmann area':['área de Brodmann','Una de las aproximadamente 52 regiones de la corteza definidas por Korbinian Brodmann en 1909 según las diferencias en las capas celulares vistas al microscopio. Todavía se usan como mapa; por ejemplo, el área 17 es V1.',['áreas de brodmann']],
'operculum':['opérculo','Las partes de los lóbulos frontal, parietal y temporal que se pliegan sobre la ínsula y la cubren. En latín significa «tapa».',['opérculos','opérculo frontal','opercular']],
'diencephalon':['diencéfalo','La parte del prosencéfalo situada entre el cerebro y el tronco encefálico, que contiene el tálamo, el hipotálamo y el epitálamo.',['diencefálico','diencefálica']],
'forebrain':['prosencéfalo','La división anterior del encéfalo en desarrollo, que da lugar al cerebro y al diencéfalo.',['cerebro anterior']],
'hindbrain':['rombencéfalo','La división posterior del encéfalo en desarrollo, que da lugar a la protuberancia, el bulbo raquídeo y el cerebelo.',['cerebro posterior']],
'subcortical':['subcortical','Por debajo de la corteza. Se usa para estructuras profundas como los ganglios basales, el tálamo y la amígdala.',['subcorticales']],
'anterior':['anterior','Hacia adelante.',['anteriores']],
'posterior':['posterior','Hacia atrás.',['posteriores']],
'superior':['superior','Hacia arriba.',['superiores']],
'inferior':['inferior','Hacia abajo.',['inferiores']],
'medial':['medial','Hacia la línea media, la línea central que divide el cuerpo en izquierda y derecha.',['mediales']],
'lateral':['lateral','Hacia el costado, alejándose de la línea media.',['laterales']],
'dorsal':['dorsal','Hacia la espalda o la parte superior. En el cerebro, dorsal suele significar hacia la parte superior de la cabeza.',['dorsales']],
'ventral':['ventral','Hacia el vientre o la parte inferior. En el cerebro, ventral suele significar hacia la base.',['ventrales']],
'midline':['línea media','La línea central imaginaria que divide el cerebro y el cuerpo en mitades izquierda y derecha.',[]],
'contralateral':['contralateral','En el lado opuesto. La mayor parte del cerebro controla y percibe el lado contralateral del cuerpo.',['contralaterales','contralateralmente']],
'ipsilateral':['ipsilateral','En el mismo lado. Cada mitad del cerebelo controla el lado ipsilateral del cuerpo.',['ipsilaterales','homolateral']],
'decussation':['decusación','Un punto donde las fibras nerviosas cruzan de un lado del cerebro o de la médula espinal al otro.',['decusaciones','decusación piramidal','decusan','decusa']],
'homunculus':['homúnculo','Un mapa del cuerpo distribuido a lo largo de la corteza motora o somatosensorial. Las partes que requieren un control o una sensibilidad finos, como las manos y los labios, ocupan mucho más espacio.',['homúnculo motor','homúnculo sensorial','homúnculos']],
'tonotopic':['tonotópico','Organizado según la frecuencia del sonido, como las teclas de un piano. El sistema auditivo es tonotópico.',['tonotópica','tonotópicos','tonotópicas','tonotópicamente','tonotopía']],
'visual field':['campo visual','Toda el área que puedes ver sin mover los ojos. Cada mitad la procesa el hemisferio opuesto.',['campos visuales']],
'optic chiasm':['quiasma óptico','El cruce en forma de X situado justo encima de la hipófisis, donde las fibras de la mitad interna de cada retina cruzan al otro lado.',['quiasma']],

'optic radiations':['radiaciones ópticas','Haces de fibras que llevan las señales visuales desde el núcleo geniculado lateral (NGL) hasta la corteza visual primaria.',['radiación óptica']],
'corticospinal tract':['tracto corticoespinal','La vía principal que lleva las órdenes de movimiento desde la corteza motora hasta la médula espinal. La mayoría de sus fibras se cruzan en el bulbo raquídeo.',['vía corticoespinal','vía piramidal','corticoespinal']],
'arcuate fasciculus':['fascículo arqueado','Un haz curvo de sustancia blanca que conecta el área de Broca con el área de Wernicke.',['fascículo arcuato']],
'meninges':['meninges','Tres membranas protectoras que cubren el encéfalo y la médula espinal: la duramadre, la aracnoides y la piamadre.',['meníngeo','meníngea','meníngeos','meníngeas']],
'subarachnoid space':['espacio subaracnoideo','El espacio lleno de líquido entre la aracnoides y la piamadre, por el que circulan el LCR y grandes vasos sanguíneos.',['subaracnoideo','subaracnoidea']],
'choroid plexus':['plexo coroideo','Tejido de los ventrículos que produce el líquido cefalorraquídeo.',['plexos coroideos']],
'cerebrospinal fluid':['líquido cefalorraquídeo','El líquido transparente que llena los ventrículos y rodea el encéfalo y la médula espinal, amortiguándolos y eliminando desechos.',['lcr']],
'spinal cord':['médula espinal','El haz de nervios que recorre la columna vertebral y transmite señales entre el encéfalo y el cuerpo.',['médula','espinal','espinales']],
'cranial nerves':['nervios craneales','Doce pares de nervios que salen directamente del encéfalo en lugar de la médula espinal. Inervan la cabeza, la cara, los sentidos y algunos órganos.',['nervio craneal','pares craneales','par craneal']],
'vestibular system':['sistema vestibular','Los órganos del equilibrio del oído interno y los circuitos cerebrales que procesan sus señales.',['vestibular','vestibulares']],
'vestibulo-ocular reflex':['reflejo vestíbulo-ocular','Un reflejo que mueve los ojos en sentido opuesto al movimiento de la cabeza para que la mirada se mantenga estable.',['reflejo vestibuloocular','rvo']],
'folia':['folias','Los pliegues delgados, con forma de hoja, de la superficie del cerebelo.',['folia','folium','láminas cerebelosas']],
'striatum':['cuerpo estriado','El núcleo caudado, el putamen y el núcleo accumbens en conjunto. Es la principal estación de entrada de los ganglios basales.',['estriado','estriatal','estriatales','estriado asociativo']],
'limbic system':['sistema límbico','Un grupo de estructuras conectadas, como el hipocampo, la amígdala, la corteza cingulada y partes del tálamo y del hipotálamo, que intervienen en la emoción, la motivación y la memoria.',['límbico','límbica','límbicos','límbicas']],
'papez circuit':['circuito de Papez','Un circuito de memoria que va del hipocampo, a través del fórnix, a los cuerpos mamilares, el tálamo anterior y la corteza cingulada, y vuelve al hipocampo.',[]],
'prefrontal cortex':['corteza prefrontal','La parte anterior del lóbulo frontal, situada delante de las áreas motoras; es fundamental para la planificación, la toma de decisiones, el juicio y la conducta social.',['prefrontal','prefrontales','cpf']],
'reticular formation':['formación reticular','Una red de neuronas que recorre el tronco encefálico y controla el nivel de activación, el estado de alerta y el paso entre el sueño y la vigilia.',['sustancia reticular','reticular']],
'superior colliculus':['colículo superior','Una prominencia en la parte posterior del mesencéfalo que controla los movimientos reflejos de los ojos y la cabeza hacia lo que vemos.',['colículos superiores','tubérculo cuadrigémino superior']],
'inferior colliculus':['colículo inferior','Una prominencia en la parte posterior del mesencéfalo que procesa el sonido antes de que llegue al tálamo.',['colículos inferiores','tubérculo cuadrigémino inferior']],
'sella turcica':['silla turca','Una cavidad en forma de silla de montar en la base del cráneo que aloja la hipófisis.',[]],
'dorsal stream':['vía dorsal','La vía visual que asciende hacia el lóbulo parietal y determina dónde están las cosas y cómo actuar sobre ellas. A menudo se la llama la vía del «dónde».',['corriente dorsal','vía del dónde']],
'ventral stream':['vía ventral','La vía visual que desciende hacia el lóbulo temporal e identifica qué son las cosas. A menudo se la llama la vía del «qué».',['corriente ventral','vía del qué']],
'default mode network':['red neuronal por defecto','Un conjunto de regiones cerebrales, entre ellas la corteza cingulada posterior, el precúneo y la corteza prefrontal medial, que está más activo durante el reposo, la ensoñación y el pensamiento sobre uno mismo.',['red por defecto','modo por defecto','red de modo por defecto']],
'salience network':['red de saliencia','Una red centrada en la ínsula anterior y la corteza cingulada anterior (CCA) que detecta lo que es importante y dirige la atención hacia ello.',['red de prominencia','saliencia']],
'mesolimbic pathway':['vía mesolímbica','Neuronas dopaminérgicas que van del área tegmental ventral (ATV) al núcleo accumbens. Es fundamental para la recompensa y la motivación.',['mesolímbica','mesolímbico','mesolímbicos','mesolímbicas']],
'mesocortical pathway':['vía mesocortical','Neuronas dopaminérgicas que van del área tegmental ventral (ATV) a la corteza prefrontal. Es importante para la motivación y la cognición.',['mesocortical','mesocorticales']],
'nigrostriatal pathway':['vía nigroestriada','Neuronas dopaminérgicas que van de la sustancia negra al cuerpo estriado. Es esencial para el movimiento y se pierde en la enfermedad de Parkinson.',['nigroestriada','nigroestriatal','vía nigroestriatal']],
'hpa axis':['eje HHA','El eje hipotálamo-hipófisis-suprarrenal: el principal sistema hormonal del estrés, en el que el hipotálamo envía señales a la hipófisis, que a su vez indica a las glándulas suprarrenales que liberen cortisol.',['eje hipotálamo-hipófisis-suprarrenal','eje hipotálamo-hipófisis-adrenal','hha']],
'reward circuit':['circuito de recompensa','La red cerebral que genera el deseo y el aprendizaje a partir de las recompensas, centrada en la dopamina que va del ATV al núcleo accumbens y a la corteza prefrontal.',['sistema de recompensa','vía de recompensa']],
'neuron':['neurona','Una célula nerviosa. Las neuronas se transmiten señales eléctricas y químicas entre sí; el cerebro humano tiene aproximadamente 86 mil millones de ellas.',['neuronas','neuronal','neuronales','célula nerviosa','células nerviosas']],
'glial cells':['células gliales','Células del sistema nervioso que no son neuronas y que sostienen, aíslan, nutren y protegen a las neuronas. Entre ellas están los astrocitos, los oligodendrocitos y la microglía.',['glía','glial','célula glial','neuroglía']],

  const f=4.1, n1=Math.abs(noise3(wx*f,wy*f*1.1,wz*f)), n2=Math.abs(noise3(wx*f*1.9+5,wy*f*1.9,wz*f*1.9));
  const s1=1-smooth(0,0.17,n1), s2=1-smooth(0,0.09,n2);
  const crown=smooth(0.17,0.5,n1);              // gentle rounding of each gyrus
  return 1-(0.85*s1+0.3*s2*(1-s1))+0.12*crown;   // high = gyrus surface, low = inside a sulcus
}
function classifyCortex(X,Y,ly,lz){
  const zc=0.28-0.25*ly, ys=-0.16-0.1*lz, zpo=-0.72+0.12*ly, medial=X<-0.2;

  const lat=X<0?X*0.5:X;

    if(medial){ const calc=-0.02+0.1*(lz+0.9); if(Math.abs(ly-calc)<0.09) return 'v1'; return ly>calc?'cuneus':'lingual'; }
    if(lz<-1.08) return 'v1';
    if(Y<-0.55&&X<0.6) return 'v4';
    if(X>0.45&&ly<-0.02&&ly>-0.4&&lz>-0.98) return 'v5';
    return 'v2v3';
  }
  if(ly<ys&&lz<0.6&&(lat>0.1||(lz<0.3&&ly<ys-0.08))){
    if(lz>0.42) return 'tpole';

    if(lz<zc+0.12) return 'm1';
    if(lz<zc+0.3) return medial?'sma':'premotor';
    if(Y<-0.5) return 'ofc';
    if(lz>1.0) return 'fpole';
    if(medial) return Y<0.2?'vmpfc':'dmpfc';
    if(ly>ys-0.02&&ly<ys+0.2&&lz<zc+0.6) return 'broca';
    if(ly<ys+0.32) return 'vlpfc';
    return 'dlpfc';
  }

function buildHemisphere(side){

  for(let i=0;i<n;i++){
    const ux=p.getX(i),uy=p.getY(i),uz=p.getZ(i), X=ux*side;
    let lx=ux*A, ly=uy*B, lz=uz*C;
    const medial=X<0; if(medial) lx*=0.5; if(ly<0) ly*=0.88;
    const cly=ly, clz=lz;
    let nx=lx/(A*A),ny=ly/(B*B),nz=lz/(C*C); const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
    const lat=medial?X*0.5:X;
    const tf=smooth(0.35,1.18,lz), to=smooth(-0.55,-1.18,lz);
    let sx=1-0.13*tf*tf-0.16*to*to, sy=1-0.08*tf*tf-0.1*to;
    if(ly<0) sy*=1-0.28*tf;
    if(ly>0) sy*=0.97;
    const ys0=-0.16-0.1*lz;
    const tw=medial?0:smooth(ys0+0.02,ys0-0.14,ly)*smooth(0.62,0.38,lz)*smooth(-0.8,-0.55,lz)*clamp(lat*2.2,0,1);
    let px=lx*sx, py=ly*sy, pz=lz;
    py-=0.07*tw; px+=side*0.045*tw; pz+=0.02*tw;
    let d=0.085*(folds(lx+side*3,ly,lz)-0.85)*(medial?0.6:1);
    const zc=0.28-0.25*ly; if(ly>-0.2) d-=0.06*G(lz-zc,0.04);
    const ys=ys0; if(!medial&&lz>-0.65&&lz<0.62) d-=0.1*G(ly-ys,0.045)*Math.min(1,lat*3);
    if(!medial&&lz>0.3&&lz<0.62) d-=0.05*G(ly-(ys-0.03),0.06)*Math.min(1,lat*3);
    const zpo=-0.72+0.12*ly; d-=0.03*G(lz-zpo,0.04);

    if(lz<zc&&lz>zpo&&ly>-0.1) d-=0.022*G(lz-(zc-0.14),0.03);
    if(!medial&&lz<zc-0.14&&lz>zpo) d-=0.022*G(ly-0.36,0.03)*Math.min(1,lat*2);
    if(!medial&&lz>zc+0.3&&ly>0.05) d-=0.02*G(ly-(0.42-0.1*lz),0.03)*Math.min(1,lat*2);
    if(!medial&&ly<ys&&lz<0.45&&lz>zpo){ d-=0.024*G(ly-(ys-0.11),0.025)*Math.min(1,lat*2); d-=0.02*G(ly-(ys-0.22),0.025)*Math.min(1,lat*2); }
    if(X<-0.2&&lz<zpo){ const calc=-0.02+0.1*(lz+0.9); d-=0.032*G(ly-calc,0.03); }
    if(X<-0.45&&Math.abs(lz)<0.62){ const cc=0.34-0.5*lz*lz; d-=0.028*G(ly-(cc+0.2),0.03); }

    const o=out[key]||(out[key]={p:[],n:[],m:0,t:0}); o.t++; if(X<-0.2) o.m++;

  }

  const geos={};
  for(const k in out){ const bg=new THREE.BufferGeometry(); bg.setAttribute('position',new THREE.Float32BufferAttribute(out[k].p,3)); bg.setAttribute('normal',new THREE.Float32BufferAttribute(out[k].n,3)); geos[k]=bg; med[k]=out[k].m/out[k].t; }

function ellipsoid(c,s,seg){

function tube(points,r,seg,rad,scaleX){

function split(obj,fn){

    for(let j=0;j<k;j++) c[j]=(aux[a*k+j]+aux[b*k+j]+aux[d*k+j])/3;

MESHES.forEach(m=>{ const {leaf,side}=m.userData; const o=offsetFor(leaf,side==='B'?null:side); if(isBilateralInner(m)) o.x+=(side==='L'?-1:1)*0.18; m.userData.off.copy(o); });
const NODE_OFF={};
function nodeOffset(id,side){
  const k=id+'|'+side; if(NODE_OFF[k]) return NODE_OFF[k];
  const n=S[id]; const o=offsetFor(id,(n.lat||n.isHemi)?side:(n.meshes.every(m=>m.userData.side==='B')?null:side));
  if(!(n.lat||n.isHemi)&&n.meshes.some(isBilateralInner)&&n.meshes.every(m=>m.userData.layer==='inner')) o.x+=(side==='L'?-1:1)*0.18;

function centroidAnchor(meshes){

  c.divideScalar(n||1);

const LOBE_DIR={frontal:[-0.45,0.45,0.75],parietal:[-0.45,0.85,-0.3],temporal:[-1,-0.35,0.15],occipital:[-0.35,0.15,-1],cerebellum:[-0.55,-0.35,-0.8],brainstem:[-0.85,-0.45,0.3],olfactory:[-0.35,-0.85,0.45],hemiL:[-1,0.75,0.15],hemiR:[-1,0.75,0.15],insula:[-1,0,0.1]};

const ANC={}, FDIR={};
function computeAnchor(id,side){

/* ================= State ================= */
let mode='structure', sel='brain', selSide='L', cond=null, condMap={}, condWhole={}, showLabels=true, hovered=null, activeTab='region', goal=null, spread=0, opac=0.2, bright=1;
const openCond={psych:null,disease:null};
const GHOST=new THREE.Color(0x8fa3bd), HOTC=new THREE.Color(HOT), WARMC=new THREE.Color(WARM);
const viewSide=()=>camera.position.x<=0?'L':'R';
const isMobile=()=>matchMedia('(max-width:760px)').matches;
function visAspect(){ const w=stage.clientWidth||1,h=stage.clientHeight||1; if(!isMobile()) return w/h; const vh=Math.max(160,h-sheetH()-95); return w/vh; }
const fit=()=>Math.max(1,1.15/visAspect());
const selKey=()=>keyOf(sel,selSide);
const isLeafNode=id=>!S[id].kids||!S[id].kids.length;
function labelParent(){ return isLeafNode(sel)?(parentOf(sel,selSide)||'brain'):sel; }
const lpKey=()=>keyOf(labelParent(),selSide);
function childIn(m,parentKey){ const p=m.userData.path; const i=p.indexOf(parentKey); return i>0?p[i-1]:null; }
const colorOfKey=k=>S[parseKey(k).id].color;

function applyView(){
  const sk=selKey(), lk=lpKey();
  MESHES.forEach(m=>{
    const u=m.userData, path=u.path; let useSolid=false, col, op, em=0;
    if(mode==='condition'){
      const inv=condMap[u.leaf];
      if(inv){ useSolid=true; col=inv==='p'?HOTC:WARMC; op=u.layer==='cortex'?(condWhole[u.top]?0.3:(inv==='p'?0.72:0.4)):1; em=0.22; }
      else { col=GHOST; op=u.layer==='cortex'?0.1:u.layer==='shell'?0.14:0.12; }
    } else {
      const inSel=sel!=='brain'&&path.includes(sk);
      if(inSel){ useSolid=true; const ck=isLeafNode(sel)?sk:childIn(m,sk); col=new THREE.Color(colorOfKey(ck||sk)); op=1; em=isLeafNode(sel)?0.3:0.06; }
      else {
        const inLp=lk!=='brain'&&path.includes(lk); const ck=inLp?childIn(m,lk):null;
        col=new THREE.Color(ck?colorOfKey(ck):(u.top?S[u.top].color:'#9FB3D1'));
        op=u.layer==='cortex'?0.27:u.layer==='shell'?0.32:0.34;
        if(sel!=='brain'&&!inLp) op*=0.55;

      if(useSolid&&hovered&&path.includes(hovered)) em=Math.max(em,0.22);
    }
    if(useSolid){
      const M=u.solid; M.color.copy(col); M.emissive.copy(col).multiplyScalar(em);
      const tr=op<0.999; if(M.transparent!==tr){ M.transparent=tr; M.needsUpdate=true; } M.opacity=op; M.depthWrite=op>=0.5;
      if(m.material!==M) m.material=M;
    } else {
      const M=u.holo, sld=mode==='condition'?0:clamp((opac-0.2)/0.8,0,1), add=sld<0.02;
      if(mode!=='condition'&&opac<0.2) op*=opac/0.2;

      const bl=add?THREE.AdditiveBlending:THREE.NormalBlending; if(M.blending!==bl){ M.blending=bl; M.needsUpdate=true; } M.depthWrite=sld>0.7; if(m.material!==M) m.material=M;

}
function applySpread(){ MESHES.forEach(m=>m.position.copy(m.userData.off).multiplyScalar(spread)); }

function focusNode(id,side){
  const n=S[id]; const sd=(n.lat||n.isHemi)?side:null;
  const c=centerOf(id,sd).clone().add(nodeOffset(id,side).clone().multiplyScalar(spread));
  const d=fdirOf(id,side)||new V3(-1,0.4,0.4).normalize(), r=radiusOf(id,sd);
  const k=id==='brain'?0:isLeafNode(id)?0.75:0.5;
  const tgt=CENTER.clone().lerp(c,k);
  let dist=id==='brain'?HOME.distanceTo(CENTER)/fit():n.isHemi?4.2:Math.min(4.3,Math.max(2.3,1.6+r*3.4));
  dist=dist*fit()*(1+spread*0.7)*(isMobile()?1.3:1);
  goal={pos:tgt.clone().addScaledVector(d,dist),tgt};
  if(reduceMotion){ camera.position.copy(goal.pos); controls.target.copy(goal.tgt); goal=null; }
}

/* ================= Selection ================= */
function selectNode(id,side,opts){
  opts=opts||{}; if(!S[id]) return;
  sel=id; if(side) selSide=side; mode='structure'; hidePop();
  applyView(); renderRegion(); buildMini(id,selSide); renderMap();
  if(opts.focus!==false) focusNode(id,selSide);
  if(opts.tab!==false) showTab('region');
  if(opts.scroll) ensureOpen();
}
function goUp(){ if(sel==='brain') return; const p=parentOf(sel,selSide)||'brain'; selectNode(p,S[p].isHemi?S[p].side:selSide); }
function setCondition(c){
  cond=c; mode='condition'; condMap={}; condWhole={};
  c.brain.forEach(([id])=>{ if(S[id].isTop&&S[id].layer==='cortex') condWhole[id]=true; });
  c.brain.forEach(([id,lv])=>{ S[id].meshes.forEach(m=>{ const l=m.userData.leaf; if(condMap[l]!=='p') condMap[l]=lv; }); });
}
function focusCondition(){
  const b=new THREE.Box3(); MESHES.forEach(m=>{ if(condMap[m.userData.leaf]){ m.updateMatrixWorld(); b.union(new THREE.Box3().setFromObject(m)); } });
  if(b.isEmpty()) return;
  const ctr=b.getCenter(new V3()), dir=camera.position.clone().sub(controls.target).normalize();
  const tgt=CENTER.clone().lerp(ctr,0.5);
  goal={pos:tgt.clone().addScaledVector(dir,4.4*fit()*(1+spread*0.7)*(isMobile()?1.3:1)),tgt};
  if(reduceMotion){ camera.position.copy(goal.pos); controls.target.copy(goal.tgt); goal=null; }
}
function openCondition(key){

}
function closeCondition(kind){ openCond[kind]=null; renderCondList(kind); showTab(kind); }

const VIEWS={browse:'view-browse',region:'view-region',psych:'view-psych',disease:'view-disease',gloss:'view-gloss'};
function showTab(name){

for(const k in VIEWS) document.getElementById('tab-'+k).addEventListener('click',()=>{ showTab(k); ensureOpen(); });
const condbar=document.getElementById('condbar'), hint=document.getElementById('hint');
function updateCondbar(){

  if(on) condbar.innerHTML=`<b>${esc(cond.short||cond.name)}</b><span class="k"><i style="background:${HOT}"></i>${t('primary')}</span><span class="k"><i style="background:${WARM}"></i>${t('alsoInvolved')}</span><button type="button" id="exitCond">${t('backToAnatomy')}</button>`;

/* ================= Picking ================= */
const ray=new THREE.Raycaster();
function castAt(ev,list){
  const rc=canvas.getBoundingClientRect();

  return ray.intersectObjects(list,false);
}
function pickTarget(ev){

    const hits=castAt(ev,MESHES.filter(m=>condMap[m.userData.leaf])); if(!hits.length) return null;
    const u=hits[0].object.userData; return keyOf(u.leaf,u.side==='B'?selSide:u.side);
  }

  const scope=lk==='brain'?MESHES:MESHES.filter(m=>m.userData.path.includes(lk));
  let hits=castAt(ev,scope);
  if(hits.length){
    const deepScope=lk!=='brain'&&!['hemiL','hemiR'].includes(lk);
    const inner=deepScope?hits.find(h=>h.object.userData.layer==='inner'):null;
    return childIn((inner||hits[0]).object,lk)||null;
  }
  hits=castAt(ev,MESHES); if(!hits.length) return null;
  const hp=hits[0].object.userData.path, sp=pathKeys(sel,selSide);

const nodeSide=(k)=>{ const {id,side}=parseKey(k); return side||(S[id].isHemi?S[id].side:selSide); };
let down=null; const tip=document.getElementById('tip');
canvas.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,t:performance.now()}; });
canvas.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y), dt=performance.now()-down.t; down=null;
  if(moved<6&&dt<600){ const k=pickTarget(e); if(k) selectNode(parseKey(k).id,nodeSide(k),{scroll:true}); else if(mode==='structure') goUp(); }
});
let hoverQueued=null;
canvas.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') hoverQueued=e; });
canvas.addEventListener('pointerleave',()=>{ hovered=null; tip.hidden=true; canvas.style.cursor=''; applyView(); });

/* ================= Labels ================= */
const labelsEl=document.getElementById('labels'), LBL={};
function labelEl(key){
  if(LBL[key]) return LBL[key];
  const {id}=parseKey(key), st=S[id];
  const b=document.createElement('button'); b.className='lbl'; b.type='button'; b.hidden=true;
  b.innerHTML=`<i></i><span>${esc(st.short||st.name)}</span>`;
  b.addEventListener('click',()=>{ if(mode==='condition'){ selectNode(id,viewSide(),{scroll:true}); return; } selectNode(id,nodeSide(key),{scroll:true}); });
  labelsEl.appendChild(b); LBL[key]=b; return b;
}
const tmp=new V3(), shown=new Set();
function updateLabels(){
  const w=stage.clientWidth,h=stage.clientHeight, vs=viewSide(), want=[];
  if(showLabels){
    if(mode==='condition'&&cond) cond.brain.forEach(([id,lv])=>want.push({key:'c|'+id,id,side:vs,c:lv==='p'?HOT:WARM}));
    else { const lp=labelParent();
      S[lp].kids.forEach(k=>{ const side=k.isHemi?k.side:(k.lat?selSide:vs); want.push({key:keyOf(k.id,side),id:k.id,side,c:k.color,sub:lp!=='brain'}); });
    }
  }
  const items=[];
  want.forEach(o=>{
    const a=anchorOf(o.id,o.side); if(!a) return;
    tmp.copy(a.p).addScaledVector(nodeOffset(o.id,o.side),spread).project(camera);
    if(tmp.z>1||Math.abs(tmp.x)>1.05||Math.abs(tmp.y)>1.05) return;
    const yy=(-tmp.y*0.5+0.5)*h;
    if(isMobile()&&(yy<(mode==='condition'?140:100)||yy>h-sheetH()-14)) return;
    items.push({o,x:(tmp.x*0.5+0.5)*w,y:yy});
  });
  items.sort((a,b)=>a.y-b.y);
  const placed=[], now=new Set(), sk=selKey();
  items.forEach(it=>{
    const el=it.o.key.startsWith('c|')?labelEl(it.o.id):labelEl(it.o.key);
    const lkey=it.o.key.startsWith('c|')?it.o.id:it.o.key;
    if(el.hidden) el.hidden=false;
    el.style.setProperty('--c',it.o.c);
    el.classList.toggle('sub',!!it.o.sub);
    el.classList.toggle('on',mode==='structure'&&lkey===sk);
    if(!el._w){ el._w=el.offsetWidth; el._h=el.offsetHeight; }
    const lw=el._w||110, lh=el._h||20;
    let flip=it.x<w*0.5; if(flip&&it.x-lw<4) flip=false; else if(!flip&&it.x+lw>w-4) flip=true;
    const x0=flip?it.x-lw+4.5:it.x-4.5; let y=it.y;
    for(let k=0;k<8;k++){ const hit=placed.find(r=>x0<r.x+r.w&&x0+lw>r.x&&y-lh/2<r.y+r.h/2+2&&y+lh/2>r.y-r.h/2-2); if(!hit) break; y=hit.y+lh+3; }
    placed.push({x:x0,y,w:lw,h:lh});
    el.classList.toggle('flip',flip);
    el.style.transform=`translate(${x0.toFixed(1)}px,${(y-lh/2).toFixed(1)}px)`;
    now.add(lkey);
  });
  shown.forEach(k=>{ if(!now.has(k)&&LBL[k]) LBL[k].hidden=true; });
  shown.clear(); now.forEach(k=>shown.add(k));
}

const mapEl=document.getElementById('chips');
function chip(id,side,label,color,pressed,cls){ return `<button type="button" class="chip${cls?' '+cls:''}" data-node="${id}" data-side="${side||''}" style="--c:${color}" aria-pressed="${pressed}"><i></i>${esc(label)}</button>`; }
function renderMap(){
  const sp=pathKeys(sel,selSide), inPath=k=>sp.includes(k), sk=selKey();
  const sec=(title,headId,headSide,kids,kidSide,color)=>{
    const headKey=headId?keyOf(headId,headSide):null;
    const kk=k=>keyOf(k.id,k.lat?kidSide:'L');
    const active=(headKey&&inPath(headKey))||kids.some(k=>inPath(kk(k)));
    let h=`<div class="sec${active?' open':''}" style="--c:${color}"><div class="sec-h">${headId?`<button type="button" class="sec-t" data-node="${headId}" data-side="${headSide||''}" aria-pressed="${headKey===sk}">${esc(title)}</button>`:`<span class="sec-t">${esc(title)}</span>`}</div><div class="sec-row">`;
    h+=kids.map(k=>chip(k.id,k.lat?kidSide:null,k.name,k.color,inPath(kk(k)))).join('');
    h+='</div>';
    const open=kids.find(k=>inPath(kk(k)));
    if(open&&open.kids&&open.kids.length){
      h+=`<div class="sub-map" style="--c:${open.color}">`;
      const groups=open.kids.filter(k=>k.isGroup), singles=open.kids.filter(k=>!k.isGroup);
      groups.forEach(g=>{ h+=`<div class="grp"><button type="button" class="grp-t" data-node="${g.id}" data-side="${g.lat?kidSide:''}" aria-pressed="${keyOf(g.id,kidSide)===sk}">${esc(g.name)}</button><div class="grp-row">${g.kids.map(l=>chip(l.id,l.lat?kidSide:null,l.short||l.name,l.color,inPath(keyOf(l.id,kidSide)),'sm')).join('')}</div></div>`; });
      if(singles.length) h+=`<div class="grp">${groups.length?`<span class="grp-t plain">${t('otherParts')}</span>`:`<span class="grp-t plain">${t('parts')}</span>`}<div class="grp-row">${singles.map(l=>chip(l.id,l.lat?kidSide:null,l.short||l.name,l.color,inPath(keyOf(l.id,kidSide)),'sm')).join('')}</div></div>`;
      h+='</div>';
    }
    return h+'</div>';
  };
  let h=sec(S.hemiL.name,'hemiL','L',S.hemiL.kids,'L',S.hemiL.color);
  h+=sec(S.hemiR.name,'hemiR','R',S.hemiR.kids,'R',S.hemiR.color);
  h+=sec(S.deep.name,'deep',null,S.deep.kids,null,S.deep.color);
  h+=sec(t('hindbrain'),null,null,[S.cerebellum,S.brainstem],null,'#B58BD6');
  mapEl.innerHTML=h;
}

const mini=document.createElement('canvas'); mini.setAttribute('aria-label','Close-up of the selected structure');
const mR=new THREE.WebGLRenderer({canvas:mini,antialias:true,alpha:true}); mR.setPixelRatio(Math.min(devicePixelRatio,2));
const mS=new THREE.Scene(); addLights(mS);
const mC=new THREE.PerspectiveCamera(35,16/10,0.02,50);
const mCtl=new THREE.OrbitControls(mC,mini); mCtl.enablePan=false; mCtl.enableDamping=true; mCtl.autoRotate=!reduceMotion; mCtl.autoRotateSpeed=1.6; mCtl.minDistance=0.3; mCtl.maxDistance=8;
const ghostMat=new THREE.MeshStandardMaterial({color:0x9aa6b6,transparent:true,opacity:0.08,depthWrite:false,roughness:0.8});
MESHES.forEach(m=>{ if(m.userData.layer!=='inner') mS.add(new THREE.Mesh(m.geometry,ghostMat)); });
let miniGroup=new THREE.Group(); mS.add(miniGroup);
function buildMini(id,side){

  const n=S[id], key=keyOf(id,side), ms=(n.lat||n.isHemi)?meshesOf(id,side):n.meshes;
  ms.forEach(m=>{ const ck=isLeafNode(id)?key:childIn(m,key); const c=new THREE.Color(ck?colorOfKey(ck):S[m.userData.leaf].color); miniGroup.add(new THREE.Mesh(m.geometry,new THREE.MeshStandardMaterial({color:c,roughness:0.55,metalness:0.02,emissive:c.clone().multiplyScalar(0.12)}))); });

  const d=fdirOf(id,side)||new V3(-1,0.3,0.3), dist=Math.min(Math.max(rad*3.2,0.5),5);

function dragEnd(e){ if(!drag) return; panelEl.classList.remove('dragging'); const d=drag; drag=null;
  if(!d.moved){ if(e.target.closest('#grab')) setSnap(snap==='peek'?'half':snap==='half'?'full':'peek'); return; }
  const cur=panelEl.getBoundingClientRect().height, H=snapHeights(), v=(e.clientY-d.y)/(performance.now()-d.t);
  let best='peek'; if(v<-0.5) best=cur>H.half?'full':'half'; else if(v>0.5) best=cur<H.half?'peek':'half'; else { let bd=1e9; for(const k in H){ const dd=Math.abs(H[k]-cur); if(dd<bd){bd=dd;best=k;} } }

  renderer.render(scene,camera);
  updateLabels();
  if(activeTab==='region'&&mini.isConnected&&mini.clientWidth){ mCtl.update(); mR.render(mS,mC); }
  requestAnimationFrame(tick);
}
function setStatic(){
  document.documentElement.lang=lang; document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title=t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  document.getElementById('stats').textContent=t('stats',{p:ATLAS.subs.length,d:PSYCH.length,s:DISEASES.length,e:DICT.length});
}
function applyLang(l){
  if(l===lang) return; lang=l; try{ localStorage.setItem('ibm-lang',l); }catch(e){}
  overlayContent(); buildGlossary(); buildIndex(); buildDict();
  Object.keys(LBL).forEach(k=>{ LBL[k].remove(); delete LBL[k]; }); shown.clear();
  recent.length=0; recentEl.innerHTML=''; hidePop();
  setStatic(); renderFilters(); renderGloss(); renderRegion(); renderMap();
  ['psych','disease'].forEach(k=>{ if(openCond[k]) renderCondDetail(openCond[k]); else renderCondList(k); });
  updateCondbar();
}
setStatic();
placeMap();
selectNode('brain','L',{focus:false});
updateCondbar();
tick();
window.__atlas={S,CONDS,selectNode,openCondition,showTab,setSpread:v=>{spread=v;spreadIn.value=v*100;applySpread();}};
})();

</script>
