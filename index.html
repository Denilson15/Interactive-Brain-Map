'psych:trich':{name:'Tricotilomanía y trastorno de excoriación',short:'Tricotilomanía',aka:['tricotilomanía','trastorno de arrancarse el pelo','trastorno de excoriación','dermatilomanía','pellizcarse la piel','arrancarse el cabello'],
 summary:'Son conductas repetitivas centradas en el cuerpo: arrancarse el pelo de forma recurrente (tricotilomanía) o pellizcarse la piel (excoriación), lo que causa pérdida de cabello o lesiones cutáneas, con intentos repetidos de dejar de hacerlo.',
 overview:['La tricotilomanía (arrancarse el pelo) y el trastorno de excoriación (pellizcarse la piel) son conductas repetitivas centradas en el cuerpo. Las personas se arrancan el pelo o se pellizcan la piel una y otra vez, lo que causa pérdida de cabello o lesiones cutáneas, e intentan repetidamente dejar de hacerlo.',
  'La conducta puede ser automática, ocurriendo mientras se lee o se ve la televisión sin darse cuenta, o focalizada, realizada deliberadamente para aliviar una tensión o un impulso. A menudo produce una sensación de alivio o satisfacción seguida de vergüenza.'],
 brain:{putamen:'Los circuitos del hábito impulsan la naturaleza automática y repetitiva de la conducta.',
  acc:'Una autosupervisión alterada hace más difícil notar la conducta y detenerla.',
  cerebhemi:'Algunos estudios han descrito diferencias en la sustancia gris (su papel no está claro).'},
 symptoms:['Arrancarse el pelo o pellizcarse la piel de forma repetida','Tensión antes de la conducta y alivio durante ella','Episodios automáticos sin darse cuenta','Pérdida de cabello o lesiones cutáneas visibles','Vergüenza y ocultación de los efectos'],
 diagnosis:'Diagnóstico clínico tras descartar causas dermatológicas.',
 causes:['Genética, diferencias en los circuitos del hábito y de la recompensa, y el papel de la conducta en la regulación del aburrimiento o el estrés.'],
 treatment:['El entrenamiento en reversión de hábitos y el modelo conductual integral (ComB). La N-acetilcisteína cuenta con cierta evidencia.'],
 course:'A menudo comienza en torno a la pubertad y puede ser crónico.',
 prevalence:'Cada uno afecta a alrededor del 1–2 % de las personas.'},

'psych:ptsd':{name:'Trastorno de estrés postraumático',short:'TEPT',aka:['trastorno de estrés postraumático','tept','estrés postraumático','trauma'],
 summary:'El TEPT puede aparecer después de vivir o presenciar un acontecimiento traumático, como el combate, una agresión, un desastre o un accidente grave. Los síntomas duran más de un mes e incluyen revivir el suceso, evitación, cambios negativos en el estado de ánimo y el pensamiento, y estar constantemente en alerta.',
 overview:['El trastorno de estrés postraumático puede aparecer después de vivir o presenciar una muerte real o una amenaza de muerte, una lesión grave o violencia sexual. Los síntomas duran más de un mes y se agrupan en cuatro bloques: reexperimentación intrusiva, evitación, alteraciones negativas del pensamiento y del estado de ánimo, y alteraciones de la activación y la reactividad.',
  'En el TEPT, el sistema de amenaza del cerebro se queda atascado en modo de peligro: el recuerdo traumático se almacena como un fragmento sensorial vívido que pueden desencadenar los recordatorios, en lugar de como un recuerdo ordinario situado en el pasado. La mayoría de las personas expuestas a un trauma no desarrolla TEPT; la recuperación es el desenlace más frecuente.'],
 brain:{amygdala:'Este detector de amenazas es hiperreactivo ante los recordatorios del trauma e incluso ante señales neutras, lo que impulsa las reviviscencias (flashbacks), el pánico y la hipervigilancia.',
  vmpfc:'Normalmente almacena el aprendizaje de seguridad y calma la amígdala. En el TEPT está hipoactiva, así que la extinción del miedo fracasa y el cerebro sigue tratando las situaciones seguras como peligrosas.',
  hippocampus:'Sitúa los recuerdos en el tiempo y el contexto. Un volumen menor y un funcionamiento más débil hacen más difícil distinguir el "entonces" del "ahora" y los contextos seguros de los peligrosos, de modo que los recordatorios desencadenan miedo en cualquier lugar.',
  acc:'Un volumen y una regulación reducidos contribuyen a la dificultad para controlar las respuestas emocionales.',
  antinsula:'Aumenta la ansiedad de base corporal y la conciencia emocional de la amenaza.',
  lc:'Una elevada liberación de noradrenalina impulsa la hiperactivación, el sobresalto y las pesadillas; la prazosina, que bloquea uno de los efectos de la noradrenalina, puede reducir las pesadillas.',
  pvn:'Regulación alterada de las hormonas del estrés; las respuestas de cortisol suelen ser anómalas.'},
 symptoms:['Recuerdos intrusivos, reviviscencias (flashbacks) y pesadillas','Malestar intenso o reacciones corporales ante los recordatorios','Evitar pensamientos, lugares o personas relacionados con el trauma','Creencias negativas persistentes, culpa, autoinculpación o vergüenza','Embotamiento emocional y desapego','Hipervigilancia y respuesta de sobresalto exagerada','Irritabilidad, dificultad para concentrarse y para dormir'],
 diagnosis:'Requiere exposición a un trauma más síntomas de los cuatro bloques durante más de un mes que causen deterioro. Se usan con frecuencia la PCL-5 y la CAPS-5. Existe un subtipo disociativo.',
 types:['Con síntomas disociativos: despersonalización o desrealización.','Con expresión diferida: se cumplen todos los criterios seis meses o más después del suceso.','El TEPT complejo (en la CIE-11) añade problemas de regulación emocional, de autoconcepto y en las relaciones tras un trauma prolongado.'],
 causes:['El riesgo es mayor con la violencia interpersonal, el trauma repetido o prolongado, los traumas previos, la falta de apoyo posterior, el estrés continuado y la vulnerabilidad genética.'],
 treatment:['Las psicoterapias centradas en el trauma son de primera línea: exposición prolongada, terapia de procesamiento cognitivo y EMDR. Ayudan al cerebro a reprocesar el recuerdo y a volver a aprender la seguridad.',
  'Los ISRS (sertralina, paroxetina) y la venlafaxina son los medicamentos de primera línea. La prazosina puede reducir las pesadillas en algunas personas. Entre los enfoques nuevos en estudio está la terapia asistida con MDMA, que la FDA decidió no aprobar en 2024.'],
 course:'Muchas personas se recuperan en meses; en otras, el TEPT puede durar años. Un tratamiento eficaz ayuda a una gran parte de las personas incluso tras una enfermedad prolongada.',
 prevalence:'Alrededor del 6–8 % de los adultos en EE. UU. a lo largo de la vida.',
 fact:'La extinción del miedo no borra un recuerdo de miedo; crea un nuevo recuerdo de seguridad, almacenado con la ayuda de la CPFvm, que compite con el antiguo.'},

'psych:asd_stress':{name:'Trastorno de estrés agudo',short:'Estrés agudo',aka:['trastorno de estrés agudo','estrés agudo','reacción aguda al estrés'],
 summary:'El trastorno de estrés agudo implica síntomas parecidos a los del TEPT que aparecen entre 3 días y 1 mes después de un acontecimiento traumático. Puede resolverse o evolucionar a TEPT.',
 overview:['El trastorno de estrés agudo implica síntomas parecidos a los del TEPT que comienzan entre 3 días y 1 mes después de un acontecimiento traumático. A menudo incluye disociación, como sentirse aturdido. Muchas personas se recuperan; algunas llegan a desarrollar TEPT.'],
 brain:{amygdala:'La activación aguda ante la amenaza tras el trauma mantiene encendido el sistema de alarma.',
  hippocampus:'Los niveles altos de hormonas del estrés alteran la codificación del recuerdo, lo que contribuye a un recuerdo fragmentado.'},
 symptoms:['Recuerdos intrusivos','Disociación, embotamiento o aturdimiento','Evitación','Ansiedad, mal sueño e hiperactivación'],
 diagnosis:'Requiere nueve o más síntomas de las categorías de intrusión, estado de ánimo negativo, disociación, evitación y activación, con una duración de entre 3 días y 1 mes.',
 causes:['Exposición a un trauma, con factores de riesgo similares a los del TEPT.'],
 treatment:['Una TCC breve centrada en el trauma puede prevenir el TEPT. No se recomienda el debriefing psicológico de sesión única, porque puede aumentar el riesgo.'],
 course:'En muchas personas se resuelve en un mes; alrededor de la mitad llega a desarrollar TEPT.',
 prevalence:'Afecta aproximadamente al 20 % o menos de las personas tras acontecimientos traumáticos que no implican agresión, y a más tras una agresión.'},

'psych:did':{name:'Trastorno de identidad disociativo',short:'TID',aka:['trastorno de identidad disociativo','tid','trastorno de personalidad múltiple','personalidad múltiple'],
 summary:'El trastorno de identidad disociativo implica dos o más estados de identidad diferenciados, con lagunas de memoria sobre acontecimientos cotidianos, información personal o sucesos traumáticos. Casi siempre se asocia con traumas infantiles graves y repetidos, y sigue siendo un tema de debate e investigación.',
 overview:['El trastorno de identidad disociativo implica dos o más estados de identidad diferenciados, cada uno con su propio sentido de sí mismo y de agencia, y lagunas de memoria recurrentes sobre acontecimientos cotidianos, información personal o traumas. Se entiende como una respuesta a traumas infantiles graves y repetidos en los que la disociación fue una forma de sobrevivir.',
  'El TID sigue siendo objeto de debate: algunos investigadores sostienen que puede estar moldeado por la sugestión o por las expectativas sociales. La mayoría de los clínicos especializados en trauma lo reconocen como una condición real, aunque rara y a menudo mal diagnosticada.'],
 brain:{hippocampus:'Se ha descrito un volumen menor, que podría reflejar estrés temprano crónico y relacionarse con las lagunas de memoria.',
  amygdala:'Algunos estudios describen un volumen menor y una reactividad emocional alterada.',
  precuneus:'Se han observado cambios en las redes de autoconciencia entre distintos estados de identidad.',
  dlpfc:'Un control prefrontal alterado podría contribuir a las alteraciones de la memoria y de la identidad (investigación limitada).'},
 symptoms:['Estados de identidad diferenciados con rasgos, voces o recuerdos distintos','Lagunas de memoria sobre acontecimientos cotidianos y la historia personal','Encontrar objetos o escritos sin explicación','Despersonalización y desrealización','TEPT, depresión y autolesiones concurrentes'],
 diagnosis:'Requiere una evaluación especializada, a menudo con entrevistas estructuradas como la SCID-D, y una cuidadosa diferenciación de la psicosis, el trastorno límite de la personalidad y las crisis epilépticas.',
 causes:['Trauma temprano grave y crónico, combinado con una alta capacidad de disociación y la falta de cuidados de apoyo.'],
 treatment:['Psicoterapia a largo plazo orientada por fases: seguridad y estabilización, después procesamiento de los recuerdos traumáticos y, por último, integración o cooperación entre los estados de identidad.'],
 course:'Suele ser crónico, pero muchas personas mejoran con un tratamiento especializado.',
 prevalence:'En torno al 1–1,5 % en algunas muestras comunitarias; las estimaciones varían y son objeto de debate.'},

'psych:dpdr':{name:'Trastorno de despersonalización/desrealización',short:'Despersonalización',aka:['trastorno de despersonalización/desrealización','trastorno de despersonalización','despersonalización','desrealización'],
 summary:'Las personas con este trastorno se sienten repetidamente desconectadas de su propia mente, su cuerpo o sus sentimientos (despersonalización), o sienten que el mundo es irreal, onírico o brumoso (desrealización). Saben que la sensación no es literalmente cierta.',
 overview:['Las personas con trastorno de despersonalización/desrealización se sienten repetidamente desconectadas de su propia mente, su cuerpo o sus sentimientos, como si se observaran desde fuera, o sienten que el mundo es irreal, brumoso u onírico. El juicio de realidad se mantiene intacto: saben que la experiencia no es literalmente cierta.',
  'Los episodios breves son frecuentes con el estrés o la falta de sueño; el trastorno implica episodios persistentes o recurrentes que causan malestar.'],
 brain:{antinsula:'Genera la sensación sentida de las emociones y del cuerpo. Su menor actividad coincide con la experiencia de embotamiento emocional y de sentirse desconectado de uno mismo.',
  vlpfc:'Se cree que una inhibición prefrontal hiperactiva de las respuestas límbicas amortigua los sentimientos emocionales, una especie de sobrecorrección.',
  angular:'La unión temporoparietal sostiene la sensación de estar situado dentro del propio cuerpo; su actividad alterada se asocia con experiencias parecidas a las extracorporales.'},
 symptoms:['Sentirse como un observador externo de uno mismo','Embotamiento emocional y físico','El entorno parece plano, lejano o artificial','Sentido del tiempo distorsionado','Malestar por la experiencia'],
 diagnosis:'Requiere episodios persistentes o recurrentes con el juicio de realidad intacto, tras descartar sustancias, crisis epilépticas y otros trastornos.',
 causes:['Pueden desencadenarlo el estrés grave, el maltrato emocional en la infancia, la ansiedad y experiencias con drogas como el cannabis.'],
 treatment:['Psicoterapia (TCC, técnicas de anclaje o grounding), reducción de la ansiedad y tratamiento de las condiciones concurrentes. No hay ningún medicamento aprobado específicamente.'],
 course:'A menudo es crónico, aunque puede fluctuar y mejorar.',
 prevalence:'Alrededor del 1–2 % de las personas.'},

'psych:ssd':{name:'Trastorno de síntomas somáticos',short:'Síntomas somáticos',aka:['trastorno de síntomas somáticos','trastorno de somatización','somatización'],
 summary:'El trastorno de síntomas somáticos implica uno o más síntomas físicos angustiantes, que pueden tener o no una causa médica, junto con pensamientos, sentimientos o conductas excesivos sobre ellos, como una ansiedad persistente por la salud o dedicarles una gran cantidad de tiempo.',
 overview:['El trastorno de síntomas somáticos implica uno o más síntomas físicos angustiantes, que pueden tener o no una explicación médica, junto con pensamientos, sentimientos o conductas excesivos sobre ellos, como una preocupación persistente por su gravedad o dedicarles una gran cantidad de tiempo y energía.',
  'Los síntomas son reales, no imaginados. El trastorno reside en cómo la atención, la interpretación y la preocupación los amplifican y acaban dominando la vida diaria.'],
 brain:{antinsula:'Amplifica la atención a las señales corporales, haciendo que las sensaciones normales se sientan más intensas.',
  acc:'Aumenta el malestar emocional asociado a las sensaciones corporales.',
  amygdala:'Interpreta las sensaciones como amenazantes, lo que aumenta la preocupación.'},
 symptoms:['Síntomas angustiantes como dolor o fatiga','Preocupación persistente por su gravedad','Visitas médicas y pruebas frecuentes','Síntomas que dominan la vida diaria'],
 diagnosis:'Se diagnostica por la respuesta excesiva a los síntomas durante seis meses, no por la ausencia de una explicación médica.',
 causes:['Mayor sensibilidad corporal, ansiedad y depresión, experiencias previas de enfermedad y estrés.'],
 treatment:['TCC, visitas regulares programadas con un único médico y tratamiento de la ansiedad o la depresión concurrentes.'],
 course:'A menudo es crónico, pero la TCC puede reducir el malestar y mejorar el funcionamiento.',
 prevalence:'Se estima en alrededor del 5–7 % de los adultos.'},

'psych:fnd':{name:'Trastorno neurológico funcional',short:'TNF',aka:['trastorno neurológico funcional','trastorno de síntomas neurológicos funcionales','trastorno de conversión','tnf'],
 summary:'En el trastorno neurológico funcional (antes llamado trastorno de conversión), las personas tienen síntomas neurológicos reales, como debilidad, temblor, crisis o entumecimiento, que se deben a un problema en el funcionamiento del cerebro y no a un daño estructural. Los síntomas no son fingidos ni imaginados.',
 overview:['El trastorno neurológico funcional causa síntomas neurológicos reales, como debilidad, temblor, crisis, problemas para caminar o entumecimiento, que se deben a un problema en el funcionamiento del cerebro y no a un daño estructural. A menudo se describe como un problema de "software" y no de "hardware".',
  'El TNF es frecuente y realmente incapacitante. Los síntomas no son fingidos ni imaginados, y muchas personas no tienen ningún desencadenante psicológico identificable. El diagnóstico se basa en signos clínicos positivos, no solo en pruebas normales.'],
 brain:{angular:'La unión temporoparietal contribuye al sentido de agencia. Su menor actividad podría explicar por qué los movimientos se sienten involuntarios.',
  sma:'Una preparación del movimiento alterada puede perturbar el control voluntario normal.',
  amygdala:'Una mayor reactividad emocional puede secuestrar los circuitos de control motor.',
  antinsula:'Una conciencia corporal alterada puede cambiar la forma en que se experimentan los síntomas.'},
 symptoms:['Debilidad o parálisis de las extremidades','Crisis funcionales (disociativas)','Temblor, sacudidas o marcha inusual','Entumecimiento o pérdida sensitiva','Problemas del habla o de la deglución'],
 diagnosis:'Los neurólogos identifican signos positivos, como el signo de Hoover en la debilidad funcional, y utilizan el video-EEG para las crisis funcionales.',
 causes:['Lesiones físicas, enfermedades, estrés, trauma y la atención centrada en el cuerpo, a menudo combinados.'],
 treatment:['Una explicación clara del diagnóstico es el primer paso. La fisioterapia especializada, la terapia ocupacional y la TCC ayudan a reentrenar el funcionamiento cerebral.'],
 course:'Variable; un diagnóstico y un tratamiento más tempranos mejoran el pronóstico.',
 prevalence:'Uno de los motivos más frecuentes de consulta en neurología.'},
});

</script>
<script>
window.I18N_ES=window.I18N_ES||{nodes:{},conds:{},glossary:{}};
Object.assign(window.I18N_ES.conds,{
'psych:anorexia':{name:'Anorexia nerviosa',short:'Anorexia nerviosa',aka:['anorexia nerviosa','anorexia'],
 summary:'La anorexia nerviosa es un trastorno de la conducta alimentaria grave que implica una restricción de la ingesta que lleva a un peso corporal significativamente bajo, un miedo intenso a ganar peso y una vivencia distorsionada de la forma del cuerpo. Tiene una de las tasas de mortalidad más altas de todas las condiciones psiquiátricas, pero la recuperación es posible.',
 overview:['La anorexia nerviosa es un trastorno de la conducta alimentaria grave caracterizado por la restricción de la ingesta energética que lleva a un peso corporal significativamente bajo para la edad y la salud de la persona, un miedo intenso a ganar peso o conductas que impiden ganarlo, y una alteración en la vivencia de la forma del cuerpo o la negación de la gravedad del bajo peso.',
  'Afecta a todos los sistemas del organismo, incluidos el corazón, los huesos, las hormonas y el cerebro, y tiene una de las tasas de mortalidad más altas de todas las condiciones psiquiátricas. La propia inanición cambia el pensamiento, volviéndolo más rígido y centrado en la comida, lo que ayuda a mantener la enfermedad. La recuperación completa es posible, sobre todo con un tratamiento temprano.'],
 brain:{antinsula:'Integra las señales de hambre, sabor y del cuerpo en sensaciones. Su actividad alterada puede amortiguar las señales de hambre y cambiar cómo se sienten la comida y el cuerpo, lo que contribuye a la restricción y a la vivencia corporal distorsionada.',
  caudate:'Forma parte del sistema de recompensa y de hábitos. Las respuestas dopaminérgicas alteradas pueden hacer que la restricción resulte gratificante y la comida menos, y la restricción puede convertirse en un hábito.',
  dlpfc:'Sostiene el autocontrol. Un control prefrontal aumentado se asocia con la capacidad de anular el hambre y con un pensamiento rígido y perfeccionista.',
  ofc:'Representa el valor de recompensa de la comida. Sus respuestas alteradas pueden reducir el placer de comer.',
  hypothalamus:'Regula el apetito y las hormonas reproductivas. La inanición altera estos sistemas y provoca la pérdida de la menstruación y otros cambios hormonales.'},
 symptoms:['Restricción de la ingesta de alimentos','Miedo intenso a ganar peso','Imagen corporal distorsionada','Negación de la gravedad del bajo peso','Rituales rígidos con la comida','Ejercicio excesivo en algunas personas','Efectos físicos: frecuencia cardíaca baja, mareos, sensación de frío, pérdida de la menstruación, pérdida de masa ósea'],
 diagnosis:'Los profesionales evalúan la historia del peso, las conductas alimentarias, las creencias sobre el peso y la figura, y el estado médico, incluidos el ritmo cardíaco, los electrolitos y la salud ósea. La gravedad se clasifica según el índice de masa corporal en adultos y según percentiles en personas jóvenes.',
 types:['Tipo restrictivo: pérdida de peso principalmente mediante dieta, ayuno o ejercicio excesivo.','Tipo con atracones/purgas: atracones recurrentes o conductas purgativas.'],
 causes:['La genética explica alrededor del 50–60 % del riesgo, y estudios recientes sugieren factores genéticos tanto metabólicos como psiquiátricos. Contribuyen el temperamento (perfeccionismo, ansiedad, evitación del daño), las dietas y las presiones culturales sobre la delgadez.'],
 treatment:['La estabilización médica y la restauración nutricional son esenciales. El tratamiento basado en la familia es el enfoque más eficaz en adolescentes. En adultos se usan terapias especializadas como la TCC-E, MANTRA y el manejo clínico de apoyo especializado.','Ningún medicamento trata directamente la anorexia, aunque pueden tratarse las condiciones concurrentes. Muchos cambios cerebrales mejoran con la recuperación del peso.'],
 course:'La evolución es variable; muchas personas se recuperan por completo, algunas tienen recaídas y una minoría sigue un curso crónico. El tratamiento temprano mejora los resultados.',
 prevalence:'Hasta alrededor del 1–4 % de las mujeres y una proporción menor de los hombres a lo largo de la vida.',
 fact:'Si te preocupa tu situación o la de otra persona, un médico o una línea de ayuda para trastornos de la conducta alimentaria pueden ayudarte.'},

'psych:bulimia':{name:'Bulimia nerviosa',short:'Bulimia nerviosa',aka:['bulimia nerviosa','bulimia'],
 summary:'La bulimia nerviosa implica episodios recurrentes de atracones con sensación de pérdida de control, seguidos de conductas para evitar el aumento de peso, con una autoestima muy basada en la figura y el peso corporal.',
 overview:['La bulimia nerviosa implica episodios recurrentes de atracones con sensación de pérdida de control, seguidos de conductas compensatorias para evitar el aumento de peso, al menos una vez por semana durante tres meses, con una autoestima muy basada en la figura y el peso corporal.',
  'Las personas con bulimia suelen tener un peso normal, por lo que el trastorno puede pasar desapercibido con facilidad. Los episodios suelen ser secretos y van acompañados de vergüenza. Las purgas repetidas pueden causar desequilibrios electrolíticos peligrosos y daño dental.'],
 brain:{vlpfc:'Sostiene el control inhibitorio. Su menor actividad puede hacer más difícil detenerse una vez que empieza un atracón.',
  ofc:'Una valoración alterada de la recompensa de la comida puede aumentar el impulso a darse atracones.',
  antinsula:'Un procesamiento alterado del sabor y de las señales corporales puede afectar a las señales de hambre y saciedad.',
  nacc:'Las respuestas de recompensa alteradas ante la comida pueden reforzar el ciclo de atracones.'},
 symptoms:['Episodios recurrentes de atracones con pérdida de control','Conductas compensatorias','Autoevaluación determinada por la figura y el peso','Secretismo y vergüenza','Mejillas hinchadas, erosión dental, problemas de electrolitos'],
 diagnosis:'Requiere atracones y conductas compensatorias al menos semanales durante tres meses, con una autoevaluación excesivamente influida por el peso y la figura.',
 causes:['Genética, dietas, baja autoestima, dificultades para regular las emociones y presiones culturales.'],
 treatment:['La TCC-E es el tratamiento principal. La fluoxetina está aprobada por la FDA para la bulimia.'],
 course:'Muchas personas mejoran con tratamiento, aunque pueden producirse recaídas.',
 prevalence:'Alrededor del 1 % de las mujeres a lo largo de la vida; es menos frecuente en hombres.'},

'psych:bed':{name:'Trastorno por atracón',short:'Trastorno por atracón',aka:['trastorno por atracón','trastorno por atracones','atracones','comer compulsivo'],
 summary:'El trastorno por atracón implica episodios recurrentes de atracones con sensación de pérdida de control y malestar marcado, sin conductas compensatorias regulares. Es el trastorno de la conducta alimentaria más frecuente.',
 overview:['El trastorno por atracón implica episodios recurrentes de atracones con sensación de pérdida de control y malestar marcado, sin las conductas compensatorias regulares de la bulimia. Es el trastorno de la conducta alimentaria más frecuente.',
  'Los atracones suelen seguir al estrés, a emociones negativas o a dietas restrictivas, y van seguidos de vergüenza y culpa, lo que puede desencadenar el siguiente atracón.'],
 brain:{nacc:'Muestra respuestas aumentadas ante las señales de comida, lo que incrementa el impulso a comer.',
  ofc:'Valoración alterada de la comida como recompensa.',
  vlpfc:'Un menor control inhibitorio hace más difícil dejar de comer una vez que se empieza.'},
 symptoms:['Comer cantidades inusualmente grandes en poco tiempo','Sentir que se pierde el control mientras se come','Comer muy rápido, sin tener hambre o hasta sentirse incómodamente lleno','Comer a solas por vergüenza','Vergüenza y culpa después'],
 diagnosis:'Requiere atracones al menos semanales durante tres meses con malestar marcado.',
 causes:['Genética, dietas, estrés, depresión y dificultades para regular las emociones.'],
 treatment:['La TCC es el tratamiento de primera línea. La lisdexanfetamina está aprobada por la FDA para el trastorno por atracón moderado a grave.'],
 course:'A menudo es crónico, pero responde al tratamiento.',
 prevalence:'Alrededor del 1–3 % de las personas a lo largo de la vida.'},

'psych:insomnia':{name:'Trastorno de insomnio',short:'Insomnio',aka:['trastorno de insomnio','insomnio'],
 summary:'El trastorno de insomnio es una dificultad continuada para conciliar el sueño, mantenerlo o despertarse demasiado temprano, al menos tres noches por semana durante tres meses, a pesar de tener suficiente oportunidad para dormir, y que causa problemas durante el día.',
 overview:['El trastorno de insomnio es una dificultad persistente para conciliar el sueño, mantenerlo o despertarse demasiado temprano, al menos tres noches por semana durante tres meses, a pesar de tener suficiente oportunidad para dormir, que causa fatiga diurna, problemas del estado de ánimo o deterioro del funcionamiento.',
  'Se entiende como un estado de hiperactivación: el cerebro y el cuerpo permanecen demasiado alerta por la noche. Con el tiempo, preocuparse por el sueño y pasar muchas horas despierto en la cama enseñan al cerebro a asociar la cama con la vigilia, lo que mantiene el insomnio incluso después de que el desencadenante original haya desaparecido.'],
 brain:{lateralhyp:'Los sistemas de activación, como el de la orexina, permanecen demasiado activos por la noche y mantienen despierto al cerebro.',
  thalamus:'Normalmente filtra la información sensorial y se desactiva al inicio del sueño. Una menor desactivación puede permitir que el cerebro siga alerta.',
  acc:'Su mayor actividad se asocia con una mente acelerada y preocupada a la hora de acostarse.',
  amygdala:'Una mayor activación emocional dificulta relajarse.'},
 symptoms:['Dificultad para conciliar o mantener el sueño','Despertar demasiado temprano','Fatiga y somnolencia diurnas','Mala concentración e irritabilidad','Preocupación por el sueño'],
 diagnosis:'Se basa en la historia del sueño y en diarios de sueño; se realizan estudios del sueño si se sospecha apnea del sueño u otros trastornos.',
 causes:['Hiperactivación, estrés, horarios irregulares, ansiedad y depresión, dolor y asociaciones aprendidas entre la cama y la vigilia.'],
 treatment:['La TCC-I (control de estímulos, restricción del sueño, trabajo cognitivo e higiene del sueño) es el tratamiento de primera línea y supera a las pastillas para dormir a largo plazo. Los medicamentos suelen reservarse para un uso a corto plazo.'],
 course:'Puede ser crónico, pero responde bien a la TCC-I.',
 prevalence:'Alrededor del 10 % de los adultos tiene insomnio crónico; cerca de un tercio tiene síntomas ocasionales.'},

'psych:narcolepsy':{name:'Narcolepsia',short:'Narcolepsia',aka:['narcolepsia'],
 summary:'La narcolepsia es un trastorno neurológico crónico del sueño en el que el cerebro no puede regular adecuadamente el sueño y la vigilia. Causa una somnolencia diurna abrumadora y, en el tipo 1, cataplejía: debilidad muscular súbita desencadenada por emociones como la risa.',
 overview:['La narcolepsia es un trastorno neurológico crónico del sueño en el que el cerebro no puede regular adecuadamente el sueño y la vigilia. Causa una somnolencia diurna abrumadora y, en el tipo 1, cataplejía: debilidad muscular súbita desencadenada por emociones intensas como la risa.',
  'Rasgos del sueño REM se introducen en la vigilia: la parálisis muscular aparece como cataplejía y parálisis del sueño, y las imágenes oníricas aparecen como alucinaciones al quedarse dormido o al despertar.'],
 brain:{lateralhyp:'Las neuronas de orexina estabilizan la vigilia. Su pérdida en la narcolepsia tipo 1 deja inestable el interruptor sueño-vigilia, de modo que la persona cae en el sueño o en estados similares al REM durante el día.',
  pons:'Controla el sueño REM y su parálisis muscular. Sin orexina, esta parálisis puede activarse estando despierto y causar cataplejía y parálisis del sueño.',
  amygdala:'Las emociones intensas activan la amígdala, que puede desencadenar la cataplejía a través de circuitos del tronco encefálico.'},
 symptoms:['Somnolencia diurna excesiva y ataques de sueño repentinos','Cataplejía (tipo 1)','Parálisis del sueño','Alucinaciones vívidas al quedarse dormido o al despertar','Sueño nocturno fragmentado'],
 diagnosis:'Estudio del sueño nocturno (polisomnografía) seguido de un test de latencias múltiples del sueño; una orexina baja en el líquido cefalorraquídeo confirma el tipo 1.',
 types:['Tipo 1: con cataplejía y/o orexina baja.','Tipo 2: sin cataplejía, con orexina normal.'],
 causes:['El tipo 1 se debe a la pérdida de neuronas de orexina, probablemente por un ataque autoinmune en personas con la variante genética HLA-DQB1*06:02.'],
 treatment:['Modafinilo, solriamfetol, pitolisant y estimulantes para la somnolencia; oxibato de sodio para la somnolencia y la cataplejía; siestas programadas.'],
 course:'Dura toda la vida, pero los síntomas son manejables con tratamiento.',
 prevalence:'Alrededor de 1 de cada 2.000 personas.'},

'psych:aud':{name:'Trastorno por consumo de alcohol',short:'Trastorno por consumo de alcohol',aka:['trastorno por consumo de alcohol','trastorno por uso de alcohol','alcoholismo','adicción al alcohol'],
 summary:'El trastorno por consumo de alcohol es un patrón problemático de consumo con pérdida de control, ansia (craving) y consumo continuado a pesar del daño. Va de leve a grave e implica cambios duraderos en los circuitos cerebrales de recompensa, estrés y autocontrol.',
 overview:['El trastorno por consumo de alcohol es un patrón problemático de consumo marcado por la pérdida de control, el ansia (craving) y el consumo continuado a pesar del daño. Va de leve a grave e implica cambios duraderos en los sistemas cerebrales de recompensa, estrés y autocontrol.',
  'La adicción suele describirse en tres etapas que se repiten: atracón e intoxicación (impulsada por la recompensa), abstinencia y afecto negativo (impulsada por los sistemas de estrés), y preocupación y anticipación (impulsada por un control prefrontal debilitado). Con el tiempo, las personas beben menos por placer y más para aliviar la abstinencia y el malestar.'],
 brain:{nacc:'El centro de recompensa se adapta a los picos repetidos de dopamina inducidos por el alcohol, de modo que las señales asociadas a la bebida desencadenan un ansia intensa mientras que las recompensas cotidianas resultan menos satisfactorias.',
  vta:'El alcohol aumenta la liberación de dopamina por las neuronas del ATV, el efecto reforzador inicial que impulsa el consumo repetido.',
  dlpfc:'Sostiene el autocontrol y la planificación. Un control descendente debilitado hace más difícil resistirse a beber a pesar de las intenciones.',
  antinsula:'Convierte los estados corporales en impulsos sentidos, lo que contribuye al ansia.',
  ofc:'Una valoración alterada hace que el alcohol parezca más valioso que otras recompensas.',
  vermis:'El consumo intenso prolongado reduce el cerebelo, sobre todo el vermis, y causa una marcha inestable.',
  hippocampus:'El alcohol altera la formación de recuerdos (lagunas o «blackouts»), y el consumo intenso a largo plazo reduce su volumen.',
  mammillary:'El déficit de tiamina puede causar el síndrome de Wernicke-Korsakoff, que daña estas estructuras de la memoria.'},
 symptoms:['Beber más cantidad o durante más tiempo de lo previsto','Intentos fallidos de reducir el consumo','Ansia (craving)','Tolerancia','Abstinencia: temblores, sudoración, ansiedad, insomnio; en casos graves, convulsiones o delirium tremens','Seguir bebiendo a pesar de los problemas','Abandonar actividades'],
 diagnosis:'Se basa en 11 criterios del DSM-5; la gravedad es leve (2–3), moderada (4–5) o grave (6 o más). El cuestionario AUDIT es una herramienta de cribado habitual.',
 causes:['Genética (heredabilidad de alrededor del 50 %), inicio temprano del consumo, estrés, trauma, condiciones de salud mental y entorno social.'],
 treatment:['Los medicamentos incluyen naltrexona, acamprosato y disulfiram. La orientación psicológica, la TCC, la entrevista motivacional y los grupos de ayuda mutua apoyan la recuperación. La abstinencia tras un consumo intenso y prolongado puede ser peligrosa y requerir supervisión médica.'],
 course:'A menudo es crónico y con recaídas, pero muchas personas se recuperan, sobre todo con tratamiento.',
 prevalence:'Alrededor de 1 de cada 10 adultos en EE. UU. en un año determinado.'},

'psych:oud':{name:'Trastorno por consumo de opioides',short:'Trastorno por consumo de opioides',aka:['trastorno por consumo de opioides','trastorno por uso de opioides','adicción a los opioides','adicción a opiáceos'],
 summary:'El trastorno por consumo de opioides es una condición crónica que implica el consumo compulsivo de opioides como la heroína, el fentanilo o analgésicos con receta a pesar del daño. Conlleva un alto riesgo de sobredosis mortal.',
 overview:['El trastorno por consumo de opioides es una condición crónica y tratable que implica el consumo compulsivo de opioides como la heroína, el fentanilo o analgésicos con receta a pesar del daño. La dependencia física se desarrolla rápidamente y la abstinencia es intensamente desagradable, lo que impulsa con fuerza a seguir consumiendo.',
  'La actual crisis de sobredosis se debe principalmente al fentanilo de fabricación ilícita, que es extremadamente potente. Los medicamentos para el trastorno por consumo de opioides son muy eficaces y reducen sustancialmente las muertes por sobredosis, pero siguen infrautilizándose.'],
 brain:{vta:'Los opioides inhiben los frenos de las neuronas dopaminérgicas del ATV y liberan un pico de dopamina que produce euforia y refuerza el consumo.',
  nacc:'Los picos repetidos remodelan el centro de recompensa y generan un ansia intensa e impulsos desencadenados por señales.',
  lc:'Los opioides suprimen el locus coeruleus; durante la abstinencia rebota hacia una hiperactividad que causa ansiedad, sudoración y agitación.',
  medulla:'Los centros respiratorios son muy sensibles a los opioides; la sobredosis mata principalmente al detener la respiración.',
  antinsula:'Convierte el malestar de la abstinencia en ansia.',
  ofc:'Una toma de decisiones alterada favorece el consumo de la droga frente a otras recompensas.'},
 symptoms:['Ansia intensa','Tolerancia','Abstinencia: dolores, sudoración, diarrea, ansiedad, insomnio','Pérdida de control sobre el consumo','Consumo continuado a pesar del daño','Riesgo de sobredosis'],
 diagnosis:'Se basa en criterios del DSM-5 similares a los del trastorno por consumo de alcohol.',
 causes:['Exposición a opioides, genética, dolor crónico, trauma, condiciones de salud mental y factores sociales.'],
 treatment:['La buprenorfina, la metadona y la naltrexona de liberación prolongada reducen las muertes por sobredosis y apoyan la recuperación. La naloxona revierte las sobredosis. La orientación psicológica y el apoyo a la recuperación ayudan.'],
 course:'Crónico y con recaídas, pero el tratamiento farmacológico a largo plazo mejora enormemente la supervivencia y la recuperación.',
 prevalence:'Varios millones de personas en EE. UU.'},

'psych:stimulant':{name:'Trastorno por consumo de estimulantes',short:'Trastorno por consumo de estimulantes',aka:['trastorno por consumo de estimulantes','trastorno por uso de estimulantes','adicción a la cocaína','adicción a la metanfetamina'],
 summary:'El trastorno por consumo de estimulantes implica un consumo problemático de cocaína, metanfetamina u otros estimulantes, con ansia, pérdida de control y consumo continuado a pesar del daño.',
 overview:['El trastorno por consumo de estimulantes implica un consumo problemático de cocaína, metanfetamina u otros estimulantes, con ansia, patrones de consumo en atracón y consumo continuado a pesar del daño. Los estimulantes producen una euforia y una energía intensas seguidas de un bajón de agotamiento y ánimo bajo.',
  'El consumo intenso puede causar paranoia y psicosis, infartos de miocardio, accidentes cerebrovasculares y, cada vez más, sobredosis cuando los estimulantes están contaminados con fentanilo.'],
 brain:{nacc:'Los estimulantes bloquean la recaptación de dopamina o fuerzan su liberación, inundando el centro de recompensa de dopamina y produciendo una euforia y un ansia intensas.',
  vta:'Los circuitos dopaminérgicos se adaptan con el consumo repetido y reducen la respuesta del cerebro a las recompensas naturales.',
  caudate:'El consumo pasa de estar dirigido a metas a estar impulsado por el hábito.',
  ofc:'Valoración alterada y actividad reducida durante la abstinencia.',
  acc:'Supervisión de errores y control más débiles.'},
 symptoms:['Patrones de consumo en atracón','Ansia intensa','Paranoia o psicosis con el consumo intenso','Bajón de agotamiento y ánimo bajo','Pérdida de peso y alteración del sueño'],
 diagnosis:'Se basa en criterios del DSM-5 similares a los de otros trastornos por consumo de sustancias.',
 causes:['Genética, exposición temprana, trauma, condiciones de salud mental y entorno.'],
 treatment:['El manejo de contingencias tiene la evidencia más sólida. La TCC también ayuda. Todavía no hay medicamentos aprobados por la FDA.'],
 course:'Crónico y con recaídas, pero la recuperación es frecuente con tratamiento.',
 prevalence:'Varios millones de personas en EE. UU.'},

'psych:gambling':{name:'Trastorno por juego de apuestas',short:'Juego patológico',aka:['trastorno por juego de apuestas','juego patológico','ludopatía','adicción al juego','trastorno de juego'],
 summary:'El trastorno por juego de apuestas es un juego persistente y problemático que causa malestar o daño significativos. Es la única adicción conductual incluida en la sección diagnóstica principal del DSM-5.',
 overview:['El trastorno por juego de apuestas es un juego persistente y problemático que causa malestar o daño significativos. Es la única adicción conductual incluida en la sección diagnóstica principal del DSM-5.',
  'Activa los mismos circuitos de recompensa que las drogas. Las ganancias impredecibles y los «casi aciertos» son especialmente poderosos, y la persecución de las pérdidas impulsa apuestas y deudas cada vez mayores.'],
 brain:{nacc:'Responde con fuerza a las ganancias y a los casi aciertos, lo que refuerza el juego continuado.',
  vmpfc:'Valoración alterada de las elecciones arriesgadas.',
  ofc:'Toma de decisiones alterada.',
  antinsula:'Los efectos de los casi aciertos activan la ínsula y aumentan el impulso de seguir jugando.'},
 symptoms:['Necesitar apostar más para sentir emoción','Inquietud al intentar dejarlo','Perseguir las pérdidas','Mentir para ocultar el juego','Poner en riesgo relaciones o el trabajo','Depender de otros para obtener dinero'],
 diagnosis:'Requiere cuatro o más de los nueve criterios del DSM-5 en el plazo de un año.',
 causes:['Genética, impulsividad, ganancias tempranas, fácil acceso y, raramente, medicamentos agonistas dopaminérgicos usados para la enfermedad de Parkinson.'],
 treatment:['La TCC tiene el mayor respaldo; la naltrexona cuenta con cierta evidencia. Los programas de autoexclusión y los grupos de apoyo ayudan.'],
 course:'Puede ser crónico, pero muchas personas se recuperan.',
 prevalence:'Alrededor del 0,5–1 % de los adultos.'}
});

</script>
<script>
window.I18N_ES=window.I18N_ES||{nodes:{},conds:{},glossary:{}};
Object.assign(window.I18N_ES.conds,{
'psych:bpd':{name:'Trastorno límite de la personalidad',short:'TLP',aka:['trastorno límite de la personalidad','tlp','personalidad límite','borderline','trastorno de inestabilidad emocional de la personalidad'],
 summary:'El trastorno límite de la personalidad es un patrón duradero de emociones intensas e inestables, relaciones e imagen de sí mismo inestables, e impulsividad. Las emociones suben rápido, se viven con mucha intensidad y tardan en calmarse. Suele aparecer en la adolescencia o al inicio de la edad adulta, y muchas personas mejoran sustancialmente con tratamiento.',
 overview:['El trastorno límite de la personalidad es un patrón duradero de emociones intensas e inestables, relaciones e imagen de sí mismo inestables, e impulsividad. Las emociones suben rápidamente, se viven con mucha intensidad y tardan en calmarse. Suele aparecer en la adolescencia o al inicio de la edad adulta.',
  'Un modelo muy utilizado describe el TLP como el resultado de una alta sensibilidad emocional biológica que se encuentra con un entorno que invalidó o castigó las emociones. Las personas con TLP suelen experimentar un miedo intenso al abandono y pueden reaccionar con fuerza ante un rechazo percibido. Las autolesiones y la conducta suicida son frecuentes y graves.',
  'El TLP es muy tratable, y los estudios a largo plazo muestran que la mayoría de las personas mejora sustancialmente con el tiempo.'],
 brain:{amygdala:'Detecta amenazas emocionales. En el TLP reacciona con más fuerza a señales sociales, como un rostro neutro o una respuesta que tarda, y le cuesta más calmarse después. Junto con una regulación prefrontal más débil, esto ayuda a explicar los cambios de ánimo rápidos e intensos y el miedo al abandono.',
  vlpfc:'Regula las emociones de arriba abajo. Su menor actividad debilita el freno sobre las reacciones emocionales, de modo que los sentimientos escalan rápidamente.',
  acc:'Vigila el conflicto y ayuda a regular las emociones y los impulsos. Su menor actividad y volumen se asocian con dificultad para hacer una pausa antes de actuar movido por sentimientos intensos.',
  ofc:'Su actividad alterada se asocia con impulsividad y dificultad para sopesar las consecuencias.',
  hippocampus:'Un volumen menor, a menudo asociado con traumas tempranos, puede afectar la memoria emocional y la regulación del estrés.',
  antinsula:'Una mayor sensibilidad a la exclusión social hace que el rechazo resulte especialmente doloroso.'},
 symptoms:['Miedo intenso al abandono','Relaciones inestables e intensas que oscilan entre la idealización y la devaluación','Sentido de identidad inestable','Conductas impulsivas','Autolesiones o conducta suicida recurrentes','Cambios rápidos de ánimo que duran de horas a días','Sensación crónica de vacío','Ira intensa y difícil de controlar','Paranoia o disociación relacionadas con el estrés'],
 diagnosis:'Requiere al menos cinco de nueve criterios, que comiencen al inicio de la edad adulta y estén presentes en distintos contextos. Los clínicos descartan el trastorno bipolar, el TEPT y los efectos de sustancias, que a menudo coexisten.',
 causes:['Sensibilidad emocional biológica (heredabilidad de alrededor del 40 %) combinada con un entorno invalidante, trauma infantil, negligencia o vínculos de apego inestables.'],
 treatment:['La terapia dialéctico-conductual (TDC), que enseña regulación emocional, tolerancia al malestar, atención plena (mindfulness) y habilidades interpersonales, tiene la evidencia más sólida. El tratamiento basado en la mentalización, la terapia de esquemas y la psicoterapia focalizada en la transferencia también funcionan. La medicación puede ayudar con síntomas concretos, pero no es un tratamiento principal.'],
 course:'La evolución es mejor de lo que se creía: en estudios a largo plazo, la mayoría de las personas con TLP ya no cumple los criterios diagnósticos al cabo de 10 años, aunque algunas dificultades pueden persistir.',
 prevalence:'Alrededor del 1,5–2 % de los adultos; mucho más frecuente en entornos clínicos.',
 fact:'La evolución es mejor de lo que se creía: en estudios a largo plazo, la mayoría de las personas con TLP ya no cumple los criterios diagnósticos al cabo de 10 años.'},

'psych:aspd':{name:'Trastorno antisocial de la personalidad',short:'TAP',aka:['trastorno antisocial de la personalidad','tap','personalidad antisocial','sociopatía','psicopatía'],
 summary:'El trastorno antisocial de la personalidad es un patrón duradero de desprecio y violación de los derechos de los demás, que comienza con problemas de conducta antes de los 15 años. La psicopatía, un concepto de investigación relacionado, añade emociones superficiales y falta de empatía y de remordimiento.',
 overview:['El trastorno antisocial de la personalidad es un patrón duradero de desprecio y violación de los derechos de los demás, que comienza con problemas de conducta antes de los 15 años y solo se diagnostica en adultos. La psicopatía es un concepto de investigación relacionado pero más restringido, que añade emociones superficiales y una marcada falta de empatía y de remordimiento.',
  'No todas las personas con TAP son violentas ni tienen rasgos psicopáticos, y el trastorno está muy sobrerrepresentado en las prisiones, donde hasta aproximadamente la mitad de los reclusos podría cumplir los criterios.'],
 brain:{amygdala:'La menor respuesta al miedo y al malestar ajeno, sobre todo en personas con rasgos psicopáticos, debilita las señales emocionales que normalmente disuaden de dañar a otros.',
  vmpfc:'Su menor actividad y volumen se asocian con una toma de decisiones morales deficiente y con no aprender del castigo.',
  ofc:'La reducción de sustancia gris se asocia con impulsividad y mal juicio.',
  acc:'Una supervisión de errores más débil dificulta ajustar la conducta después de equivocarse.',
  nacc:'Una mayor sensibilidad a la recompensa puede impulsar la conducta de riesgo.'},
 symptoms:['Incumplimiento repetido de normas o leyes','Engaño y manipulación','Impulsividad e incapacidad para planificar','Irritabilidad y agresividad','Desprecio temerario por la seguridad','Irresponsabilidad','Falta de remordimiento'],
 diagnosis:'Requiere tener 18 años o más, evidencia de trastorno de conducta antes de los 15 y al menos tres de siete criterios.',
 causes:['Genética, trastorno de conducta en la infancia, maltrato o negligencia, y una crianza dura o inconsistente.'],
 treatment:['Es difícil de tratar. Los enfoques se centran en el consumo de sustancias concurrente, el manejo de la ira y programas basados en la TCC. La intervención temprana en los problemas de conducta infantiles es lo más prometedor.'],
 course:'La conducta antisocial suele disminuir después de los 40 años.',
 prevalence:'Alrededor del 1–3 % de los adultos; más frecuente en hombres.'},

'psych:npd':{name:'Trastorno narcisista de la personalidad',short:'TNP',aka:['trastorno narcisista de la personalidad','tnp','narcisismo','personalidad narcisista'],
 summary:'El trastorno narcisista de la personalidad es un patrón generalizado de grandiosidad, necesidad de admiración y falta de empatía. Bajo una superficie segura, la autoestima suele ser frágil y muy sensible a la crítica.',
 overview:['El trastorno narcisista de la personalidad es un patrón generalizado de grandiosidad, necesidad de admiración y falta de empatía. Bajo una superficie segura, la autoestima suele ser frágil y muy sensible a la crítica, que puede desencadenar vergüenza, ira o retraimiento.',
  'Los investigadores distinguen entre el narcisismo grandioso (audaz, con sentido de derecho) y el narcisismo vulnerable (inseguro, hipersensible), que a menudo coexisten en la misma persona.'],
 brain:{antinsula:'La reducción de sustancia gris en la ínsula anterior izquierda se asocia con menor empatía, lo que puede dificultar sentir lo que sienten los demás.',
  dmpfc:'Un procesamiento alterado de la información sobre uno mismo puede contribuir a una imagen de sí inflada o inestable.',
  acc:'Una respuesta alterada a la exclusión social puede estar en la base de la sensibilidad a la crítica.'},
 symptoms:['Sentido exagerado de la propia importancia','Fantasías de éxito o poder','Necesidad de admiración excesiva','Sentido de tener derecho a privilegios','Aprovecharse de los demás','Falta de empatía','Envidia y arrogancia'],
 diagnosis:'Requiere al menos cinco de nueve criterios que comiencen al inicio de la edad adulta.',
 causes:['Genética y experiencias infantiles, incluidos tanto el elogio excesivo como la crítica dura.'],
 treatment:['Psicoterapia a largo plazo, como la psicoterapia focalizada en la transferencia o la terapia de esquemas.'],
 course:'A menudo es estable, aunque algunos rasgos se suavizan con la edad.',
 prevalence:'Alrededor del 1 % de las personas; las estimaciones varían mucho.'},

'psych:avpd':{name:'Trastorno de la personalidad evitativa',short:'TP evitativa',aka:['trastorno de la personalidad evitativa','trastorno de la personalidad por evitación','personalidad evitativa','personalidad por evitación'],
 summary:'El trastorno de la personalidad evitativa es un patrón generalizado de inhibición social, sentimientos de insuficiencia y una sensibilidad extrema a la crítica, que lleva a evitar el contacto social pese a desearlo.',
 overview:['El trastorno de la personalidad evitativa es un patrón generalizado de inhibición social, sentimientos de insuficiencia y una sensibilidad extrema a la crítica, que lleva a evitar el contacto social pese a desearlo. Se solapa mucho con el trastorno de ansiedad social grave.'],
 brain:{amygdala:'Una mayor respuesta de amenaza ante señales sociales se solapa con la ansiedad social.',
  antinsula:'Mayor dolor social.',
  dmpfc:'Evaluación centrada en uno mismo.'},
 symptoms:['Evitar trabajos o actividades que impliquen trato con personas','No implicarse a menos que esté seguro de agradar','Contención en las relaciones íntimas','Preocupación por el rechazo','Sentirse inferior'],
 diagnosis:'Requiere al menos cuatro de siete criterios que comiencen al inicio de la edad adulta.',

 prevalence:'Alrededor del 2 % de las personas.'},

'psych:ocpd':{name:'Trastorno obsesivo-compulsivo de la personalidad',short:'TOCP',aka:['trastorno obsesivo-compulsivo de la personalidad','tocp','personalidad obsesivo-compulsiva','personalidad anancástica'],
 summary:'El TOCP es una preocupación generalizada por el orden, el perfeccionismo y el control a costa de la flexibilidad y la eficiencia. A diferencia del TOC, normalmente no hay verdaderas obsesiones ni compulsiones, y la persona considera que sus normas son las correctas.',
 overview:['El TOCP es una preocupación generalizada por el orden, el perfeccionismo y el control a costa de la flexibilidad y la eficiencia. A diferencia del TOC, normalmente no hay verdaderas obsesiones ni compulsiones, y las personas consideran sus normas correctas en lugar de angustiantes.'],
 brain:{dlpfc:'Control cognitivo alterado (investigación limitada).',
  caudate:'Se ha propuesto cierto solapamiento con los circuitos del TOC.',
  ofc:'Valoración rígida (investigación limitada).'},
 symptoms:['Preocupación por los detalles, las normas y las listas','Perfeccionismo que impide terminar las tareas','Dedicación excesiva al trabajo','Moral rígida','Reticencia a delegar','Terquedad'],
 diagnosis:'Requiere al menos cuatro de ocho criterios que comiencen al inicio de la edad adulta.',
 causes:['Genética y temperamento; a menudo se presenta en varias personas de la misma familia.'],
 treatment:['TCC y terapia psicodinámica.'],
 course:'A menudo es estable a lo largo del tiempo.',

'psych:stpd':{name:'Trastorno esquizotípico de la personalidad',short:'TP esquizotípica',aka:['trastorno esquizotípico de la personalidad','personalidad esquizotípica','esquizotipia'],
 summary:'El trastorno esquizotípico de la personalidad implica déficits sociales e interpersonales, un malestar agudo en las relaciones cercanas y creencias, percepciones o conductas extrañas. Está relacionado genéticamente con la esquizofrenia, pero sin psicosis sostenida.',
 overview:['El trastorno esquizotípico de la personalidad implica déficits sociales e interpersonales, un malestar agudo en las relaciones cercanas y creencias, percepciones o conductas extrañas. Comparte riesgo genético con la esquizofrenia, pero sin psicosis sostenida.'],
 brain:{stg:'Una circunvolución temporal superior izquierda más pequeña, similar a la de la esquizofrenia, puede relacionarse con las percepciones inusuales.',

  latvent:'Leve agrandamiento ventricular en algunos estudios.'},
 symptoms:['Ideas de referencia','Creencias extrañas o pensamiento mágico','Percepciones inusuales','Habla extraña y suspicacia','Pocos amigos íntimos','Ansiedad social que no disminuye con la familiaridad'],
 diagnosis:'Requiere al menos cinco de nueve criterios que comiencen al inicio de la edad adulta.',
 causes:['Comparte riesgo genético con la esquizofrenia.'],

'psych:ppd':{name:'Trastorno paranoide de la personalidad',short:'TP paranoide',aka:['trastorno paranoide de la personalidad','personalidad paranoide'],

 brain:{amygdala:'Se propone una mayor detección de amenazas; la investigación directa con neuroimagen es limitada.'},
 symptoms:['Sospechar que los demás se aprovechan de uno o lo engañan','Dudar de la lealtad de los amigos','Reticencia a confiar en otros','Ver amenazas en comentarios inofensivos','Guardar rencor'],
 diagnosis:'Requiere al menos cuatro de siete criterios que comiencen al inicio de la edad adulta.',
 causes:['Posibles vínculos genéticos con la esquizofrenia y adversidad temprana.'],

 course:'A menudo es crónico.',

'psych:szpd':{name:'Trastorno esquizoide de la personalidad',short:'TP esquizoide',aka:['trastorno esquizoide de la personalidad','personalidad esquizoide'],
 summary:'El trastorno esquizoide de la personalidad es un patrón generalizado de desapego de las relaciones sociales y un rango restringido de expresión emocional. Las personas prefieren actividades solitarias y parecen indiferentes al elogio o a la crítica.',
 overview:['El trastorno esquizoide de la personalidad es un patrón generalizado de desapego de las relaciones sociales y un rango restringido de expresión emocional. Las personas prefieren actividades solitarias y parecen indiferentes al elogio o a la crítica.'],
 brain:{nacc:'Se propone una menor respuesta a la recompensa social; la investigación con neuroimagen es muy limitada.'},
 symptoms:['Poco deseo de relaciones cercanas','Elegir actividades solitarias','Poco interés en tener experiencias sexuales con otras personas','Disfrutar de pocas actividades','Frialdad o aplanamiento emocional'],

 causes:['Se sospechan vínculos genéticos con el espectro de la esquizofrenia.'],
 treatment:['Las personas rara vez buscan tratamiento; la psicoterapia puede ayudar cuando lo hacen.'],
 course:'Suele ser estable.',
 prevalence:'Menos del 1–3 % de las personas.'},

'psych:hpd':{name:'Trastorno histriónico de la personalidad',short:'TP histriónica',aka:['trastorno histriónico de la personalidad','personalidad histriónica'],

'psych:dpd':{name:'Trastorno de la personalidad dependiente',short:'TP dependiente',aka:['trastorno de la personalidad dependiente','trastorno dependiente de la personalidad','personalidad dependiente'],
 summary:'El trastorno de la personalidad dependiente es una necesidad generalizada y excesiva de que otros se ocupen de uno, que lleva a una conducta sumisa y de apego excesivo, y a miedo a la separación.',
 overview:['El trastorno de la personalidad dependiente es una necesidad generalizada y excesiva de que otros se ocupen de uno, que lleva a una conducta sumisa y de apego excesivo, y a miedo a la separación.'],
 brain:{amygdala:'Se propone una mayor ansiedad ante la separación; la investigación con neuroimagen es muy limitada.'},

 diagnosis:'Requiere al menos cinco de ocho criterios que comiencen al inicio de la edad adulta.',
 causes:['Crianza sobreprotectora o autoritaria, temperamento ansioso y enfermedad crónica en la infancia.'],
 treatment:['Psicoterapia centrada en desarrollar la independencia y la asertividad.'],
 course:'Puede mejorar con terapia.',
 prevalence:'Menos del 1 % de las personas.'},

'psych:conduct':{name:'Trastorno de conducta',short:'Trastorno de conducta',aka:['trastorno de conducta','trastorno disocial','trastorno de la conducta'],
 summary:'El trastorno de conducta es un patrón repetitivo en niños o adolescentes de violación de los derechos básicos de los demás o de normas sociales importantes, como la agresión a personas o animales, la destrucción de propiedad, el engaño y el incumplimiento grave de normas.',
 overview:['El trastorno de conducta es un patrón repetitivo en niños o adolescentes de violación de los derechos básicos de los demás o de normas sociales importantes, como la agresión, la destrucción de propiedad, el engaño y el incumplimiento grave de normas.',
  'Un subgrupo con rasgos de insensibilidad emocional (culpa, empatía y preocupación por el propio desempeño limitadas) tiende a presentar problemas más graves y persistentes y patrones cerebrales subyacentes distintos.'],
 brain:{amygdala:'La menor respuesta al malestar ajeno, sobre todo con rasgos de insensibilidad emocional, debilita las señales que normalmente disuaden de dañar a otros.',
  vmpfc:'Menor actividad durante la toma de decisiones.',
  antinsula:'Empatía y conciencia emocional alteradas.',
  ofc:'Menor sensibilidad al castigo.'},
 symptoms:['Agresión, acoso o peleas','Destrucción de propiedad','Mentiras y robos','Incumplimientos graves de normas, como escaparse de casa','En algunos, rasgos de insensibilidad emocional: poca culpa o empatía'],
 diagnosis:'Requiere al menos tres de 15 criterios en el último año. Los especificadores incluyen el inicio en la infancia frente al inicio en la adolescencia, y las emociones prosociales limitadas.',
 causes:['Genética, crianza dura o inconsistente, maltrato, violencia en el barrio e influencia de los compañeros.'],
 treatment:['El entrenamiento para padres en manejo de la conducta, la terapia multisistémica y los programas escolares funcionan mejor cuando se inician pronto.'],
 course:'Muchos mejoran al llegar a la edad adulta, pero el inicio en la infancia aumenta el riesgo de trastorno antisocial de la personalidad.',
 prevalence:'Alrededor del 2–10 % de los niños y adolescentes.'},

'psych:delirium':{name:'Delírium',short:'Delírium',aka:['delírium','delirium','síndrome confusional agudo','estado confusional agudo'],
 summary:'El delírium es una alteración aguda y fluctuante de la atención y la conciencia que se desarrolla en horas o días, generalmente causada por una enfermedad médica, una infección, una cirugía, un medicamento o la abstinencia de sustancias. Es una urgencia médica.',
 overview:['El delírium es una alteración aguda y fluctuante de la atención y la conciencia que se desarrolla en horas o días, generalmente causada por una enfermedad médica subyacente, una infección, una cirugía, un medicamento o la abstinencia de sustancias. Es una urgencia médica.',
  'Puede ser hiperactivo (agitado), hipoactivo (tranquilo y retraído, fácil de pasar por alto) o mixto. El delírium aumenta el riesgo de deterioro cognitivo a largo plazo y de muerte, sobre todo en adultos mayores.'],
 brain:{thalamus:'Alteración del filtrado de la activación y la atención.',
  dlpfc:'Alteración de las redes atencionales.',
  pcc:'Conectividad alterada de la red neuronal por defecto.'},
 symptoms:['Incapacidad para concentrarse o cambiar el foco de atención','Confusión y desorientación','Nivel de alerta fluctuante','Alucinaciones','Alteración del ciclo de sueño y vigilia'],

 causes:['Infecciones, cirugía, deshidratación, medicamentos, abstinencia de alcohol e insuficiencia de órganos. La edad avanzada y la demencia aumentan el riesgo.'],
 treatment:['Buscar y tratar la causa; mantener a la persona orientada, en movimiento y durmiendo bien; evitar sedantes innecesarios.'],
 course:'A menudo se resuelve al tratar la causa, pero puede dejar efectos cognitivos duraderos.',
