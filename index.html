'psych:gad':{
 overview:['Generalized anxiety disorder is excessive, hard-to-control worry about many everyday matters, such as health, work, money, family or minor responsibilities, occurring on more days than not for at least six months, together with physical tension and restlessness.','The worry in GAD is not usually about one specific threat. It shifts from topic to topic and is driven by difficulty tolerating uncertainty: worrying feels like preparation or protection, which keeps the habit going even though it is exhausting. The body stays in a low-grade state of alarm, producing muscle tension, fatigue and poor sleep.'],
 brain:[['amygdala','p','Detects possible threats. In GAD it reacts more strongly to ambiguous or mildly negative information, so uncertain situations register as dangerous and trigger worry.'],['vlpfc','s','Regulates the amygdala from the top down. Weaker coupling between prefrontal regions and the amygdala means alarm signals are not dampened, letting anxiety persist.'],['acc','s','Monitors conflict and threat. Altered activity may keep attention locked on possible problems and make it hard to disengage from worry.'],['antinsula','s','Creates feelings from body signals and predicts uncertainty. Heightened activity amplifies awareness of tension and makes uncertainty feel physically uncomfortable.'],['bla','s','Learns which cues predict danger. Fear learning in GAD generalizes broadly, so many situations become linked with threat.']],
 symptoms:['Persistent, excessive worry that is hard to control','Restlessness or feeling keyed up','Easily fatigued','Difficulty concentrating or mind going blank','Irritability','Muscle tension, headaches, stomach upset','Sleep problems','Seeking reassurance, over-preparing or avoiding uncertainty'],
 diagnosis:'Diagnosis requires excessive worry on most days for six months with at least three of six physical or cognitive symptoms (one in children), causing distress or impairment. Screening tools like the GAD-7 help. Clinicians rule out thyroid disease, caffeine or stimulant effects and other anxiety or mood disorders.',
 causes:['Genetics accounts for about 30% of risk and overlaps with depression. A behaviorally inhibited temperament, stressful life events, childhood adversity and learned beliefs that worry is useful all contribute.'],
 treatment:['CBT is highly effective: it targets intolerance of uncertainty, tests worry beliefs and uses exposure to uncertainty and worry postponement. Applied relaxation and mindfulness-based approaches also help.','SSRIs (escitalopram, sertraline) and SNRIs (venlafaxine, duloxetine) are first-line medications; buspirone and pregabalin are alternatives. Benzodiazepines work quickly but are generally limited to short-term use because of tolerance and dependence.'],
 course:'GAD tends to be chronic with ups and downs, often worsening under stress, but most people improve substantially with treatment.'},
'psych:panic':{
 overview:['Panic disorder involves repeated, unexpected panic attacks, sudden surges of intense fear that peak within minutes, together with at least a month of persistent worry about having more attacks or changes in behavior to avoid them.','During an attack, the body launches a full fight-or-flight response without a real external threat: pounding heart, breathlessness, dizziness, trembling and a sense of doom. Many people go to emergency rooms believing they are having a heart attack. The disorder is maintained by "fear of fear": body sensations themselves become threatening, so noticing a fast heartbeat can trigger the next attack.'],
 brain:[['amygdala','p','The fear hub triggers the alarm response. In panic disorder it is highly sensitive, so a small internal change can set off a full fight-or-flight reaction.'],['antinsula','p','Interprets body signals such as heartbeat and breathing. It tends to read normal sensations as dangerous, which is the core of the fear-of-fear cycle.'],['lc','p','Releases norepinephrine across the brain. Bursts of activity drive the racing heart, sweating and hyperalertness of an attack.'],['midbrain','s','The periaqueductal gray coordinates defensive responses like escape. It may produce the urgent need to flee during attacks.'],['hippocampus','s','Links fear to places and contexts, which is why people begin avoiding places where attacks have happened.'],['pvn','s','Starts stress-hormone release, contributing to exhaustion after attacks.']],
 symptoms:['Pounding or racing heart, chest pain','Shortness of breath or feeling of choking','Trembling, sweating, chills or hot flushes','Dizziness, nausea','Numbness or tingling','Feeling unreal or detached','Fear of losing control, going crazy or dying','Worry about future attacks and avoidance of triggers'],
 diagnosis:'Requires recurrent unexpected attacks plus a month of worry or avoidance. Heart, lung, thyroid and substance causes are ruled out, often with an ECG and blood tests.',
 causes:['Genetic vulnerability, high anxiety sensitivity, stressful life events and stimulants such as caffeine. Attacks often first occur during a period of stress.'],
 treatment:['CBT is first-line and very effective. It includes education about the panic cycle, interoceptive exposure (deliberately producing sensations like a fast heart rate by running in place or spinning until they lose their threat) and situational exposure. SSRIs and SNRIs are first-line medications.'],
 course:'Untreated, panic disorder often becomes chronic and can lead to agoraphobia and depression. With treatment, most people have large and lasting improvement.'},
'psych:socialanx':{
 overview:['Social anxiety disorder is an intense, persistent fear of social or performance situations in which a person might be scrutinized, judged or embarrassed. The fear is out of proportion to the actual threat and leads to avoidance or enduring situations with great distress.','It is more than shyness. People may avoid speaking in class, eating in public, making phone calls or meeting new people, which can limit education, careers and relationships. Safety behaviors, like rehearsing what to say or avoiding eye contact, feel protective but keep the fear alive and focus attention inward.'],
 brain:[['amygdala','p','Reacts strongly to faces, especially critical or angry ones, and to the prospect of evaluation. This hyperreactivity makes social situations feel threatening.'],['antinsula','s','Heightens awareness of bodily signs of anxiety, like blushing or a shaky voice, which then become a source of fear.'],['dmpfc','s','Supports thinking about oneself and how others see you. Overactivity is linked to excessive self-focus and imagining negative judgments.'],['acc','s','Processes social pain such as rejection. Heightened sensitivity makes perceived criticism feel especially painful.']],
 symptoms:['Fear of speaking, eating or performing in front of others','Fear that others will notice blushing, sweating or trembling','Avoiding social situations or enduring them with dread','Replaying and criticizing interactions afterward','Physical symptoms such as racing heart and nausea'],
 diagnosis:'Requires marked fear of social situations for six months or more, causing impairment. A "performance only" specifier applies when fear is limited to speaking or performing.',
 causes:['Behaviorally inhibited temperament, genetics, and experiences like bullying, humiliation or critical parenting.'],
 treatment:['CBT with exposure to feared social situations and dropping safety behaviors is first-line, often in groups. SSRIs and SNRIs are first-line medications. Beta-blockers can blunt physical symptoms before specific performances.'],
 course:'Usually starts in adolescence and can be chronic without treatment, but treatment is effective.'},
'psych:phobia':{
 overview:['A specific phobia is an intense, persistent fear of a particular object or situation, such as heights, animals, flying, enclosed spaces, needles or blood, that is out of proportion to the actual danger and leads to avoidance.','Phobias are the most common anxiety disorder and among the most treatable. Most people know their fear is excessive, but knowing this does not stop the reaction, because the fear response is driven by fast emotional circuits rather than reasoning.'],
 brain:[['amygdala','p','Triggers the immediate fear response on seeing the feared object, often before conscious recognition.'],['antinsula','p','Especially active in phobias involving disgust, such as spiders, and blood-injection-injury phobias, where the body reaction includes nausea or fainting.'],['vmpfc','s','Stores safety learning (fear extinction). Weak extinction allows the fear to persist despite many safe encounters.']],
 symptoms:['Immediate fear or panic when facing the trigger','Avoiding the trigger or enduring it with intense anxiety','Anticipatory anxiety beforehand','Fainting in blood-injection-injury phobia, from a sudden drop in heart rate'],
 diagnosis:'Requires marked, persistent fear for six months that is out of proportion and causes distress or avoidance.',
 types:['Animal (spiders, dogs, snakes).','Natural environment (heights, storms, water).','Blood-injection-injury.','Situational (flying, elevators, enclosed spaces).','Other (choking, vomiting, loud noises).'],
 causes:['Frightening experiences, watching others react with fear, receiving threat information and an evolutionary readiness to fear certain things.'],
 treatment:['Exposure therapy is the treatment of choice: gradual, repeated contact with the feared object until fear subsides. For some phobias, a single prolonged session can work. Virtual reality exposure is useful for flying or heights. Medication is rarely needed.'],
 course:'Phobias often start in childhood and can persist for decades, but exposure therapy produces lasting improvement for most people.'},
'psych:agoraphobia':{
 overview:['Agoraphobia is fear and avoidance of situations where escape might be difficult or help unavailable if panic or embarrassing symptoms occur, such as public transport, open spaces, shops, crowds or being outside the home alone.','It often develops after panic attacks, as people avoid more and more places associated with them. In severe cases a person may be unable to leave home.'],
 brain:[['amygdala','p','Overactive threat responses make leaving safe places feel dangerous.'],['hippocampus','s','Strongly links fear to places and contexts, spreading avoidance to new situations.'],['antinsula','s','Heightened body awareness makes people fear that symptoms will strike in public.']],
 symptoms:['Fear of public transport, open or enclosed spaces, lines or crowds','Fear of being outside alone','Needing a companion to go out','Avoidance that progressively shrinks a person\'s world'],
 diagnosis:'Requires fear in at least two of five situation types for six months, with avoidance or need for a companion. It can be diagnosed with or without panic disorder.',
 causes:['Panic attacks, genetics, anxious temperament and stressful events.'],
 treatment:['CBT with gradual exposure to avoided situations, often supported by SSRIs. Therapist-guided home visits or remote sessions help people who cannot leave home.'],
 course:'Can be chronic without treatment; exposure-based treatment produces substantial improvement.'},
'psych:sepanx':{
 overview:['Separation anxiety disorder is excessive fear or anxiety about separation from attachment figures, beyond what is developmentally expected, lasting at least four weeks in children and six months in adults.','Some separation anxiety is normal in infants and toddlers. The disorder involves persistent worry that something terrible will happen to loved ones or that an event will separate them, leading to school refusal, difficulty sleeping alone and physical complaints.'],
 brain:[['amygdala','p','A heightened threat response to separation cues makes being apart from loved ones feel dangerous.'],['vmpfc','s','Still developing in childhood, it normally helps calm fear; immature regulation contributes to difficulty self-soothing.']],
 symptoms:['Distress when separation is expected or happens','Persistent worry about harm to loved ones','Refusing to go to school, work or sleep away from home','Nightmares about separation','Headaches or stomachaches before separations'],
 diagnosis:'Based on interviews with the child and parents, confirming duration, impairment and that fear exceeds developmental norms.',
 causes:['Anxious temperament, genetics, stressful events such as a loss or move, and sometimes overprotective patterns.'],
 treatment:['CBT with gradual separation practice and parent coaching. SSRIs for severe cases.'],
 course:'Many children improve, but it raises the risk of later anxiety disorders, especially panic disorder.'},
'psych:ocd':{
 overview:['Obsessive-compulsive disorder involves obsessions, which are intrusive, unwanted thoughts, images or urges that cause intense anxiety or disgust, and compulsions, which are repetitive behaviors or mental acts performed to neutralize that distress or prevent a feared outcome.','Compulsions bring short-term relief, which teaches the brain that the ritual prevented disaster, so the cycle strengthens over time. OCD can consume hours a day. Most people recognize that their thoughts are excessive, but the feeling that something is wrong or incomplete overrides that knowledge.','Obsessions are not wishes or desires. People with OCD often have intrusive thoughts about harming others or taboo topics precisely because these thoughts are so upsetting to them.'],
 brain:[['ofc','p','Assigns value and signals that something is wrong. In OCD it is overactive, especially when triggered, producing a persistent false alarm that something needs fixing.'],['caudate','p','Normally filters which thoughts and actions get through. Overactivity in OFC–caudate loops fails to shut off worry signals, so obsessions keep returning. Successful treatment reduces caudate activity.'],['acc','p','Generates error signals. Excessive error signaling creates the feeling that an action was not done right, driving checking and repeating.'],['thalamus','s','Completes the cortico-striato-thalamo-cortical loop. Overactivity in this loop keeps the cycle of obsession and compulsion running.'],['putamen','s','Supports habits. As compulsions repeat, control shifts toward habit circuits, making rituals more automatic.']],
 symptoms:['Contamination fears and washing or cleaning','Doubts about harm or mistakes and repeated checking','Need for symmetry, order or "just right" feelings','Unwanted taboo or violent thoughts and mental rituals','Counting, repeating, praying or reviewing','Reassurance seeking and avoidance of triggers'],
 diagnosis:'Requires obsessions, compulsions or both that are time-consuming (over an hour a day) or cause significant distress or impairment. Clinicians assess insight and the Y-BOCS scale measures severity.',
 types:['Insight specifiers: good or fair insight, poor insight, and absent insight or delusional beliefs.','Tic-related OCD is a recognized specifier.'],
 causes:['OCD is moderately heritable (about 40–50%). Brain circuit differences, stressful life events and, in some children, sudden onset after infection (PANS/PANDAS, still debated) contribute.'],
 treatment:['Exposure and response prevention (ERP) is the most effective therapy: gradually facing triggers while resisting compulsions so the brain learns that anxiety falls on its own. SSRIs, often at higher doses than for depression, and clomipramine are effective medications; augmentation with low-dose antipsychotics can help.','For severe, treatment-resistant OCD, options include deep brain stimulation, deep TMS (FDA-cleared for OCD) and, rarely, lesion surgery such as cingulotomy or capsulotomy.'],
 course:'Usually chronic with fluctuations, but most people improve substantially with ERP and/or medication.'},
'psych:bdd':{
 overview:['In body dysmorphic disorder, a person is preoccupied with one or more perceived flaws in appearance that are slight or not visible to others, and performs repetitive behaviors such as mirror checking, excessive grooming, skin picking or seeking reassurance.','BDD causes severe distress and often social avoidance. Many people seek cosmetic procedures, which rarely relieve the preoccupation. Muscle dysmorphia, the belief that one\'s body is too small, is a recognized form.'],
 brain:[['ofc','s','Overactive valuation circuits shared with OCD keep attention fixed on the perceived defect.'],['caudate','s','Shared obsessive-compulsive circuitry may make checking and grooming rituals hard to stop.'],['fusiform','s','People with BDD tend to process faces in fine detail rather than as a whole, magnifying small features.'],['v2v3','s','An imbalance favoring detailed visual processing over global shape may make minor flaws stand out.']],
 symptoms:['Preoccupation with a perceived flaw for hours a day','Mirror checking or avoiding mirrors','Excessive grooming, camouflaging with makeup or clothing','Comparing appearance with others','Seeking reassurance or cosmetic procedures','Social avoidance'],
 diagnosis:'Requires preoccupation with perceived flaws, repetitive behaviors and significant distress, not better explained by an eating disorder. Insight is rated.',
 causes:['Genetics, perfectionism, detail-focused perception and experiences such as teasing.'],
 treatment:['CBT tailored to BDD, including exposure and response prevention and perceptual retraining, and SSRIs, often at high doses.'],
 course:'Often chronic without treatment and linked to high rates of depression, but treatment helps many people.'},
'psych:hoarding':{
 overview:['Hoarding disorder is persistent difficulty discarding possessions, regardless of their actual value, because of a strong perceived need to save them and distress at the thought of letting go. Clutter accumulates until rooms cannot be used for their intended purpose.','It differs from collecting: items are not organized or displayed, and the clutter causes distress, health and safety risks, and family conflict. Insight is often limited.'],
 brain:[['acc','p','Shows abnormal activity when people decide whether to discard their own items, which may make the decision feel threatening.'],['antinsula','p','Heightened emotional reaction during discarding decisions makes letting go feel unbearable.'],['dlpfc','s','Difficulties with categorizing, planning and decision-making make organizing and discarding hard.']],
 symptoms:['Great distress at discarding items','Excessive acquiring','Clutter blocking living spaces','Indecisiveness and difficulty organizing'],
 diagnosis:'Diagnosed by interview, home visits or photos, and rating scales such as the Clutter Image Rating.',
 causes:['Strong family history, indecisiveness, and stressful or traumatic events.'],
 treatment:['Specialized CBT for hoarding builds skills in sorting, decision-making and resisting acquiring. Home-based help and community supports are often needed.'],
 course:'Often starts in adolescence and worsens with age.'},
'psych:trich':{
 overview:['Trichotillomania (hair pulling) and excoriation disorder (skin picking) are body-focused repetitive behaviors. People repeatedly pull hair or pick skin, causing hair loss or skin damage, and make repeated attempts to stop.','The behavior can be automatic, happening while reading or watching TV without awareness, or focused, done deliberately to relieve tension or an urge. It often brings a sense of relief or satisfaction followed by shame.'],
 brain:[['putamen','s','Habit circuits drive the automatic, repetitive nature of the behavior.'],['acc','s','Altered self-monitoring makes it harder to notice and stop the behavior.'],['cerebhemi','s','Gray matter differences have been reported in some studies (role unclear).']],
 symptoms:['Repeated hair pulling or skin picking','Tension before and relief during the behavior','Automatic episodes without awareness','Visible hair loss or skin damage','Shame and hiding the effects'],
 diagnosis:'Clinical diagnosis after ruling out dermatological causes.',
 causes:['Genetics, differences in habit and reward circuits, and the behavior\'s role in regulating boredom or stress.'],
 treatment:['Habit reversal training and the comprehensive behavioral model (ComB). N-acetylcysteine has some evidence.'],
 course:'Often begins around puberty and can be chronic.'},
'psych:ptsd':{
 overview:['Post-traumatic stress disorder can develop after experiencing or witnessing an actual or threatened death, serious injury or sexual violence. Symptoms last more than a month and fall into four clusters: intrusive re-experiencing, avoidance, negative changes in thoughts and mood, and changes in arousal and reactivity.','In PTSD, the brain\'s threat system stays stuck in danger mode: the trauma memory is stored as a vivid sensory fragment that can be triggered by reminders, rather than as an ordinary memory placed in the past. Most people exposed to trauma do not develop PTSD; recovery is the most common outcome.'],
 brain:[['amygdala','p','The threat detector is hyperreactive to trauma reminders and even neutral cues, driving flashbacks, panic and hypervigilance.'],['vmpfc','p','Normally stores safety learning and calms the amygdala. In PTSD it is underactive, so fear extinction fails and the brain keeps treating safe situations as dangerous.'],['hippocampus','p','Places memories in time and context. Smaller volume and weaker function make it harder to tell "then" from "now" and safe contexts from dangerous ones, so reminders trigger fear anywhere.'],['acc','s','Reduced volume and regulation contribute to difficulty controlling emotional responses.'],['antinsula','s','Heightened body-based anxiety and emotional awareness of threat.'],['lc','s','High norepinephrine output drives hyperarousal, startle and nightmares; prazosin, which blocks one norepinephrine effect, can reduce nightmares.'],['pvn','s','Altered stress-hormone regulation; cortisol responses are often abnormal.']],
 symptoms:['Intrusive memories, flashbacks and nightmares','Intense distress or body reactions to reminders','Avoiding thoughts, places or people linked to the trauma','Persistent negative beliefs, blame, guilt or shame','Emotional numbness and detachment','Hypervigilance and exaggerated startle','Irritability, trouble concentrating and sleeping'],
 diagnosis:'Requires trauma exposure plus symptoms in all four clusters for more than a month causing impairment. The PCL-5 and CAPS-5 are commonly used. A dissociative subtype exists.',
 types:['With dissociative symptoms: depersonalization or derealization.','With delayed expression: full criteria met six months or more after the event.','Complex PTSD (in ICD-11) adds problems with emotion regulation, self-concept and relationships after prolonged trauma.'],
 causes:['Risk is higher with interpersonal violence, repeated or prolonged trauma, earlier trauma, lack of support afterward, ongoing stress and genetic vulnerability.'],
 treatment:['Trauma-focused psychotherapies are first-line: prolonged exposure, cognitive processing therapy and EMDR. They help the brain reprocess the memory and relearn safety.','SSRIs (sertraline, paroxetine) and venlafaxine are first-line medications. Prazosin may reduce nightmares for some people. Newer approaches under study include MDMA-assisted therapy, which the FDA declined to approve in 2024.'],
 course:'Many people recover within months; for others, PTSD can last years. Effective treatment helps a large share of people even after long illness.'},
'psych:asd_stress':{
 overview:['Acute stress disorder involves PTSD-like symptoms beginning 3 days to 1 month after a traumatic event. It often includes dissociation, such as feeling in a daze. Many people recover; some go on to develop PTSD.'],
 brain:[['amygdala','p','Acute threat activation following trauma keeps the alarm system on.'],['hippocampus','s','High stress hormones disrupt how the memory is encoded, contributing to fragmented recall.']],
 symptoms:['Intrusive memories','Dissociation, numbness or daze','Avoidance','Anxiety, poor sleep and hyperarousal'],
 diagnosis:'Requires nine or more symptoms from intrusion, negative mood, dissociation, avoidance and arousal categories, lasting 3 days to 1 month.',
 causes:['Trauma exposure, with risk factors similar to PTSD.'],
 treatment:['Brief trauma-focused CBT can prevent PTSD. Single-session psychological debriefing is not recommended because it can increase risk.'],
 course:'Resolves within a month for many; about half go on to develop PTSD.'},
'psych:did':{
 overview:['Dissociative identity disorder involves two or more distinct identity states, each with its own sense of self and agency, and recurrent gaps in memory for everyday events, personal information or trauma. It is understood as a response to severe, repeated childhood trauma in which dissociation was a way to survive.','DID remains debated: some researchers argue it can be shaped by suggestion or social expectations. Most clinicians who specialize in trauma recognize it as a real, though rare and often misdiagnosed, condition.'],
 brain:[['hippocampus','s','Smaller volume is reported, possibly reflecting chronic early stress, and may relate to memory gaps.'],['amygdala','s','Smaller volume and altered emotional reactivity are reported in some studies.'],['precuneus','s','Changes in self-awareness networks have been observed between identity states.'],['dlpfc','s','Altered prefrontal control may contribute to memory and identity disruptions (limited research).']],
 symptoms:['Distinct identity states with different traits, voices or memories','Memory gaps for everyday events and personal history','Finding unexplained items or writing','Depersonalization and derealization','Co-occurring PTSD, depression and self-harm'],
 diagnosis:'Requires specialized assessment, often with structured interviews such as the SCID-D, and careful differentiation from psychosis, borderline personality disorder and seizures.',
 causes:['Severe, chronic early trauma combined with a high capacity for dissociation and lack of supportive caregiving.'],
 treatment:['Long-term, phase-oriented psychotherapy: safety and stabilization, then processing traumatic memories, then integration or cooperation among identity states.'],
 course:'Usually chronic, but many people improve with specialized treatment.'},
'psych:dpdr':{
 overview:['People with depersonalization/derealization disorder repeatedly feel detached from their own mind, body or feelings, as if observing themselves from outside, or feel that the world is unreal, foggy or dreamlike. Reality testing stays intact: they know the experience is not literally true.','Brief episodes are common under stress or sleep deprivation; the disorder involves persistent or recurrent episodes that cause distress.'],
 brain:[['antinsula','p','Generates the felt sense of emotions and the body. Reduced activity matches the experience of emotional numbness and feeling disconnected from oneself.'],['vlpfc','s','Overactive prefrontal inhibition of limbic responses is thought to dampen emotional feelings, a kind of overcorrection.'],['angular','s','The temporoparietal junction supports the sense of being located in one\'s own body; altered activity is linked to out-of-body-like experiences.']],
 symptoms:['Feeling like an outside observer of yourself','Emotional and physical numbness','Surroundings seem flat, distant or artificial','Distorted sense of time','Distress about the experience'],
 diagnosis:'Requires persistent or recurrent episodes with intact reality testing, after ruling out substances, seizures and other disorders.',
 causes:['Severe stress, childhood emotional abuse, anxiety, and drug experiences such as cannabis can trigger it.'],
 treatment:['Psychotherapy (CBT, grounding skills), reducing anxiety and treating co-occurring conditions. No medication is specifically approved.'],
 course:'Often chronic, though it can fluctuate and improve.'},
'psych:ssd':{
 overview:['Somatic symptom disorder involves one or more distressing physical symptoms, which may or may not have a medical explanation, together with excessive thoughts, feelings or behaviors about them, such as persistent worry about their seriousness or spending large amounts of time and energy on them.','The symptoms are real, not imagined. The disorder lies in how attention, interpretation and worry amplify them and take over daily life.'],
 brain:[['antinsula','s','Amplifies attention to body signals, making normal sensations feel more intense.'],['acc','s','Heightens the emotional distress attached to bodily sensations.'],['amygdala','s','Interprets sensations as threatening, increasing worry.']],
 symptoms:['Distressing symptoms such as pain or fatigue','Persistent worry about their seriousness','Frequent medical visits and tests','Symptoms dominating daily life'],
 diagnosis:'Diagnosed by the excessive response to symptoms lasting six months, not by the absence of a medical explanation.',
 causes:['Heightened body sensitivity, anxiety and depression, past illness experiences and stress.'],
 treatment:['CBT, regular scheduled visits with one doctor and treatment of co-occurring anxiety or depression.'],
 course:'Often chronic, but CBT can reduce distress and improve functioning.'},
'psych:fnd':{
 overview:['Functional neurological disorder causes real neurological symptoms, such as weakness, tremor, seizures, walking problems or numbness, that result from a problem with how the brain functions rather than structural damage. It is often described as a "software" rather than "hardware" problem.','FND is common and genuinely disabling. Symptoms are not faked or imagined, and many people have no identifiable psychological trigger. Diagnosis is based on positive clinical signs, not just normal tests.'],
 brain:[['angular','s','The temporoparietal junction contributes to the sense of agency. Reduced activity may explain why movements feel involuntary.'],['sma','s','Altered movement preparation may disrupt normal voluntary control.'],['amygdala','s','Increased emotional reactivity may hijack motor control circuits.'],['antinsula','s','Altered body awareness may change how symptoms are experienced.']],
 symptoms:['Limb weakness or paralysis','Functional (dissociative) seizures','Tremor, jerks or unusual gait','Numbness or sensory loss','Speech or swallowing problems'],
 diagnosis:'Neurologists identify positive signs such as Hoover\'s sign for functional weakness and use video EEG for functional seizures.',
 causes:['Physical injury, illness, stress, trauma and attention focused on the body, often in combination.'],
 treatment:['A clear explanation of the diagnosis is the first step. Specialized physiotherapy, occupational therapy and CBT help retrain brain function.'],
 course:'Variable; earlier diagnosis and treatment improve outcomes.'}
});

<script>
window.COND_EXT=window.COND_EXT||{};
Object.assign(window.COND_EXT,{
'psych:anorexia':{
 overview:['Anorexia nervosa is a serious eating disorder characterized by restriction of energy intake leading to significantly low body weight for a person\'s age and health, an intense fear of gaining weight or behaviors that prevent weight gain, and a disturbed experience of body shape or denial of the seriousness of low weight.','It affects every organ system, including the heart, bones, hormones and brain, and has one of the highest mortality rates of any psychiatric condition. Starvation itself changes thinking, making it more rigid and food-focused, which helps keep the illness going. Full recovery is possible, especially with early treatment.'],
 brain:[['antinsula','p','Integrates hunger, taste and body signals into feelings. Altered activity may blunt hunger signals and change how food and the body feel, contributing to restriction and distorted body experience.'],['caudate','s','Part of the reward and habit system. Altered dopamine responses may make restriction feel rewarding and food less so, and restriction can become a habit.'],['dlpfc','s','Supports self-control. Heightened prefrontal control is linked to the ability to override hunger and to rigid, perfectionistic thinking.'],['ofc','s','Represents the reward value of food. Altered responses may reduce the pleasure of eating.'],['hypothalamus','s','Regulates appetite and reproductive hormones. Starvation disrupts these systems, causing loss of periods and other hormone changes.']],
 symptoms:['Restriction of food intake','Intense fear of weight gain','Distorted body image','Denial of the seriousness of low weight','Rigid food rituals','Excessive exercise in some','Physical effects: low heart rate, dizziness, feeling cold, loss of periods, bone loss'],
 diagnosis:'Clinicians assess weight history, eating behaviors, beliefs about weight and shape, and medical status, including heart rhythm, electrolytes and bone health. Severity is graded by body mass index in adults and percentiles in young people.',
 types:['Restricting type: weight loss mainly through dieting, fasting or excessive exercise.','Binge-eating/purging type: recurrent binge eating or purging behaviors.'],
 causes:['Genetics accounts for about 50–60% of risk, and recent studies suggest metabolic as well as psychiatric genetic factors. Temperament (perfectionism, anxiety, harm avoidance), dieting, and cultural pressures about thinness contribute.'],
 treatment:['Medical stabilization and nutritional restoration are essential. Family-based treatment is the most effective approach for adolescents. For adults, specialized therapies such as CBT-E, MANTRA and specialist supportive clinical management are used.','No medication treats anorexia directly, though co-occurring conditions may be treated. Many brain changes improve with weight restoration.'],
 course:'The course varies; many people recover fully, some have relapses and a minority have a chronic course. Early treatment improves outcomes.'},
'psych:bulimia':{
 overview:['Bulimia nervosa involves recurrent episodes of binge eating with a sense of loss of control, followed by compensatory behaviors to prevent weight gain, at least once a week for three months, with self-worth heavily based on body shape and weight.','People with bulimia are often at a normal weight, which can make the disorder easy to miss. Episodes are usually secret and accompanied by shame. Repeated purging can cause dangerous electrolyte imbalances and dental damage.'],
 brain:[['vlpfc','p','Supports inhibitory control. Reduced activity may make it harder to stop once a binge starts.'],['ofc','s','Altered food-reward valuation may increase the drive to binge.'],['antinsula','s','Altered taste and body-signal processing may affect hunger and fullness cues.'],['nacc','s','Altered reward responses to food may reinforce the binge cycle.']],
 symptoms:['Recurrent binge episodes with loss of control','Compensatory behaviors','Self-evaluation driven by shape and weight','Secrecy and shame','Swollen cheeks, dental erosion, electrolyte problems'],
 diagnosis:'Requires binge and compensatory episodes at least weekly for three months, with self-evaluation overly influenced by weight and shape.',
 causes:['Genetics, dieting, low self-esteem, emotion regulation difficulties and cultural pressures.'],
 treatment:['CBT-E is the leading treatment. Fluoxetine is FDA-approved for bulimia.'],
 course:'Many people improve with treatment, though relapse can occur.'},
'psych:bed':{
 overview:['Binge-eating disorder involves recurrent binge episodes with a sense of loss of control and marked distress, without the regular compensatory behaviors of bulimia. It is the most common eating disorder.','Binges often follow stress, negative emotions or restrictive dieting and are followed by shame and guilt, which can trigger the next binge.'],
 brain:[['nacc','p','Shows heightened responses to food cues, increasing the drive to eat.'],['ofc','s','Altered reward valuation of food.'],['vlpfc','s','Reduced inhibitory control makes it harder to stop eating once started.']],
 symptoms:['Eating unusually large amounts in a short period','Feeling out of control while eating','Eating rapidly, when not hungry or until uncomfortably full','Eating alone due to embarrassment','Shame and guilt afterward'],
 diagnosis:'Requires binge episodes at least weekly for three months with marked distress.',
 causes:['Genetics, dieting, stress, depression and difficulties regulating emotion.'],
 treatment:['CBT is first-line. Lisdexamfetamine is FDA-approved for moderate to severe binge-eating disorder.'],
 course:'Often chronic but responsive to treatment.'},
'psych:insomnia':{
 overview:['Insomnia disorder is persistent difficulty falling asleep, staying asleep or waking too early, at least three nights a week for three months, despite enough opportunity to sleep, causing daytime fatigue, mood problems or impaired functioning.','It is understood as a state of hyperarousal: the brain and body stay too alert at night. Over time, worrying about sleep and spending long hours awake in bed teach the brain to associate the bed with wakefulness, which keeps insomnia going even after the original trigger is gone.'],
 brain:[['lateralhyp','s','Arousal systems such as orexin stay too active at night, keeping the brain awake.'],['thalamus','s','Normally gates sensory input and deactivates at sleep onset. Reduced deactivation may let the brain stay alert.'],['acc','s','Heightened activity is linked to a racing, worried mind at bedtime.'],['amygdala','s','Heightened emotional arousal makes it harder to wind down.']],
 symptoms:['Trouble falling or staying asleep','Waking too early','Daytime fatigue and sleepiness','Poor concentration and irritability','Worry about sleep'],
 diagnosis:'Based on sleep history and sleep diaries; sleep studies are used if sleep apnea or other disorders are suspected.',
 causes:['Hyperarousal, stress, irregular schedules, anxiety and depression, pain and learned links between bed and wakefulness.'],
 treatment:['CBT-I (stimulus control, sleep restriction, cognitive work and sleep hygiene) is first-line and outperforms sleeping pills over the long term. Medications are generally for short-term use.'],
 course:'Can be chronic but responds well to CBT-I.'},
'psych:narcolepsy':{
 overview:['Narcolepsy is a chronic neurological sleep disorder in which the brain cannot properly regulate sleep and wakefulness. It causes overwhelming daytime sleepiness, and in type 1, cataplexy: sudden muscle weakness triggered by strong emotions such as laughter.','Features of REM sleep intrude into waking: muscle paralysis appears as cataplexy and sleep paralysis, and dream imagery appears as hallucinations when falling asleep or waking.'],
 brain:[['lateralhyp','p','Orexin neurons stabilize wakefulness. Their loss in type 1 narcolepsy leaves the sleep–wake switch unstable, so people slip into sleep or REM-like states during the day.'],['pons','s','Controls REM sleep and its muscle paralysis. Without orexin, this paralysis can switch on while awake, causing cataplexy and sleep paralysis.'],['amygdala','s','Strong emotions activate the amygdala, which can trigger cataplexy through brainstem circuits.']],
 symptoms:['Excessive daytime sleepiness and sudden sleep attacks','Cataplexy (type 1)','Sleep paralysis','Vivid hallucinations when falling asleep or waking','Fragmented nighttime sleep'],
 diagnosis:'Overnight sleep study followed by a multiple sleep latency test; low orexin in spinal fluid confirms type 1.',
 types:['Type 1: with cataplexy and/or low orexin.','Type 2: without cataplexy, normal orexin.'],
 causes:['Type 1 is caused by loss of orexin neurons, probably through an autoimmune attack in people with the HLA-DQB1*06:02 gene variant.'],
 treatment:['Modafinil, solriamfetol, pitolisant and stimulants for sleepiness; sodium oxybate for sleepiness and cataplexy; scheduled naps.'],
 course:'Lifelong, but symptoms are manageable with treatment.'},
'psych:aud':{
 overview:['Alcohol use disorder is a problematic pattern of drinking marked by loss of control, craving and continued use despite harm. It ranges from mild to severe and involves lasting changes in the brain\'s reward, stress and self-control systems.','Addiction is often described in three repeating stages: binge and intoxication (driven by reward), withdrawal and negative feelings (driven by stress systems), and preoccupation and anticipation (driven by weakened prefrontal control). Over time, people drink less for pleasure and more to relieve withdrawal and distress.'],
 brain:[['nacc','p','The reward hub adapts to repeated alcohol-induced dopamine surges, so cues linked to drinking trigger strong craving while ordinary rewards feel less satisfying.'],['vta','p','Alcohol increases dopamine release from VTA neurons, the initial reinforcing effect that drives repeated use.'],['dlpfc','p','Supports self-control and planning. Weakened top-down control makes it harder to resist drinking despite intentions.'],['antinsula','s','Turns body states into felt urges, contributing to craving.'],['ofc','s','Altered valuation makes alcohol seem more valuable than other rewards.'],['vermis','s','Long-term heavy use shrinks the cerebellum, especially the vermis, causing unsteady gait.'],['hippocampus','s','Alcohol disrupts memory formation (blackouts), and heavy long-term use reduces volume.'],['mammillary','s','Thiamine deficiency can cause Wernicke-Korsakoff syndrome, damaging these memory structures.']],
 symptoms:['Drinking more or longer than intended','Unsuccessful efforts to cut down','Craving','Tolerance','Withdrawal: shaking, sweating, anxiety, insomnia; in severe cases seizures or delirium tremens','Continued drinking despite problems','Giving up activities'],
 diagnosis:'Based on 11 DSM-5 criteria; severity is mild (2–3), moderate (4–5) or severe (6+). The AUDIT questionnaire is a common screening tool.',
 causes:['Genetics (about 50% heritable), early first use, stress, trauma, mental health conditions and social environment.'],
 treatment:['Medications include naltrexone, acamprosate and disulfiram. Counseling, CBT, motivational interviewing and mutual-help groups support recovery. Withdrawal from heavy long-term drinking can be dangerous and may need medical supervision.'],
 course:'Often chronic and relapsing, but many people recover, especially with treatment.'},
'psych:oud':{
 overview:['Opioid use disorder is a chronic, treatable condition involving compulsive use of opioids such as heroin, fentanyl or prescription painkillers despite harm. Physical dependence develops quickly, and withdrawal is intensely unpleasant, which powerfully drives continued use.','The current overdose crisis is driven mainly by illicitly manufactured fentanyl, which is extremely potent. Medications for opioid use disorder are highly effective and cut overdose deaths substantially, yet they remain underused.'],
 brain:[['vta','p','Opioids inhibit the brakes on VTA dopamine neurons, releasing a surge of dopamine that produces euphoria and reinforces use.'],['nacc','p','Repeated surges reshape the reward hub, building intense craving and cue-driven urges.'],['lc','s','Opioids suppress the locus coeruleus; during withdrawal it rebounds into overactivity, causing anxiety, sweating and agitation.'],['medulla','s','The breathing centers are highly sensitive to opioids; overdose kills mainly by stopping breathing.'],['antinsula','s','Turns withdrawal discomfort into craving.'],['ofc','s','Altered decision-making favors drug use over other rewards.']],
 symptoms:['Strong cravings','Tolerance','Withdrawal: aches, sweating, diarrhea, anxiety, insomnia','Loss of control over use','Continued use despite harm','Overdose risk'],
 diagnosis:'Based on DSM-5 criteria similar to alcohol use disorder.',
 causes:['Exposure to opioids, genetics, chronic pain, trauma, mental health conditions and social factors.'],
 treatment:['Buprenorphine, methadone and extended-release naltrexone reduce overdose deaths and support recovery. Naloxone reverses overdoses. Counseling and recovery support help.'],
 course:'Chronic and relapsing, but long-term medication treatment greatly improves survival and recovery.'},
'psych:stimulant':{
 overview:['Stimulant use disorder involves problematic use of cocaine, methamphetamine or other stimulants, with craving, binge patterns and continued use despite harm. Stimulants produce intense euphoria and energy followed by a crash of exhaustion and low mood.','Heavy use can cause paranoia and psychosis, heart attacks, strokes and, increasingly, overdoses when stimulants are contaminated with fentanyl.'],
 brain:[['nacc','p','Stimulants block dopamine reuptake or force its release, flooding the reward hub with dopamine and producing intense euphoria and craving.'],['vta','p','Dopamine circuitry adapts with repeated use, reducing the brain\'s response to natural rewards.'],['caudate','s','Use shifts from goal-directed to habit-driven.'],['ofc','s','Altered valuation and reduced activity during withdrawal.'],['acc','s','Weaker error monitoring and control.']],
 symptoms:['Binge patterns of use','Intense craving','Paranoia or psychosis with heavy use','Crash of exhaustion and low mood','Weight loss and sleep disruption'],
 diagnosis:'Based on DSM-5 criteria similar to other substance use disorders.',
 causes:['Genetics, early exposure, trauma, mental health conditions and environment.'],
 treatment:['Contingency management has the strongest evidence. CBT also helps. There are no FDA-approved medications yet.'],
 course:'Chronic and relapsing, but recovery is common with treatment.'},
'psych:gambling':{
 overview:['Gambling disorder is persistent, problematic gambling causing significant distress or harm. It is the only behavioral addiction in the main DSM-5 diagnostic section.','It activates the same reward circuits as drugs. Unpredictable wins and near-misses are especially powerful, and chasing losses drives escalating bets and debt.'],
 brain:[['nacc','p','Responds strongly to wins and near-misses, reinforcing continued gambling.'],['vmpfc','s','Altered valuation of risky choices.'],['ofc','s','Altered decision-making.'],['antinsula','s','Near-miss effects activate the insula, increasing the urge to continue.']],
 symptoms:['Needing to bet more for excitement','Restlessness when trying to stop','Chasing losses','Lying to hide gambling','Jeopardizing relationships or work','Relying on others for money'],
 diagnosis:'Requires four or more of nine DSM-5 criteria within a year.',
 causes:["Genetics, impulsivity, early wins, easy access, and rarely dopamine agonist medications used for Parkinson's disease."],
 treatment:['CBT has the best support; naltrexone has some evidence. Self-exclusion programs and support groups help.'],
 course:'Can be chronic, but many people recover.'},
'psych:bpd':{
 overview:['Borderline personality disorder is a long-standing pattern of intense and unstable emotions, unstable relationships and self-image, and impulsivity. Emotions rise quickly, run hot and take a long time to settle. It usually emerges in adolescence or early adulthood.','A widely used model describes BPD as the result of high biological emotional sensitivity meeting an environment that invalidated or punished emotions. People with BPD often experience intense fear of abandonment and may react strongly to perceived rejection. Self-harm and suicidal behavior are common and serious.','BPD is highly treatable, and long-term studies show that most people improve substantially over time.'],
 brain:[['amygdala','p','Detects emotional threat. In BPD it reacts more strongly to social cues like a neutral face or a delayed reply, and takes longer to settle afterward. Together with weaker prefrontal calming, this helps explain fast, intense mood shifts and fear of abandonment.'],['vlpfc','p','Regulates emotion from the top down. Reduced activity weakens the brake on emotional reactions, so feelings escalate quickly.'],['acc','p','Monitors conflict and helps regulate emotion and impulses. Reduced activity and volume are linked to difficulty pausing before acting on strong feelings.'],['ofc','s','Altered activity is linked to impulsivity and difficulty weighing consequences.'],['hippocampus','s','Smaller volume, often associated with early trauma, may affect emotional memory and stress regulation.'],['antinsula','s','Heightened sensitivity to social exclusion makes rejection feel especially painful.']],
 symptoms:['Intense fear of abandonment','Unstable, intense relationships swinging between idealization and devaluation','Unstable sense of identity','Impulsive behaviors','Recurrent self-harm or suicidal behavior','Rapid mood shifts lasting hours to days','Chronic emptiness','Intense, hard-to-control anger','Stress-related paranoia or dissociation'],
 diagnosis:'Requires at least five of nine criteria, beginning by early adulthood and present across contexts. Clinicians rule out bipolar disorder, PTSD and substance effects, which often co-occur.',
 causes:['Biological emotional sensitivity (heritability about 40%) combined with an invalidating environment, childhood trauma, neglect or unstable attachments.'],
 treatment:['Dialectical behavior therapy (DBT), teaching emotion regulation, distress tolerance, mindfulness and relationship skills, has the strongest evidence. Mentalization-based treatment, schema therapy and transference-focused psychotherapy also work. Medication can help specific symptoms but is not a primary treatment.'],
 course:'Outcomes are better than once thought: in long-term studies, most people with BPD no longer meet the diagnostic criteria after 10 years, though some difficulties may persist.'},
'psych:aspd':{
 overview:['Antisocial personality disorder is a long-standing pattern of disregarding and violating the rights of others, beginning with conduct problems before age 15 and diagnosed only in adults. Psychopathy is a related but narrower research concept that adds shallow emotion and a marked lack of empathy and remorse.','Not everyone with ASPD is violent or has psychopathic traits, and the disorder is heavily overrepresented in prisons, where up to around half of inmates may meet criteria.'],
 brain:[['amygdala','p',"Reduced response to fear and others' distress, especially in people with psychopathic traits, weakens the emotional signals that normally discourage harming others."],['vmpfc','p','Reduced activity and volume are linked to poor moral decision-making and failure to learn from punishment.'],['ofc','p','Reduced gray matter is linked to impulsivity and poor judgment.'],['acc','s','Weaker error monitoring makes it harder to adjust behavior after mistakes.'],['nacc','s','Heightened reward sensitivity may drive risk-taking.']],
 symptoms:['Repeated rule- or law-breaking','Deceitfulness and manipulation','Impulsivity and failure to plan','Irritability and aggression','Reckless disregard for safety','Irresponsibility','Lack of remorse'],
 diagnosis:'Requires age 18 or older, evidence of conduct disorder before 15, and at least three of seven criteria.',
 causes:['Genetics, childhood conduct disorder, abuse or neglect, and harsh or inconsistent parenting.'],
 treatment:['Difficult to treat. Approaches focus on co-occurring substance use, anger management and CBT-based programs. Early intervention for childhood conduct problems is most promising.'],
 course:'Antisocial behavior often decreases after age 40.'},
'psych:npd':{
 overview:['Narcissistic personality disorder is a pervasive pattern of grandiosity, need for admiration and lack of empathy. Beneath the confident surface, self-esteem is often fragile and highly sensitive to criticism, which can trigger shame, rage or withdrawal.','Researchers distinguish grandiose narcissism (bold, entitled) and vulnerable narcissism (insecure, hypersensitive), which often coexist in the same person.'],
 brain:[['antinsula','p','Reduced gray matter in the left anterior insula is linked to lower empathy, which may make it harder to feel what others feel.'],['dmpfc','s','Altered self-related processing may contribute to an inflated or unstable self-image.'],['acc','s','Altered response to social exclusion may underlie sensitivity to criticism.']],
 symptoms:['Inflated sense of importance','Fantasies of success or power','Need for excessive admiration','Sense of entitlement','Exploiting others','Lack of empathy','Envy and arrogance'],
 diagnosis:'Requires at least five of nine criteria beginning by early adulthood.',
 causes:['Genetics and childhood experiences, including both excessive praise and harsh criticism.'],
 treatment:['Long-term psychotherapy such as transference-focused psychotherapy or schema therapy.'],
 course:'Often stable, though some traits soften with age.'},
'psych:avpd':{overview:['Avoidant personality disorder is a pervasive pattern of social inhibition, feelings of inadequacy and extreme sensitivity to criticism, leading to avoidance of social contact despite wanting it. It overlaps heavily with severe social anxiety disorder.'],
 brain:[['amygdala','p','Heightened threat response to social cues overlaps with social anxiety.'],['antinsula','s','Heightened social pain.'],['dmpfc','s','Self-focused evaluation.']],
 diagnosis:'Requires at least four of seven criteria beginning by early adulthood.',
 causes:['Shy temperament, genetics and experiences of rejection.'],
 treatment:['CBT and schema therapy; SSRIs may help with anxiety.'],
 course:'Often chronic, but therapy can lead to substantial improvement.'},
'psych:ocpd':{overview:['OCPD is a pervasive preoccupation with orderliness, perfectionism and control at the expense of flexibility and efficiency. Unlike OCD, there are usually no true obsessions or compulsions, and people see their standards as correct rather than distressing.'],
 brain:[['dlpfc','s','Altered cognitive control (limited research).'],['caudate','s','Some overlap with OCD circuitry has been proposed.'],['ofc','s','Rigid valuation (limited research).']],
 diagnosis:'Requires at least four of eight criteria beginning by early adulthood.',
 causes:['Genetics and temperament; it often runs in families.'],
 treatment:['CBT and psychodynamic therapy.'],
 course:'Often stable over time.'},
'psych:stpd':{overview:['Schizotypal personality disorder involves social and interpersonal deficits, acute discomfort in close relationships, and odd beliefs, perceptions or behavior. It shares genetic risk with schizophrenia but without sustained psychosis.'],
 brain:[['stg','s','Smaller left superior temporal gyrus, similar to schizophrenia, may relate to unusual perceptions.'],['dlpfc','s','Mild working memory and prefrontal changes.'],['latvent','s','Mild ventricular enlargement in some studies.']],
 diagnosis:'Requires at least five of nine criteria beginning by early adulthood.',
 causes:['Shares genetic risk with schizophrenia.'],
 treatment:['Psychotherapy and social skills training; low-dose antipsychotics for some symptoms.'],
 course:'Usually stable; a minority develop schizophrenia.'},
'psych:ppd':{overview:['Paranoid personality disorder is a pervasive distrust and suspiciousness of others, interpreting their motives as harmful, without the fixed delusions of psychosis.'],
 brain:[['amygdala','s','Heightened threat detection is proposed; direct imaging research is limited.']],
 diagnosis:'Requires at least four of seven criteria beginning by early adulthood.',
 causes:['Possible genetic links with schizophrenia, and early adversity.'],
 treatment:['Psychotherapy focused on building trust.'],
 course:'Often chronic.'},
'psych:szpd':{overview:['Schizoid personality disorder is a pervasive pattern of detachment from social relationships and a restricted range of emotional expression. People prefer solitary activities and seem indifferent to praise or criticism.'],
 brain:[['nacc','s','Reduced social reward response is proposed; brain imaging research is very limited.']],
 diagnosis:'Requires at least four of seven criteria beginning by early adulthood.',
 causes:['Genetic links to the schizophrenia spectrum are suspected.'],
 treatment:['People rarely seek treatment; psychotherapy can help when they do.'],
 course:'Usually stable.'},
'psych:hpd':{overview:['Histrionic personality disorder is a pattern of excessive emotionality and attention-seeking, with a need to be the center of attention.'],
 brain:[['amygdala','s','Heightened emotional reactivity is proposed; almost no imaging research exists.']],
 diagnosis:'Requires at least five of eight criteria beginning by early adulthood.',
 causes:['Genetics and early experiences; little research exists.'],
 treatment:['Psychotherapy.'],
 course:'Traits may soften with age.'},
'psych:dpd':{overview:['Dependent personality disorder is a pervasive, excessive need to be taken care of, leading to submissive, clinging behavior and fear of separation.'],
 brain:[['amygdala','s','Heightened anxiety about separation is proposed; imaging research is very limited.']],
 diagnosis:'Requires at least five of eight criteria beginning by early adulthood.',
 causes:['Overprotective or authoritarian parenting, anxious temperament and chronic illness in childhood.'],
 treatment:['Psychotherapy focused on building independence and assertiveness.'],
 course:'Can improve with therapy.'},
'psych:conduct':{overview:['Conduct disorder is a repetitive pattern in children or teens of violating the basic rights of others or major social rules, such as aggression, destroying property, deceit and serious rule-breaking.','A subgroup with callous-unemotional traits (limited guilt, empathy and concern about performance) tends to have more severe and persistent problems and different underlying brain patterns.'],
 brain:[['amygdala','p',"Reduced response to others' distress, especially with callous-unemotional traits, weakens the signals that normally discourage harming others."],['vmpfc','s','Reduced activity during decision-making.'],['antinsula','s','Altered empathy and emotional awareness.'],['ofc','s','Reduced sensitivity to punishment.']],
 diagnosis:'Requires at least three of 15 criteria in the past year. Specifiers include childhood- vs adolescent-onset and limited prosocial emotions.',
 causes:['Genetics, harsh or inconsistent parenting, abuse, neighborhood violence and peer influence.'],
 treatment:['Parent management training, multisystemic therapy and school-based programs work best when started early.'],
 course:'Many improve by adulthood, but childhood onset raises the risk of antisocial personality disorder.'},
'psych:ied':{overview:['Intermittent explosive disorder involves recurrent, impulsive outbursts of verbal or physical aggression that are far out of proportion to the trigger and are not planned.'],
 brain:[['amygdala','p','Overactive response to angry faces and provocation fuels rapid rage.'],['ofc','p','Reduced regulation of anger responses means the brake engages too late.'],['acc','s','Weaker control over impulsive reactions.']],
 diagnosis:'Requires frequent verbal outbursts (twice weekly for three months) or three damaging outbursts within a year, starting after age 6.',
 causes:['Genetics, exposure to violence in childhood and serotonin system differences.'],
 treatment:['CBT focused on anger regulation; SSRIs.'],
 course:'Often begins in adolescence and can be chronic.'},
'psych:delirium':{overview:['Delirium is an acute, fluctuating disturbance in attention and awareness that develops over hours to days, usually caused by an underlying medical condition, infection, surgery, medication or substance withdrawal. It is a medical emergency.','It can be hyperactive (agitated), hypoactive (quiet and withdrawn, easily missed) or mixed. Delirium increases the risk of long-term cognitive decline and death, especially in older adults.'],
 brain:[['thalamus','s','Disrupted arousal and attention gating.'],['dlpfc','s','Disrupted attention networks.'],['pcc','s','Altered default mode network connectivity.']],
 diagnosis:'Bedside tools such as the CAM (Confusion Assessment Method) help detect it; the cause is found through exam, labs and medication review.',
 causes:['Infection, surgery, dehydration, medications, alcohol withdrawal and organ failure. Older age and dementia raise risk.'],
 treatment:['Find and treat the cause; keep the person oriented, mobile and sleeping well; avoid unnecessary sedatives.'],
 course:'Often resolves when the cause is treated, but may leave lasting cognitive effects.'}
});

<script>
Object.assign(window.I18N_ES.nodes,{
/* ---------- Jerarquía ---------- */
brain:{name:'Cerebro humano',kind:'Encéfalo completo',where:'Dentro del cráneo, apoyado sobre el tronco encefálico, que continúa hacia abajo como la médula espinal.',
 summary:'El cerebro adulto pesa entre 1,3 y 1,4 kg y contiene unos 86 mil millones de neuronas y una cantidad similar de células gliales. Está organizado en capas: dos hemisferios cerebrales con una corteza externa plegada, estructuras profundas bajo ellos que se encargan de la emoción, la memoria, la selección de movimientos y la regulación del cuerpo, y un rombencéfalo (cerebelo y tronco encefálico) que te mantiene en equilibrio, coordinado y con vida.',
 does:['Percibe e interpreta el mundo','Planifica y controla el movimiento','Almacena recuerdos y aprende','Genera emociones, motivación y pensamiento','Regula la respiración, la frecuencia cardiaca, las hormonas y el sueño'],
 fact:'El cerebro representa cerca del 2 % del peso corporal, pero consume alrededor del 20 % de la energía del cuerpo en reposo.'},
hemiL:{name:'Hemisferio izquierdo',kind:'Cerebro · Hemisferio',where:'La mitad izquierda del cerebro, separada de la derecha por la cisura longitudinal y unida a ella por el cuerpo calloso.',
 summary:'El hemisferio izquierdo controla y percibe el lado derecho del cuerpo. En cerca del 95 % de las personas diestras y en la mayoría de las zurdas, es dominante para el lenguaje: producir el habla, la gramática, la lectura y la escritura. También suele liderar el análisis detallado y secuencial, como los procedimientos aritméticos y las secuencias motoras finas de la mano derecha.',
 does:['Movimiento y sensibilidad del lado derecho del cuerpo','Lenguaje en la mayoría de las personas','Lectura, escritura y procedimientos aritméticos','Visión de la mitad derecha del campo visual'],
 damage:'Un ictus en el hemisferio izquierdo suele causar debilidad en el lado derecho y afasia, un trastorno del lenguaje, como la afasia de Broca o de Wernicke.',
 fact:'La idea popular de personas "de cerebro izquierdo" lógicas y "de cerebro derecho" creativas no está respaldada por la neuroimagen; ambos hemisferios trabajan juntos en casi todo.'},
hemiR:{name:'Hemisferio derecho',kind:'Cerebro · Hemisferio',where:'La mitad derecha del cerebro, separada de la izquierda por la cisura longitudinal y unida a ella por el cuerpo calloso.',
 summary:'El hemisferio derecho controla y percibe el lado izquierdo del cuerpo. Suele liderar la atención espacial a ambos lados del espacio, el reconocimiento de caras, la lectura del tono emocional de la voz (prosodia) y la comprensión del contexto, el humor y las metáforas en el lenguaje.',
 does:['Movimiento y sensibilidad del lado izquierdo del cuerpo','Atención y conciencia espacial','Reconocimiento de caras','Tono emocional del habla y de la expresión facial','Visión de la mitad izquierda del campo visual'],
 damage:'Un ictus en el hemisferio derecho suele causar debilidad en el lado izquierdo y heminegligencia: la persona ignora el lado izquierdo del espacio, a veces sin darse cuenta de que algo va mal.',
 fact:'En pacientes con cerebro dividido, el hemisferio derecho puede reconocer un objeto que solo él ve, pero no puede nombrarlo, porque el habla suele depender del hemisferio izquierdo.'},
deep:{name:'Estructuras profundas',kind:'Estructuras subcorticales y límbicas',aka:['estructuras profundas','estructuras subcorticales'],where:'Ocultas bajo la corteza en el centro del cerebro, alrededor de los ventrículos.',
 summary:'Las estructuras profundas incluyen el tálamo y el hipotálamo, los ganglios basales, las estructuras límbicas (hipocampo y amígdala), el cuerpo calloso y los ventrículos llenos de líquido. Transmiten y filtran información, seleccionan acciones, forman recuerdos, generan emociones y regulan el cuerpo. Muchas afecciones psiquiátricas y neurológicas se centran en ellas.',
 does:['Transmitir la información sensorial a la corteza','Seleccionar acciones y formar hábitos','Formar recuerdos y respuestas emocionales','Regular hormonas, hambre, temperatura y sueño','Conectar los dos hemisferios'],
 fact:'Al estar ocultas, la mayoría de estas estructuras solo podían estudiarse después de la muerte hasta que la resonancia magnética se generalizó en la década de 1980.'},
/* ---------- Grupos ---------- */
g_pfc:{name:'Corteza prefrontal',short:'Corteza prefrontal',aka:['corteza prefrontal'],where:'La parte delantera del lóbulo frontal, por delante de las áreas motoras.',
 summary:'La corteza prefrontal es el centro ejecutivo del cerebro. Sus partes externas (laterales) se ocupan de la memoria de trabajo, la planificación y el control; sus partes inferiores e internas vinculan la emoción y el valor con las decisiones y la conducta social. Es la parte de la corteza de evolución más reciente, termina de madurar hacia mediados de los 20 años y está implicada en casi todas las afecciones psiquiátricas.',
 does:['Función ejecutiva y planificación','Memoria de trabajo','Toma de decisiones y juicio','Regulación de las emociones','Conducta social y personalidad'],
 clinical:'El daño prefrontal puede dejar intacta la inteligencia pero arruinar el juicio, la planificación y la conducta social. Se observa una actividad prefrontal reducida o alterada en la depresión, la esquizofrenia, el TDAH, las adicciones y muchas otras afecciones.'},
g_motor:{name:'Áreas motoras',short:'Áreas motoras',aka:['áreas motoras'],where:'La franja posterior del lóbulo frontal, justo por delante del surco central.',
 summary:'Las áreas motoras planifican, preparan y ejecutan el movimiento voluntario. La corteza premotora y el área motora suplementaria planifican y secuencian los movimientos; la corteza motora primaria envía las órdenes finales a la médula espinal.',
 does:['Planificar el movimiento','Secuenciar el movimiento','Enviar órdenes de movimiento a los músculos'],
 clinical:'El daño causa debilidad o pérdida de movimiento en el lado opuesto del cuerpo, o dificultad para planificar movimientos aprendidos (apraxia).'},
g_ipl:{name:'Lobulillo parietal inferior',short:'Parietal inferior',aka:['lobulillo parietal inferior'],where:'La parte inferior del lóbulo parietal, por debajo del surco intraparietal.',
 summary:'El lobulillo parietal inferior es un área de asociación de alto nivel donde confluyen el tacto, la visión, la audición y el lenguaje. Participa en la lectura, la aritmética, el uso de herramientas, la atención y la comprensión de las acciones de otras personas. Es mucho más grande en los humanos que en otros primates.',
 does:['Lenguaje y lectura','Aritmética','Planificación de gestos y uso de herramientas','Atención espacial'],
 clinical:'El daño puede causar apraxia, síndrome de Gerstmann en el lado izquierdo o heminegligencia en el derecho.'},
g_auditory:{name:'Áreas auditivas y del lenguaje',short:'Auditivas y lenguaje',aka:['áreas auditivas y del lenguaje'],where:'La parte superior del lóbulo temporal, a lo largo del surco lateral.',
 summary:'Esta franja convierte el sonido en significado. La corteza auditiva primaria analiza el tono y el ritmo, la circunvolución temporal superior que la rodea reconoce los sonidos del habla, las voces y la música, y el área de Wernicke conecta las palabras con su significado.',
 does:['Audición','Reconocimiento del habla','Comprensión del lenguaje','Percepción musical'],
 clinical:'El daño en el lado izquierdo puede causar afasia de Wernicke. La actividad anormal aquí se relaciona con las alucinaciones auditivas de la esquizofrenia.'},
g_ventral:{name:'Corteza temporal lateral y ventral',short:'Temporal lateral y ventral',aka:['corteza temporal ventral'],where:'La superficie externa media e inferior y la cara inferior del lóbulo temporal.',
 summary:'Estas áreas almacenan conocimiento y reconocen qué son las cosas. La circunvolución temporal media guarda el significado de palabras y conceptos; la circunvolución temporal inferior y la fusiforme forman el final de la vía visual ventral del "qué", que reconoce objetos, caras y palabras escritas.',
 does:['Conocimiento semántico','Reconocimiento de objetos','Reconocimiento de caras','Lectura de palabras'],
 clinical:'El daño puede causar agnosia visual o prosopagnosia; se atrofian en la demencia semántica.'},
g_mtl:{name:'Corteza temporal medial',short:'Temporal medial',aka:['lóbulo temporal medial','corteza temporal medial'],where:'La cara inferior interna del lóbulo temporal, envolviendo el hipocampo.',
 summary:'La corteza temporal medial es la puerta entre el resto de la corteza y el hipocampo. Aporta al sistema de memoria información sobre lugares, escenas, objetos y contexto, y alberga el sistema de navegación de las células de rejilla.',
 does:['Enviar información al hipocampo','Reconocimiento de escenas y lugares','Navegación'],
 clinical:'Es una de las primeras áreas dañadas en la enfermedad de Alzheimer y un sitio frecuente de crisis en la epilepsia del lóbulo temporal.'},
g_early:{name:'Corteza visual temprana',short:'Visual temprana',aka:['corteza visual temprana'],where:'La parte posterior y la superficie externa del lóbulo occipital.',
 summary:'La corteza visual temprana, de V1 a V3, construye los primeros mapas de lo que ven los ojos: bordes, orientación, contraste, contornos y profundidad. Todo lo que ves pasa por estas áreas antes de enviarse a regiones especializadas.',
 does:['Detección de bordes y contornos','Mapa del campo visual','Percepción de la profundidad'],
 clinical:'El daño causa ceguera en las partes correspondientes del campo visual.'},
g_special:{name:'Áreas visuales especializadas',short:'Visuales especializadas',aka:['áreas visuales especializadas'],where:'La cara inferior (V4) y la cara externa (V5/MT) del lóbulo occipital.',
 summary:'Más allá de la corteza visual temprana, áreas especializadas procesan rasgos concretos: V4 se ocupa del color y la forma, y V5/MT del movimiento.',
 does:['Percepción del color','Percepción del movimiento'],
 clinical:'El daño causa pérdida selectiva de la visión del color (acromatopsia) o del movimiento (acinetopsia).'},
g_medocc:{name:'Circunvoluciones occipitales mediales',short:'Occipital medial',aka:['circunvoluciones occipitales mediales'],where:'La cara interna del lóbulo occipital, por encima y por debajo del surco calcarino.',
 summary:'La cuña, por encima del surco calcarino, y la circunvolución lingual, por debajo, contienen las partes de la corteza visual que representan la mitad inferior y la mitad superior del campo visual, respectivamente.',
 does:['Campo visual inferior (cuña)','Campo visual superior (circunvolución lingual)'],
 clinical:'El daño causa la pérdida de un cuarto del campo visual.'},
g_striatum:{name:'Cuerpo estriado',short:'Estriado',aka:['estriado','cuerpo estriado'],where:'La gran región de entrada de los ganglios basales: el caudado, el putamen y el núcleo accumbens.',
 summary:'El cuerpo estriado recibe información de casi toda la corteza y dopamina del mesencéfalo. Su parte dorsal (caudado y putamen) sostiene la acción dirigida a metas y los hábitos; su parte ventral (núcleo accumbens) sostiene la recompensa y la motivación.',
 does:['Recibir la información cortical que entra a los ganglios basales','Aprendizaje de hábitos y habilidades','Recompensa y motivación'],
 clinical:'Es central en la enfermedad de Parkinson (pérdida de dopamina), la enfermedad de Huntington (pérdida neuronal), el TOC, el síndrome de Tourette y las adicciones.'},
g_relay:{name:'Núcleos de relevo sensorial y motor',short:'Núcleos de relevo',aka:['núcleos de relevo'],where:'Las partes inferior y posterior del tálamo.',
 summary:'Estos núcleos transmiten corrientes concretas de información: los núcleos ventrales llevan tacto, dolor y circuitos motores, el geniculado lateral lleva la visión y el geniculado medial la audición.',
 does:['Relevo del tacto y el dolor','Relevo de circuitos motores','Relevo de la visión y la audición'],
 clinical:'El daño causa pérdida de la sensibilidad correspondiente en el lado opuesto, o dolor crónico.'},
g_neuromod:{name:'Núcleos neuromoduladores',short:'Neuromoduladores',aka:['núcleos neuromoduladores'],where:'Pequeños grupos dentro del mesencéfalo, la protuberancia y el bulbo raquídeo.',
 summary:'Estos núcleos diminutos envían fibras de largo alcance por todo el cerebro y fijan su estado general. El área tegmental ventral aporta dopamina, el locus coeruleus noradrenalina y los núcleos del rafe serotonina, que moldean la motivación, el alerta, el estado de ánimo y el sueño.',
 does:['Dopamina para la recompensa y la motivación','Noradrenalina para el alerta y la vigilia','Serotonina para el estado de ánimo y el sueño'],
 clinical:'La mayoría de los medicamentos psiquiátricos actúan sobre los sistemas químicos que producen estos núcleos.'},
/* ---------- Regiones principales ---------- */
frontal:{name:'Lóbulo frontal',kind:'Corteza cerebral · Lóbulo',aka:['lóbulo frontal','lóbulos frontales'],where:'La parte delantera de cada hemisferio, detrás de la frente, hasta el surco central.',
 summary:'El lóbulo frontal es el lóbulo más grande de la corteza cerebral y el centro de planificación del cerebro. Su corteza prefrontal sostiene la función ejecutiva: fijar metas, sopesar opciones, mantener datos en la memoria de trabajo y frenar impulsos. A lo largo de su borde posterior, la corteza motora primaria envía las señales que inician el movimiento voluntario.',
 does:['Planificación, juicio y toma de decisiones','Memoria de trabajo y atención','Inicio del movimiento voluntario','Producción del habla mediante el área de Broca, normalmente en el hemisferio izquierdo','Personalidad y conducta social'],
 damage:'El daño puede cambiar la personalidad, el juicio y el autocontrol. En 1848 una barra de hierro atravesó el lóbulo frontal del capataz ferroviario Phineas Gage. Sobrevivió, pero quienes lo conocían decían que ya no era el mismo. El daño en el área de Broca causa un tipo de afasia en que el habla es lenta y costosa mientras la comprensión se conserva en gran parte.',
 fact:'La corteza prefrontal es una de las últimas áreas cerebrales en madurar, normalmente hacia mediados de los 20 años.'},
parietal:{name:'Lóbulo parietal',kind:'Corteza cerebral · Lóbulo',aka:['lóbulo parietal','lóbulos parietales'],where:'La parte superior y posterosuperior de cada hemisferio, entre el surco central y el lóbulo occipital.',
 summary:'El lóbulo parietal convierte la sensación en bruto en una percepción de tu cuerpo y del espacio que lo rodea. La corteza somatosensorial recibe señales de tacto, temperatura, dolor y propiocepción de todo el cuerpo. Las áreas situadas detrás combinan esas señales con la visión y la audición para que puedas alcanzar objetos, calcular distancias y orientarte.',
 does:['Percepción del tacto, la temperatura y el dolor','Propiocepción, el sentido de la posición del cuerpo','Conciencia espacial y navegación','Guiar los movimientos de alcance y agarre','Lectura, escritura y aritmética'],
 damage:'El daño en el lóbulo parietal derecho puede causar heminegligencia: una persona puede comer solo del lado derecho del plato o afeitarse solo la mitad de la cara. El daño en el izquierdo puede alterar la lectura, la escritura y el cálculo.',
 fact:'La vía dorsal de la visión sube hasta el lóbulo parietal, por eso se la llama la vía del "dónde" del cerebro.'},
temporal:{name:'Lóbulo temporal',kind:'Corteza cerebral · Lóbulo',aka:['lóbulo temporal','lóbulos temporales'],where:'La parte lateral inferior de cada hemisferio, por debajo del surco lateral, aproximadamente detrás de las sienes y las orejas.',
 summary:'El lóbulo temporal se ocupa del sonido, el lenguaje y la memoria. La corteza auditiva distingue el tono, el ritmo y los sonidos del habla, y el área de Wernicke ayuda a entender el significado de las palabras. En su cara inferior, la circunvolución fusiforme reconoce caras y objetos, y en su cara interna se encuentran el hipocampo y la amígdala del sistema límbico.',
 does:['Audición y procesamiento del sonido','Comprensión del lenguaje mediante el área de Wernicke','Reconocimiento de caras y objetos','Formación de nuevos recuerdos, con el hipocampo','Reacciones emocionales, con la amígdala'],
 damage:'La epilepsia del lóbulo temporal es el tipo más común de epilepsia focal, y sus crisis pueden traer déjà vu, olores extraños o una emoción intensa repentina. El daño en el área de Wernicke causa una afasia en la que el habla fluye con facilidad pero tiene poco sentido.',
 fact:'Algunas personas con daño en la circunvolución fusiforme desarrollan ceguera facial: ven una cara con claridad, pero no saben de quién es.'},
occipital:{name:'Lóbulo occipital',kind:'Corteza cerebral · Lóbulo',aka:['lóbulo occipital','lóbulos occipitales'],where:'La parte más posterior del cerebro, por encima del cerebelo.',
 summary:'El lóbulo occipital se dedica casi por completo a la visión. Las señales de los ojos pasan por el tálamo hasta la corteza visual primaria, que detecta bordes, ángulos y contraste. Las áreas vecinas añaden color, movimiento y forma, y luego envían los resultados hacia delante por la vía dorsal, que calcula dónde están las cosas, y la vía ventral, que identifica qué son.',
 does:['Recibir la información visual de los ojos','Detectar bordes, líneas y contraste','Procesar el color y el movimiento','Enviar la información visual a otros lóbulos'],
 damage:'El daño en la corteza visual primaria causa ceguera en parte del campo visual aunque los ojos estén sanos. Algunos pacientes muestran visión ciega: señalan correctamente objetos que dicen no poder ver.',
 fact:'Cada hemisferio ve la mitad opuesta del mundo: tu lóbulo occipital izquierdo procesa todo lo que está a la derecha de donde miras.'},
cingulate:{name:'Corteza cingulada',kind:'Corteza límbica · Cara medial',aka:['corteza cingulada','circunvolución cingulada','cíngulo'],where:'En la pared interna (medial) de cada hemisferio, rodeando la parte superior del cuerpo calloso como un cinturón.',
 summary:'La corteza cingulada es una banda curva de corteza que vincula la emoción, la motivación, el dolor y la atención con la acción. Su parte anterior, la corteza cingulada anterior, detecta conflictos y errores y ayuda a decidir cuánto esfuerzo merece una tarea. Su parte posterior, la corteza cingulada posterior, es un nodo central de la red neuronal por defecto, activa cuando sueñas despierto, recuerdas tu pasado o piensas en ti mismo.',
 does:['Detectar errores y metas en conflicto','Conciencia y regulación emocional','La sensación desagradable del dolor','Motivación y esfuerzo','Reflexión sobre uno mismo y memoria autobiográfica'],
 damage:'El daño bilateral en la cingulada anterior puede causar apatía grave y, en casos extremos, mutismo acinético: la persona está despierta pero rara vez se mueve o habla. La actividad cingulada anormal aparece en la depresión, el TOC, el dolor crónico y el TEPT. Unos pocos centros aún usan la cingulotomía quirúrgica para el TOC grave y resistente al tratamiento y para el dolor.',
 fact:'Su nombre viene del latín cingulum, que significa "cinturón" o "faja".'},
