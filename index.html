<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="description"
            content="Interactive 3D brain map for studying neuroscience, psychology and medicine."
        />
        <title>Interactive Brain Map</title>
    </head>
    <body data-stage="loading">
        <div class="app">
            <header class="top">
                <h1 data-i18n="title">Interactive Brain Map</h1>
                <p id="stats"></p>
            </header>

            <section class="left">
                <div class="stage" id="stage">
                    <canvas
                        id="brain"
                        aria-label="Rotatable 3D model of the human brain"
                    ></canvas>
                    <div class="labels" id="labels"></div>
                    <div class="tip" id="tip" hidden></div>
                    <div class="toolbar">
                        <button
                            class="tb"
                            id="upBtn"
                            title="Go up one level (Esc)"
                            data-i18n="up"
                            data-i18n-title="upTitle"
                        >
                            ↑ Up a level
                        </button>
                        <button
                            class="tb more-btn"
                            id="moreBtn"
                            aria-expanded="false"
                            aria-controls="tbMore"
                            data-i18n="controls"
                        >
                            Controls ▾
                        </button>
                        <div class="tb-more" id="tbMore">
                            <label class="tb spread" for="spread"
                                ><span data-i18n="spread">Spread</span>
                                <input
                                    id="spread"
                                    type="range"
                                    min="0"
                                    max="100"
                                    value="0"
                            /></label>
                            <label class="tb spread" for="opac"
                                ><span data-i18n="opacity">Opacity</span>
                                <input
                                    id="opac"
                                    type="range"
                                    min="0"
                                    max="100"
                                    value="20"
                            /></label>
                            <label class="tb spread" for="bright"
                                ><span data-i18n="brightness">Brightness</span>
                                <input
                                    id="bright"
                                    type="range"
                                    min="0"
                                    max="100"
                                    value="50"
                            /></label>
                            <button
                                class="tb"
                                id="lblBtn"
                                aria-pressed="true"
                                data-i18n="labels"
                            >
                                Labels
                            </button>
                            <button class="tb" id="resetBtn" data-i18n="reset">
                                Reset
                            </button>
                        </div>
                    </div>
                    <div class="hint" id="hint" data-i18n="hint">
                        Drag to rotate · scroll or pinch to zoom · click a
                        section to open it · Esc goes back up
                    </div>
                    <div class="condbar" id="condbar" hidden></div>
                    <!-- Shown from the first paint until the model is built.
                         Replaced by #stageError if the 3D view can't run. -->
                    <div class="stage-status" id="stageStatus" role="status">
                        <p class="stage-status-title" id="stageStatusTitle">
                            <span data-i18n="loadingTitle"
                                >Loading the 3D brain</span
                            >
                        </p>
                        <progress
                            id="stageProgress"
                            max="100"
                            value="0"
                            aria-labelledby="stageStatusTitle"
                        ></progress>
                        <p class="stage-status-note" data-i18n="loadingNote">
                            You can read and search while it loads.
                        </p>
                        <noscript>
                            <p class="stage-status-note">
                                The 3D brain needs JavaScript. Turn it on in
                                your browser settings to explore the model.
                            </p>
                        </noscript>
                    </div>
                    <div
                        class="stage-status stage-error"
                        id="stageError"
                        role="alert"
                        hidden
                    ></div>
                </div>
                <div class="chips" id="chips"></div>
            </section>

            <aside class="panel">
                <div
                    class="grab"
                    id="grab"
                    role="button"
                    tabindex="0"
                    aria-label="Resize panel"
                >
                    <span></span>
                </div>
                <div class="tabs" role="tablist">
                    <button
                        class="tab"
                        role="tab"
                        id="tab-browse"
                        aria-selected="false"
                        data-i18n="tabBrowse"
                    >
                        Browse
                    </button>
                    <button
                        class="tab"
                        role="tab"
                        id="tab-region"
                        aria-selected="true"
                        data-i18n="tabRegion"
                    >
                        Region
                    </button>
                    <button
                        class="tab"
                        role="tab"
                        id="tab-psych"
                        aria-selected="false"
                        data-i18n="tabPsych"
                    >
                        Psychology
                    </button>
                    <button
                        class="tab"
                        role="tab"
                        id="tab-disease"
                        aria-selected="false"
                        data-i18n="tabDisease"
                    >
                        Diseases
                    </button>
                    <button
                        class="tab"
                        role="tab"
                        id="tab-gloss"
                        aria-selected="false"
                        data-i18n="tabGloss"
                    >
                        Dictionary
                    </button>
                    <div
                        class="lang"
                        role="group"
                        aria-label="Language / Idioma"
                    >
                        <button
                            type="button"
                            data-lang="en"
                            aria-pressed="true"
                        >
                            EN</button
                        ><button
                            type="button"
                            data-lang="es"
                            aria-pressed="false"
                        >
                            ES
                        </button>
                    </div>
                </div>
                <p class="notice" id="notice" role="status" hidden></p>
                <div class="view" id="view-browse" role="tabpanel" hidden>
                    <p class="eyebrow" data-i18n="browseEyebrow">
                        Every section of the brain
                    </p>
                </div>
                <div class="view" id="view-region" role="tabpanel"></div>
                <div class="view" id="view-psych" role="tabpanel" hidden></div>
                <div
                    class="view"
                    id="view-disease"
                    role="tabpanel"
                    hidden
                ></div>
                <div class="view" id="view-gloss" role="tabpanel" hidden>
                    <label for="gq" class="eyebrow" data-i18n="glossSearch"
                        >Search terms, regions and conditions</label
                    >
                    <input
                        class="search"
                        id="gq"
                        type="search"
                        placeholder="e.g. synapse, putamen, PTSD"
                        data-i18n-ph="glossPh"
                        autocomplete="off"
                    />
                    <div class="filters" id="gfilters"></div>
                    <div class="recent" id="recent"></div>
                    <p class="count" id="gcount"></p>
                    <ul class="gl" id="glist"></ul>
                </div>
            </aside>
        </div>

        <div class="pop" id="pop" role="dialog" aria-live="polite" hidden></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
