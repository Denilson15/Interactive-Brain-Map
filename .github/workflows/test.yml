# Runs the end-to-end tests on every push and pull request, and checks
# that the committed index.html matches a fresh build of src/.
name: Test

on:
    push:
    pull_request:

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Check index.html is up to date with src/
              run: |
                  python3 build.py
                  git diff --exit-code index.html
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
