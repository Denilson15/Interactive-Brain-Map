condNote:
    Los hallazgos cerebrales describen diferencias promedio observadas en grupos
    de investigación. No sirven para diagnosticar a una persona, y los cambios
    cerebrales pueden ser causa, consecuencia o ambas. Esto es material de
    estudio, no consejo médico.
