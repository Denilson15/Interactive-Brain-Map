help:
    Haz clic en una sección del modelo, en su etiqueta o en un botón debajo del
    modelo para bajar un nivel. Haz clic en un espacio vacío o pulsa Esc para
    subir. Usa Separar para apartar las partes. Las palabras con subrayado
    punteado abren una definición; también puedes seleccionar cualquier palabra
    para buscarla.
