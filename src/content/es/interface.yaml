errWebglTitle: La vista 3D no puede iniciarse en este dispositivo
errWebglBody: >-
    Tu navegador no permitió WebGL, que dibuja el modelo. Todo lo demás
    funciona: elige una región de la lista, abre una afección o busca en el
    diccionario.
errWebglFix: >-
    Para ver el modelo, activa la aceleración por hardware en la configuración
    del navegador o abre esta página en otro navegador.
errBuildTitle: El modelo 3D no terminó de construirse
errBuildBody: >-
    Recarga la página para intentarlo de nuevo. Las listas, las afecciones y el
    diccionario siguen funcionando.
errLostTitle: Tu dispositivo pausó la vista 3D
errLostBody: >-
    Puede pasar cuando el dispositivo tiene poca memoria. Puede volver por sí
    sola; si no, recarga la página.
