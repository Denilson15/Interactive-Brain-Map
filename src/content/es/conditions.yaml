# Spanish text for conditions, keyed by kind:id. `brain` maps an area
# id to its translated note.

psych:adhd:
    name: Trastorno por déficit de atención e hiperactividad
    short: TDAH
    aka:
        - tdah
        - déficit de atención
    summary:
        El TDAH es una condición del neurodesarrollo marcada por un patrón
        continuo de inatención, hiperactividad e impulsividad que interfiere en
        la vida diaria.
    overview:
        - El TDAH es una condición del neurodesarrollo definida por un patrón
          persistente de inatención, hiperactividad e impulsividad más intenso
          de lo esperado para la edad, que interfiere en la escuela, el trabajo
          o las relaciones. Los síntomas deben comenzar antes de los 12 años,
          aparecer en más de un entorno y durar al menos seis meses.
        - Se entiende mejor como una diferencia en la autorregulación que como
          falta de conocimiento o de esfuerzo. Las personas con TDAH suelen
          saber lo que deberían hacer; la dificultad está en lograr que el
          cerebro inicie, mantenga y detenga una conducta cuando hace falta,
          sobre todo si la tarea es aburrida o la recompensa está lejos. Ese
          mismo cerebro puede concentrarse durante horas en algo muy
          estimulante, por eso la "hiperconcentración" y la inatención pueden
          coexistir.
        - El TDAH suele continuar en la edad adulta, donde la hiperactividad a
          menudo se convierte en inquietud interna, y la desorganización, la
          "ceguera temporal" y la reactividad emocional pasan a ser los
          problemas principales. Con frecuencia se acompaña de ansiedad,
          depresión, trastornos del aprendizaje, autismo y consumo de
          sustancias.
    brain:
        dlpfc:
            Mantiene metas e instrucciones en la memoria de trabajo. En el TDAH
            se activa menos durante tareas exigentes y madura más tarde, así que
            los planes y las instrucciones "se borran", lo que se ve como
            olvidos, perder el hilo a mitad de una tarea y dificultad para
            organizar trabajos de varios pasos.
        vlpfc:
            Actúa como el freno del cerebro para detener una acción. Su menor
            activación derecha en tareas de señal de parada hace más difícil
            cancelar una respuesta ya iniciada, lo que produce responder sin
            pensar, interrumpir y actuar antes de pensar.
        caudate:
            Parte del estriado que conecta la corteza prefrontal con la
            selección de acciones. Es más pequeño en muchos niños con TDAH y
            recibe una señal dopaminérgica menos eficaz, lo que debilita el
            circuito que mantiene al cerebro enfocado en la meta actual. Los
            estimulantes aumentan la dopamina aquí.
        nacc:
            Codifica cuán gratificante se espera que sea algo. En el TDAH
            responde débilmente a recompensas diferidas, así que ganan las
            inmediatas, lo que ayuda a explicar la procrastinación y la
            atracción del móvil y los videojuegos frente a los deberes.
        acc:
            Vigila los errores y avisa cuando hace falta más esfuerzo. Su menor
            actividad ante errores hace que los fallos y la atención que se
            desvía se noten más tarde, y los errores por descuido se acumulan.
        pcc:
            Es un nodo de la red neuronal por defecto, que debería calmarse
            durante las tareas. En el TDAH sigue interfiriendo, así que la
            atención se desvía hacia la ensoñación durante clases o lecturas.
        cerebhemi:
            Sostiene la sincronía y la secuenciación automática de la conducta.
            El menor volumen cerebeloso descrito en varios estudios podría
            contribuir a la mala estimación del tiempo y a la torpeza.
    symptoms:
        - Dificultad para mantener la atención en tareas poco interesantes
        - Errores por descuido y pasar por alto detalles
        - Perder cosas y olvidar citas o tareas
        - Mala gestión del tiempo y retrasos crónicos ("ceguera temporal")
        - Inquietud, moverse constantemente o sentirse impulsado por un motor
        - Hablar en exceso, interrumpir y dificultad para esperar el turno
        - Fuerte preferencia por recompensas inmediatas; procrastinación
        - Reactividad emocional e intolerancia a la frustración
        - Hiperconcentración en actividades muy atractivas
    diagnosis:
        "El diagnóstico es clínico: no hay análisis de sangre ni escáner
        cerebral para el TDAH. Un profesional reúne una historia detallada, usa
        escalas estandarizadas de varios informantes (padres, docentes, pareja),
        confirma que los síntomas empezaron en la infancia y causan deterioro en
        al menos dos entornos, y descarta otras explicaciones como problemas de
        sueño, ansiedad, depresión, problemas de audición o visión, enfermedad
        tiroidea o trastornos del aprendizaje. Los niños necesitan seis o más
        síntomas en un dominio; las personas de 17 años o más, cinco."
    types:
        - "Presentación predominantemente inatenta: sobre todo problemas de
          atención y organización, sin mucha hiperactividad. Pasa desapercibida
          con más frecuencia, sobre todo en niñas y mujeres."
        - "Presentación predominantemente hiperactiva-impulsiva: sobre todo
          inquietud e impulsividad; más frecuente en niños pequeños."
        - "Presentación combinada: síntomas importantes en ambos dominios. La
          presentación de una persona puede cambiar con el tiempo."
    causes:
        - "El TDAH es una de las condiciones psiquiátricas más heredables, con
          una heredabilidad estimada por estudios de gemelos de alrededor del
          70–80 %. Es poligénico: muchas variantes genéticas comunes, algunas
          relacionadas con la señal dopaminérgica, añaden cada una un poco de
          riesgo."
        - Los factores ambientales que aumentan el riesgo incluyen el nacimiento
          prematuro y el bajo peso al nacer, la exposición prenatal al tabaco,
          el alcohol o algunos medicamentos, la exposición al plomo y la
          privación grave temprana. El estilo de crianza, el tiempo de pantalla
          y el azúcar no causan TDAH, aunque el entorno puede mejorar o empeorar
          los síntomas.
    treatment:
        - Los medicamentos estimulantes (metilfenidato y anfetaminas) son el
          tratamiento más eficaz y ayudan a cerca del 70–80 % de las personas.
          Aumentan la señal de dopamina y noradrenalina en los circuitos
          prefrontales y estriatales, reforzando la atención y el control de
          impulsos mientras el medicamento actúa.
        - Las opciones no estimulantes incluyen atomoxetina y viloxazina
          (inhibidores de la recaptación de noradrenalina) y guanfacina y
          clonidina (agonistas alfa-2 que refuerzan la señal prefrontal). Pueden
          convenir a quienes no toleran los estimulantes o tienen tics o riesgo
          de consumo de sustancias.
        - "El entrenamiento conductual para padres es la primera opción en
          preescolares. Los apoyos escolares, el entrenamiento en habilidades
          organizativas, el coaching y la TCC para adultos construyen rutinas y
          estructura externa: agendas, temporizadores, dividir las tareas en
          pasos pequeños y hacer las recompensas más inmediatas."
    course:
        Los síntomas suelen disminuir con la edad, sobre todo la hiperactividad,
        pero entre la mitad y dos tercios de los niños siguen teniendo síntomas
        que causan deterioro en la edad adulta. El TDAH no tratado se asocia con
        más abandono escolar, accidentes, inestabilidad laboral y consumo de
        sustancias; el tratamiento reduce muchos de estos riesgos. Muchos
        adultos aprenden a aprovechar fortalezas como la creatividad, la energía
        y la capacidad de hiperconcentración.
    prevalence:
        Alrededor del 5–7 % de los niños y aproximadamente el 2,5–3 % de los
        adultos en el mundo.
    fact:
        En un conocido estudio de neuroimagen, la corteza de los niños con TDAH
        alcanzó su grosor máximo unos tres años más tarde que en otros niños, lo
        que sugiere un retraso en la maduración más que un déficit fijo.
psych:asd:
    name: Trastorno del espectro autista
    short: Autismo
    aka:
        - trastorno del espectro autista
        - autismo
        - tea
        - autista
    summary:
        El autismo es una diferencia del neurodesarrollo de por vida en la
        comunicación y la interacción social, junto con conductas e intereses
        restringidos o repetitivos y diferencias en el procesamiento sensorial.
    overview:
        - El trastorno del espectro autista es una diferencia del
          neurodesarrollo de por vida en cómo una persona se comunica, se
          relaciona con los demás y procesa el mundo. El diagnóstico requiere
          diferencias persistentes en la comunicación y la interacción social,
          junto con conductas, intereses o respuestas sensoriales restringidos o
          repetitivos, presentes desde la primera infancia.
        - "El autismo es un espectro en dos sentidos: las capacidades varían
          enormemente, desde personas que necesitan apoyo constante y no usan el
          lenguaje hablado hasta personas con títulos avanzados que sobre todo
          tienen dificultades con las expectativas sociales y la sobrecarga
          sensorial; y cada persona tiene su propia combinación de fortalezas y
          retos. Entre las fortalezas frecuentes están la atención al detalle,
          el reconocimiento de patrones, la honestidad y un conocimiento
          profundo de sus áreas de interés."
        - "Muchas personas autistas y defensores adoptan la visión de la
          neurodiversidad: el autismo es una variación natural del desarrollo
          cerebral, y gran parte de la discapacidad proviene de entornos que no
          se adaptan a él. El apoyo se centra en la comunicación, la
          independencia, el bienestar y reducir el malestar, más que en hacer
          que la persona parezca no autista."
    brain:
        amygdala:
            Señala la información social y emocionalmente importante. Muchos
            niños autistas muestran un crecimiento inusualmente rápido de la
            amígdala en la primera infancia y respuestas diferentes a las caras
            y al contacto visual, lo que puede hacer incómodo el contacto visual
            y cambiar qué señales sociales se perciben.
        stg:
            El surco temporal superior descifra la dirección de la mirada, las
            voces y el movimiento corporal. Su actividad atípica puede
            dificultar leer en tiempo real las intenciones a partir de señales
            no verbales sutiles.
        fusiform:
            Se especializa en reconocer las caras como un todo. Algunos estudios
            hallan respuestas menos específicas a las caras, que se procesan más
            como objetos, lo que puede hacer más costoso reconocer a las
            personas y sus expresiones.
        dmpfc:
            Construye modelos de lo que piensan los demás (teoría de la mente).
            Su activación distinta en estas tareas encaja con la dificultad para
            adivinar intenciones no dichas, aunque las personas autistas suelen
            entenderse bien entre sí, un patrón llamado el problema de la "doble
            empatía".
        antinsula:
            Decide qué señales internas y externas son importantes. Las
            diferencias aquí se relacionan con la hiper o hiporreactividad
            sensorial y la dificultad para identificar las propias emociones
            (alexitimia).
        cerebhemi:
            El cerebelo da forma a la predicción y la sincronía en el
            movimiento, el lenguaje y la interacción social. Un menor número de
            células de Purkinje es uno de los hallazgos post mortem más
            consistentes y podría contribuir a la torpeza motora y a la
            dificultad para adaptarse a situaciones impredecibles.
        callosum:
            Conecta los hemisferios. Un cuerpo calloso más pequeño y una
            conectividad de largo alcance alterada podrían favorecer el
            procesamiento local detallado sobre la integración de información en
            todo el cerebro.
    symptoms:
        - Diferencias en la conversación recíproca y la atención compartida
        - Uso menor o distinto del contacto visual, los gestos y las expresiones
          faciales
        - Dificultad para entender las reglas sociales no escritas o para hacer
          amistades de forma típica
        - Movimientos o lenguaje repetitivos, como el stimming, que a menudo
          ayuda a autorregularse
        - Fuerte necesidad de rutina y malestar ante cambios inesperados
        - Intereses intensos y focalizados
        - Hiper o hiposensibilidad al sonido, la luz, el tacto, el gusto, el
          olor o el dolor
        - Crisis (meltdowns) o bloqueos (shutdowns) ante la sobrecarga
    diagnosis:
        El diagnóstico se basa en la historia del desarrollo y la observación
        directa, a menudo con herramientas como el ADOS-2 y el ADI-R. Se
        recomienda el cribado a los 18 y 24 meses, y un diagnóstico fiable es
        posible hacia los 2 años, aunque muchas personas, sobre todo niñas,
        mujeres y quienes no tienen discapacidad intelectual, se diagnostican
        mucho más tarde. Se especifica el nivel de apoyo necesario (1–3) y si
        hay discapacidad intelectual o del lenguaje. Suelen recomendarse pruebas
        de audición y estudios genéticos.
    types:
        - "El DSM-5 unificó etiquetas anteriores, como el síndrome de Asperger y
          el trastorno generalizado del desarrollo, en un único diagnóstico de
          espectro autista. En lugar de subtipos usa niveles de apoyo: nivel 1
          (necesita apoyo), nivel 2 (necesita apoyo sustancial) y nivel 3
          (necesita apoyo muy sustancial), valorados por separado para la
          comunicación social y las conductas restringidas o repetitivas."
    causes:
        - El autismo es muy heredable (estimaciones de alrededor del 60–90 %).
          Intervienen cientos de genes, muchos de los cuales afectan la
          formación de sinapsis y el desarrollo cerebral. Alrededor del 10–20 %
          de los casos se vinculan a un cambio genético identificable, como el
          síndrome del X frágil, la esclerosis tuberosa o variaciones concretas
          en el número de copias.
        - Los factores asociados con una probabilidad algo mayor incluyen la
          edad avanzada de los padres, el nacimiento muy prematuro y algunas
          exposiciones prenatales como el valproato. Estudios muy amplios han
          demostrado que las vacunas no causan autismo. El estilo de crianza no
          causa autismo.
    treatment:
        - "No hay medicamento para el autismo en sí. El apoyo es
          individualizado: logopedia (incluidos sistemas de comunicación
          aumentativa y alternativa), terapia ocupacional para necesidades
          sensoriales y motoras, y enfoques del desarrollo o conductuales
          naturalistas en la primera infancia."
        - "Las adaptaciones prácticas marcan una gran diferencia: rutinas
          predecibles, horarios visuales, espacios tranquilos, auriculares que
          reducen el ruido, comunicación clara y directa y ajustes en el
          trabajo. Las condiciones asociadas, como la ansiedad, la depresión, el
          TDAH, la epilepsia y los problemas de sueño y digestivos, son
          frecuentes y se tratan por sí mismas. La risperidona y el aripiprazol
          están aprobados para la irritabilidad grave."
    course:
        El autismo dura toda la vida, pero las habilidades y las necesidades
        cambian con el tiempo, y muchas personas desarrollan buenas estrategias
        de afrontamiento. Los resultados varían mucho. Los adultos autistas
        tienen altas tasas de ansiedad, depresión y desempleo, en gran parte por
        falta de apoyo y aceptación, lo que hace importantes la adaptación y la
        comunidad.
    prevalence:
        Alrededor de 1 de cada 31 a 1 de cada 36 niños en la vigilancia reciente
        de EE. UU., y aproximadamente 1 de cada 100 en el mundo. Se diagnostica
        unas 3–4 veces más en niños que en niñas.
    fact:
        Se ha descrito un crecimiento cerebral excesivo en los primeros años de
        vida, sobre todo en la corteza frontal y temporal, en un subgrupo de
        niños autistas.
psych:tourette:
    name: Síndrome de Tourette
    short: Tourette
    aka:
        - síndrome de tourette
        - tourette
        - síndrome de gilles de la tourette
    summary:
        El síndrome de Tourette es un trastorno de tics en el que la persona
        tiene múltiples tics motores y al menos un tic vocal durante más de un
        año, con inicio antes de los 18 años.
    overview:
        - El síndrome de Tourette es el trastorno de tics más conocido. Se
          diagnostica cuando una persona ha tenido múltiples tics motores y al
          menos un tic vocal durante más de un año, con inicio antes de los 18
          años, sin que los cause una sustancia u otra afección médica. Los tics
          suelen empezar entre los 5 y 7 años y alcanzan su máxima intensidad
          hacia los 10–12.
        - "Los tics son movimientos o sonidos repentinos, rápidos y repetitivos.
          No son del todo voluntarios, pero tampoco completamente involuntarios:
          la mayoría de las personas sienten una urgencia creciente antes del
          tic y pueden suprimirlo brevemente, aunque cuesta esfuerzo y la
          urgencia aumenta. Los tics cambian con el tiempo, suben y bajan, y
          empeoran con el estrés, la excitación o el cansancio."
        - La mayoría de las personas con Tourette tienen además al menos otra
          condición, sobre todo TDAH, TOC, ansiedad o dificultades de
          aprendizaje, y a menudo estas causan más deterioro que los propios
          tics.
    brain:
        caudate:
            Forma parte del circuito que filtra los programas de movimiento no
            deseados. Un caudado más pequeño y una señal corticoestriatal
            anormal dejan "escapar" fragmentos de movimiento o sonido como tics;
            un menor volumen del caudado en la infancia se ha relacionado con
            tics más intensos después.
        sma:
            Prepara los movimientos autoiniciados. Se activa poco antes de cada
            tic y se cree que genera la urgencia premonitoria, la sensación de
            que hay que hacer algo.
        putamen:
            Almacena hábitos motores. Los tics se parecen a hábitos
            sobreaprendidos, lo que podría explicar por qué se arraigan y por
            qué ayuda la terapia basada en hábitos (CBIT).
        antinsula:
            Convierte las sensaciones corporales en sentimientos. Contribuye a
            la parte sensorial de la urgencia premonitoria, parecida a un picor
            o una presión.
        gp:
            Es la principal puerta de salida de los ganglios basales. La
            estimulación cerebral profunda aquí puede reducir los tics graves,
            lo que muestra que esta salida forma parte del circuito que genera
            los tics.
        thalamus:
            Transmite la salida de los ganglios basales de vuelta a la corteza.
            Algunos núcleos talámicos son otra diana de la estimulación cerebral
            profunda, y el circuito que pasa por el tálamo es lo que permite que
            los tics se repitan.
    symptoms:
        - "Tics motores simples: parpadeo, muecas, sacudidas de cabeza,
          encogerse de hombros"
        - "Tics motores complejos: tocar, saltar, imitar movimientos ajenos
          (ecopraxia)"
        - "Tics vocales simples: olfatear, carraspear, gruñir"
        - "Tics vocales complejos: palabras, frases, repetir a otros (ecolalia)
          o a uno mismo (palilalia)"
        - Coprolalia (palabras socialmente inapropiadas) en una minoría
        - Urgencia premonitoria antes de los tics y alivio después
        - Capacidad de suprimir los tics brevemente, a menudo seguida de un
          rebote
    diagnosis:
        El diagnóstico es clínico, basado en la observación de los tics y en la
        historia de su inicio y duración. Los vídeos grabados en casa ayudan
        porque los tics suelen suprimirse en la consulta. Se busca TDAH, TOC y
        ansiedad, y solo se piden pruebas si se sospecha otra causa. Los
        trastornos de tics solo motores o solo vocales se diagnostican como
        trastorno de tics motores o vocales persistente (crónico); los tics de
        menos de un año, como trastorno de tics provisional.
    causes:
        - El síndrome de Tourette es muy genético, con una heredabilidad
          estimada del 70–80 %, y en él intervienen muchos genes. Los factores
          de riesgo incluyen el sexo masculino (3–4 veces más frecuente), el
          tabaquismo materno, el estrés prenatal y el bajo peso al nacer. Un
          posible vínculo con la infección estreptocócica (PANDAS) sigue siendo
          controvertido.
    treatment:
        - Muchas personas solo necesitan información, tranquilidad y un colegio
          o trabajo comprensivo. La Intervención Conductual Integral para los
          Tics (CBIT) enseña a reconocer la urgencia premonitoria y a hacer una
          respuesta incompatible con el tic; reduce los tics tanto como muchos
          medicamentos.
        - "Cuando hace falta medicación: los agonistas alfa-2 (guanfacina,
          clonidina) suelen probarse primero, sobre todo si hay TDAH; los
          bloqueadores de dopamina como el aripiprazol, el haloperidol y la
          pimozida son más potentes pero tienen más efectos secundarios; los
          inhibidores de VMAT2 y las inyecciones de toxina botulínica ayudan a
          algunas personas. La estimulación cerebral profunda se reserva para
          casos adultos graves y resistentes al tratamiento."
    course:
        Los tics suelen alcanzar su máximo al inicio de la adolescencia. A
        comienzos de la edad adulta, alrededor de un tercio de las personas ya
        no tiene tics y otro tercio mejora mucho, aunque una minoría sigue
        teniendo tics importantes. El TDAH, el TOC y la ansiedad asociados a
        menudo necesitan atención continua.
    prevalence:
        Alrededor del 0,3–0,9 % de los niños en edad escolar; 3–4 veces más
        frecuente en niños que en niñas.
    fact:
        La coprolalia (decir palabrotas de forma involuntaria) es famosa, pero
        solo la presenta una minoría de las personas con Tourette,
        aproximadamente entre 1 de cada 10 y 1 de cada 5.
psych:dyslexia:
    name:
        Dislexia (trastorno específico del aprendizaje con dificultad en la
        lectura)
    short: Dislexia
    aka:
        - dislexia
        - trastorno específico del aprendizaje
    summary:
        La dislexia es un trastorno específico del aprendizaje que dificulta
        leer y escribir con precisión y fluidez pese a una enseñanza adecuada y
        una inteligencia normal.
    overview:
        - La dislexia es un trastorno específico del aprendizaje en el que la
          persona tiene dificultades persistentes para leer palabras con
          precisión y fluidez, decodificar y deletrear, a pesar de una
          inteligencia, una visión y una enseñanza adecuadas. Es el trastorno
          del aprendizaje más frecuente.
        - "El problema central en la mayoría de las personas es fonológico:
          dividir las palabras habladas en sus sonidos y vincular esos sonidos
          con letras. Como la lectura depende de esa correspondencia, las
          palabras deben descifrarse con esfuerzo en lugar de reconocerse
          automáticamente, lo que enlentece la lectura y consume la atención que
          se usaría para comprender."
        - La dislexia no es un problema de visión ni consiste en leer letras al
          revés, algo común en todos los lectores principiantes. Muchas personas
          con dislexia tienen un buen razonamiento, lenguaje oral y visión de
          conjunto, y la comprensión oral suele ser mucho mejor que la lectora.
    brain:
        supramarginal:
            Forma parte de la red temporoparietal izquierda que vincula letras
            con sonidos del habla. Está sistemáticamente hipoactiva durante la
            lectura en la dislexia, lo que coincide con la dificultad fonológica
            central para descifrar palabras.
        fusiform:
            Contiene el área de la forma visual de las palabras, que aprende a
            reconocer al instante las palabras conocidas. Responde débilmente en
            la dislexia porque las correspondencias letra-sonido nunca se
            automatizaron, así que incluso las palabras conocidas se leen
            despacio.
        broca:
            Sostiene el deletreo y la articulación de las palabras. A menudo
            está más activa en los lectores con dislexia, probablemente
            compensando con la subvocalización.
        angular:
            Conecta las palabras escritas con su significado. Unas conexiones
            más débiles con las áreas visuales y del lenguaje enlentecen la
            comprensión del texto escrito.
        cerebhemi:
            Ayuda a automatizar las habilidades. La teoría cerebelosa,
            discutida, propone que una menor automatización contribuye a una
            lectura lenta y costosa.
    symptoms:
        - Lectura lenta, costosa e imprecisa
        - Dificultad para descifrar palabras desconocidas
        - Errores ortográficos persistentes
        - Dificultad con las rimas y para dividir palabras en sonidos en la
          primera infancia
        - Dificultad para aprender los nombres y sonidos de las letras
        - Evitar leer en voz alta
        - Comprensión oral mejor que la comprensión lectora
    diagnosis:
        La evaluación de un psicólogo educativo o especialista mide la
        conciencia fonológica, la decodificación de palabras reales e
        inventadas, la fluidez lectora, la ortografía y la comprensión, y las
        compara con el lenguaje oral y el razonamiento. El diagnóstico requiere
        dificultades que persistan al menos seis meses pese a una ayuda
        específica. El cribado temprano en educación infantil y primer curso
        permite intervenir antes de que el niño se quede atrás.
    causes:
        - "La dislexia es muy familiar: un niño con un progenitor afectado tiene
          un riesgo mucho mayor. La heredabilidad es de aproximadamente el 40–70
          % e intervienen muchos genes que afectan el desarrollo cerebral
          temprano. Los retrasos tempranos del habla y el lenguaje son una señal
          de alerta."
    treatment:
        - La intervención más eficaz es la enseñanza explícita, sistemática y
          multisensorial de la fonética y la conciencia fonológica, a menudo
          llamada alfabetización estructurada (por ejemplo, programas basados en
          Orton-Gillingham). Empezar pronto (de infantil a segundo de primaria)
          da los mejores resultados, pero los estudiantes mayores y los adultos
          también mejoran.
        - "Las adaptaciones equilibran las condiciones: tiempo extra,
          audiolibros y lectura en voz sintética, dictado por voz para escribir
          y menos penalización por la ortografía. Los estudios de neuroimagen
          muestran que una intervención lectora exitosa aumenta la actividad en
          la red lectora temporoparietal y fusiforme izquierda."
    course:
        La dislexia dura toda la vida, pero con una buena enseñanza la mayoría
        aprende a leer con precisión, aunque la lectura puede seguir siendo más
        lenta de lo habitual. La identificación temprana reduce el riesgo de
        baja autoestima y rechazo escolar que suelen seguir a años de
        dificultades.
    prevalence:
        Las estimaciones van del 5 % al 10 %, según la definición utilizada.
psych:schizophrenia:
    name: Esquizofrenia
    short: Esquizofrenia
    aka:
        - esquizofrenia
    summary:
        La esquizofrenia es una enfermedad mental grave que afecta cómo una
        persona piensa, percibe y vive la realidad.
    overview:
        - La esquizofrenia es una enfermedad mental grave que afecta la
          percepción, el pensamiento, la motivación y el sentido de lo que es
          real. Suele comenzar entre el final de la adolescencia y los primeros
          años de la treintena, a menudo tras una fase prodrómica de meses o
          años con aislamiento social, bajo rendimiento e ideas inusuales.
        - "Los síntomas se agrupan en tres tipos. Los síntomas positivos son
          experiencias que se añaden a la vida normal, como alucinaciones,
          delirios y pensamiento desorganizado. Los negativos son pérdidas:
          menos motivación, placer, habla y expresión emocional. Los cognitivos
          incluyen problemas de atención, memoria de trabajo y planificación.
          Los síntomas negativos y cognitivos suelen afectar más la vida diaria
          y responden menos a la medicación."
        - La esquizofrenia no es "personalidad dividida", y la mayoría de las
          personas que la tienen no son violentas; tienen muchas más
          probabilidades de ser víctimas de violencia. Con un tratamiento
          temprano y constante y apoyo, muchas personas tienen largos periodos
          de recuperación, trabajan y mantienen sus relaciones.
    brain:
        caudate:
            El estriado asociativo, sobre todo en el caudado, recibe demasiada
            dopamina en la psicosis. Se cree que esto hace que sucesos
            corrientes parezcan extrañamente significativos ("saliencia
            aberrante"), y los delirios surgen como explicaciones de esas
            experiencias. Los antipsicóticos actúan sobre todo bloqueando aquí
            los receptores D2 de dopamina.
        dlpfc:
            "Mantiene y manipula información en la memoria de trabajo. Está
            hipoactiva durante tareas exigentes (hipofrontalidad), en parte por
            una señal de dopamina demasiado baja en la corteza, lo que produce
            los síntomas cognitivos: dificultad para concentrarse, planificar y
            seguir conversaciones."
        hippocampus:
            La hiperactividad en CA1 suele aparecer temprano y podría impulsar
            el exceso de liberación de dopamina en el estriado. También se
            reduce a lo largo de la enfermedad, en relación con los problemas de
            memoria.
        stg:
            Procesa los sonidos del habla. La menor sustancia gris y la
            actividad espontánea aquí durante las alucinaciones sugieren que el
            cerebro atribuye su propio habla interna a una voz externa.
        latvent:
            Los ventrículos agrandados están entre los hallazgos replicados más
            antiguos. Reflejan una menor cantidad de tejido cerebral alrededor
            más que una causa de los síntomas.
        mdthal:
            Transmite y sincroniza la información con la corteza prefrontal. Una
            menor conectividad talamocortical podría alterar el filtrado de la
            información sensorial y el pensamiento organizado.
        vta:
            Es la fuente de dopamina de las vías mesolímbica y mesocortical,
            cuyo desequilibrio subyace a los síntomas positivos y negativos.
        acc:
            Vigila los conflictos y los errores. Su menor actividad se relaciona
            con la dificultad para reconocer que las propias percepciones o
            creencias podrían estar equivocadas.
    symptoms:
        - Alucinaciones, sobre todo oír voces que comentan o conversan
        - Delirios, como creer que te vigilan, te siguen, te controlan o tienes
          poderes especiales
        - Habla desorganizada que salta de un tema a otro
        - Conducta desorganizada o inusual
        - Menor motivación y aislamiento social
        - Expresión facial y del habla aplanada
        - Menor capacidad de sentir placer (anhedonia)
        - Problemas de atención, memoria y planificación
        - Poca conciencia de estar enfermo
    diagnosis:
        El diagnóstico requiere al menos dos síntomas centrales (delirios,
        alucinaciones, habla desorganizada, conducta muy desorganizada o
        catatónica, o síntomas negativos) durante una parte importante de un
        mes, siendo al menos uno delirios, alucinaciones o habla desorganizada,
        y signos continuos de enfermedad durante al menos seis meses. Se
        descartan la psicosis inducida por sustancias, los trastornos del estado
        de ánimo con síntomas psicóticos y causas médicas como tumores
        cerebrales, encefalitis autoinmune y enfermedad tiroidea, a menudo con
        análisis de sangre y neuroimagen.
    types:
        - El DSM-5 eliminó los antiguos subtipos (paranoide, desorganizado,
          catatónico, indiferenciado) por ser poco fiables. Los diagnósticos
          relacionados del espectro incluyen el trastorno psicótico breve (menos
          de un mes), el trastorno esquizofreniforme (de uno a seis meses), el
          trastorno esquizoafectivo y el trastorno delirante.
    causes:
        - La esquizofrenia es muy heredable, alrededor del 80 %. Una persona con
          un gemelo idéntico afectado tiene un riesgo de aproximadamente el
          40–50 %, frente a menos del 1 % en la población general. Cientos de
          variantes comunes añaden pequeños riesgos, y variantes raras, como la
          deleción 22q11.2, añaden riesgos grandes.
        - "Los factores ambientales incluyen complicaciones del embarazo y el
          parto, infección o desnutrición prenatal, adversidad infantil,
          migración y crianza urbana, y el consumo intenso de cannabis de alta
          potencia en la adolescencia. El modelo principal es del
          neurodesarrollo: una vulnerabilidad temprana combinada con cambios
          durante la maduración cerebral adolescente, incluida una poda
          sináptica excesiva."
    treatment:
        - La medicación antipsicótica es la base del tratamiento y reduce los
          síntomas positivos y el riesgo de recaída. La clozapina es la opción
          más eficaz para la enfermedad resistente al tratamiento, que afecta a
          alrededor de un tercio de las personas. Las formas inyectables de
          acción prolongada ayudan a quienes tienen dificultades con las
          pastillas diarias.
        - "La atención especializada coordinada para el primer episodio
          psicótico combina medicación, TCC para la psicosis, psicoeducación
          familiar, apoyo para el empleo y los estudios y gestión de casos, y
          mejora los resultados. La rehabilitación cognitiva, el entrenamiento
          en habilidades sociales y el apoyo entre pares ayudan con los síntomas
          negativos y cognitivos. La salud física importa: la esperanza de vida
          se reduce entre 10 y 20 años, sobre todo por enfermedades cardiacas y
          tabaquismo."
    course:
        La evolución varía. Aproximadamente una cuarta parte de las personas se
        recupera bien, alrededor de la mitad tiene síntomas continuos con
        periodos de mejoría y recaída, y otras tienen una discapacidad
        persistente. Un tratamiento más temprano, un buen apoyo y la continuidad
        del tratamiento predicen mejores resultados.
    prevalence:
        Alrededor del 0,3–0,7 % de las personas a lo largo de la vida, algo más
        frecuente y más temprana en los hombres.
    fact:
        Muchas personas viven bien con esquizofrenia; el tratamiento temprano de
        un primer episodio se asocia con mejores resultados a largo plazo.
psych:schizoaffective:
    name: Trastorno esquizoafectivo
    short: Esquizoafectivo
    aka:
        - trastorno esquizoafectivo
        - esquizoafectivo
    summary:
        El trastorno esquizoafectivo combina síntomas de la esquizofrenia, como
        alucinaciones o delirios, con episodios afectivos mayores de depresión o
        manía.
    overview:
        - El trastorno esquizoafectivo combina síntomas de la esquizofrenia,
          como alucinaciones o delirios, con episodios afectivos mayores de
          depresión o manía. Para el diagnóstico, los síntomas psicóticos
          también deben darse durante al menos dos semanas sin un episodio
          afectivo, y los episodios afectivos deben estar presentes durante la
          mayor parte de la enfermedad.
        - Se sitúa entre la esquizofrenia y el trastorno bipolar, comparte con
          ambos riesgo genético y características, y el diagnóstico puede
          cambiar con el tiempo. Los resultados suelen ser algo mejores que en
          la esquizofrenia, pero peores que en los trastornos del estado de
          ánimo con psicosis.
    brain:
        dlpfc:
            Muestra la misma menor actividad de memoria de trabajo que en la
            esquizofrenia, lo que contribuye a los síntomas cognitivos.
        hippocampus:
            Las reducciones de volumen similares a las de la esquizofrenia y el
            trastorno bipolar podrían contribuir a los problemas de memoria y a
            la desregulación de la dopamina que impulsa la psicosis.
        amygdala:
            Una reactividad emocional alterada, como en los trastornos del
            estado de ánimo, podría contribuir a los episodios afectivos
            intensos.
        latvent:
            El ligero agrandamiento refleja una menor cantidad de tejido
            cerebral alrededor, como en la esquizofrenia.
    symptoms:
        - Alucinaciones o delirios
        - "Episodios depresivos mayores: ánimo bajo, desesperanza, poca energía"
        - "Episodios maníacos (tipo bipolar): ánimo elevado o irritable, menos
          sueño, pensamientos acelerados"
        - Pensamiento desorganizado
        - Deterioro social y laboral
    diagnosis:
        El diagnóstico depende de una cuidadosa cronología de los síntomas
        psicóticos y afectivos a lo largo de toda la enfermedad, y a menudo
        requiere observación longitudinal y registros. Se descartan causas
        médicas y relacionadas con sustancias.
    types:
        - "Tipo bipolar: incluye episodios maníacos, con o sin depresión."
        - "Tipo depresivo: solo episodios depresivos mayores."
    causes:
        - El riesgo genético se solapa con la esquizofrenia y el trastorno
          bipolar. Los factores de estrés ambientales y el consumo de sustancias
          pueden desencadenar episodios.
    treatment:
        - El tratamiento combina un antipsicótico (la paliperidona está aprobada
          por la FDA específicamente para esta afección) con un estabilizador
          del ánimo en el tipo bipolar o un antidepresivo en el tipo depresivo.
          La psicoterapia, la psicoeducación familiar, la gestión de casos y el
          apoyo laboral ayudan a la recuperación a largo plazo.
    course:
        Suele ser de larga duración, con episodios de psicosis y alteración del
        ánimo. Los resultados suelen ser intermedios entre la esquizofrenia y el
        trastorno bipolar, y muchas personas logran un funcionamiento estable
        con tratamiento.
    prevalence: Alrededor del 0,3 % de las personas a lo largo de la vida.
psych:delusional:
    name: Trastorno delirante
    short: Trastorno delirante
    aka:
        - trastorno delirante
    summary:
        El trastorno delirante consiste en una o más creencias falsas firmemente
        sostenidas durante al menos un mes, sin los demás síntomas principales
        de la esquizofrenia.
    overview:
        - El trastorno delirante consiste en una o más creencias falsas y fijas
          que duran al menos un mes, sin los demás síntomas principales de la
          esquizofrenia, como alucinaciones destacadas o habla desorganizada.
          Fuera del delirio y sus consecuencias, las personas a menudo funcionan
          sorprendentemente bien y pueden parecer completamente corrientes.
        - Los delirios suelen sonar plausibles (no extraños), como que te
          siguen, que tu pareja te engaña o que tienes una enfermedad grave, lo
          que puede dificultar reconocerlos. Las personas rara vez ven la
          creencia como un síntoma y suelen llegar a consulta por conflictos,
          problemas legales o visitas médicas repetidas.
    brain:
        dlpfc:
            Evalúa las creencias frente a la evidencia. La investigación sugiere
            un estilo de razonamiento de "saltar a conclusiones" y una
            actualización más débil de las creencias, lo que podría permitir que
            una sospecha inicial se convierta en certeza (estudios limitados).
        caudate:
            Como en otras psicosis, el exceso de dopamina estriatal podría hacer
            que ciertos sucesos parezcan inusualmente significativos, algo que
            el delirio luego explica (propuesto).
        acc:
            Vigila la información contradictoria. Una menor vigilancia del
            conflicto podría facilitar descartar la evidencia contra la creencia
            (evidencia limitada).
    symptoms:
        - Una creencia persistente y fija que no cambia ante la evidencia
        - Conducta coherente con la creencia, como investigar a la pareja o
          contactar a las autoridades
        - Irritabilidad o ánimo bajo relacionados con la creencia
        - Pocas o ninguna alucinación
        - Funcionamiento por lo demás conservado
    diagnosis:
        Se confirma que la creencia ha durado al menos un mes, se descartan la
        esquizofrenia, los trastornos del estado de ánimo con psicosis, la
        demencia y el consumo de sustancias, y se evalúa el riesgo relacionado
        con la creencia.
    types:
        - "Persecutorio: creer que conspiran contra uno o le hacen daño (el más
          frecuente)."
        - "Celotípico: la pareja es infiel."
        - "Erotomaníaco: alguien, a menudo de mayor estatus, está enamorado de
          la persona."
        - "Grandioso: tener un gran talento, conocimiento o una relación
          especial."
        - "Somático: tener un defecto corporal o una enfermedad."
        - Mixto o no especificado.
    causes:
        - Las causas no se conocen bien. Los factores de riesgo incluyen
          antecedentes familiares de trastornos psicóticos o rasgos paranoides,
          el aislamiento social, la inmigración, la pérdida auditiva y los
          acontecimientos estresantes.
    treatment:
        - Lo primero es construir una relación de confianza, ya que confrontar
          directamente la creencia suele ser contraproducente. La medicación
          antipsicótica ayuda a muchas personas, y la TCC puede explorar con
          delicadeza la evidencia y reducir el malestar y la preocupación.
    course:
        "La evolución varía: algunas personas se recuperan por completo y otras
        tienen un curso crónico con fluctuaciones. El funcionamiento suele
        conservarse mejor que en la esquizofrenia."
    prevalence: Alrededor del 0,2 % de las personas a lo largo de la vida.
psych:bipolar:
    name: Trastorno bipolar
    short: Trastorno bipolar
    aka:
        - trastorno bipolar
        - bipolar i
        - bipolar ii
        - bipolar
        - psicosis maniaco-depresiva
    summary:
        El trastorno bipolar causa cambios extremos en el estado de ánimo, la
        energía y la actividad.
    overview:
        - El trastorno bipolar causa episodios de ánimo y energía anormalmente
          elevados o irritables (manía o hipomanía) y, en la mayoría de las
          personas, episodios de depresión mayor. Entre episodios, muchas
          personas vuelven a su estado habitual, aunque algunas tienen síntomas
          leves persistentes.
        - "La manía es más que estar de buen humor: implica un aumento marcado
          de la energía y la actividad con menos necesidad de dormir,
          pensamientos acelerados, habla rápida, exceso de confianza y
          decisiones arriesgadas que pueden dañar las finanzas, las relaciones y
          la salud. La manía grave puede incluir psicosis y suele requerir
          hospitalización. Los episodios depresivos suelen ser más largos y son
          la principal fuente de discapacidad."
        - El trastorno bipolar suele empezar al final de la adolescencia o en
          los veinte. A menudo se diagnostica al principio como depresión,
          porque las personas suelen pedir ayuda cuando están deprimidas, y esto
          importa porque los antidepresivos solos pueden desencadenar manía.
    brain:
        amygdala:
            Detecta el significado emocional. Está hiperreactiva a los estímulos
            emocionales tanto en la manía como en la depresión, lo que amplifica
            las respuestas emocionales y dificulta mantener el ánimo estable.
        vlpfc:
            Regula la emoción de forma descendente. Su menor actividad debilita
            el control sobre la amígdala, así que las reacciones emocionales se
            desbordan, sobre todo durante los episodios.
        acc:
            La CCA subgenual regula el ánimo y vincula la emoción con el cuerpo.
            Se encuentran menor volumen y actividad alterada tanto en el
            trastorno bipolar como en la depresión, en relación con los cambios
            de ánimo y los episodios depresivos.
        nacc:
            Impulsa la búsqueda de recompensas. Se cree que una mayor
            sensibilidad a la recompensa contribuye a la conducta orientada a
            metas y arriesgada de la manía; puede aumentar antes de los
            episodios.
        hippocampus:
            Las reducciones de volumen se relacionan con problemas de memoria;
            el tratamiento con litio se asocia con un mayor volumen del
            hipocampo, posiblemente por efectos neuroprotectores.
        callosum:
            La sustancia blanca que conecta los hemisferios muestra menor
            integridad, lo que podría alterar la coordinación entre las redes de
            emoción y regulación.
    symptoms:
        - "Manía: ánimo elevado, expansivo o irritable durante al menos una
          semana"
        - Necesidad de dormir mucho menor sin sentirse cansado
        - Pensamientos acelerados, habla rápida y apremiante, saltos entre ideas
        - Grandiosidad y autoestima exagerada
        - "Conducta arriesgada: gastos excesivos, conducción temeraria,
          decisiones impulsivas"
        - "Hipomanía: los mismos rasgos, más leves y breves (al menos 4 días),
          sin deterioro grave"
        - "Depresión: ánimo bajo, pérdida de interés, cansancio, desesperanza,
          cambios en el sueño y el apetito"
        - Síntomas psicóticos en los episodios graves
    diagnosis:
        El diagnóstico se basa en una historia cuidadosa de los episodios
        afectivos, a menudo con información de la familia, ya que la persona
        puede no reconocer la hipomanía. Los registros del estado de ánimo
        ayudan. Se descartan la enfermedad tiroidea, los cambios de ánimo
        inducidos por sustancias y medicamentos como los corticoides. El bipolar
        I requiere al menos un episodio maníaco; el bipolar II requiere al menos
        un episodio hipomaníaco y uno depresivo mayor, sin manía completa.
    types:
        - "Trastorno bipolar I: al menos un episodio maníaco; los episodios
          depresivos son frecuentes pero no obligatorios."
        - "Trastorno bipolar II: episodios hipomaníacos y depresivos mayores,
          nunca manía completa. No es un trastorno más leve: a menudo predomina
          la depresión."
        - "Trastorno ciclotímico: síntomas hipomaníacos y depresivos fluctuantes
          y crónicos por debajo del umbral de episodios completos."
        - Los especificadores incluyen ciclos rápidos (cuatro o más episodios al
          año), características mixtas y patrón estacional.
    causes:
        - El trastorno bipolar está entre los trastornos psiquiátricos más
          heredables (alrededor del 60–85 %), con solapamiento genético con la
          esquizofrenia y la depresión. Los desencadenantes incluyen la
          alteración del sueño y el trabajo por turnos, los acontecimientos
          estresantes, el consumo de sustancias, el parto y los antidepresivos
          usados sin un estabilizador del ánimo.
    treatment:
        - Los estabilizadores del ánimo son la base. El litio es el tratamiento
          de referencia y reduce tanto la manía como el riesgo de suicidio; el
          valproato y la carbamazepina tratan la manía; la lamotrigina previene
          los episodios depresivos. Varios antipsicóticos (como quetiapina,
          lurasidona, cariprazina y olanzapina) tratan la manía o la depresión
          bipolar.
        - La psicoterapia (TCC, terapia centrada en la familia, terapia
          interpersonal y de ritmo social) y la psicoeducación reducen las
          recaídas. Proteger el sueño y mantener una rutina diaria regular son
          potentes herramientas preventivas. El litio y el valproato requieren
          controles en sangre, y el valproato conlleva riesgos graves durante el
          embarazo.
    course:
        El trastorno bipolar suele durar toda la vida, pero es muy tratable. Sin
        tratamiento, los episodios tienden a ser más frecuentes. Muchas personas
        llevan una vida plena con un tratamiento constante y reconociendo pronto
        señales de alerta como dormir menos.
    prevalence: Alrededor del 1–2,5 % de las personas a lo largo de la vida.
    fact:
        El litio se usa desde 1949, cuando el psiquiatra australiano John Cade
        describió su efecto sobre la manía.
psych:cyclothymia:
    name: Trastorno ciclotímico
    short: Ciclotimia
    aka:
        - trastorno ciclotímico
        - ciclotimia
    summary:
        El trastorno ciclotímico consiste en al menos dos años de muchos
        periodos de síntomas hipomaníacos y depresivos que no alcanzan la
        gravedad de episodios completos.
    overview:
        - El trastorno ciclotímico consiste en al menos dos años (uno en niños y
          adolescentes) de frecuentes periodos de síntomas hipomaníacos y
          depresivos que nunca cumplen criterios de episodios completos, sin más
          de dos meses seguidos sin síntomas.
        - Como los altibajos son más leves, las personas pueden verlos como
          parte de la personalidad ("cambiante", "impredecible") y no como un
          trastorno, pero la inestabilidad constante puede tensar las relaciones
          y el trabajo. Entre el 15 % y el 50 % de las personas desarrollan más
          tarde un trastorno bipolar I o II.
    brain:
        amygdala:
            Una sobrerreactividad emocional similar a la del trastorno bipolar
            podría impulsar los frecuentes cambios de ánimo (investigación
            directa limitada).
        vlpfc:
            Se propone que una regulación descendente más débil permite que el
            ánimo oscile con más facilidad.
    symptoms:
        - Cambios frecuentes entre estados de ánimo elevados y bajos
        - Periodos de mucha energía, confianza y menos necesidad de dormir
        - Periodos de ánimo bajo, poca energía y pesimismo
        - Irritabilidad
        - Rara vez más de dos meses sin síntomas
    diagnosis:
        Se diagnostica a partir de una historia prolongada de síntomas, a menudo
        con registros del estado de ánimo, tras descartar episodios afectivos
        completos, sustancias y causas médicas.
    causes:
        - Los fuertes vínculos familiares con el trastorno bipolar sugieren un
          riesgo genético compartido.
    treatment:
        - La psicoterapia, el registro del estado de ánimo y unas rutinas y un
          sueño regulares son lo que más ayuda. Pueden usarse estabilizadores
          del ánimo, y los antidepresivos solos se usan con cautela porque
          pueden desencadenar hipomanía.
    course:
        Suele ser crónico, empieza en la adolescencia o el inicio de la edad
        adulta y conlleva un riesgo importante de evolucionar a trastorno
        bipolar I o II.
    prevalence: Alrededor del 0,4–1 % de las personas a lo largo de la vida.
psych:mdd:
    name: Trastorno depresivo mayor
    short: Depresión
    aka:
        - trastorno depresivo mayor
        - depresión mayor
        - depresión
        - depresión clínica
        - tdm
    summary:
        El trastorno depresivo mayor es un trastorno del estado de ánimo
        frecuente, grave y tratable.
    overview:
        - El trastorno depresivo mayor es un trastorno del estado de ánimo
          frecuente, grave y tratable. Se diagnostica cuando, durante al menos
          dos semanas, una persona tiene ánimo deprimido o pérdida de interés y
          placer la mayor parte del día, casi todos los días, junto con otros
          síntomas que afectan el sueño, el apetito, la energía, la
          concentración, la autoestima y los pensamientos sobre la muerte.
        - "La depresión es una enfermedad de todo el cuerpo. Cambia cómo el
          cerebro procesa la recompensa, la amenaza y la memoria, altera las
          hormonas del estrés, el sueño y la inflamación, y enlentece el
          pensamiento y el movimiento. No es lo mismo que la tristeza común, ni
          es signo de debilidad: las personas no pueden simplemente decidir
          salir de ella."
        - Es una de las principales causas de discapacidad en el mundo. Los
          episodios pueden ser únicos o recurrentes, y cuantos más episodios
          tiene una persona, mayor es el riesgo de otro, por lo que continuar el
          tratamiento tras la recuperación es importante.
    brain:
        acc:
            La CCA subgenual vincula la emoción con las respuestas corporales y
            de estrés. Está hiperactiva en la depresión y se normaliza con un
            tratamiento eficaz; ha sido diana de la estimulación cerebral
            profunda en la depresión resistente. Su hiperactividad se relaciona
            con la tristeza persistente y la atención negativa centrada en uno
            mismo.
        dlpfc:
            Aporta control cognitivo sobre la emoción. Está hipoactiva, sobre
            todo en el lado izquierdo, lo que debilita la capacidad de apartar
            la atención de los pensamientos negativos y contribuye a la mala
            concentración y la indecisión. La EMT se dirige a ella.
        amygdala:
            Detecta la amenaza emocional. Reacciona en exceso a caras y palabras
            negativas y tarda en calmarse, sesgando la percepción y la memoria
            hacia lo negativo; los antidepresivos reducen este sesgo al
            principio del tratamiento.
        hippocampus:
            Forma recuerdos y ayuda a apagar la respuesta al estrés. Su menor
            volumen se relaciona con la depresión recurrente o crónica,
            probablemente en parte por la exposición prolongada a hormonas del
            estrés; esto podría contribuir a los problemas de memoria y a una
            peor regulación del estrés.
        nacc:
            "Impulsa la anticipación de la recompensa. Sus respuestas atenuadas
            ayudan a explicar la anhedonia: las actividades dejan de parecer
            valiosas."
        pvn:
            Inicia la cascada de hormonas del estrés. Es frecuente un eje HHA
            hiperactivo con cortisol alto, sobre todo en la depresión grave, que
            con el tiempo podría dañar el hipocampo.
        raphe:
            Es la fuente de serotonina. La mayoría de los antidepresivos
            aumentan la señal de serotonina, aunque la depresión no es
            simplemente serotonina baja; los cambios posteriores en la
            plasticidad parecen más importantes.
        pcc:
            Es un nodo de la red neuronal por defecto. Su conectividad excesiva
            con la CCA subgenual se relaciona con la rumiación, darle vueltas
            repetidamente a los problemas.
    symptoms:
        - Ánimo deprimido la mayor parte del día, casi todos los días
        - Marcada disminución del interés o el placer (anhedonia)
        - Cambio importante del apetito o el peso
        - Insomnio o dormir demasiado
        - Enlentecimiento del movimiento y el habla, o agitación
        - Cansancio y pérdida de energía
        - Sentimientos de inutilidad o culpa excesiva
        - Dificultad para pensar, concentrarse o decidir
        - Pensamientos recurrentes de muerte o suicidio
    diagnosis:
        El diagnóstico requiere al menos cinco de nueve síntomas durante dos
        semanas, incluido el ánimo deprimido o la pérdida de interés, con
        malestar o deterioro importantes. Se usan entrevistas y herramientas de
        cribado como el PHQ-9, se pregunta por episodios maníacos o hipomaníacos
        previos para descartar un trastorno bipolar, se evalúa el riesgo de
        suicidio y se buscan factores médicos como enfermedad tiroidea, anemia,
        déficits vitamínicos y medicamentos.
    types:
        - "Los especificadores describen el patrón de un episodio: con ansiedad,
          con rasgos melancólicos (pérdida de placer en casi todo, despertar
          precoz, peor por la mañana), con rasgos atípicos (el ánimo mejora con
          buenas noticias, dormir en exceso, más apetito), con rasgos
          psicóticos, con inicio en el periparto (durante el embarazo o en las
          cuatro semanas tras el parto) y con patrón estacional."
    causes:
        - La depresión surge de factores que interactúan. La genética explica
          aproximadamente el 35–40 % del riesgo. Los acontecimientos vitales
          estresantes, sobre todo las pérdidas y humillaciones, la adversidad y
          el trauma infantil, las enfermedades crónicas, el dolor crónico, el
          aislamiento social, los cambios hormonales y algunos medicamentos
          aumentan el riesgo.
        - La explicación del "desequilibrio químico" se considera hoy demasiado
          simple. Los modelos actuales destacan circuitos cerebrales alterados,
          respuestas de estrés crónico, inflamación y menor neuroplasticidad;
          los antidepresivos probablemente actúan en parte restaurando la
          plasticidad a lo largo de semanas.
    treatment:
        - En la depresión leve a moderada, la psicoterapia (TCC, activación
          conductual, terapia interpersonal) y los antidepresivos son igual de
          eficaces; en la depresión más grave, la combinación funciona mejor.
          Los ISRS e IRSN suelen ser la primera opción; otros son bupropión,
          mirtazapina y vortioxetina. La medicación suele tardar 2–6 semanas en
          hacer efecto y se mantiene al menos 6–12 meses tras la recuperación.
        - "Para la depresión resistente: cambiar o potenciar la medicación (por
          ejemplo con litio o un antipsicótico atípico), la estimulación
          magnética transcraneal, la esketamina en aerosol nasal y la terapia
          electroconvulsiva, que es el tratamiento más eficaz para la depresión
          grave o psicótica. El ejercicio, el sueño regular y la conexión social
          apoyan la recuperación."
    course:
        La mayoría de los episodios mejoran con tratamiento en meses. Alrededor
        de la mitad de quienes tienen un episodio tendrán otro, y el riesgo
        aumenta con cada episodio, pero el tratamiento de mantenimiento y las
        habilidades aprendidas en terapia reducen mucho las recaídas. Quien
        tenga pensamientos de suicidio debe buscar ayuda de inmediato.
    prevalence:
        Alrededor del 5 % de los adultos en el mundo en un año dado; casi 1 de
        cada 5 adultos en EE. UU. a lo largo de la vida. Unas dos veces más
        frecuente en mujeres.
    fact:
        Si tú o alguien que conoces lo está pasando mal, un médico, un
        orientador o una línea de crisis local pueden ayudar. En EE. UU. puedes
        llamar o enviar un mensaje de texto al 988, que también atiende en
        español.
psych:pdd:
    name: Trastorno depresivo persistente
    short: Distimia
    aka:
        - trastorno depresivo persistente
        - distimia
    summary:
        El trastorno depresivo persistente, antes llamado distimia, es un ánimo
        deprimido de larga duración presente la mayoría de los días durante al
        menos dos años.
    overview:
        - El trastorno depresivo persistente, antes llamado distimia, es un
          ánimo deprimido presente la mayoría de los días durante al menos dos
          años (uno en jóvenes), con al menos otros dos síntomas depresivos. Los
          síntomas pueden ser más leves que en la depresión mayor, pero su
          persistencia los hace muy discapacitantes, y muchas personas llegan a
          ver el ánimo bajo como parte de quiénes son.
        - Pueden aparecer episodios depresivos mayores encima, lo que a veces se
          llama "doble depresión". Como a menudo empieza en la infancia o la
          adolescencia, puede moldear la personalidad, las relaciones y las
          decisiones profesionales.
    brain:
        amygdala:
            Una mayor reactividad a la emoción negativa mantiene al cerebro
            orientado a la amenaza y la decepción a largo plazo.
        acc:
            Una actividad alterada similar a la de la depresión mayor se
            relaciona con el ánimo bajo persistente y la atención negativa
            centrada en uno mismo.
        dlpfc:
            Una menor regulación dificulta salir de los patrones de pensamiento
            negativo.
    symptoms:
        - Ánimo bajo la mayoría de los días durante años
        - Poca energía y cansancio
        - Baja autoestima
        - Mala concentración e indecisión
        - Desesperanza
        - Cambios en el apetito o el sueño
        - Sensación de que "así soy yo"
    diagnosis:
        "Se diagnostica por la historia: ánimo deprimido la mayor parte del día,
        más días que no, durante al menos dos años, nunca sin síntomas más de
        dos meses, con deterioro, tras descartar el trastorno bipolar y causas
        médicas."
    causes:
        - La genética, el estrés crónico, la adversidad temprana y el
          temperamento contribuyen, de forma similar a la depresión mayor. El
          inicio temprano es frecuente.
    treatment:
        - Combinar psicoterapia y antidepresivos suele funcionar mejor que
          cualquiera de los dos solos. La CBASP (Sistema de Psicoterapia de
          Análisis Cognitivo-Conductual) se desarrolló específicamente para la
          depresión crónica; la TCC y la terapia interpersonal también ayudan.
    course:
        Es crónico y a menudo de larga duración, pero el tratamiento puede
        llevar a la remisión y a veces revela a la persona por primera vez cómo
        puede ser su estado de ánimo habitual.
    prevalence: Alrededor del 2–3 % de los adultos a lo largo de la vida.
psych:pmdd:
    name: Trastorno disfórico premenstrual
    short: TDPM
    aka:
        - trastorno disfórico premenstrual
        - tdpm
    summary:
        El TDPM es una forma grave del síndrome premenstrual en la que los
        síntomas del estado de ánimo aparecen la semana previa a la menstruación
        y mejoran pocos días después de que empieza.
    overview:
        - El trastorno disfórico premenstrual es un trastorno del estado de
          ánimo grave y cíclico en el que los síntomas aparecen la semana previa
          a la menstruación, mejoran pocos días después de que empieza y son
          mínimos o nulos la semana siguiente. Es mucho más incapacitante que el
          síndrome premenstrual típico.
        - Los niveles hormonales en las personas con TDPM suelen ser normales.
          En cambio, el cerebro parece inusualmente sensible a las subidas y
          bajadas normales de estrógeno, progesterona y su metabolito
          neuroactivo alopregnanolona, que afecta la señal GABA.
    brain:
        amygdala:
            Se vuelve más reactiva en la fase lútea tardía, intensificando la
            irritabilidad, la ansiedad y las reacciones emocionales.
        hypothalamus:
            Coordina el ciclo menstrual y responde a las señales hormonales
            cíclicas, que en el TDPM desencadenan respuestas anímicas anormales.
        raphe:
            Aporta serotonina. El beneficio rápido de los ISRS, a veces en días,
            sugiere una sensibilidad alterada a la serotonina a lo largo del
            ciclo.
        dlpfc:
            Muestra una actividad alterada durante la regulación emocional en la
            fase lútea, lo que debilita el control del estado de ánimo.
    symptoms:
        - Cambios de humor marcados o tristeza repentina
        - Irritabilidad, enfado o conflictos
        - Ánimo deprimido o desesperanza
        - Ansiedad o tensión
        - Pérdida de interés, cansancio, dificultad para concentrarse
        - Cambios en el sueño y el apetito, antojos
        - Síntomas físicos como sensibilidad mamaria e hinchazón
    diagnosis:
        El diagnóstico requiere registros diarios de síntomas durante al menos
        dos ciclos que muestren el patrón cíclico, con al menos cinco síntomas,
        incluido uno afectivo central, que causen un deterioro importante.
    causes:
        - Una respuesta cerebral anormal a cambios hormonales normales, con
          contribuciones genéticas, posiblemente del complejo génico ESC/E(Z),
          que regula la respuesta a las hormonas sexuales.
    treatment:
        - Los ISRS son la primera opción y pueden funcionar tomados solo en la
          fase lútea. Algunos anticonceptivos hormonales que suprimen la
          ovulación (como los que contienen drospirenona) ayudan. La TCC, el
          ejercicio y la reducción del estrés apoyan el manejo. En casos graves
          se usan medicamentos que suprimen la función ovárica.
    course:
        Los síntomas continúan de forma cíclica hasta la menopausia, a veces
        empeorando en los últimos años reproductivos, pero el tratamiento es
        eficaz en la mayoría de las personas.
    prevalence: Alrededor del 3–8 % de las personas que menstrúan.
psych:sad:
    name: Depresión mayor con patrón estacional
    short: Depresión estacional
    aka:
        - trastorno afectivo estacional
        - depresión estacional
        - depresión invernal
    summary:
        A menudo llamada trastorno afectivo estacional, es una depresión mayor
        que vuelve en la misma época cada año, normalmente en otoño e invierno,
        y mejora en primavera.
    overview:
        - La depresión mayor con patrón estacional, a menudo llamada trastorno
          afectivo estacional, es una depresión que vuelve en la misma época del
          año, normalmente empieza en otoño o invierno y mejora en primavera,
          durante al menos dos años seguidos. También existe un patrón de verano
          menos frecuente.
        - Es más frecuente en latitudes altas, donde los días de invierno son
          cortos. La explicación principal es que la menor luz matinal desajusta
          el reloj interno del cuerpo respecto al sueño y la vida diaria.
    brain:
        scn:
            El reloj maestro se reajusta cada mañana con la luz. Con menos luz
            del día se retrasa respecto al sueño, desincronizando las hormonas,
            el estado de alerta y el ánimo.
        pineal:
            Libera melatonina en la oscuridad. El invierno puede alargar o
            desplazar su liberación, lo que contribuye a dormir en exceso y a la
            falta de energía.
        raphe:
            En algunos estudios, la actividad del transportador de serotonina en
            el cerebro aumenta en invierno, lo que reduciría la serotonina
            disponible y podría contribuir al ánimo bajo.
    symptoms:
        - Ánimo bajo que vuelve en los meses oscuros
        - Dormir en exceso y dificultad para despertar
        - Poca energía y pesadez
        - Antojos de carbohidratos y aumento de peso
        - Aislamiento social ("hibernar")
        - Mejoría en primavera y verano
    diagnosis:
        Requiere un patrón de episodios depresivos mayores ligados a una
        estación durante al menos dos años, con más episodios estacionales que
        no estacionales.
    causes:
        - La menor luz del día, la vulnerabilidad genética y vivir lejos del
          ecuador.
    treatment:
        - La terapia de luz brillante cada mañana, normalmente de 10 000 lux
          durante 20–30 minutos, es la primera opción y suele funcionar en una o
          dos semanas. La TCC adaptada a la depresión estacional tiene
          beneficios duraderos y los antidepresivos también ayudan; el bupropión
          iniciado antes del invierno puede prevenir los episodios.
    course:
        Los episodios tienden a repetirse cada año, pero pueden prevenirse o
        reducirse empezando el tratamiento antes de la fecha habitual de inicio.
    prevalence:
        Varía mucho según la latitud, desde alrededor del 1 % hasta más del 9 %
        en algunas regiones del norte.
psych:gad:
    name: Trastorno de ansiedad generalizada
    short: TAG
    aka:
        - trastorno de ansiedad generalizada
        - tag
        - ansiedad generalizada
    summary:
        El TAG es una preocupación excesiva y difícil de controlar por muchas
        cosas cotidianas, como la salud, el trabajo, la familia o el dinero, la
        mayoría de los días durante al menos seis meses, junto con síntomas
        físicos de tensión.
    overview:
        - El trastorno de ansiedad generalizada es una preocupación excesiva y
          difícil de controlar por muchos asuntos cotidianos, como la salud, el
          trabajo, el dinero, la familia o responsabilidades menores, presente
          más días sí que no durante al menos seis meses, junto con tensión
          física e inquietud.
        - "En el TAG la preocupación no suele centrarse en una amenaza concreta.
          Salta de un tema a otro y se alimenta de la dificultad para tolerar la
          incertidumbre: preocuparse se siente como prepararse o protegerse, lo
          que mantiene el hábito aunque resulte agotador. El cuerpo permanece en
          un estado de alarma de baja intensidad que produce tensión muscular,
          fatiga y mal sueño."
    brain:
        amygdala:
            Detecta posibles amenazas. En el TAG reacciona con más fuerza ante
            información ambigua o levemente negativa, de modo que las
            situaciones inciertas se registran como peligrosas y desencadenan
            preocupación.
        vlpfc:
            Regula la amígdala de arriba abajo. Un acoplamiento más débil entre
            las regiones prefrontales y la amígdala hace que las señales de
            alarma no se amortigüen, lo que permite que la ansiedad persista.
        acc:
            Vigila el conflicto y la amenaza. Su actividad alterada puede
            mantener la atención fija en posibles problemas y dificultar
            desengancharse de la preocupación.
        antinsula:
            Genera sensaciones a partir de las señales del cuerpo y predice la
            incertidumbre. Su mayor actividad amplifica la conciencia de la
            tensión y hace que la incertidumbre se sienta físicamente incómoda.
        bla:
            Aprende qué señales predicen peligro. En el TAG el aprendizaje del
            miedo se generaliza ampliamente, de modo que muchas situaciones
            quedan asociadas con la amenaza.
    symptoms:
        - Preocupación persistente, excesiva y difícil de controlar
        - Inquietud o sensación de estar en tensión
        - Fatigarse con facilidad
        - Dificultad para concentrarse o quedarse con la mente en blanco
        - Irritabilidad
        - Tensión muscular, dolores de cabeza, malestar estomacal
        - Problemas de sueño
        - Buscar tranquilización, prepararse en exceso o evitar la incertidumbre
    diagnosis:
        El diagnóstico requiere preocupación excesiva la mayoría de los días
        durante seis meses con al menos tres de seis síntomas físicos o
        cognitivos (uno en niños), que causen malestar o deterioro. Herramientas
        de cribado como el GAD-7 ayudan. Los clínicos descartan enfermedad
        tiroidea, efectos de la cafeína o de estimulantes y otros trastornos de
        ansiedad o del estado de ánimo.
    causes:
        - La genética explica alrededor del 30 % del riesgo y se solapa con la
          de la depresión. Contribuyen un temperamento con inhibición
          conductual, los acontecimientos vitales estresantes, la adversidad en
          la infancia y las creencias aprendidas de que preocuparse es útil.
    treatment:
        - "La TCC es muy eficaz: aborda la intolerancia a la incertidumbre, pone
          a prueba las creencias sobre la preocupación y utiliza la exposición a
          la incertidumbre y el aplazamiento de la preocupación. La relajación
          aplicada y los enfoques basados en mindfulness también ayudan."
        - Los ISRS (escitalopram, sertralina) y los IRSN (venlafaxina,
          duloxetina) son los medicamentos de primera línea; la buspirona y la
          pregabalina son alternativas. Las benzodiacepinas actúan rápido, pero
          en general se limitan a un uso breve por la tolerancia y la
          dependencia.
    course:
        El TAG tiende a ser crónico, con altibajos, y a menudo empeora con el
        estrés, pero la mayoría de las personas mejora de forma sustancial con
        tratamiento.
    prevalence:
        Alrededor del 3 % de los adultos en EE. UU. en un año dado y cerca del 6
        % a lo largo de la vida.
psych:panic:
    name: Trastorno de pánico
    short: Trastorno de pánico
    aka:
        - trastorno de pánico
        - ataques de pánico
        - ataque de pánico
        - crisis de angustia
        - trastorno de angustia
    summary:
        El trastorno de pánico consiste en ataques de pánico repetidos e
        inesperados, que son oleadas súbitas de miedo intenso con fuertes
        síntomas físicos que alcanzan su máximo en minutos, seguidos de
        preocupación continua por futuros ataques o de cambios de conducta para
        evitarlos.
    overview:
        - El trastorno de pánico consiste en ataques de pánico repetidos e
          inesperados, oleadas súbitas de miedo intenso que alcanzan su máximo
          en minutos, junto con al menos un mes de preocupación persistente por
          tener más ataques o de cambios de conducta para evitarlos.
        - 'Durante un ataque, el cuerpo pone en marcha una respuesta completa de
          lucha o huida sin una amenaza externa real: corazón acelerado, falta
          de aire, mareo, temblores y sensación de catástrofe inminente. Muchas
          personas acuden a urgencias creyendo que están sufriendo un infarto.
          El trastorno se mantiene por el "miedo al miedo": las propias
          sensaciones corporales se vuelven amenazantes, de modo que notar un
          latido rápido puede desencadenar el siguiente ataque.'
    brain:
        amygdala:
            Este centro del miedo dispara la respuesta de alarma. En el
            trastorno de pánico es muy sensible, así que un pequeño cambio
            interno puede desencadenar una reacción completa de lucha o huida.
        antinsula:
            Interpreta señales corporales como el latido y la respiración.
            Tiende a leer sensaciones normales como peligrosas, lo que
            constituye el núcleo del ciclo del miedo al miedo.
        lc:
            Libera noradrenalina por todo el cerebro. Sus ráfagas de actividad
            producen el corazón acelerado, la sudoración y la hiperalerta de un
            ataque.
        midbrain:
            La sustancia gris periacueductal coordina respuestas defensivas como
            la huida. Puede producir la necesidad urgente de escapar durante los
            ataques.
        hippocampus:
            Asocia el miedo con lugares y contextos, por eso las personas
            empiezan a evitar los sitios donde han tenido ataques.
        pvn:
            Inicia la liberación de hormonas del estrés, lo que contribuye al
            agotamiento posterior a los ataques.
    symptoms:
        - Corazón que late con fuerza o acelerado, dolor en el pecho
        - Falta de aire o sensación de ahogo
        - Temblores, sudoración, escalofríos o sofocos
        - Mareo, náuseas
        - Entumecimiento u hormigueo
        - Sensación de irrealidad o de estar desconectado
        - Miedo a perder el control, a volverse loco o a morir
        - Preocupación por futuros ataques y evitación de los desencadenantes
    diagnosis:
        Requiere ataques inesperados recurrentes más un mes de preocupación o
        evitación. Se descartan causas cardíacas, pulmonares, tiroideas y por
        sustancias, a menudo con un ECG y análisis de sangre.
    causes:
        - Vulnerabilidad genética, alta sensibilidad a la ansiedad,
          acontecimientos vitales estresantes y estimulantes como la cafeína.
          Los ataques suelen aparecer por primera vez durante un periodo de
          estrés.
    treatment:
        - La TCC es de primera línea y muy eficaz. Incluye educación sobre el
          ciclo del pánico, exposición interoceptiva (provocar deliberadamente
          sensaciones como un ritmo cardíaco rápido corriendo en el sitio o
          dando vueltas hasta que pierden su carácter amenazante) y exposición
          situacional. Los ISRS y los IRSN son los medicamentos de primera
          línea.
    course:
        Sin tratamiento, el trastorno de pánico a menudo se vuelve crónico y
        puede conducir a agorafobia y depresión. Con tratamiento, la mayoría de
        las personas logra una mejoría grande y duradera.
    prevalence: Alrededor del 2–3 % de los adultos en un año dado.
psych:socialanx:
    name: Trastorno de ansiedad social
    short: Ansiedad social
    aka:
        - trastorno de ansiedad social
        - ansiedad social
        - fobia social
        - tas
    summary:
        El trastorno de ansiedad social es un miedo intenso y persistente a
        situaciones sociales o de actuación en las que una persona podría ser
        juzgada, sentirse avergonzada o ser rechazada. El miedo es
        desproporcionado respecto a la situación y lleva a evitarla o a
        soportarla con gran malestar.
    overview:
        - El trastorno de ansiedad social es un miedo intenso y persistente a
          situaciones sociales o de actuación en las que una persona podría ser
          observada, juzgada o sentirse avergonzada. El miedo es
          desproporcionado respecto a la amenaza real y lleva a evitar las
          situaciones o a soportarlas con gran malestar.
        - Es más que timidez. Las personas pueden evitar hablar en clase, comer
          en público, hacer llamadas telefónicas o conocer gente nueva, lo que
          puede limitar los estudios, la carrera profesional y las relaciones.
          Las conductas de seguridad, como ensayar lo que se va a decir o evitar
          el contacto visual, se sienten protectoras, pero mantienen vivo el
          miedo y dirigen la atención hacia uno mismo.
    brain:
        amygdala:
            Reacciona con fuerza ante los rostros, sobre todo los críticos o
            enfadados, y ante la perspectiva de ser evaluado. Esta
            hiperreactividad hace que las situaciones sociales se perciban como
            amenazantes.
        antinsula:
            Aumenta la conciencia de los signos corporales de ansiedad, como el
            sonrojo o la voz temblorosa, que luego se convierten en fuente de
            miedo.
        dmpfc:
            Participa en pensar sobre uno mismo y en cómo nos ven los demás. Su
            hiperactividad se asocia con una autoobservación excesiva y con
            imaginar juicios negativos.
        acc:
            Procesa el dolor social, como el rechazo. Una mayor sensibilidad
            hace que la crítica percibida resulte especialmente dolorosa.
    symptoms:
        - Miedo a hablar, comer o actuar delante de otros
        - Miedo a que los demás noten el sonrojo, la sudoración o el temblor
        - Evitar situaciones sociales o soportarlas con angustia
        - Repasar y criticar las interacciones después
        - Síntomas físicos como corazón acelerado y náuseas
    diagnosis:
        Requiere un miedo marcado a situaciones sociales durante seis meses o
        más, que cause deterioro. Se aplica el especificador "solo de actuación"
        cuando el miedo se limita a hablar o actuar en público.
    causes:
        - Temperamento con inhibición conductual, genética y experiencias como
          el acoso escolar, la humillación o una crianza crítica.
    treatment:
        - La TCC con exposición a las situaciones sociales temidas y abandono de
          las conductas de seguridad es de primera línea, a menudo en grupo. Los
          ISRS y los IRSN son los medicamentos de primera línea. Los
          betabloqueantes pueden atenuar los síntomas físicos antes de
          actuaciones concretas.
    course:
        Suele comenzar en la adolescencia y puede ser crónico sin tratamiento,
        pero el tratamiento es eficaz.
    prevalence:
        Alrededor del 7 % de los adultos en EE. UU. en un año dado; a menudo
        comienza en la adolescencia.
psych:phobia:
    name: Fobia específica
    short: Fobia específica
    aka:
        - fobia específica
        - fobia
        - fobias
    summary:
        Una fobia específica es un miedo intenso e irracional a un objeto o
        situación concretos, como las alturas, las arañas, volar, las agujas o
        la sangre, que lleva a la evitación y al malestar.
    overview:
        - Una fobia específica es un miedo intenso y persistente a un objeto o
          situación concretos, como las alturas, los animales, volar, los
          espacios cerrados, las agujas o la sangre, que es desproporcionado
          respecto al peligro real y lleva a la evitación.
        - Las fobias son el trastorno de ansiedad más frecuente y uno de los más
          tratables. La mayoría de las personas sabe que su miedo es excesivo,
          pero saberlo no detiene la reacción, porque la respuesta de miedo la
          impulsan circuitos emocionales rápidos y no el razonamiento.
    brain:
        amygdala:
            Desencadena la respuesta de miedo inmediata al ver el objeto temido,
            a menudo antes del reconocimiento consciente.
        antinsula:
            Especialmente activa en las fobias que implican asco, como la de las
            arañas, y en las fobias a la sangre, las inyecciones y las heridas,
            en las que la reacción corporal incluye náuseas o desmayo.
        vmpfc:
            Almacena el aprendizaje de seguridad (extinción del miedo). Una
            extinción débil permite que el miedo persista pese a muchos
            encuentros seguros.
    symptoms:
        - Miedo o pánico inmediatos al enfrentarse al desencadenante
        - Evitar el desencadenante o soportarlo con ansiedad intensa
        - Ansiedad anticipatoria previa
        - Desmayo en la fobia a la sangre, las inyecciones y las heridas, por
          una caída brusca de la frecuencia cardíaca
    diagnosis:
        Requiere un miedo marcado y persistente durante seis meses que sea
        desproporcionado y cause malestar o evitación.
    types:
        - Animal (arañas, perros, serpientes).
        - Entorno natural (alturas, tormentas, agua).
        - Sangre-inyección-heridas.
        - Situacional (volar, ascensores, espacios cerrados).
        - Otras (atragantarse, vomitar, ruidos fuertes).
    causes:
        - Experiencias atemorizantes, ver a otros reaccionar con miedo, recibir
          información sobre amenazas y una predisposición evolutiva a temer
          ciertas cosas.
    treatment:
        - "La terapia de exposición es el tratamiento de elección: contacto
          gradual y repetido con el objeto temido hasta que el miedo disminuye.
          Para algunas fobias puede bastar una sola sesión prolongada. La
          exposición mediante realidad virtual es útil para el miedo a volar o a
          las alturas. Rara vez se necesita medicación."
    course:
        Las fobias suelen empezar en la infancia y pueden persistir durante
        décadas, pero la terapia de exposición produce una mejoría duradera en
        la mayoría de las personas.
    prevalence:
        Alrededor del 7–9 % de las personas en un año dado, lo que la convierte
        en el trastorno de ansiedad más frecuente.
psych:agoraphobia:
    name: Agorafobia
    short: Agorafobia
    aka:
        - agorafobia
    summary:
        La agorafobia es el miedo y la evitación de situaciones en las que
        escapar podría ser difícil o no haber ayuda disponible si aparecen
        síntomas de pánico o embarazosos, como el transporte público, las
        multitudes, los espacios abiertos o cerrados, o estar fuera de casa a
        solas.
    overview:
        - La agorafobia es el miedo y la evitación de situaciones en las que
          escapar podría ser difícil o no haber ayuda disponible si aparecen
          síntomas de pánico o embarazosos, como el transporte público, los
          espacios abiertos, las tiendas, las multitudes o estar fuera de casa a
          solas.
        - A menudo se desarrolla tras ataques de pánico, a medida que la persona
          evita cada vez más lugares asociados con ellos. En los casos graves,
          la persona puede llegar a ser incapaz de salir de casa.
    brain:
        amygdala:
            Unas respuestas de amenaza hiperactivas hacen que salir de los
            lugares seguros se perciba como peligroso.
        hippocampus:
            Asocia con fuerza el miedo a lugares y contextos, extendiendo la
            evitación a situaciones nuevas.
        antinsula:
            Una mayor conciencia corporal hace que las personas teman que los
            síntomas aparezcan en público.
    symptoms:
        - Miedo al transporte público, a los espacios abiertos o cerrados, a las
          filas o a las multitudes
        - Miedo a estar fuera de casa a solas
        - Necesitar compañía para salir
        - Una evitación que reduce progresivamente el mundo de la persona
    diagnosis:
        Requiere miedo en al menos dos de cinco tipos de situaciones durante
        seis meses, con evitación o necesidad de compañía. Puede diagnosticarse
        con o sin trastorno de pánico.
    causes:
        - Ataques de pánico, genética, temperamento ansioso y acontecimientos
          estresantes.
    treatment:
        - TCC con exposición gradual a las situaciones evitadas, a menudo
          apoyada con ISRS. Las visitas a domicilio guiadas por el terapeuta o
          las sesiones a distancia ayudan a las personas que no pueden salir de
          casa.
    course:
        Puede ser crónica sin tratamiento; el tratamiento basado en la
        exposición produce una mejoría sustancial.
    prevalence: Alrededor del 1–2 % de los adultos en un año dado.
psych:sepanx:
    name: Trastorno de ansiedad por separación
    short: Ansiedad por separación
    aka:
        - trastorno de ansiedad por separación
        - ansiedad por separación
        - angustia de separación
    summary:
        El trastorno de ansiedad por separación es un miedo o ansiedad excesivos
        ante la separación de las figuras de apego, más allá de lo esperado para
        la edad de la persona. Es más frecuente en niños, pero puede darse en
        adultos.
    overview:
        - El trastorno de ansiedad por separación es un miedo o ansiedad
          excesivos ante la separación de las figuras de apego, más allá de lo
          esperable para el nivel de desarrollo, que dura al menos cuatro
          semanas en niños y seis meses en adultos.
        - Cierta ansiedad por separación es normal en bebés y niños pequeños. El
          trastorno implica una preocupación persistente de que algo terrible
          les ocurra a los seres queridos o de que algún acontecimiento los
          separe, lo que conduce a rechazo escolar, dificultad para dormir solo
          y quejas físicas.
    brain:
        amygdala:
            Una respuesta de amenaza aumentada ante las señales de separación
            hace que estar lejos de los seres queridos se perciba como
            peligroso.
        vmpfc:
            Todavía en desarrollo durante la infancia, normalmente ayuda a
            calmar el miedo; una regulación inmadura contribuye a la dificultad
            para tranquilizarse a uno mismo.
    symptoms:
        - Malestar cuando se prevé o se produce una separación
        - Preocupación persistente por que les ocurra algo malo a los seres
          queridos
        - Negarse a ir a la escuela, al trabajo o a dormir fuera de casa
        - Pesadillas sobre la separación
        - Dolores de cabeza o de estómago antes de las separaciones
    diagnosis:
        Se basa en entrevistas con el niño y los padres, que confirman la
        duración, el deterioro y que el miedo supera lo esperable para el
        desarrollo.
    causes:
        - Temperamento ansioso, genética, acontecimientos estresantes como una
          pérdida o una mudanza y, a veces, patrones de sobreprotección.
    treatment:
        - TCC con práctica gradual de la separación y orientación a los padres.
          ISRS en los casos graves.
    course:
        Muchos niños mejoran, pero aumenta el riesgo de trastornos de ansiedad
        posteriores, sobre todo del trastorno de pánico.
    prevalence: Alrededor del 4 % de los niños y cerca del 1–2 % de los adultos.
psych:ocd:
    name: Trastorno obsesivo-compulsivo
    short: TOC
    aka:
        - trastorno obsesivo-compulsivo
        - toc
        - obsesiones
        - compulsiones
    summary:
        El TOC implica obsesiones, que son pensamientos, imágenes o impulsos
        intrusivos y no deseados que causan ansiedad, y compulsiones, que son
        conductas repetitivas o actos mentales que se realizan para reducir esa
        ansiedad o evitar un desenlace temido. El ciclo puede ocupar horas al
        día.
    overview:
        - El trastorno obsesivo-compulsivo implica obsesiones, que son
          pensamientos, imágenes o impulsos intrusivos y no deseados que causan
          ansiedad o asco intensos, y compulsiones, que son conductas
          repetitivas o actos mentales que se realizan para neutralizar ese
          malestar o evitar un desenlace temido.
        - Las compulsiones producen alivio a corto plazo, lo que enseña al
          cerebro que el ritual evitó la catástrofe, de modo que el ciclo se
          refuerza con el tiempo. El TOC puede consumir horas al día. La mayoría
          de las personas reconoce que sus pensamientos son excesivos, pero la
          sensación de que algo está mal o incompleto se impone a ese
          conocimiento.
        - Las obsesiones no son deseos ni anhelos. Las personas con TOC a menudo
          tienen pensamientos intrusivos sobre hacer daño a otros o sobre temas
          tabú precisamente porque esos pensamientos les resultan muy
          perturbadores.
    brain:
        ofc:
            Asigna valor y señala que algo va mal. En el TOC está hiperactiva,
            sobre todo ante los desencadenantes, y produce una falsa alarma
            persistente de que hay algo que arreglar.
        caudate:
            Normalmente filtra qué pensamientos y acciones pasan. La
            hiperactividad de los circuitos COF–caudado no logra apagar las
            señales de preocupación, así que las obsesiones siguen volviendo. Un
            tratamiento eficaz reduce la actividad del caudado.
        acc:
            Genera señales de error. Una señalización de error excesiva crea la
            sensación de que una acción no se hizo bien, lo que impulsa a
            comprobar y repetir.
        thalamus:
            Completa el circuito cortico-estriado-tálamo-cortical. La
            hiperactividad de este circuito mantiene en marcha el ciclo de
            obsesión y compulsión.
        putamen:
            Sostiene los hábitos. A medida que las compulsiones se repiten, el
            control se desplaza hacia los circuitos del hábito y los rituales se
            vuelven más automáticos.
    symptoms:
        - Miedo a la contaminación y lavado o limpieza
        - Dudas sobre causar daño o cometer errores y comprobaciones repetidas
        - Necesidad de simetría, orden o de sentir que algo está "justo bien"
        - Pensamientos tabú o violentos no deseados y rituales mentales
        - Contar, repetir, rezar o repasar
        - Búsqueda de tranquilización y evitación de los desencadenantes
    diagnosis:
        Requiere obsesiones, compulsiones o ambas que consuman mucho tiempo (más
        de una hora al día) o causen malestar o deterioro significativos. Los
        clínicos evalúan el grado de introspección, y la escala Y-BOCS mide la
        gravedad.
    types:
        - "Especificadores de introspección: introspección buena o aceptable,
          introspección pobre, y ausencia de introspección o creencias
          delirantes."
        - El TOC relacionado con tics es un especificador reconocido.
    causes:
        - El TOC es moderadamente heredable (alrededor del 40–50 %). Contribuyen
          diferencias en los circuitos cerebrales, acontecimientos vitales
          estresantes y, en algunos niños, un inicio brusco tras una infección
          (PANS/PANDAS, todavía en debate).
    treatment:
        - "La exposición con prevención de respuesta (EPR) es la terapia más
          eficaz: enfrentarse gradualmente a los desencadenantes mientras se
          resisten las compulsiones, para que el cerebro aprenda que la ansiedad
          disminuye por sí sola. Los ISRS, a menudo en dosis más altas que para
          la depresión, y la clomipramina son medicamentos eficaces; la
          potenciación con antipsicóticos en dosis bajas puede ayudar."
        - Para el TOC grave y resistente al tratamiento, las opciones incluyen
          la estimulación cerebral profunda, la EMT profunda (autorizada por la
          FDA para el TOC) y, rara vez, la cirugía lesional como la cingulotomía
          o la capsulotomía.
    course:
        Suele ser crónico con fluctuaciones, pero la mayoría de las personas
        mejora de forma sustancial con EPR, medicación o ambas.
    prevalence: Alrededor del 1–2 % de las personas a lo largo de la vida.
    fact:
        Se ha demostrado que un tratamiento eficaz, ya sea con EPR o con
        medicación, reduce la hiperactividad del caudado.
psych:bdd:
    name: Trastorno dismórfico corporal
    short: Trastorno dismórfico corporal
    aka:
        - trastorno dismórfico corporal
        - tdc
        - dismorfia corporal
        - dismorfofobia
        - vigorexia
        - dismorfia muscular
    summary:
        En el trastorno dismórfico corporal, una persona está preocupada por
        defectos percibidos en su apariencia que son leves o no visibles para
        los demás, y realiza conductas repetitivas como mirarse al espejo,
        arreglarse o buscar tranquilización.
    overview:
        - En el trastorno dismórfico corporal, una persona está preocupada por
          uno o más defectos percibidos en su apariencia que son leves o no
          visibles para los demás, y realiza conductas repetitivas como mirarse
          al espejo, arreglarse en exceso, pellizcarse la piel o buscar
          tranquilización.
        - El TDC causa un malestar grave y a menudo evitación social. Muchas
          personas recurren a procedimientos estéticos, que rara vez alivian la
          preocupación. La dismorfia muscular, la creencia de que el propio
          cuerpo es demasiado pequeño, es una forma reconocida.
    brain:
        ofc:
            Unos circuitos de valoración hiperactivos, compartidos con el TOC,
            mantienen la atención fija en el defecto percibido.
        caudate:
            Los circuitos obsesivo-compulsivos compartidos pueden hacer que los
            rituales de comprobación y arreglo sean difíciles de detener.
        fusiform:
            Las personas con TDC tienden a procesar los rostros con gran detalle
            en lugar de como un todo, lo que magnifica los rasgos pequeños.
        v2v3:
            Un desequilibrio que favorece el procesamiento visual detallado
            frente a la forma global puede hacer que los defectos menores
            destaquen.
    symptoms:
        - Preocupación por un defecto percibido durante horas al día
        - Mirarse al espejo constantemente o evitar los espejos
        - Arreglarse en exceso, camuflarse con maquillaje o ropa
        - Comparar la propia apariencia con la de otros
        - Buscar tranquilización o procedimientos estéticos
        - Evitación social
    diagnosis:
        Requiere preocupación por defectos percibidos, conductas repetitivas y
        malestar significativo, que no se expliquen mejor por un trastorno de la
        conducta alimentaria. Se valora el grado de introspección.
    causes:
        - Genética, perfeccionismo, una percepción centrada en los detalles y
          experiencias como las burlas.
    treatment:
        - TCC adaptada al TDC, que incluye exposición con prevención de
          respuesta y reentrenamiento perceptivo, e ISRS, a menudo en dosis
          altas.
    course:
        A menudo es crónico sin tratamiento y se asocia con tasas altas de
        depresión, pero el tratamiento ayuda a muchas personas.
    prevalence: Alrededor del 2 % de las personas.
psych:hoarding:
    name: Trastorno de acumulación
    short: Acumulación
    aka:
        - trastorno de acumulación
        - acumulación compulsiva
        - acumulación
        - síndrome de diógenes
    summary:
        El trastorno de acumulación es una dificultad persistente para
        desprenderse de las pertenencias, sea cual sea su valor, por una
        necesidad percibida de guardarlas y el malestar que causa deshacerse de
        ellas. El desorden se acumula hasta que los espacios de la vivienda no
        pueden usarse.
    overview:
        - El trastorno de acumulación es una dificultad persistente para
          desprenderse de las pertenencias, sea cual sea su valor real, por una
          fuerte necesidad percibida de guardarlas y el malestar que produce la
          idea de deshacerse de ellas. El desorden se acumula hasta que las
          habitaciones no pueden usarse para su fin previsto.
        - "Se diferencia del coleccionismo: los objetos no están organizados ni
          expuestos, y el desorden causa malestar, riesgos para la salud y la
          seguridad, y conflictos familiares. La introspección suele ser
          limitada."
    brain:
        acc:
            Muestra una actividad anómala cuando las personas deciden si
            desechar sus propios objetos, lo que puede hacer que la decisión se
            sienta amenazante.
        antinsula:
            Una reacción emocional aumentada durante las decisiones de desechar
            hace que desprenderse de algo resulte insoportable.
        dlpfc:
            Las dificultades para categorizar, planificar y tomar decisiones
            hacen difícil organizar y desechar.
    symptoms:
        - Gran malestar al desechar objetos
        - Adquisición excesiva
        - Desorden que bloquea los espacios de la vivienda
        - Indecisión y dificultad para organizar
    diagnosis:
        Se diagnostica mediante entrevista, visitas al domicilio o fotografías,
        y escalas de valoración como la Clutter Image Rating (escala de imágenes
        de desorden).
    causes:
        - Fuertes antecedentes familiares, indecisión y acontecimientos
          estresantes o traumáticos.
    treatment:
        - La TCC especializada para la acumulación desarrolla habilidades para
          clasificar, tomar decisiones y resistir el impulso de adquirir. A
          menudo se necesita ayuda en el domicilio y apoyos comunitarios.
    course: A menudo comienza en la adolescencia y empeora con la edad.
    prevalence:
        Alrededor del 2–6 % de las personas; más frecuente en adultos mayores.
psych:trich:
    name: Tricotilomanía y trastorno de excoriación
    short: Tricotilomanía
    aka:
        - tricotilomanía
        - trastorno de arrancarse el pelo
        - trastorno de excoriación
        - dermatilomanía
        - pellizcarse la piel
        - arrancarse el cabello
    summary:
        "Son conductas repetitivas centradas en el cuerpo: arrancarse el pelo de
        forma recurrente (tricotilomanía) o pellizcarse la piel (excoriación),
        lo que causa pérdida de cabello o lesiones cutáneas, con intentos
        repetidos de dejar de hacerlo."
    overview:
        - La tricotilomanía (arrancarse el pelo) y el trastorno de excoriación
          (pellizcarse la piel) son conductas repetitivas centradas en el
          cuerpo. Las personas se arrancan el pelo o se pellizcan la piel una y
          otra vez, lo que causa pérdida de cabello o lesiones cutáneas, e
          intentan repetidamente dejar de hacerlo.
        - La conducta puede ser automática, ocurriendo mientras se lee o se ve
          la televisión sin darse cuenta, o focalizada, realizada
          deliberadamente para aliviar una tensión o un impulso. A menudo
          produce una sensación de alivio o satisfacción seguida de vergüenza.
    brain:
        putamen:
            Los circuitos del hábito impulsan la naturaleza automática y
            repetitiva de la conducta.
        acc:
            Una autosupervisión alterada hace más difícil notar la conducta y
            detenerla.
        cerebhemi:
            Algunos estudios han descrito diferencias en la sustancia gris (su
            papel no está claro).
    symptoms:
        - Arrancarse el pelo o pellizcarse la piel de forma repetida
        - Tensión antes de la conducta y alivio durante ella
        - Episodios automáticos sin darse cuenta
        - Pérdida de cabello o lesiones cutáneas visibles
        - Vergüenza y ocultación de los efectos
    diagnosis: Diagnóstico clínico tras descartar causas dermatológicas.
    causes:
        - Genética, diferencias en los circuitos del hábito y de la recompensa,
          y el papel de la conducta en la regulación del aburrimiento o el
          estrés.
    treatment:
        - El entrenamiento en reversión de hábitos y el modelo conductual
          integral (ComB). La N-acetilcisteína cuenta con cierta evidencia.
    course: A menudo comienza en torno a la pubertad y puede ser crónico.
    prevalence: Cada uno afecta a alrededor del 1–2 % de las personas.
psych:ptsd:
    name: Trastorno de estrés postraumático
    short: TEPT
    aka:
        - trastorno de estrés postraumático
        - tept
        - estrés postraumático
        - trauma
    summary:
        El TEPT puede aparecer después de vivir o presenciar un acontecimiento
        traumático, como el combate, una agresión, un desastre o un accidente
        grave. Los síntomas duran más de un mes e incluyen revivir el suceso,
        evitación, cambios negativos en el estado de ánimo y el pensamiento, y
        estar constantemente en alerta.
    overview:
        - "El trastorno de estrés postraumático puede aparecer después de vivir
          o presenciar una muerte real o una amenaza de muerte, una lesión grave
          o violencia sexual. Los síntomas duran más de un mes y se agrupan en
          cuatro bloques: reexperimentación intrusiva, evitación, alteraciones
          negativas del pensamiento y del estado de ánimo, y alteraciones de la
          activación y la reactividad."
        - "En el TEPT, el sistema de amenaza del cerebro se queda atascado en
          modo de peligro: el recuerdo traumático se almacena como un fragmento
          sensorial vívido que pueden desencadenar los recordatorios, en lugar
          de como un recuerdo ordinario situado en el pasado. La mayoría de las
          personas expuestas a un trauma no desarrolla TEPT; la recuperación es
          el desenlace más frecuente."
    brain:
        amygdala:
            Este detector de amenazas es hiperreactivo ante los recordatorios
            del trauma e incluso ante señales neutras, lo que impulsa las
            reviviscencias (flashbacks), el pánico y la hipervigilancia.
        vmpfc:
            Normalmente almacena el aprendizaje de seguridad y calma la
            amígdala. En el TEPT está hipoactiva, así que la extinción del miedo
            fracasa y el cerebro sigue tratando las situaciones seguras como
            peligrosas.
        hippocampus:
            Sitúa los recuerdos en el tiempo y el contexto. Un volumen menor y
            un funcionamiento más débil hacen más difícil distinguir el
            "entonces" del "ahora" y los contextos seguros de los peligrosos, de
            modo que los recordatorios desencadenan miedo en cualquier lugar.
        acc:
            Un volumen y una regulación reducidos contribuyen a la dificultad
            para controlar las respuestas emocionales.
        antinsula:
            Aumenta la ansiedad de base corporal y la conciencia emocional de la
            amenaza.
        lc:
            Una elevada liberación de noradrenalina impulsa la hiperactivación,
            el sobresalto y las pesadillas; la prazosina, que bloquea uno de los
            efectos de la noradrenalina, puede reducir las pesadillas.
        pvn:
            Regulación alterada de las hormonas del estrés; las respuestas de
            cortisol suelen ser anómalas.
    symptoms:
        - Recuerdos intrusivos, reviviscencias (flashbacks) y pesadillas
        - Malestar intenso o reacciones corporales ante los recordatorios
        - Evitar pensamientos, lugares o personas relacionados con el trauma
        - Creencias negativas persistentes, culpa, autoinculpación o vergüenza
        - Embotamiento emocional y desapego
        - Hipervigilancia y respuesta de sobresalto exagerada
        - Irritabilidad, dificultad para concentrarse y para dormir
    diagnosis:
        Requiere exposición a un trauma más síntomas de los cuatro bloques
        durante más de un mes que causen deterioro. Se usan con frecuencia la
        PCL-5 y la CAPS-5. Existe un subtipo disociativo.
    types:
        - "Con síntomas disociativos: despersonalización o desrealización."
        - "Con expresión diferida: se cumplen todos los criterios seis meses o
          más después del suceso."
        - El TEPT complejo (en la CIE-11) añade problemas de regulación
          emocional, de autoconcepto y en las relaciones tras un trauma
          prolongado.
    causes:
        - El riesgo es mayor con la violencia interpersonal, el trauma repetido
          o prolongado, los traumas previos, la falta de apoyo posterior, el
          estrés continuado y la vulnerabilidad genética.
    treatment:
        - "Las psicoterapias centradas en el trauma son de primera línea:
          exposición prolongada, terapia de procesamiento cognitivo y EMDR.
          Ayudan al cerebro a reprocesar el recuerdo y a volver a aprender la
          seguridad."
        - Los ISRS (sertralina, paroxetina) y la venlafaxina son los
          medicamentos de primera línea. La prazosina puede reducir las
          pesadillas en algunas personas. Entre los enfoques nuevos en estudio
          está la terapia asistida con MDMA, que la FDA decidió no aprobar en
          2024.
    course:
        Muchas personas se recuperan en meses; en otras, el TEPT puede durar
        años. Un tratamiento eficaz ayuda a una gran parte de las personas
        incluso tras una enfermedad prolongada.
    prevalence:
        Alrededor del 6–8 % de los adultos en EE. UU. a lo largo de la vida.
    fact:
        La extinción del miedo no borra un recuerdo de miedo; crea un nuevo
        recuerdo de seguridad, almacenado con la ayuda de la CPFvm, que compite
        con el antiguo.
psych:asd_stress:
    name: Trastorno de estrés agudo
    short: Estrés agudo
    aka:
        - trastorno de estrés agudo
        - estrés agudo
        - reacción aguda al estrés
    summary:
        El trastorno de estrés agudo implica síntomas parecidos a los del TEPT
        que aparecen entre 3 días y 1 mes después de un acontecimiento
        traumático. Puede resolverse o evolucionar a TEPT.
    overview:
        - El trastorno de estrés agudo implica síntomas parecidos a los del TEPT
          que comienzan entre 3 días y 1 mes después de un acontecimiento
          traumático. A menudo incluye disociación, como sentirse aturdido.
          Muchas personas se recuperan; algunas llegan a desarrollar TEPT.
    brain:
        amygdala:
            La activación aguda ante la amenaza tras el trauma mantiene
            encendido el sistema de alarma.
        hippocampus:
            Los niveles altos de hormonas del estrés alteran la codificación del
            recuerdo, lo que contribuye a un recuerdo fragmentado.
    symptoms:
        - Recuerdos intrusivos
        - Disociación, embotamiento o aturdimiento
        - Evitación
        - Ansiedad, mal sueño e hiperactivación
    diagnosis:
        Requiere nueve o más síntomas de las categorías de intrusión, estado de
        ánimo negativo, disociación, evitación y activación, con una duración de
        entre 3 días y 1 mes.
    causes:
        - Exposición a un trauma, con factores de riesgo similares a los del
          TEPT.
    treatment:
        - Una TCC breve centrada en el trauma puede prevenir el TEPT. No se
          recomienda el debriefing psicológico de sesión única, porque puede
          aumentar el riesgo.
    course:
        En muchas personas se resuelve en un mes; alrededor de la mitad llega a
        desarrollar TEPT.
    prevalence:
        Afecta aproximadamente al 20 % o menos de las personas tras
        acontecimientos traumáticos que no implican agresión, y a más tras una
        agresión.
psych:did:
    name: Trastorno de identidad disociativo
    short: TID
    aka:
        - trastorno de identidad disociativo
        - tid
        - trastorno de personalidad múltiple
        - personalidad múltiple
    summary:
        El trastorno de identidad disociativo implica dos o más estados de
        identidad diferenciados, con lagunas de memoria sobre acontecimientos
        cotidianos, información personal o sucesos traumáticos. Casi siempre se
        asocia con traumas infantiles graves y repetidos, y sigue siendo un tema
        de debate e investigación.
    overview:
        - El trastorno de identidad disociativo implica dos o más estados de
          identidad diferenciados, cada uno con su propio sentido de sí mismo y
          de agencia, y lagunas de memoria recurrentes sobre acontecimientos
          cotidianos, información personal o traumas. Se entiende como una
          respuesta a traumas infantiles graves y repetidos en los que la
          disociación fue una forma de sobrevivir.
        - "El TID sigue siendo objeto de debate: algunos investigadores
          sostienen que puede estar moldeado por la sugestión o por las
          expectativas sociales. La mayoría de los clínicos especializados en
          trauma lo reconocen como una condición real, aunque rara y a menudo
          mal diagnosticada."
    brain:
        hippocampus:
            Se ha descrito un volumen menor, que podría reflejar estrés temprano
            crónico y relacionarse con las lagunas de memoria.
        amygdala:
            Algunos estudios describen un volumen menor y una reactividad
            emocional alterada.
        precuneus:
            Se han observado cambios en las redes de autoconciencia entre
            distintos estados de identidad.
        dlpfc:
            Un control prefrontal alterado podría contribuir a las alteraciones
            de la memoria y de la identidad (investigación limitada).
    symptoms:
        - Estados de identidad diferenciados con rasgos, voces o recuerdos
          distintos
        - Lagunas de memoria sobre acontecimientos cotidianos y la historia
          personal
        - Encontrar objetos o escritos sin explicación
        - Despersonalización y desrealización
        - TEPT, depresión y autolesiones concurrentes
    diagnosis:
        Requiere una evaluación especializada, a menudo con entrevistas
        estructuradas como la SCID-D, y una cuidadosa diferenciación de la
        psicosis, el trastorno límite de la personalidad y las crisis
        epilépticas.
    causes:
        - Trauma temprano grave y crónico, combinado con una alta capacidad de
          disociación y la falta de cuidados de apoyo.
    treatment:
        - "Psicoterapia a largo plazo orientada por fases: seguridad y
          estabilización, después procesamiento de los recuerdos traumáticos y,
          por último, integración o cooperación entre los estados de identidad."
    course:
        Suele ser crónico, pero muchas personas mejoran con un tratamiento
        especializado.
    prevalence:
        En torno al 1–1,5 % en algunas muestras comunitarias; las estimaciones
        varían y son objeto de debate.
psych:dpdr:
    name: Trastorno de despersonalización/desrealización
    short: Despersonalización
    aka:
        - trastorno de despersonalización/desrealización
        - trastorno de despersonalización
        - despersonalización
        - desrealización
    summary:
        Las personas con este trastorno se sienten repetidamente desconectadas
        de su propia mente, su cuerpo o sus sentimientos (despersonalización), o
        sienten que el mundo es irreal, onírico o brumoso (desrealización).
        Saben que la sensación no es literalmente cierta.
    overview:
        - "Las personas con trastorno de despersonalización/desrealización se
          sienten repetidamente desconectadas de su propia mente, su cuerpo o
          sus sentimientos, como si se observaran desde fuera, o sienten que el
          mundo es irreal, brumoso u onírico. El juicio de realidad se mantiene
          intacto: saben que la experiencia no es literalmente cierta."
        - Los episodios breves son frecuentes con el estrés o la falta de sueño;
          el trastorno implica episodios persistentes o recurrentes que causan
          malestar.
    brain:
        antinsula:
            Genera la sensación sentida de las emociones y del cuerpo. Su menor
            actividad coincide con la experiencia de embotamiento emocional y de
            sentirse desconectado de uno mismo.
        vlpfc:
            Se cree que una inhibición prefrontal hiperactiva de las respuestas
            límbicas amortigua los sentimientos emocionales, una especie de
            sobrecorrección.
        angular:
            La unión temporoparietal sostiene la sensación de estar situado
            dentro del propio cuerpo; su actividad alterada se asocia con
            experiencias parecidas a las extracorporales.
    symptoms:
        - Sentirse como un observador externo de uno mismo
        - Embotamiento emocional y físico
        - El entorno parece plano, lejano o artificial
        - Sentido del tiempo distorsionado
        - Malestar por la experiencia
    diagnosis:
        Requiere episodios persistentes o recurrentes con el juicio de realidad
        intacto, tras descartar sustancias, crisis epilépticas y otros
        trastornos.
    causes:
        - Pueden desencadenarlo el estrés grave, el maltrato emocional en la
          infancia, la ansiedad y experiencias con drogas como el cannabis.
    treatment:
        - Psicoterapia (TCC, técnicas de anclaje o grounding), reducción de la
          ansiedad y tratamiento de las condiciones concurrentes. No hay ningún
          medicamento aprobado específicamente.
    course: A menudo es crónico, aunque puede fluctuar y mejorar.
    prevalence: Alrededor del 1–2 % de las personas.
psych:ssd:
    name: Trastorno de síntomas somáticos
    short: Síntomas somáticos
    aka:
        - trastorno de síntomas somáticos
        - trastorno de somatización
        - somatización
    summary:
        El trastorno de síntomas somáticos implica uno o más síntomas físicos
        angustiantes, que pueden tener o no una causa médica, junto con
        pensamientos, sentimientos o conductas excesivos sobre ellos, como una
        ansiedad persistente por la salud o dedicarles una gran cantidad de
        tiempo.
    overview:
        - El trastorno de síntomas somáticos implica uno o más síntomas físicos
          angustiantes, que pueden tener o no una explicación médica, junto con
          pensamientos, sentimientos o conductas excesivos sobre ellos, como una
          preocupación persistente por su gravedad o dedicarles una gran
          cantidad de tiempo y energía.
        - Los síntomas son reales, no imaginados. El trastorno reside en cómo la
          atención, la interpretación y la preocupación los amplifican y acaban
          dominando la vida diaria.
    brain:
        antinsula:
            Amplifica la atención a las señales corporales, haciendo que las
            sensaciones normales se sientan más intensas.
        acc:
            Aumenta el malestar emocional asociado a las sensaciones corporales.
        amygdala:
            Interpreta las sensaciones como amenazantes, lo que aumenta la
            preocupación.
    symptoms:
        - Síntomas angustiantes como dolor o fatiga
        - Preocupación persistente por su gravedad
        - Visitas médicas y pruebas frecuentes
        - Síntomas que dominan la vida diaria
    diagnosis:
        Se diagnostica por la respuesta excesiva a los síntomas durante seis
        meses, no por la ausencia de una explicación médica.
    causes:
        - Mayor sensibilidad corporal, ansiedad y depresión, experiencias
          previas de enfermedad y estrés.
    treatment:
        - TCC, visitas regulares programadas con un único médico y tratamiento
          de la ansiedad o la depresión concurrentes.
    course:
        A menudo es crónico, pero la TCC puede reducir el malestar y mejorar el
        funcionamiento.
    prevalence: Se estima en alrededor del 5–7 % de los adultos.
psych:fnd:
    name: Trastorno neurológico funcional
    short: TNF
    aka:
        - trastorno neurológico funcional
        - trastorno de síntomas neurológicos funcionales
        - trastorno de conversión
        - tnf
    summary:
        En el trastorno neurológico funcional (antes llamado trastorno de
        conversión), las personas tienen síntomas neurológicos reales, como
        debilidad, temblor, crisis o entumecimiento, que se deben a un problema
        en el funcionamiento del cerebro y no a un daño estructural. Los
        síntomas no son fingidos ni imaginados.
    overview:
        - El trastorno neurológico funcional causa síntomas neurológicos reales,
          como debilidad, temblor, crisis, problemas para caminar o
          entumecimiento, que se deben a un problema en el funcionamiento del
          cerebro y no a un daño estructural. A menudo se describe como un
          problema de "software" y no de "hardware".
        - El TNF es frecuente y realmente incapacitante. Los síntomas no son
          fingidos ni imaginados, y muchas personas no tienen ningún
          desencadenante psicológico identificable. El diagnóstico se basa en
          signos clínicos positivos, no solo en pruebas normales.
    brain:
        angular:
            La unión temporoparietal contribuye al sentido de agencia. Su menor
            actividad podría explicar por qué los movimientos se sienten
            involuntarios.
        sma:
            Una preparación del movimiento alterada puede perturbar el control
            voluntario normal.
        amygdala:
            Una mayor reactividad emocional puede secuestrar los circuitos de
            control motor.
        antinsula:
            Una conciencia corporal alterada puede cambiar la forma en que se
            experimentan los síntomas.
    symptoms:
        - Debilidad o parálisis de las extremidades
        - Crisis funcionales (disociativas)
        - Temblor, sacudidas o marcha inusual
        - Entumecimiento o pérdida sensitiva
        - Problemas del habla o de la deglución
    diagnosis:
        Los neurólogos identifican signos positivos, como el signo de Hoover en
        la debilidad funcional, y utilizan el video-EEG para las crisis
        funcionales.
    causes:
        - Lesiones físicas, enfermedades, estrés, trauma y la atención centrada
          en el cuerpo, a menudo combinados.
    treatment:
        - Una explicación clara del diagnóstico es el primer paso. La
          fisioterapia especializada, la terapia ocupacional y la TCC ayudan a
          reentrenar el funcionamiento cerebral.
    course:
        Variable; un diagnóstico y un tratamiento más tempranos mejoran el
        pronóstico.
    prevalence: Uno de los motivos más frecuentes de consulta en neurología.
psych:anorexia:
    name: Anorexia nerviosa
    short: Anorexia nerviosa
    aka:
        - anorexia nerviosa
        - anorexia
    summary:
        La anorexia nerviosa es un trastorno de la conducta alimentaria grave
        que implica una restricción de la ingesta que lleva a un peso corporal
        significativamente bajo, un miedo intenso a ganar peso y una vivencia
        distorsionada de la forma del cuerpo. Tiene una de las tasas de
        mortalidad más altas de todas las condiciones psiquiátricas, pero la
        recuperación es posible.
    overview:
        - La anorexia nerviosa es un trastorno de la conducta alimentaria grave
          caracterizado por la restricción de la ingesta energética que lleva a
          un peso corporal significativamente bajo para la edad y la salud de la
          persona, un miedo intenso a ganar peso o conductas que impiden
          ganarlo, y una alteración en la vivencia de la forma del cuerpo o la
          negación de la gravedad del bajo peso.
        - Afecta a todos los sistemas del organismo, incluidos el corazón, los
          huesos, las hormonas y el cerebro, y tiene una de las tasas de
          mortalidad más altas de todas las condiciones psiquiátricas. La propia
          inanición cambia el pensamiento, volviéndolo más rígido y centrado en
          la comida, lo que ayuda a mantener la enfermedad. La recuperación
          completa es posible, sobre todo con un tratamiento temprano.
    brain:
        antinsula:
            Integra las señales de hambre, sabor y del cuerpo en sensaciones. Su
            actividad alterada puede amortiguar las señales de hambre y cambiar
            cómo se sienten la comida y el cuerpo, lo que contribuye a la
            restricción y a la vivencia corporal distorsionada.
        caudate:
            Forma parte del sistema de recompensa y de hábitos. Las respuestas
            dopaminérgicas alteradas pueden hacer que la restricción resulte
            gratificante y la comida menos, y la restricción puede convertirse
            en un hábito.
        dlpfc:
            Sostiene el autocontrol. Un control prefrontal aumentado se asocia
            con la capacidad de anular el hambre y con un pensamiento rígido y
            perfeccionista.
        ofc:
            Representa el valor de recompensa de la comida. Sus respuestas
            alteradas pueden reducir el placer de comer.
        hypothalamus:
            Regula el apetito y las hormonas reproductivas. La inanición altera
            estos sistemas y provoca la pérdida de la menstruación y otros
            cambios hormonales.
    symptoms:
        - Restricción de la ingesta de alimentos
        - Miedo intenso a ganar peso
        - Imagen corporal distorsionada
        - Negación de la gravedad del bajo peso
        - Rituales rígidos con la comida
        - Ejercicio excesivo en algunas personas
        - "Efectos físicos: frecuencia cardíaca baja, mareos, sensación de frío,
          pérdida de la menstruación, pérdida de masa ósea"
    diagnosis:
        Los profesionales evalúan la historia del peso, las conductas
        alimentarias, las creencias sobre el peso y la figura, y el estado
        médico, incluidos el ritmo cardíaco, los electrolitos y la salud ósea.
        La gravedad se clasifica según el índice de masa corporal en adultos y
        según percentiles en personas jóvenes.
    types:
        - "Tipo restrictivo: pérdida de peso principalmente mediante dieta,
          ayuno o ejercicio excesivo."
        - "Tipo con atracones/purgas: atracones recurrentes o conductas
          purgativas."
    causes:
        - La genética explica alrededor del 50–60 % del riesgo, y estudios
          recientes sugieren factores genéticos tanto metabólicos como
          psiquiátricos. Contribuyen el temperamento (perfeccionismo, ansiedad,
          evitación del daño), las dietas y las presiones culturales sobre la
          delgadez.
    treatment:
        - La estabilización médica y la restauración nutricional son esenciales.
          El tratamiento basado en la familia es el enfoque más eficaz en
          adolescentes. En adultos se usan terapias especializadas como la
          TCC-E, MANTRA y el manejo clínico de apoyo especializado.
        - Ningún medicamento trata directamente la anorexia, aunque pueden
          tratarse las condiciones concurrentes. Muchos cambios cerebrales
          mejoran con la recuperación del peso.
    course:
        La evolución es variable; muchas personas se recuperan por completo,
        algunas tienen recaídas y una minoría sigue un curso crónico. El
        tratamiento temprano mejora los resultados.
    prevalence:
        Hasta alrededor del 1–4 % de las mujeres y una proporción menor de los
        hombres a lo largo de la vida.
    fact:
        Si te preocupa tu situación o la de otra persona, un médico o una línea
        de ayuda para trastornos de la conducta alimentaria pueden ayudarte.
psych:bulimia:
    name: Bulimia nerviosa
    short: Bulimia nerviosa
    aka:
        - bulimia nerviosa
        - bulimia
    summary:
        La bulimia nerviosa implica episodios recurrentes de atracones con
        sensación de pérdida de control, seguidos de conductas para evitar el
        aumento de peso, con una autoestima muy basada en la figura y el peso
        corporal.
    overview:
        - La bulimia nerviosa implica episodios recurrentes de atracones con
          sensación de pérdida de control, seguidos de conductas compensatorias
          para evitar el aumento de peso, al menos una vez por semana durante
          tres meses, con una autoestima muy basada en la figura y el peso
          corporal.
        - Las personas con bulimia suelen tener un peso normal, por lo que el
          trastorno puede pasar desapercibido con facilidad. Los episodios
          suelen ser secretos y van acompañados de vergüenza. Las purgas
          repetidas pueden causar desequilibrios electrolíticos peligrosos y
          daño dental.
    brain:
        vlpfc:
            Sostiene el control inhibitorio. Su menor actividad puede hacer más
            difícil detenerse una vez que empieza un atracón.
        ofc:
            Una valoración alterada de la recompensa de la comida puede aumentar
            el impulso a darse atracones.
        antinsula:
            Un procesamiento alterado del sabor y de las señales corporales
            puede afectar a las señales de hambre y saciedad.
        nacc:
            Las respuestas de recompensa alteradas ante la comida pueden
            reforzar el ciclo de atracones.
    symptoms:
        - Episodios recurrentes de atracones con pérdida de control
        - Conductas compensatorias
        - Autoevaluación determinada por la figura y el peso
        - Secretismo y vergüenza
        - Mejillas hinchadas, erosión dental, problemas de electrolitos
    diagnosis:
        Requiere atracones y conductas compensatorias al menos semanales durante
        tres meses, con una autoevaluación excesivamente influida por el peso y
        la figura.
    causes:
        - Genética, dietas, baja autoestima, dificultades para regular las
          emociones y presiones culturales.
    treatment:
        - La TCC-E es el tratamiento principal. La fluoxetina está aprobada por
          la FDA para la bulimia.
    course:
        Muchas personas mejoran con tratamiento, aunque pueden producirse
        recaídas.
    prevalence:
        Alrededor del 1 % de las mujeres a lo largo de la vida; es menos
        frecuente en hombres.
psych:bed:
    name: Trastorno por atracón
    short: Trastorno por atracón
    aka:
        - trastorno por atracón
        - trastorno por atracones
        - atracones
        - comer compulsivo
    summary:
        El trastorno por atracón implica episodios recurrentes de atracones con
        sensación de pérdida de control y malestar marcado, sin conductas
        compensatorias regulares. Es el trastorno de la conducta alimentaria más
        frecuente.
    overview:
        - El trastorno por atracón implica episodios recurrentes de atracones
          con sensación de pérdida de control y malestar marcado, sin las
          conductas compensatorias regulares de la bulimia. Es el trastorno de
          la conducta alimentaria más frecuente.
        - Los atracones suelen seguir al estrés, a emociones negativas o a
          dietas restrictivas, y van seguidos de vergüenza y culpa, lo que puede
          desencadenar el siguiente atracón.
    brain:
        nacc:
            Muestra respuestas aumentadas ante las señales de comida, lo que
            incrementa el impulso a comer.
        ofc: Valoración alterada de la comida como recompensa.
        vlpfc:
            Un menor control inhibitorio hace más difícil dejar de comer una vez
            que se empieza.
    symptoms:
        - Comer cantidades inusualmente grandes en poco tiempo
        - Sentir que se pierde el control mientras se come
        - Comer muy rápido, sin tener hambre o hasta sentirse incómodamente
          lleno
        - Comer a solas por vergüenza
        - Vergüenza y culpa después
    diagnosis:
        Requiere atracones al menos semanales durante tres meses con malestar
        marcado.
    causes:
        - Genética, dietas, estrés, depresión y dificultades para regular las
          emociones.
    treatment:
        - La TCC es el tratamiento de primera línea. La lisdexanfetamina está
          aprobada por la FDA para el trastorno por atracón moderado a grave.
    course: A menudo es crónico, pero responde al tratamiento.
    prevalence: Alrededor del 1–3 % de las personas a lo largo de la vida.
psych:insomnia:
    name: Trastorno de insomnio
    short: Insomnio
    aka:
        - trastorno de insomnio
        - insomnio
    summary:
        El trastorno de insomnio es una dificultad continuada para conciliar el
        sueño, mantenerlo o despertarse demasiado temprano, al menos tres noches
        por semana durante tres meses, a pesar de tener suficiente oportunidad
        para dormir, y que causa problemas durante el día.
    overview:
        - El trastorno de insomnio es una dificultad persistente para conciliar
          el sueño, mantenerlo o despertarse demasiado temprano, al menos tres
          noches por semana durante tres meses, a pesar de tener suficiente
          oportunidad para dormir, que causa fatiga diurna, problemas del estado
          de ánimo o deterioro del funcionamiento.
        - "Se entiende como un estado de hiperactivación: el cerebro y el cuerpo
          permanecen demasiado alerta por la noche. Con el tiempo, preocuparse
          por el sueño y pasar muchas horas despierto en la cama enseñan al
          cerebro a asociar la cama con la vigilia, lo que mantiene el insomnio
          incluso después de que el desencadenante original haya desaparecido."
    brain:
        lateralhyp:
            Los sistemas de activación, como el de la orexina, permanecen
            demasiado activos por la noche y mantienen despierto al cerebro.
        thalamus:
            Normalmente filtra la información sensorial y se desactiva al inicio
            del sueño. Una menor desactivación puede permitir que el cerebro
            siga alerta.
        acc:
            Su mayor actividad se asocia con una mente acelerada y preocupada a
            la hora de acostarse.
        amygdala: Una mayor activación emocional dificulta relajarse.
    symptoms:
        - Dificultad para conciliar o mantener el sueño
        - Despertar demasiado temprano
        - Fatiga y somnolencia diurnas
        - Mala concentración e irritabilidad
        - Preocupación por el sueño
    diagnosis:
        Se basa en la historia del sueño y en diarios de sueño; se realizan
        estudios del sueño si se sospecha apnea del sueño u otros trastornos.
    causes:
        - Hiperactivación, estrés, horarios irregulares, ansiedad y depresión,
          dolor y asociaciones aprendidas entre la cama y la vigilia.
    treatment:
        - La TCC-I (control de estímulos, restricción del sueño, trabajo
          cognitivo e higiene del sueño) es el tratamiento de primera línea y
          supera a las pastillas para dormir a largo plazo. Los medicamentos
          suelen reservarse para un uso a corto plazo.
    course: Puede ser crónico, pero responde bien a la TCC-I.
    prevalence:
        Alrededor del 10 % de los adultos tiene insomnio crónico; cerca de un
        tercio tiene síntomas ocasionales.
psych:narcolepsy:
    name: Narcolepsia
    short: Narcolepsia
    aka:
        - narcolepsia
    summary:
        "La narcolepsia es un trastorno neurológico crónico del sueño en el que
        el cerebro no puede regular adecuadamente el sueño y la vigilia. Causa
        una somnolencia diurna abrumadora y, en el tipo 1, cataplejía: debilidad
        muscular súbita desencadenada por emociones como la risa."
    overview:
        - "La narcolepsia es un trastorno neurológico crónico del sueño en el
          que el cerebro no puede regular adecuadamente el sueño y la vigilia.
          Causa una somnolencia diurna abrumadora y, en el tipo 1, cataplejía:
          debilidad muscular súbita desencadenada por emociones intensas como la
          risa."
        - "Rasgos del sueño REM se introducen en la vigilia: la parálisis
          muscular aparece como cataplejía y parálisis del sueño, y las imágenes
          oníricas aparecen como alucinaciones al quedarse dormido o al
          despertar."
    brain:
        lateralhyp:
            Las neuronas de orexina estabilizan la vigilia. Su pérdida en la
            narcolepsia tipo 1 deja inestable el interruptor sueño-vigilia, de
            modo que la persona cae en el sueño o en estados similares al REM
            durante el día.
        pons:
            Controla el sueño REM y su parálisis muscular. Sin orexina, esta
            parálisis puede activarse estando despierto y causar cataplejía y
            parálisis del sueño.
        amygdala:
            Las emociones intensas activan la amígdala, que puede desencadenar
            la cataplejía a través de circuitos del tronco encefálico.
    symptoms:
        - Somnolencia diurna excesiva y ataques de sueño repentinos
        - Cataplejía (tipo 1)
        - Parálisis del sueño
        - Alucinaciones vívidas al quedarse dormido o al despertar
        - Sueño nocturno fragmentado
    diagnosis:
        Estudio del sueño nocturno (polisomnografía) seguido de un test de
        latencias múltiples del sueño; una orexina baja en el líquido
        cefalorraquídeo confirma el tipo 1.
    types:
        - "Tipo 1: con cataplejía y/o orexina baja."
        - "Tipo 2: sin cataplejía, con orexina normal."
    causes:
        - El tipo 1 se debe a la pérdida de neuronas de orexina, probablemente
          por un ataque autoinmune en personas con la variante genética
          HLA-DQB1*06:02.
    treatment:
        - Modafinilo, solriamfetol, pitolisant y estimulantes para la
          somnolencia; oxibato de sodio para la somnolencia y la cataplejía;
          siestas programadas.
    course: Dura toda la vida, pero los síntomas son manejables con tratamiento.
    prevalence: Alrededor de 1 de cada 2.000 personas.
psych:aud:
    name: Trastorno por consumo de alcohol
    short: Trastorno por consumo de alcohol
    aka:
        - trastorno por consumo de alcohol
        - trastorno por uso de alcohol
        - alcoholismo
        - adicción al alcohol
    summary:
        El trastorno por consumo de alcohol es un patrón problemático de consumo
        con pérdida de control, ansia (craving) y consumo continuado a pesar del
        daño. Va de leve a grave e implica cambios duraderos en los circuitos
        cerebrales de recompensa, estrés y autocontrol.
    overview:
        - El trastorno por consumo de alcohol es un patrón problemático de
          consumo marcado por la pérdida de control, el ansia (craving) y el
          consumo continuado a pesar del daño. Va de leve a grave e implica
          cambios duraderos en los sistemas cerebrales de recompensa, estrés y
          autocontrol.
        - "La adicción suele describirse en tres etapas que se repiten: atracón
          e intoxicación (impulsada por la recompensa), abstinencia y afecto
          negativo (impulsada por los sistemas de estrés), y preocupación y
          anticipación (impulsada por un control prefrontal debilitado). Con el
          tiempo, las personas beben menos por placer y más para aliviar la
          abstinencia y el malestar."
    brain:
        nacc:
            El centro de recompensa se adapta a los picos repetidos de dopamina
            inducidos por el alcohol, de modo que las señales asociadas a la
            bebida desencadenan un ansia intensa mientras que las recompensas
            cotidianas resultan menos satisfactorias.
        vta:
            El alcohol aumenta la liberación de dopamina por las neuronas del
            ATV, el efecto reforzador inicial que impulsa el consumo repetido.
        dlpfc:
            Sostiene el autocontrol y la planificación. Un control descendente
            debilitado hace más difícil resistirse a beber a pesar de las
            intenciones.
        antinsula:
            Convierte los estados corporales en impulsos sentidos, lo que
            contribuye al ansia.
        ofc:
            Una valoración alterada hace que el alcohol parezca más valioso que
            otras recompensas.
        vermis:
            El consumo intenso prolongado reduce el cerebelo, sobre todo el
            vermis, y causa una marcha inestable.
        hippocampus:
            El alcohol altera la formación de recuerdos (lagunas o «blackouts»),
            y el consumo intenso a largo plazo reduce su volumen.
        mammillary:
            El déficit de tiamina puede causar el síndrome de
            Wernicke-Korsakoff, que daña estas estructuras de la memoria.
    symptoms:
        - Beber más cantidad o durante más tiempo de lo previsto
        - Intentos fallidos de reducir el consumo
        - Ansia (craving)
        - Tolerancia
        - "Abstinencia: temblores, sudoración, ansiedad, insomnio; en casos
          graves, convulsiones o delirium tremens"
        - Seguir bebiendo a pesar de los problemas
        - Abandonar actividades
    diagnosis:
        Se basa en 11 criterios del DSM-5; la gravedad es leve (2–3), moderada
        (4–5) o grave (6 o más). El cuestionario AUDIT es una herramienta de
        cribado habitual.
    causes:
        - Genética (heredabilidad de alrededor del 50 %), inicio temprano del
          consumo, estrés, trauma, condiciones de salud mental y entorno social.
    treatment:
        - Los medicamentos incluyen naltrexona, acamprosato y disulfiram. La
          orientación psicológica, la TCC, la entrevista motivacional y los
          grupos de ayuda mutua apoyan la recuperación. La abstinencia tras un
          consumo intenso y prolongado puede ser peligrosa y requerir
          supervisión médica.
    course:
        A menudo es crónico y con recaídas, pero muchas personas se recuperan,
        sobre todo con tratamiento.
    prevalence:
        Alrededor de 1 de cada 10 adultos en EE. UU. en un año determinado.
psych:oud:
    name: Trastorno por consumo de opioides
    short: Trastorno por consumo de opioides
    aka:
        - trastorno por consumo de opioides
        - trastorno por uso de opioides
        - adicción a los opioides
        - adicción a opiáceos
    summary:
        El trastorno por consumo de opioides es una condición crónica que
        implica el consumo compulsivo de opioides como la heroína, el fentanilo
        o analgésicos con receta a pesar del daño. Conlleva un alto riesgo de
        sobredosis mortal.
    overview:
        - El trastorno por consumo de opioides es una condición crónica y
          tratable que implica el consumo compulsivo de opioides como la
          heroína, el fentanilo o analgésicos con receta a pesar del daño. La
          dependencia física se desarrolla rápidamente y la abstinencia es
          intensamente desagradable, lo que impulsa con fuerza a seguir
          consumiendo.
        - La actual crisis de sobredosis se debe principalmente al fentanilo de
          fabricación ilícita, que es extremadamente potente. Los medicamentos
          para el trastorno por consumo de opioides son muy eficaces y reducen
          sustancialmente las muertes por sobredosis, pero siguen
          infrautilizándose.
    brain:
        vta:
            Los opioides inhiben los frenos de las neuronas dopaminérgicas del
            ATV y liberan un pico de dopamina que produce euforia y refuerza el
            consumo.
        nacc:
            Los picos repetidos remodelan el centro de recompensa y generan un
            ansia intensa e impulsos desencadenados por señales.
        lc:
            Los opioides suprimen el locus coeruleus; durante la abstinencia
            rebota hacia una hiperactividad que causa ansiedad, sudoración y
            agitación.
        medulla:
            Los centros respiratorios son muy sensibles a los opioides; la
            sobredosis mata principalmente al detener la respiración.
        antinsula: Convierte el malestar de la abstinencia en ansia.
        ofc:
            Una toma de decisiones alterada favorece el consumo de la droga
            frente a otras recompensas.
    symptoms:
        - Ansia intensa
        - Tolerancia
        - "Abstinencia: dolores, sudoración, diarrea, ansiedad, insomnio"
        - Pérdida de control sobre el consumo
        - Consumo continuado a pesar del daño
        - Riesgo de sobredosis
    diagnosis:
        Se basa en criterios del DSM-5 similares a los del trastorno por consumo
        de alcohol.
    causes:
        - Exposición a opioides, genética, dolor crónico, trauma, condiciones de
          salud mental y factores sociales.
    treatment:
        - La buprenorfina, la metadona y la naltrexona de liberación prolongada
          reducen las muertes por sobredosis y apoyan la recuperación. La
          naloxona revierte las sobredosis. La orientación psicológica y el
          apoyo a la recuperación ayudan.
    course:
        Crónico y con recaídas, pero el tratamiento farmacológico a largo plazo
        mejora enormemente la supervivencia y la recuperación.
    prevalence: Varios millones de personas en EE. UU.
psych:stimulant:
    name: Trastorno por consumo de estimulantes
    short: Trastorno por consumo de estimulantes
    aka:
        - trastorno por consumo de estimulantes
        - trastorno por uso de estimulantes
        - adicción a la cocaína
        - adicción a la metanfetamina
    summary:
        El trastorno por consumo de estimulantes implica un consumo problemático
        de cocaína, metanfetamina u otros estimulantes, con ansia, pérdida de
        control y consumo continuado a pesar del daño.
    overview:
        - El trastorno por consumo de estimulantes implica un consumo
          problemático de cocaína, metanfetamina u otros estimulantes, con
          ansia, patrones de consumo en atracón y consumo continuado a pesar del
          daño. Los estimulantes producen una euforia y una energía intensas
          seguidas de un bajón de agotamiento y ánimo bajo.
        - El consumo intenso puede causar paranoia y psicosis, infartos de
          miocardio, accidentes cerebrovasculares y, cada vez más, sobredosis
          cuando los estimulantes están contaminados con fentanilo.
    brain:
        nacc:
            Los estimulantes bloquean la recaptación de dopamina o fuerzan su
            liberación, inundando el centro de recompensa de dopamina y
            produciendo una euforia y un ansia intensas.
        vta:
            Los circuitos dopaminérgicos se adaptan con el consumo repetido y
            reducen la respuesta del cerebro a las recompensas naturales.
        caudate:
            El consumo pasa de estar dirigido a metas a estar impulsado por el
            hábito.
        ofc: Valoración alterada y actividad reducida durante la abstinencia.
        acc: Supervisión de errores y control más débiles.
    symptoms:
        - Patrones de consumo en atracón
        - Ansia intensa
        - Paranoia o psicosis con el consumo intenso
        - Bajón de agotamiento y ánimo bajo
        - Pérdida de peso y alteración del sueño
    diagnosis:
        Se basa en criterios del DSM-5 similares a los de otros trastornos por
        consumo de sustancias.
    causes:
        - Genética, exposición temprana, trauma, condiciones de salud mental y
          entorno.
    treatment:
        - El manejo de contingencias tiene la evidencia más sólida. La TCC
          también ayuda. Todavía no hay medicamentos aprobados por la FDA.
    course:
        Crónico y con recaídas, pero la recuperación es frecuente con
        tratamiento.
    prevalence: Varios millones de personas en EE. UU.
psych:gambling:
    name: Trastorno por juego de apuestas
    short: Juego patológico
    aka:
        - trastorno por juego de apuestas
        - juego patológico
        - ludopatía
        - adicción al juego
        - trastorno de juego
    summary:
        El trastorno por juego de apuestas es un juego persistente y
        problemático que causa malestar o daño significativos. Es la única
        adicción conductual incluida en la sección diagnóstica principal del
        DSM-5.
    overview:
        - El trastorno por juego de apuestas es un juego persistente y
          problemático que causa malestar o daño significativos. Es la única
          adicción conductual incluida en la sección diagnóstica principal del
          DSM-5.
        - Activa los mismos circuitos de recompensa que las drogas. Las
          ganancias impredecibles y los «casi aciertos» son especialmente
          poderosos, y la persecución de las pérdidas impulsa apuestas y deudas
          cada vez mayores.
    brain:
        nacc:
            Responde con fuerza a las ganancias y a los casi aciertos, lo que
            refuerza el juego continuado.
        vmpfc: Valoración alterada de las elecciones arriesgadas.
        ofc: Toma de decisiones alterada.
        antinsula:
            Los efectos de los casi aciertos activan la ínsula y aumentan el
            impulso de seguir jugando.
    symptoms:
        - Necesitar apostar más para sentir emoción
        - Inquietud al intentar dejarlo
        - Perseguir las pérdidas
        - Mentir para ocultar el juego
        - Poner en riesgo relaciones o el trabajo
        - Depender de otros para obtener dinero
    diagnosis:
        Requiere cuatro o más de los nueve criterios del DSM-5 en el plazo de un
        año.
    causes:
        - Genética, impulsividad, ganancias tempranas, fácil acceso y,
          raramente, medicamentos agonistas dopaminérgicos usados para la
          enfermedad de Parkinson.
    treatment:
        - La TCC tiene el mayor respaldo; la naltrexona cuenta con cierta
          evidencia. Los programas de autoexclusión y los grupos de apoyo
          ayudan.
    course: Puede ser crónico, pero muchas personas se recuperan.
    prevalence: Alrededor del 0,5–1 % de los adultos.
psych:bpd:
    name: Trastorno límite de la personalidad
    short: TLP
    aka:
        - trastorno límite de la personalidad
        - tlp
        - personalidad límite
        - borderline
        - trastorno de inestabilidad emocional de la personalidad
    summary:
        El trastorno límite de la personalidad es un patrón duradero de
        emociones intensas e inestables, relaciones e imagen de sí mismo
        inestables, e impulsividad. Las emociones suben rápido, se viven con
        mucha intensidad y tardan en calmarse. Suele aparecer en la adolescencia
        o al inicio de la edad adulta, y muchas personas mejoran sustancialmente
        con tratamiento.
    overview:
        - El trastorno límite de la personalidad es un patrón duradero de
          emociones intensas e inestables, relaciones e imagen de sí mismo
          inestables, e impulsividad. Las emociones suben rápidamente, se viven
          con mucha intensidad y tardan en calmarse. Suele aparecer en la
          adolescencia o al inicio de la edad adulta.
        - Un modelo muy utilizado describe el TLP como el resultado de una alta
          sensibilidad emocional biológica que se encuentra con un entorno que
          invalidó o castigó las emociones. Las personas con TLP suelen
          experimentar un miedo intenso al abandono y pueden reaccionar con
          fuerza ante un rechazo percibido. Las autolesiones y la conducta
          suicida son frecuentes y graves.
        - El TLP es muy tratable, y los estudios a largo plazo muestran que la
          mayoría de las personas mejora sustancialmente con el tiempo.
    brain:
        amygdala:
            Detecta amenazas emocionales. En el TLP reacciona con más fuerza a
            señales sociales, como un rostro neutro o una respuesta que tarda, y
            le cuesta más calmarse después. Junto con una regulación prefrontal
            más débil, esto ayuda a explicar los cambios de ánimo rápidos e
            intensos y el miedo al abandono.
        vlpfc:
            Regula las emociones de arriba abajo. Su menor actividad debilita el
            freno sobre las reacciones emocionales, de modo que los sentimientos
            escalan rápidamente.
        acc:
            Vigila el conflicto y ayuda a regular las emociones y los impulsos.
            Su menor actividad y volumen se asocian con dificultad para hacer
            una pausa antes de actuar movido por sentimientos intensos.
        ofc:
            Su actividad alterada se asocia con impulsividad y dificultad para
            sopesar las consecuencias.
        hippocampus:
            Un volumen menor, a menudo asociado con traumas tempranos, puede
            afectar la memoria emocional y la regulación del estrés.
        antinsula:
            Una mayor sensibilidad a la exclusión social hace que el rechazo
            resulte especialmente doloroso.
    symptoms:
        - Miedo intenso al abandono
        - Relaciones inestables e intensas que oscilan entre la idealización y
          la devaluación
        - Sentido de identidad inestable
        - Conductas impulsivas
        - Autolesiones o conducta suicida recurrentes
        - Cambios rápidos de ánimo que duran de horas a días
        - Sensación crónica de vacío
        - Ira intensa y difícil de controlar
        - Paranoia o disociación relacionadas con el estrés
    diagnosis:
        Requiere al menos cinco de nueve criterios, que comiencen al inicio de
        la edad adulta y estén presentes en distintos contextos. Los clínicos
        descartan el trastorno bipolar, el TEPT y los efectos de sustancias, que
        a menudo coexisten.
    causes:
        - Sensibilidad emocional biológica (heredabilidad de alrededor del 40 %)
          combinada con un entorno invalidante, trauma infantil, negligencia o
          vínculos de apego inestables.
    treatment:
        - La terapia dialéctico-conductual (TDC), que enseña regulación
          emocional, tolerancia al malestar, atención plena (mindfulness) y
          habilidades interpersonales, tiene la evidencia más sólida. El
          tratamiento basado en la mentalización, la terapia de esquemas y la
          psicoterapia focalizada en la transferencia también funcionan. La
          medicación puede ayudar con síntomas concretos, pero no es un
          tratamiento principal.
    course:
        "La evolución es mejor de lo que se creía: en estudios a largo plazo, la
        mayoría de las personas con TLP ya no cumple los criterios diagnósticos
        al cabo de 10 años, aunque algunas dificultades pueden persistir."
    prevalence:
        Alrededor del 1,5–2 % de los adultos; mucho más frecuente en entornos
        clínicos.
    fact:
        "La evolución es mejor de lo que se creía: en estudios a largo plazo, la
        mayoría de las personas con TLP ya no cumple los criterios diagnósticos
        al cabo de 10 años."
psych:aspd:
    name: Trastorno antisocial de la personalidad
    short: TAP
    aka:
        - trastorno antisocial de la personalidad
        - tap
        - personalidad antisocial
        - sociopatía
        - psicopatía
    summary:
        El trastorno antisocial de la personalidad es un patrón duradero de
        desprecio y violación de los derechos de los demás, que comienza con
        problemas de conducta antes de los 15 años. La psicopatía, un concepto
        de investigación relacionado, añade emociones superficiales y falta de
        empatía y de remordimiento.
    overview:
        - El trastorno antisocial de la personalidad es un patrón duradero de
          desprecio y violación de los derechos de los demás, que comienza con
          problemas de conducta antes de los 15 años y solo se diagnostica en
          adultos. La psicopatía es un concepto de investigación relacionado
          pero más restringido, que añade emociones superficiales y una marcada
          falta de empatía y de remordimiento.
        - No todas las personas con TAP son violentas ni tienen rasgos
          psicopáticos, y el trastorno está muy sobrerrepresentado en las
          prisiones, donde hasta aproximadamente la mitad de los reclusos podría
          cumplir los criterios.
    brain:
        amygdala:
            La menor respuesta al miedo y al malestar ajeno, sobre todo en
            personas con rasgos psicopáticos, debilita las señales emocionales
            que normalmente disuaden de dañar a otros.
        vmpfc:
            Su menor actividad y volumen se asocian con una toma de decisiones
            morales deficiente y con no aprender del castigo.
        ofc:
            La reducción de sustancia gris se asocia con impulsividad y mal
            juicio.
        acc:
            Una supervisión de errores más débil dificulta ajustar la conducta
            después de equivocarse.
        nacc:
            Una mayor sensibilidad a la recompensa puede impulsar la conducta de
            riesgo.
    symptoms:
        - Incumplimiento repetido de normas o leyes
        - Engaño y manipulación
        - Impulsividad e incapacidad para planificar
        - Irritabilidad y agresividad
        - Desprecio temerario por la seguridad
        - Irresponsabilidad
        - Falta de remordimiento
    diagnosis:
        Requiere tener 18 años o más, evidencia de trastorno de conducta antes
        de los 15 y al menos tres de siete criterios.
    causes:
        - Genética, trastorno de conducta en la infancia, maltrato o
          negligencia, y una crianza dura o inconsistente.
    treatment:
        - Es difícil de tratar. Los enfoques se centran en el consumo de
          sustancias concurrente, el manejo de la ira y programas basados en la
          TCC. La intervención temprana en los problemas de conducta infantiles
          es lo más prometedor.
    course: La conducta antisocial suele disminuir después de los 40 años.
    prevalence: Alrededor del 1–3 % de los adultos; más frecuente en hombres.
psych:npd:
    name: Trastorno narcisista de la personalidad
    short: TNP
    aka:
        - trastorno narcisista de la personalidad
        - tnp
        - narcisismo
        - personalidad narcisista
    summary:
        El trastorno narcisista de la personalidad es un patrón generalizado de
        grandiosidad, necesidad de admiración y falta de empatía. Bajo una
        superficie segura, la autoestima suele ser frágil y muy sensible a la
        crítica.
    overview:
        - El trastorno narcisista de la personalidad es un patrón generalizado
          de grandiosidad, necesidad de admiración y falta de empatía. Bajo una
          superficie segura, la autoestima suele ser frágil y muy sensible a la
          crítica, que puede desencadenar vergüenza, ira o retraimiento.
        - Los investigadores distinguen entre el narcisismo grandioso (audaz,
          con sentido de derecho) y el narcisismo vulnerable (inseguro,
          hipersensible), que a menudo coexisten en la misma persona.
    brain:
        antinsula:
            La reducción de sustancia gris en la ínsula anterior izquierda se
            asocia con menor empatía, lo que puede dificultar sentir lo que
            sienten los demás.
        dmpfc:
            Un procesamiento alterado de la información sobre uno mismo puede
            contribuir a una imagen de sí inflada o inestable.
        acc:
            Una respuesta alterada a la exclusión social puede estar en la base
            de la sensibilidad a la crítica.
    symptoms:
        - Sentido exagerado de la propia importancia
        - Fantasías de éxito o poder
        - Necesidad de admiración excesiva
        - Sentido de tener derecho a privilegios
        - Aprovecharse de los demás
        - Falta de empatía
        - Envidia y arrogancia
    diagnosis:
        Requiere al menos cinco de nueve criterios que comiencen al inicio de la
        edad adulta.
    causes:
        - Genética y experiencias infantiles, incluidos tanto el elogio excesivo
          como la crítica dura.
    treatment:
        - Psicoterapia a largo plazo, como la psicoterapia focalizada en la
          transferencia o la terapia de esquemas.
    course: A menudo es estable, aunque algunos rasgos se suavizan con la edad.
    prevalence:
        Alrededor del 1 % de las personas; las estimaciones varían mucho.
psych:avpd:
    name: Trastorno de la personalidad evitativa
    short: TP evitativa
    aka:
        - trastorno de la personalidad evitativa
        - trastorno de la personalidad por evitación
        - personalidad evitativa
        - personalidad por evitación
    summary:
        El trastorno de la personalidad evitativa es un patrón generalizado de
        inhibición social, sentimientos de insuficiencia y una sensibilidad
        extrema a la crítica, que lleva a evitar el contacto social pese a
        desearlo.
    overview:
        - El trastorno de la personalidad evitativa es un patrón generalizado de
          inhibición social, sentimientos de insuficiencia y una sensibilidad
          extrema a la crítica, que lleva a evitar el contacto social pese a
          desearlo. Se solapa mucho con el trastorno de ansiedad social grave.
    brain:
        amygdala:
            Una mayor respuesta de amenaza ante señales sociales se solapa con
            la ansiedad social.
        antinsula: Mayor dolor social.
        dmpfc: Evaluación centrada en uno mismo.
    symptoms:
        - Evitar trabajos o actividades que impliquen trato con personas
        - No implicarse a menos que esté seguro de agradar
        - Contención en las relaciones íntimas
        - Preocupación por el rechazo
        - Sentirse inferior
    diagnosis:
        Requiere al menos cuatro de siete criterios que comiencen al inicio de
        la edad adulta.
    causes:
        - Temperamento tímido, genética y experiencias de rechazo.
    treatment:
        - TCC y terapia de esquemas; los ISRS pueden ayudar con la ansiedad.
    course:
        A menudo es crónico, pero la terapia puede conducir a una mejoría
        sustancial.
    prevalence: Alrededor del 2 % de las personas.
psych:ocpd:
    name: Trastorno obsesivo-compulsivo de la personalidad
    short: TOCP
    aka:
        - trastorno obsesivo-compulsivo de la personalidad
        - tocp
        - personalidad obsesivo-compulsiva
        - personalidad anancástica
    summary:
        El TOCP es una preocupación generalizada por el orden, el perfeccionismo
        y el control a costa de la flexibilidad y la eficiencia. A diferencia
        del TOC, normalmente no hay verdaderas obsesiones ni compulsiones, y la
        persona considera que sus normas son las correctas.
    overview:
        - El TOCP es una preocupación generalizada por el orden, el
          perfeccionismo y el control a costa de la flexibilidad y la
          eficiencia. A diferencia del TOC, normalmente no hay verdaderas
          obsesiones ni compulsiones, y las personas consideran sus normas
          correctas en lugar de angustiantes.
    brain:
        dlpfc: Control cognitivo alterado (investigación limitada).
        caudate: Se ha propuesto cierto solapamiento con los circuitos del TOC.
        ofc: Valoración rígida (investigación limitada).
    symptoms:
        - Preocupación por los detalles, las normas y las listas
        - Perfeccionismo que impide terminar las tareas
        - Dedicación excesiva al trabajo
        - Moral rígida
        - Reticencia a delegar
        - Terquedad
    diagnosis:
        Requiere al menos cuatro de ocho criterios que comiencen al inicio de la
        edad adulta.
    causes:
        - Genética y temperamento; a menudo se presenta en varias personas de la
          misma familia.
    treatment:
        - TCC y terapia psicodinámica.
    course: A menudo es estable a lo largo del tiempo.
    prevalence:
        Alrededor del 2–8 % de las personas; uno de los trastornos de la
        personalidad más frecuentes.
psych:stpd:
    name: Trastorno esquizotípico de la personalidad
    short: TP esquizotípica
    aka:
        - trastorno esquizotípico de la personalidad
        - personalidad esquizotípica
        - esquizotipia
    summary:
        El trastorno esquizotípico de la personalidad implica déficits sociales
        e interpersonales, un malestar agudo en las relaciones cercanas y
        creencias, percepciones o conductas extrañas. Está relacionado
        genéticamente con la esquizofrenia, pero sin psicosis sostenida.
    overview:
        - El trastorno esquizotípico de la personalidad implica déficits
          sociales e interpersonales, un malestar agudo en las relaciones
          cercanas y creencias, percepciones o conductas extrañas. Comparte
          riesgo genético con la esquizofrenia, pero sin psicosis sostenida.
    brain:
        stg:
            Una circunvolución temporal superior izquierda más pequeña, similar
            a la de la esquizofrenia, puede relacionarse con las percepciones
            inusuales.
        dlpfc:
            Cambios leves en la memoria de trabajo y en la corteza prefrontal.
        latvent: Leve agrandamiento ventricular en algunos estudios.
    symptoms:
        - Ideas de referencia
        - Creencias extrañas o pensamiento mágico
        - Percepciones inusuales
        - Habla extraña y suspicacia
        - Pocos amigos íntimos
        - Ansiedad social que no disminuye con la familiaridad
    diagnosis:
        Requiere al menos cinco de nueve criterios que comiencen al inicio de la
        edad adulta.
    causes:
        - Comparte riesgo genético con la esquizofrenia.
    treatment:
        - Psicoterapia y entrenamiento en habilidades sociales; antipsicóticos
          en dosis bajas para algunos síntomas.
    course: Suele ser estable; una minoría desarrolla esquizofrenia.
    prevalence: Alrededor del 1–4 % de las personas.
psych:ppd:
    name: Trastorno paranoide de la personalidad
    short: TP paranoide
    aka:
        - trastorno paranoide de la personalidad
        - personalidad paranoide
    summary:
        El trastorno paranoide de la personalidad es una desconfianza y
        suspicacia generalizadas hacia los demás, interpretando sus motivos como
        malintencionados, sin los delirios fijos de la psicosis.
    overview:
        - El trastorno paranoide de la personalidad es una desconfianza y
          suspicacia generalizadas hacia los demás, interpretando sus motivos
          como malintencionados, sin los delirios fijos de la psicosis.
    brain:
        amygdala:
            Se propone una mayor detección de amenazas; la investigación directa
            con neuroimagen es limitada.
    symptoms:
        - Sospechar que los demás se aprovechan de uno o lo engañan
        - Dudar de la lealtad de los amigos
        - Reticencia a confiar en otros
        - Ver amenazas en comentarios inofensivos
        - Guardar rencor
    diagnosis:
        Requiere al menos cuatro de siete criterios que comiencen al inicio de
        la edad adulta.
    causes:
        - Posibles vínculos genéticos con la esquizofrenia y adversidad
          temprana.
    treatment:
        - Psicoterapia centrada en construir confianza.
    course: A menudo es crónico.
    prevalence: Alrededor del 2–4 % de las personas.
psych:szpd:
    name: Trastorno esquizoide de la personalidad
    short: TP esquizoide
    aka:
        - trastorno esquizoide de la personalidad
        - personalidad esquizoide
    summary:
        El trastorno esquizoide de la personalidad es un patrón generalizado de
        desapego de las relaciones sociales y un rango restringido de expresión
        emocional. Las personas prefieren actividades solitarias y parecen
        indiferentes al elogio o a la crítica.
    overview:
        - El trastorno esquizoide de la personalidad es un patrón generalizado
          de desapego de las relaciones sociales y un rango restringido de
          expresión emocional. Las personas prefieren actividades solitarias y
          parecen indiferentes al elogio o a la crítica.
    brain:
        nacc:
            Se propone una menor respuesta a la recompensa social; la
            investigación con neuroimagen es muy limitada.
    symptoms:
        - Poco deseo de relaciones cercanas
        - Elegir actividades solitarias
        - Poco interés en tener experiencias sexuales con otras personas
        - Disfrutar de pocas actividades
        - Frialdad o aplanamiento emocional
    diagnosis:
        Requiere al menos cuatro de siete criterios que comiencen al inicio de
        la edad adulta.
    causes:
        - Se sospechan vínculos genéticos con el espectro de la esquizofrenia.
    treatment:
        - Las personas rara vez buscan tratamiento; la psicoterapia puede ayudar
          cuando lo hacen.
    course: Suele ser estable.
    prevalence: Menos del 1–3 % de las personas.
psych:hpd:
    name: Trastorno histriónico de la personalidad
    short: TP histriónica
    aka:
        - trastorno histriónico de la personalidad
        - personalidad histriónica
    summary:
        El trastorno histriónico de la personalidad es un patrón de emotividad
        excesiva y búsqueda de atención, con la necesidad de ser el centro de
        atención.
    overview:
        - El trastorno histriónico de la personalidad es un patrón de emotividad
          excesiva y búsqueda de atención, con la necesidad de ser el centro de
          atención.
    brain:
        amygdala:
            Se propone una mayor reactividad emocional; casi no existe
            investigación con neuroimagen.
    symptoms:
        - Malestar cuando no se es el centro de atención
        - Emociones superficiales que cambian rápidamente
        - Usar el aspecto físico para llamar la atención
        - Expresión dramática y teatral
        - Ser fácilmente influenciable
    diagnosis:
        Requiere al menos cinco de ocho criterios que comiencen al inicio de la
        edad adulta.
    causes:
        - Genética y experiencias tempranas; existe poca investigación.
    treatment:
        - Psicoterapia.
    course: Los rasgos pueden suavizarse con la edad.
    prevalence: Alrededor del 1–2 % de las personas.
psych:dpd:
    name: Trastorno de la personalidad dependiente
    short: TP dependiente
    aka:
        - trastorno de la personalidad dependiente
        - trastorno dependiente de la personalidad
        - personalidad dependiente
    summary:
        El trastorno de la personalidad dependiente es una necesidad
        generalizada y excesiva de que otros se ocupen de uno, que lleva a una
        conducta sumisa y de apego excesivo, y a miedo a la separación.
    overview:
        - El trastorno de la personalidad dependiente es una necesidad
          generalizada y excesiva de que otros se ocupen de uno, que lleva a una
          conducta sumisa y de apego excesivo, y a miedo a la separación.
    brain:
        amygdala:
            Se propone una mayor ansiedad ante la separación; la investigación
            con neuroimagen es muy limitada.
    symptoms:
        - Dificultad para tomar decisiones cotidianas sin que otros le den
          seguridad
        - Necesitar que otros asuman la responsabilidad
        - Dificultad para expresar desacuerdo
        - Buscar con urgencia una nueva relación cuando termina una
        - Miedo a quedarse solo y tener que cuidar de sí mismo
    diagnosis:
        Requiere al menos cinco de ocho criterios que comiencen al inicio de la
        edad adulta.
    causes:
        - Crianza sobreprotectora o autoritaria, temperamento ansioso y
          enfermedad crónica en la infancia.
    treatment:
        - Psicoterapia centrada en desarrollar la independencia y la
          asertividad.
    course: Puede mejorar con terapia.
    prevalence: Menos del 1 % de las personas.
psych:conduct:
    name: Trastorno de conducta
    short: Trastorno de conducta
    aka:
        - trastorno de conducta
        - trastorno disocial
        - trastorno de la conducta
    summary:
        El trastorno de conducta es un patrón repetitivo en niños o adolescentes
        de violación de los derechos básicos de los demás o de normas sociales
        importantes, como la agresión a personas o animales, la destrucción de
        propiedad, el engaño y el incumplimiento grave de normas.
    overview:
        - El trastorno de conducta es un patrón repetitivo en niños o
          adolescentes de violación de los derechos básicos de los demás o de
          normas sociales importantes, como la agresión, la destrucción de
          propiedad, el engaño y el incumplimiento grave de normas.
        - Un subgrupo con rasgos de insensibilidad emocional (culpa, empatía y
          preocupación por el propio desempeño limitadas) tiende a presentar
          problemas más graves y persistentes y patrones cerebrales subyacentes
          distintos.
    brain:
        amygdala:
            La menor respuesta al malestar ajeno, sobre todo con rasgos de
            insensibilidad emocional, debilita las señales que normalmente
            disuaden de dañar a otros.
        vmpfc: Menor actividad durante la toma de decisiones.
        antinsula: Empatía y conciencia emocional alteradas.
        ofc: Menor sensibilidad al castigo.
    symptoms:
        - Agresión, acoso o peleas
        - Destrucción de propiedad
        - Mentiras y robos
        - Incumplimientos graves de normas, como escaparse de casa
        - "En algunos, rasgos de insensibilidad emocional: poca culpa o empatía"
    diagnosis:
        Requiere al menos tres de 15 criterios en el último año. Los
        especificadores incluyen el inicio en la infancia frente al inicio en la
        adolescencia, y las emociones prosociales limitadas.
    causes:
        - Genética, crianza dura o inconsistente, maltrato, violencia en el
          barrio e influencia de los compañeros.
    treatment:
        - El entrenamiento para padres en manejo de la conducta, la terapia
          multisistémica y los programas escolares funcionan mejor cuando se
          inician pronto.
    course:
        Muchos mejoran al llegar a la edad adulta, pero el inicio en la infancia
        aumenta el riesgo de trastorno antisocial de la personalidad.
    prevalence: Alrededor del 2–10 % de los niños y adolescentes.
psych:ied:
    name: Trastorno explosivo intermitente
    short: TEI
    aka:
        - trastorno explosivo intermitente
        - tei
        - ataques de ira
    summary:
        El trastorno explosivo intermitente implica arrebatos recurrentes e
        impulsivos de agresión verbal o física, muy desproporcionados respecto
        al desencadenante y no planificados.
    overview:
        - El trastorno explosivo intermitente implica arrebatos recurrentes e
          impulsivos de agresión verbal o física, muy desproporcionados respecto
          al desencadenante y no planificados.
    brain:
        amygdala:
            Una respuesta hiperactiva ante rostros enfadados y provocaciones
            alimenta una ira rápida.
        ofc:
            Una menor regulación de las respuestas de ira hace que el freno
            actúe demasiado tarde.
        acc: Control más débil sobre las reacciones impulsivas.
    symptoms:
        - Arrebatos repentinos de ira
        - Agresión verbal o física
        - Sentir alivio y después arrepentimiento
    diagnosis:
        Requiere arrebatos verbales frecuentes (dos veces por semana durante
        tres meses) o tres arrebatos con daños en un año, con inicio después de
        los 6 años.
    causes:
        - Genética, exposición a la violencia en la infancia y diferencias en el
          sistema de la serotonina.
    treatment:
        - TCC centrada en la regulación de la ira; ISRS.
    course: A menudo comienza en la adolescencia y puede ser crónico.
    prevalence: Alrededor del 2–3 % de los adultos en un año dado.
psych:delirium:
    name: Delírium
    short: Delírium
    aka:
        - delírium
        - delirium
        - síndrome confusional agudo
        - estado confusional agudo
    summary:
        El delírium es una alteración aguda y fluctuante de la atención y la
        conciencia que se desarrolla en horas o días, generalmente causada por
        una enfermedad médica, una infección, una cirugía, un medicamento o la
        abstinencia de sustancias. Es una urgencia médica.
    overview:
        - El delírium es una alteración aguda y fluctuante de la atención y la
          conciencia que se desarrolla en horas o días, generalmente causada por
          una enfermedad médica subyacente, una infección, una cirugía, un
          medicamento o la abstinencia de sustancias. Es una urgencia médica.
        - Puede ser hiperactivo (agitado), hipoactivo (tranquilo y retraído,
          fácil de pasar por alto) o mixto. El delírium aumenta el riesgo de
          deterioro cognitivo a largo plazo y de muerte, sobre todo en adultos
          mayores.
    brain:
        thalamus: Alteración del filtrado de la activación y la atención.
        dlpfc: Alteración de las redes atencionales.
        pcc: Conectividad alterada de la red neuronal por defecto.
    symptoms:
        - Incapacidad para concentrarse o cambiar el foco de atención
        - Confusión y desorientación
        - Nivel de alerta fluctuante
        - Alucinaciones
        - Alteración del ciclo de sueño y vigilia
    diagnosis:
        Herramientas de cabecera como el CAM (Método de Evaluación de la
        Confusión) ayudan a detectarlo; la causa se identifica mediante la
        exploración, los análisis de laboratorio y la revisión de la medicación.
    causes:
        - Infecciones, cirugía, deshidratación, medicamentos, abstinencia de
          alcohol e insuficiencia de órganos. La edad avanzada y la demencia
          aumentan el riesgo.
    treatment:
        - Buscar y tratar la causa; mantener a la persona orientada, en
          movimiento y durmiendo bien; evitar sedantes innecesarios.
    course:
        A menudo se resuelve al tratar la causa, pero puede dejar efectos
        cognitivos duraderos.
    prevalence:
        Afecta a un tercio o más de los pacientes mayores hospitalizados.
disease:alzheimers:
    name: Enfermedad de Alzheimer
    short: Alzheimer
    aka:
        - enfermedad de alzheimer
        - alzheimer
        - alzheimers
        - mal de alzheimer
        - demencia tipo alzheimer
    summary:
        "La enfermedad de Alzheimer es una enfermedad cerebral progresiva y la
        causa más frecuente de demencia. Se acumulan dos proteínas anómalas: el
        beta-amiloide forma placas entre las neuronas y la tau forma ovillos
        dentro de ellas. Las neuronas y las sinapsis se pierden gradualmente,
        primero en las regiones de la memoria del lóbulo temporal medial y
        después en gran parte de la corteza. Los cambios cerebrales comienzan
        15–20 años antes de los síntomas."
    overview:
        - La enfermedad de Alzheimer es una enfermedad neurodegenerativa
          progresiva y la causa más frecuente de demencia, responsable de un
          estimado del 60–80 % de los casos. Destruye lentamente la memoria, el
          pensamiento y, con el tiempo, la capacidad de realizar las tareas
          cotidianas.
        - La definen dos proteínas anómalas. El beta-amiloide se agrupa en
          placas entre las neuronas, y la tau, que normalmente estabiliza el
          esqueleto interno de las neuronas, se pliega mal y forma ovillos
          dentro de ellas. El amiloide se acumula primero, 15–20 años antes de
          los síntomas; la tau se propaga a lo largo de redes conectadas y se
          corresponde estrechamente con los síntomas y la pérdida neuronal. La
          inflamación causada por la microglía y el daño de los vasos sanguíneos
          pequeños se suman a la lesión.
        - "Como la tau suele propagarse desde el lóbulo temporal medial hacia
          fuera, la enfermedad sigue un orden reconocible: primero la memoria
          reciente, luego el lenguaje, las habilidades espaciales y el juicio, y
          por último funciones básicas como caminar y tragar."
    brain:
        entorhinal:
            La puerta de entrada al hipocampo suele ser la primera área cortical
            en desarrollar ovillos de tau. Su pérdida corta el flujo de
            información nueva hacia la memoria y altera las células de
            cuadrícula, lo que podría explicar por qué desorientarse es una
            señal temprana.
        hippocampus:
            Forma los recuerdos nuevos. Su atrofia temprana, visible en la
            resonancia magnética, causa la dificultad característica para
            recordar conversaciones y sucesos recientes mientras los recuerdos
            antiguos se conservan.
        pcc:
            Es un nodo de la red neuronal por defecto. La reducción del
            metabolismo aquí es uno de los hallazgos más tempranos en la PET,
            relacionado con problemas de orientación y de memoria
            autobiográfica.
        precuneus:
            Es una de las primeras áreas en acumular amiloide; su menor función
            afecta la imaginación visual y la autoconciencia.
        lc:
            La tau suele aparecer aquí años antes que en cualquier otro lugar.
            La pérdida de noradrenalina podría contribuir a los problemas de
            atención, los cambios de ánimo y la inflamación.
        angular:
            Cuando la enfermedad se extiende a la corteza parietal, las personas
            tienen dificultades con las tareas espaciales, la lectura, la
            escritura y los números.
        temporal:
            La atrofia se extiende por el lóbulo temporal y causa dificultad
            para encontrar palabras y pérdida de conocimientos.
        latvent:
            Se agrandan a medida que el tejido circundante se reduce, un
            marcador visible de atrofia cerebral en las imágenes.
        frontal:
            La afectación frontal en las etapas tardías altera el juicio, la
            planificación y la conducta.
    symptoms:
        - Olvidar conversaciones y sucesos recientes
        - Repetir preguntas e historias
        - Perderse en lugares conocidos
        - Dificultad para planificar, manejar el dinero y realizar tareas
          complejas
        - Dificultad para encontrar palabras
        - Extraviar objetos y no poder reconstruir los pasos
        - Cambios de ánimo y de personalidad, aislamiento, ansiedad
        - "En etapas avanzadas: pérdida del habla, la movilidad y la deglución,
          y necesidad de cuidados a tiempo completo"
    diagnosis:
        "El diagnóstico combina la historia aportada por la persona y su
        familia, pruebas cognitivas (como el MoCA) y estudios para descartar
        otras causas como enfermedad tiroidea, déficit de vitamina B12,
        depresión y efectos de medicamentos. La resonancia magnética muestra
        patrones de atrofia. Los biomarcadores permiten ahora el diagnóstico en
        vida: PET de amiloide y de tau, pruebas en líquido cefalorraquídeo y
        análisis de sangre cada vez más precisos de tau fosforilada (como la
        p-tau217)."
    types:
        - "Preclínica: hay amiloide y tau, sin síntomas."
        - "Deterioro cognitivo leve debido al Alzheimer: problemas de memoria
          perceptibles, con la independencia conservada."
        - "Demencia leve: se necesita ayuda con tareas complejas como las
          finanzas."
        - "Demencia moderada: ayuda con las actividades diarias, confusión,
          cambios de conducta."
        - "Demencia grave: pérdida de la comunicación y la movilidad."
        - El Alzheimer de inicio temprano (antes de los 65 años) representa
          alrededor del 5–10 % de los casos; las variantes atípicas comienzan
          con síntomas visuales (atrofia cortical posterior), del lenguaje o
          conductuales.
    causes:
        - La edad es el factor de riesgo más fuerte. La variante APOE ε4
          multiplica el riesgo por unas 3 con una copia y mucho más con dos.
          Mutaciones raras en APP, PSEN1 o PSEN2 causan la forma familiar de
          inicio temprano, y el síndrome de Down aumenta el riesgo porque el
          cromosoma 21 contiene el gen APP.
        - La Comisión Lancet estima que hasta alrededor del 45 % de los casos de
          demencia en el mundo podrían retrasarse o prevenirse actuando sobre
          factores de riesgo modificables, como la pérdida auditiva, la presión
          arterial alta, la diabetes, el tabaquismo, la inactividad física, el
          bajo nivel educativo, la depresión, el aislamiento social, el consumo
          excesivo de alcohol, la contaminación del aire, el colesterol LDL alto
          y la pérdida de visión no tratada.
    treatment:
        - Los inhibidores de la colinesterasa (donepezilo, rivastigmina,
          galantamina) y la memantina mejoran modestamente los síntomas durante
          un tiempo.
        - Los anticuerpos antiamiloide, lecanemab y donanemab, eliminan las
          placas y frenan el deterioro aproximadamente entre una cuarta parte y
          un tercio a lo largo de 18 meses en la enfermedad temprana. Requieren
          confirmar la presencia de amiloide y vigilancia periódica con
          resonancia magnética, y conllevan riesgo de edema o sangrado cerebral
          (ARIA), mayor en portadores de APOE ε4.
        - "La atención no farmacológica es fundamental: ejercicio, participación
          social, audífonos, control de la presión arterial y la diabetes, un
          hogar seguro, apoyo a los cuidadores y planificación anticipada de los
          cuidados."
    course:
        El Alzheimer progresa a lo largo de un promedio de unos 8–10 años tras
        el diagnóstico, con gran variación. Las personas suelen vivir bien
        durante años en las primeras etapas. La muerte suele deberse a
        complicaciones como la neumonía.
    prevalence:
        Más de 7 millones de estadounidenses de 65 años o más; la demencia
        afecta a unos 57 millones de personas en todo el mundo.
    fact:
        Alois Alzheimer describió la enfermedad en 1906 tras examinar el cerebro
        de su paciente Auguste Deter.
disease:parkinsons:
    name: Enfermedad de Parkinson
    short: Parkinson
    aka:
        - enfermedad de parkinson
        - parkinson
        - parkinsons
        - mal de parkinson
    summary:
        La enfermedad de Parkinson es un trastorno progresivo causado
        principalmente por la pérdida de las neuronas productoras de dopamina de
        la sustancia negra. En las neuronas se acumulan agregados de la proteína
        alfa-sinucleína, llamados cuerpos de Lewy. Sin suficiente dopamina en el
        cuerpo estriado, los ganglios basales no pueden liberar el movimiento
        con normalidad, lo que causa lentitud, rigidez y temblor.
    overview:
        - "La enfermedad de Parkinson es un trastorno neurodegenerativo
          progresivo conocido sobre todo por sus síntomas motores: lentitud,
          rigidez, temblor y problemas de equilibrio. Surgen cuando mueren las
          neuronas productoras de dopamina de la sustancia negra, lo que priva
          al cuerpo estriado de la dopamina que necesita para liberar el
          movimiento."
        - Es mucho más que un trastorno del movimiento. Los agregados de
          alfa-sinucleína llamados cuerpos de Lewy se propagan por el sistema
          nervioso, a menudo comenzando en el intestino y la parte baja del
          tronco encefálico o en el bulbo olfatorio años antes de los síntomas
          motores. La pérdida del olfato, el estreñimiento, escenificar los
          sueños, la depresión y la ansiedad pueden preceder al diagnóstico en
          una década o más.
    brain:
        sn:
            Contiene las neuronas dopaminérgicas que abastecen al cuerpo
            estriado. Su muerte elimina la señal que permite un movimiento
            fluido y de amplitud adecuada, lo que causa lentitud y rigidez. Los
            síntomas aparecen cuando ya se ha perdido una gran parte de estas
            neuronas.
        putamen:
            La parte motora del cuerpo estriado pierde su aporte de dopamina
            primero y de forma más grave, por lo que los ganglios basales no
            pueden liberar el movimiento con normalidad.
        gp:
            Sin dopamina, su salida se vuelve hiperactiva y frena el movimiento
            a través del tálamo.
        stn:
            Se vuelve hiperactivo en el Parkinson y es la principal diana de la
            estimulación cerebral profunda.
        olfactory:
            Está entre las primeras áreas afectadas, lo que explica la pérdida
            temprana del olfato.
        medulla:
            En el modelo de estadificación de Braak, la patología de Lewy
            comienza en la parte baja del tronco encefálico, lo que se relaciona
            con el estreñimiento y los problemas autonómicos.
        lc:
            La pérdida de neuronas noradrenérgicas contribuye a la depresión,
            los problemas de atención y la presión arterial baja al ponerse de
            pie.
        pons:
            La afectación de los circuitos del sueño REM elimina la parálisis
            muscular durante los sueños, lo que causa el trastorno de conducta
            del sueño REM.
    symptoms:
        - Temblor en reposo, que a menudo empieza en una mano
        - "Bradicinesia: lentitud y movimientos cada vez más pequeños"
        - Rigidez
        - Marcha arrastrando los pies, congelamiento y problemas de equilibrio
        - Voz baja, letra pequeña, menor expresión facial
        - Pérdida del olfato, estreñimiento, escenificar los sueños
        - Depresión, ansiedad, apatía
        - "Más adelante: deterioro cognitivo, alucinaciones"
    diagnosis:
        El diagnóstico es clínico y se basa en la bradicinesia junto con temblor
        o rigidez; una buena respuesta a la levodopa lo respalda. Un DaTscan
        puede mostrar la pérdida de terminales dopaminérgicas. Una prueba más
        reciente en piel o líquido cefalorraquídeo (ensayo de amplificación de
        semillas) puede detectar alfa-sinucleína anómala.
    types:
        - Los subtipos con predominio de temblor y con inestabilidad
          postural/alteración de la marcha tienen evoluciones distintas.
        - El Parkinson de inicio juvenil comienza antes de los 50 años y es con
          más frecuencia genético.
        - Los "parkinsonismos atípicos" relacionados incluyen la atrofia
          multisistémica, la parálisis supranuclear progresiva y la demencia con
          cuerpos de Lewy.
    causes:
        - La edad es el principal factor de riesgo. Alrededor del 10–15 % de los
          casos se relacionan con genes como LRRK2, GBA1 y SNCA. La exposición a
          pesticidas, algunos solventes, los traumatismos craneales y vivir en
          zonas rurales aumentan el riesgo; el tabaquismo y la cafeína se
          asocian a un menor riesgo.
    treatment:
        - La levodopa (con carbidopa) es el medicamento más eficaz. Otros
          incluyen los agonistas dopaminérgicos, los inhibidores de la MAO-B y
          los inhibidores de la COMT. Con los años pueden aparecer fluctuaciones
          motoras y discinesias.
        - La estimulación cerebral profunda del núcleo subtalámico o del globo
          pálido ayuda a pacientes seleccionados, y el ultrasonido focalizado es
          una opción para el temblor. El ejercicio, la fisioterapia, la terapia
          del habla y el tratamiento de los síntomas no motores son esenciales.
    course:
        El Parkinson progresa lentamente a lo largo de muchos años. La mayoría
        de las personas tienen muchos años de buen funcionamiento con
        tratamiento; las etapas avanzadas pueden traer caídas, problemas para
        tragar y demencia.
    prevalence:
        Más de 10 millones de personas en todo el mundo, y en aumento a medida
        que la población envejece.
    fact:
        Los síntomas motores suelen aparecer solo cuando ya se ha perdido una
        gran parte de las neuronas dopaminérgicas nigrales, a menudo estimada en
        un 50–80 %.
disease:huntingtons:
    name: Enfermedad de Huntington
    short: Huntington
    aka:
        - enfermedad de huntington
        - huntington
        - corea de huntington
        - mal de huntington
    summary:
        La enfermedad de Huntington es un trastorno hereditario que destruye
        neuronas del cuerpo estriado y, más tarde, de la corteza. Causa
        movimientos incontrolados (corea), deterioro cognitivo y síntomas
        psiquiátricos, y suele comenzar entre los 30 y los 50 años.
    overview:
        - La enfermedad de Huntington es un trastorno neurodegenerativo
          hereditario causado por una expansión de repeticiones CAG en el gen
          HTT. La proteína huntingtina mutante resultante es tóxica para las
          neuronas, especialmente para las neuronas espinosas medianas del
          cuerpo estriado.
        - Causa una tríada de problemas motores (sobre todo la corea), deterioro
          cognitivo y síntomas psiquiátricos, que suelen comenzar entre los 30 y
          los 50 años. Como es autosómica dominante, cada hijo de un progenitor
          afectado tiene un 50 % de probabilidad de heredarla, y las pruebas
          genéticas plantean decisiones personales complejas.
    brain:
        caudate:
            Sufre la pérdida neuronal más temprana y grave. La vía indirecta,
            que suprime los movimientos no deseados, falla primero y deja libre
            la corea.
        putamen: La pérdida neuronal grave altera el control motor.
        gp:
            La alteración de la salida de los ganglios basales agrava los
            problemas de movimiento.
        latvent:
            Se agrandan a medida que el caudado se reduce, un signo clásico en
            las imágenes.
        dlpfc:
            El adelgazamiento cortical y la pérdida de los circuitos
            frontoestriatales causan problemas ejecutivos y apatía.
    symptoms:
        - "Corea: movimientos involuntarios que parecen de danza"
        - Torpeza y problemas de equilibrio
        - Dificultad para planificar, organizar y hacer varias cosas a la vez
        - Depresión, irritabilidad, apatía y conductas compulsivas
        - "Más adelante: rigidez, dificultad para tragar y para hablar"
    diagnosis:
        El diagnóstico se confirma con una prueba genética de las repeticiones
        CAG; 40 o más repeticiones causan la enfermedad. Las pruebas predictivas
        en familiares en riesgo se realizan tras un cuidadoso asesoramiento
        genético.
    causes:
        - Una expansión de repeticiones CAG en el gen HTT, heredada con un
          patrón autosómico dominante. Las repeticiones más largas causan un
          inicio más temprano y pueden alargarse aún más cuando se transmiten
          por vía paterna.
    treatment:
        - Todavía no hay cura. La tetrabenazina, la deutetrabenazina y la
          valbenazina reducen la corea; los antidepresivos y los antipsicóticos
          tratan los síntomas psiquiátricos. La fisioterapia, la terapia
          ocupacional, la terapia del habla y el asesoramiento genético son
          importantes. Hay terapias de silenciamiento génico en ensayos
          clínicos.
    course:
        La enfermedad progresa a lo largo de unos 15–20 años desde el inicio de
        los síntomas.
    prevalence:
        Alrededor de 3–7 por cada 100.000 personas de ascendencia europea; es
        menos frecuente en otras poblaciones.
    fact:
        El cantante folk Woody Guthrie murió de la enfermedad de Huntington en
        1967.
disease:als:
    name: Esclerosis lateral amiotrófica
    short: ELA
    aka:
        - esclerosis lateral amiotrófica
        - ela
        - enfermedad de lou gehrig
        - enfermedad de la motoneurona
        - enfermedad de neurona motora
    summary:
        La ELA es una enfermedad progresiva que destruye tanto las motoneuronas
        superiores de la corteza motora como las motoneuronas inferiores del
        tronco encefálico y la médula espinal. Los músculos se debilitan y se
        atrofian, y con el tiempo se afectan el habla, la deglución y la
        respiración. El pensamiento suele conservarse, aunque algunas personas
        desarrollan demencia frontotemporal.
    overview:
        - La ELA es una enfermedad progresiva que destruye tanto las
          motoneuronas superiores de la corteza motora como las motoneuronas
          inferiores del tronco encefálico y la médula espinal. Sin estas
          neuronas, los músculos se debilitan y se atrofian, y con el tiempo se
          afectan el habla, la deglución y la respiración.
        - El pensamiento suele conservarse, pero hasta la mitad de las personas
          presentan algún cambio cognitivo o conductual, y alrededor del 10–15 %
          desarrollan demencia frontotemporal, lo que refleja una genética
          compartida y la patología de TDP-43.
    brain:
        m1:
            Aquí degeneran las motoneuronas superiores, lo que causa rigidez,
            reflejos vivos y debilidad.
        medulla:
            Degeneran los núcleos motores de la lengua y la garganta, lo que
            causa habla arrastrada y dificultad para tragar (síntomas bulbares).
        pons:
            Se afectan los núcleos motores de la masticación y del movimiento
            facial.
        premotor:
            Afectación frontal dentro del espectro ELA–demencia frontotemporal.
    symptoms:
        - Debilidad en una mano, un brazo o una pierna
        - Contracciones musculares (fasciculaciones) y calambres
        - Rigidez y reflejos vivos
        - Habla arrastrada y dificultad para tragar
        - Debilidad respiratoria
        - Labilidad emocional (risa o llanto incontrolables) en algunas personas
    diagnosis:
        El diagnóstico es clínico, apoyado por la electromiografía (EMG), que
        muestra la pérdida de motoneuronas inferiores, y por la exclusión de
        enfermedades que la imitan mediante resonancia magnética y análisis de
        sangre.
    causes:
        - Alrededor del 90 % de los casos son esporádicos; el 10 % son
          familiares, con mayor frecuencia por los genes C9orf72, SOD1, TARDBP o
          FUS. En la mayoría de los casos aparecen agregados de TDP-43.
    treatment:
        - El riluzol y la edaravona frenan modestamente la progresión; el
          tofersén trata la ELA relacionada con SOD1. La atención
          multidisciplinaria, la ventilación no invasiva y las sondas de
          alimentación prolongan la supervivencia y mejoran la calidad de vida.
    course:
        La supervivencia mediana es de unos 2–5 años desde el inicio de los
        síntomas, aunque alrededor del 10 % vive 10 años o más.
    prevalence: Cada año la desarrollan alrededor de 2 de cada 100.000 personas.
    fact:
        El Ice Bucket Challenge de 2014 recaudó más de 100 millones de dólares,
        lo que ayudó a financiar el descubrimiento del gen de la ELA NEK1.
disease:ftd:
    name: Demencia frontotemporal
    short: DFT
    aka:
        - demencia frontotemporal
        - dft
        - demencia semántica
        - degeneración lobular frontotemporal
        - enfermedad de pick
    summary:
        La demencia frontotemporal es un grupo de trastornos en los que
        degeneran las neuronas de los lóbulos frontal y temporal. La variante
        conductual cambia la personalidad y la conducta; las variantes del
        lenguaje (afasias progresivas primarias) afectan el habla o el
        significado de las palabras. Suele comenzar entre los 45 y los 65 años.
    overview:
        - La demencia frontotemporal es un grupo de trastornos en los que
          degeneran las neuronas de los lóbulos frontal y temporal. Suele
          comenzar entre los 45 y los 65 años y es una de las demencias más
          frecuentes en personas menores de 65 años.
        - A diferencia del Alzheimer, la memoria suele estar relativamente
          conservada al principio. En cambio, los primeros signos son cambios en
          la personalidad, la conducta o el lenguaje, que con frecuencia se
          confunden con una enfermedad psiquiátrica o con una crisis de la
          mediana edad.
    brain:
        vmpfc:
            La atrofia en la variante conductual elimina la regulación social y
            emocional, lo que causa desinhibición y falta de juicio.
        ofc:
            Su atrofia se relaciona con compulsiones, cambios en la alimentación
            y decisiones impulsivas.
        antinsula:
            Su pérdida temprana se relaciona con una menor empatía y menor
            conciencia de los sentimientos de los demás.
        acc: Su daño contribuye a la apatía.
        tpole:
            La atrofia en la variante semántica erosiona el significado de las
            palabras y los objetos.
        broca:
            La atrofia en la variante no fluente hace que el habla sea
            entrecortada y esforzada.
    symptoms:
        - Desinhibición y conducta socialmente inapropiada
        - Apatía y pérdida de empatía
        - Conductas compulsivas y cambios en la alimentación
        - Dificultad para planificar
        - Pérdida del significado de las palabras (variante semántica)
        - Habla entrecortada y esforzada (variante no fluente)
    diagnosis:
        El diagnóstico usa criterios clínicos, pruebas neuropsicológicas,
        resonancia magnética que muestra atrofia frontal y/o temporal y, a
        veces, PET y pruebas genéticas.
    types:
        - DFT variante conductual.
        - Afasia progresiva primaria variante semántica.
        - Afasia progresiva primaria variante no fluente/agramatical.
        - Se superpone con la ELA, la parálisis supranuclear progresiva y el
          síndrome corticobasal.
    causes:
        - Proteínas tau o TDP-43 anómalas. Hasta alrededor de un tercio de los
          casos son hereditarios, con mayor frecuencia por los genes C9orf72,
          MAPT o GRN.
    treatment:
        - Todavía no hay tratamiento modificador de la enfermedad. Los ISRS
          pueden reducir los síntomas conductuales; la terapia del lenguaje y el
          apoyo a los cuidadores son fundamentales.
    course:
        La progresión varía, con una supervivencia media de unos 6–11 años desde
        el inicio de los síntomas.
    prevalence:
        Una de las demencias más frecuentes en personas menores de 65 años.
disease:dlb:
    name: Demencia con cuerpos de Lewy
    short: DCLewy
    aka:
        - demencia con cuerpos de lewy
        - demencia por cuerpos de lewy
        - dcl
        - cuerpos de lewy
    summary:
        La demencia con cuerpos de Lewy se debe a agregados de alfa-sinucleína
        (cuerpos de Lewy) que se propagan por la corteza y el tronco encefálico.
        Combina demencia con fluctuaciones del estado de alerta, alucinaciones
        visuales vívidas, trastorno de conducta del sueño REM y parkinsonismo.
    overview:
        - La demencia con cuerpos de Lewy se debe a agregados de alfa-sinucleína
          (cuerpos de Lewy) que se propagan por la corteza y el tronco
          encefálico. Combina demencia con fluctuaciones del estado de alerta,
          alucinaciones visuales vívidas, trastorno de conducta del sueño REM y
          parkinsonismo.
        - A menudo se diagnostica erróneamente como Alzheimer o Parkinson.
          Acertar es importante porque las personas con DCLewy pueden tener
          reacciones graves, a veces mortales, a muchos medicamentos
          antipsicóticos.
    brain:
        v2v3:
            La menor actividad de la corteza de asociación visual se relaciona
            con las alucinaciones visuales detalladas.
        sn: La pérdida de neuronas dopaminérgicas causa parkinsonismo.
        pons:
            La afectación de los circuitos del sueño REM hace que la persona
            escenifique sus sueños.
        lc: Afectación temprana del tronco encefálico.
        pcc:
            Está relativamente conservada en comparación con la precuña, lo que
            produce el "signo de la isla cingulada" en las imágenes.
    symptoms:
        - Fluctuaciones de la atención y del estado de alerta
        - Alucinaciones visuales detalladas
        - Escenificar los sueños
        - Rigidez y lentitud similares a las del Parkinson
        - Problemas con las tareas visoespaciales
    diagnosis:
        Criterios clínicos junto con pruebas de apoyo como el DaTscan, estudios
        del sueño que muestran sueño REM sin parálisis y gammagrafía cardíaca
        con MIBG.
    causes:
        - En su mayor parte desconocidas; la edad es el principal factor de
          riesgo. Las variantes de GBA y APOE aumentan el riesgo.
    treatment:
        - Los inhibidores de la colinesterasa a menudo mejoran la cognición y
          las alucinaciones. Los antipsicóticos deben usarse con gran
          precaución. La levodopa puede ayudar al movimiento, pero puede
          empeorar las alucinaciones.
    course:
        Progresiva, con una supervivencia media de unos 5–8 años tras el
        diagnóstico.
    prevalence:
        Posiblemente la segunda demencia degenerativa más frecuente después del
        Alzheimer.
disease:vascdem:
    name: Demencia vascular
    short: Demencia vascular
    aka:
        - demencia vascular
        - deterioro cognitivo vascular
        - demencia multiinfarto
    summary:
        La demencia vascular es un deterioro cognitivo causado por la reducción
        del flujo sanguíneo al cerebro, ya sea por ictus importantes, por muchos
        ictus pequeños silenciosos o por daño de los vasos pequeños de la
        sustancia blanca profunda. A menudo causa lentitud del pensamiento y
        problemas de planificación antes que pérdida de memoria, y con
        frecuencia coexiste con el Alzheimer.
    overview:
        - La demencia vascular es un deterioro cognitivo causado por la
          reducción del flujo sanguíneo al cerebro, ya sea por ictus
          importantes, por muchos ictus pequeños silenciosos o por daño de los
          vasos pequeños de la sustancia blanca. A menudo causa lentitud del
          pensamiento y problemas de planificación antes que pérdida de memoria,
          y con frecuencia coexiste con el Alzheimer (demencia mixta).
    brain:
        callosum:
            El daño de la sustancia blanca desconecta regiones cerebrales y
            enlentece el procesamiento.
        latvent:
            Los cambios de la sustancia blanca se agrupan alrededor de los
            ventrículos en la resonancia magnética.
        caudate:
            Los ictus pequeños (lacunares) suelen afectar a núcleos profundos y
            alteran los circuitos frontosubcorticales.
        thalamus: Las lagunas talámicas pueden causar problemas de memoria.
        dlpfc:
            La desconexión de los circuitos frontales causa enlentecimiento
            ejecutivo.
    symptoms:
        - Lentitud del pensamiento
        - Dificultad para planificar y organizar
        - Deterioro escalonado tras los ictus
        - Problemas para caminar
        - Cambios del estado de ánimo, sobre todo apatía y depresión
    diagnosis:
        Requiere deterioro cognitivo con evidencia de enfermedad cerebrovascular
        en la resonancia magnética y una relación plausible entre ambos.
    causes:
        - Presión arterial alta, diabetes, tabaquismo, colesterol alto,
          fibrilación auricular e ictus previos.
    treatment:
        - Controlar los factores de riesgo vascular y prevenir nuevos ictus. Los
          inhibidores de la colinesterasa aportan beneficios pequeños.
    course:
        A menudo escalonado, con una evolución muy influida por el control de
        los factores de riesgo.
    prevalence:
        La segunda causa más frecuente de demencia, a menudo combinada con el
        Alzheimer.
disease:psp:
    name: Parálisis supranuclear progresiva
    short: PSP
    aka:
        - parálisis supranuclear progresiva
        - psp
        - síndrome de steele-richardson-olszewski
    summary:
        La parálisis supranuclear progresiva es una taupatía que daña el tronco
        encefálico, los ganglios basales y los lóbulos frontales. Al principio
        suele confundirse con la enfermedad de Parkinson, pero causa caídas
        tempranas, rigidez del tronco y dificultad para mover los ojos, sobre
        todo al mirar hacia abajo.
    overview:
        - La parálisis supranuclear progresiva es una taupatía que daña el
          tronco encefálico, los ganglios basales y los lóbulos frontales. Al
          principio suele confundirse con el Parkinson, pero causa caídas
          tempranas, rigidez del tronco y dificultad para mover los ojos, sobre
          todo al mirar hacia abajo.
    brain:
        midbrain:
            Su atrofia produce el "signo del colibrí" en la resonancia magnética
            y daña los centros de la mirada vertical.
        stn: Pérdida neuronal.
        gp: Pérdida neuronal.
        dentate: Degeneración de la salida cerebelosa.
        frontal: La afectación frontal causa apatía y problemas ejecutivos.
    symptoms:
        - Caídas hacia atrás tempranas e inexplicables
        - Dificultad para mover los ojos hacia arriba y hacia abajo
        - Postura rígida y erguida
        - Habla arrastrada y dificultad para tragar
        - Apatía y lentitud del pensamiento
    diagnosis:
        Criterios clínicos apoyados por una resonancia magnética que muestra
        atrofia del mesencéfalo.
    causes:
        - Acumulación anómala de tau; la causa se desconoce.
    treatment:
        - No hay tratamiento modificador de la enfermedad. La fisioterapia, la
          terapia del habla y la terapia ocupacional ayudan.
    course: Progresiva a lo largo de unos 6–9 años.
    prevalence: Alrededor de 5–7 por cada 100.000 personas.
disease:cjd:
    name: Enfermedad de Creutzfeldt-Jakob
    short: ECJ
    aka:
        - enfermedad de creutzfeldt-jakob
        - ecj
        - creutzfeldt-jakob
        - enfermedad priónica
        - prion
        - encefalopatía espongiforme
    summary:
        La ECJ es una enfermedad priónica rara, de progresión rápida y mortal.
        Las proteínas priónicas mal plegadas obligan a las proteínas normales a
        plegarse mal, lo que hace que en el tejido cerebral aparezcan pequeños
        agujeros (cambio espongiforme). La mayoría de las personas mueren en el
        plazo de un año desde el inicio de los síntomas.
    overview:
        - La ECJ es una enfermedad priónica rara, de progresión rápida y mortal.
          Las proteínas priónicas mal plegadas obligan a las proteínas normales
          a plegarse mal, lo que causa muerte neuronal y pequeños agujeros en el
          tejido cerebral (cambio espongiforme). La mayoría de las personas
          mueren en el plazo de un año desde el inicio de los síntomas.
    brain:
        caudate:
            Una señal brillante en la resonancia magnética de difusión es una
            pista diagnóstica.
        putamen: Señal brillante en la resonancia magnética de difusión.
        frontal:
            Patrón en cinta cortical ("cortical ribboning") en la resonancia
            magnética a lo largo de la corteza.
        parietal: Afectación cortical.
        pulvinar:
            El signo del pulvinar es característico de la variante de la ECJ.
    symptoms:
        - Demencia que empeora rápidamente
        - Mioclonías
        - Problemas de coordinación y de visión
        - Cambios de conducta
    diagnosis:
        Resonancia magnética, EEG y la prueba RT-QuIC en líquido
        cefalorraquídeo, que detecta priones mal plegados con gran precisión.
    types:
        - Esporádica (alrededor del 85 %).
        - Genética (10–15 %), por mutaciones en PRNP.
        - Adquirida, incluidas la iatrogénica y la variante de la ECJ
          relacionada con la EEB ("enfermedad de las vacas locas").
    causes:
        - Proteína priónica mal plegada, que surge de forma espontánea, se
          hereda o se adquiere.
    treatment:
        - No hay cura; la atención se centra en el confort. Una esterilización
          estricta evita la transmisión a través del instrumental quirúrgico.
    course: Rápida; la mayoría de las personas mueren en el plazo de un año.
    prevalence: Alrededor de 1–2 casos por millón de personas cada año.
disease:ms:
    name: Esclerosis múltiple
    short: EM
    aka:
        - esclerosis múltiple
        - em
        - esclerosis en placas
    summary:
        La esclerosis múltiple es una enfermedad autoinmune en la que el sistema
        inmunitario ataca la mielina, el aislante que rodea las fibras
        nerviosas, en el cerebro, la médula espinal y los nervios ópticos. Las
        zonas inflamadas forman placas que alteran las señales. La mayoría de
        las personas comienzan con una forma remitente-recurrente; algunas pasan
        después a un curso progresivo.
    overview:
        - La esclerosis múltiple es una enfermedad autoinmune crónica en la que
          las células inmunitarias atacan la mielina, el aislante que rodea las
          fibras nerviosas, en el cerebro, la médula espinal y los nervios
          ópticos. Las zonas inflamadas forman placas (lesiones) donde las
          señales se enlentecen o fallan, lo que causa síntomas que dependen de
          su localización.
        - La mayoría de las personas comienzan con una EM remitente-recurrente,
          con brotes seguidos de recuperación. Con el tiempo, la pérdida
          continua de fibras nerviosas puede causar una progresión gradual. Las
          terapias modificadoras de la enfermedad actuales han reducido
          drásticamente los brotes y la discapacidad.
    brain:
        callosum:
            Las lesiones en el cuerpo calloso, a menudo orientadas
            perpendicularmente a los ventrículos ("dedos de Dawson"), son
            características y enlentecen la comunicación entre los hemisferios.
        latvent:
            Las lesiones se agrupan en la sustancia blanca alrededor de los
            ventrículos, donde pequeñas venas entran en el cerebro, y alteran
            muchas vías a la vez.
        pons:
            Las lesiones del tronco encefálico causan visión doble, mareo y
            entumecimiento facial.
        cerebhemi:
            Las lesiones cerebelosas causan temblor y falta de coordinación.
    symptoms:
        - Pérdida de visión o dolor en un ojo (neuritis óptica)
        - Entumecimiento, hormigueo o debilidad
        - Fatiga
        - Problemas de equilibrio y mareo
        - Problemas de vejiga
        - Dificultades de pensamiento y de memoria
        - Empeoramiento de los síntomas con el calor (fenómeno de Uhthoff)
    diagnosis:
        Los criterios de McDonald usan lesiones en la resonancia magnética
        diseminadas en el espacio y en el tiempo, y pueden usar las bandas
        oligoclonales en el líquido cefalorraquídeo, tras descartar enfermedades
        que la imitan.
    types:
        - Síndrome clínico aislado.
        - EM remitente-recurrente (la más frecuente al inicio).
        - EM secundaria progresiva.
        - EM primaria progresiva (alrededor del 10–15 %).
    causes:
        - Susceptibilidad genética combinada con el entorno. La infección por el
          virus de Epstein-Barr parece ser un desencadenante casi necesario. La
          vitamina D baja, el tabaquismo y la obesidad en la adolescencia
          aumentan el riesgo.
    treatment:
        - Las terapias modificadoras de la enfermedad (como ocrelizumab,
          natalizumab, ofatumumab y otras) reducen los brotes y las lesiones
          nuevas. Los corticoides acortan los brotes. La rehabilitación y el
          tratamiento de los síntomas ayudan en la vida diaria.
    course:
        Muy variable; muchas personas con tratamiento actual mantienen un buen
        funcionamiento durante décadas.
    prevalence:
        Alrededor de 2,8 millones de personas en todo el mundo; es unas dos a
        tres veces más frecuente en mujeres.
    fact:
        Un estudio de 2022 con 10 millones de militares estadounidenses halló
        que la infección por Epstein-Barr multiplicaba el riesgo de EM por unas
        32.
disease:ischemic:
    name: Ictus isquémico
    short: Ictus isquémico
    aka:
        - ictus isquémico
        - accidente cerebrovascular isquémico
        - acv isquémico
        - infarto cerebral
        - derrame cerebral
        - embolia cerebral
        - trombosis cerebral
    summary:
        Un ictus isquémico ocurre cuando un coágulo o una arteria estrechada
        interrumpe el flujo sanguíneo a una parte del cerebro y la priva de
        oxígeno. Alrededor del 85 % de los ictus son isquémicos. Los síntomas
        dependen de la arteria obstruida; la arteria cerebral media, que irriga
        gran parte de la superficie externa del cerebro, es la afectada con más
        frecuencia.
    overview:
        - Un ictus isquémico ocurre cuando un coágulo o una arteria estrechada
          interrumpe el flujo sanguíneo a una parte del cerebro. Sin oxígeno ni
          glucosa, las neuronas del núcleo del infarto mueren en minutos,
          mientras que una zona circundante llamada penumbra puede salvarse si
          el flujo sanguíneo se restablece rápidamente.
        - Los síntomas dependen de la arteria obstruida. La arteria cerebral
          media, que irriga gran parte de la superficie externa del cerebro, es
          la afectada con más frecuencia. Los ictus isquémicos representan
          alrededor del 85 % de los ictus.
    brain:
        m1:
            Los ictus de la arteria cerebral media suelen dañar la corteza
            motora y causan debilidad en el lado opuesto del cuerpo.
        s1: Su daño causa pérdida de sensibilidad en el lado opuesto.
        broca: Los ictus del lado izquierdo pueden causar afasia expresiva.
        wernicke: Los ictus del lado izquierdo pueden causar afasia receptiva.
        putamen:
            Los pequeños ictus lacunares profundos pueden causar debilidad
            motora pura.
        ventthal: Los ictus talámicos causan pérdida sensitiva o dolor crónico.
    symptoms:
        - Caída repentina de un lado de la cara
        - Debilidad de un brazo o una pierna en un lado
        - Dificultad para hablar o confusión
        - Pérdida repentina de la visión
        - Mareo repentino o pérdida del equilibrio
    diagnosis:
        La TC o la resonancia magnética urgentes distinguen el ictus isquémico
        del hemorrágico; la angiografía por TC detecta las obstrucciones de
        grandes vasos.
    causes:
        - Aterosclerosis, coágulos procedentes del corazón en la fibrilación
          auricular y enfermedad de pequeño vaso. Los factores de riesgo
          incluyen la presión arterial alta, la diabetes, el tabaquismo, el
          colesterol alto y la inactividad.
    treatment:
        - Medicación trombolítica (alteplasa o tenecteplasa), normalmente en las
          primeras 4,5 horas, y trombectomía mecánica para las obstrucciones de
          grandes vasos, hasta 24 horas en pacientes seleccionados. Después,
          rehabilitación y prevención secundaria.
    course:
        La recuperación es más rápida en los tres primeros meses, pero puede
        continuar durante años gracias a la neuroplasticidad y la
        rehabilitación.
    prevalence:
        En Estados Unidos se producen alrededor de 795.000 ictus cada año.
    fact:
        '"El tiempo es cerebro": un ictus extenso sin tratar destruye unos 1,9
        millones de neuronas por minuto. Recuerda BE FAST (siglas en inglés):
        Balance (equilibrio), Eyes (ojos), Face (cara), Arm (brazo), Speech
        (habla), Time (tiempo: llamar a emergencias).'
disease:ich:
    name: Ictus hemorrágico
    short: Ictus hemorrágico
    aka:
        - ictus hemorrágico
        - accidente cerebrovascular hemorrágico
        - acv hemorrágico
        - hemorragia intracerebral
        - hemorragia cerebral
        - derrame cerebral
    summary:
        Un ictus hemorrágico ocurre cuando se rompe un vaso sanguíneo dentro del
        cerebro y la sangre que se escapa daña y comprime el tejido cerebral.
        Representa alrededor del 10–15 % de los ictus, pero una proporción mayor
        de las muertes por ictus.
    overview:
        - Un ictus hemorrágico ocurre cuando se rompe un vaso sanguíneo dentro
          del cerebro. La sangre que se escapa daña el tejido directamente,
          aumenta la presión dentro del cráneo y desencadena inflamación.
          Representa alrededor del 10–15 % de los ictus, pero una proporción
          mayor de las muertes por ictus.
    brain:
        putamen:
            Es la localización más frecuente de las hemorragias por presión
            arterial alta, y daña las vías motoras.
        thalamus:
            Otra localización frecuente, que causa pérdida sensitiva y
            disminución de la conciencia.
        pons: Las hemorragias de la protuberancia suelen ser graves.
        cerebhemi: Las hemorragias cerebelosas pueden requerir cirugía urgente.
    symptoms:
        - Dolor de cabeza intenso y repentino
        - Debilidad o entumecimiento en un lado
        - Vómitos
        - Disminución del nivel de conciencia
        - Crisis epilépticas
    diagnosis: La TC urgente muestra la hemorragia.
    causes:
        - Presión arterial alta de larga evolución, angiopatía amiloide cerebral
          en personas mayores, anticoagulantes y malformaciones vasculares.
    treatment:
        - Descenso rápido de la presión arterial, reversión de los
          anticoagulantes y, a veces, cirugía.
    course:
        La mortalidad es alta durante el primer mes; los supervivientes suelen
        mejorar con la rehabilitación.
    prevalence: Alrededor del 10–15 % de todos los ictus.
disease:sah:
    name: Hemorragia subaracnoidea y aneurisma cerebral
    short: Rotura de aneurisma
    aka:
        - hemorragia subaracnoidea
        - aneurisma cerebral
        - aneurisma
        - hsa
        - rotura de aneurisma
    summary:
        Un aneurisma cerebral es un punto débil y abombado en la pared de una
        arteria, normalmente en la base del cerebro. Si se rompe, la sangre
        llena el espacio subaracnoideo que rodea el cerebro y causa un dolor de
        cabeza repentino e intenso. Es una emergencia médica.
    overview:
        - Un aneurisma cerebral es un punto débil y abombado en la pared de una
          arteria, normalmente en la base del cerebro. Si se rompe, la sangre
          llena el espacio subaracnoideo que rodea el cerebro y causa un dolor
          de cabeza repentino e intenso. Es una emergencia médica.
    brain:
        ventricles:
            La sangre puede bloquear el flujo de LCR y causar hidrocefalia.
        ofc:
            La rotura de un aneurisma de la arteria comunicante anterior puede
            dañar la cara inferior del lóbulo frontal.
        hypothalamus:
            Puede verse afectado, lo que altera el equilibrio del sodio y de las
            hormonas.
    symptoms:
        - Dolor de cabeza repentino, "el peor dolor de cabeza de mi vida"
        - Rigidez de nuca
        - Náuseas y vómitos
        - Sensibilidad a la luz
        - Pérdida del conocimiento
    diagnosis:
        TC, con punción lumbar si la TC es negativa, y angiografía para
        localizar el aneurisma.
    causes:
        - Presión arterial alta, tabaquismo, antecedentes familiares y algunas
          enfermedades hereditarias.
    treatment:
        - Asegurar el aneurisma mediante embolización con espirales (coils) o
          clipaje; nimodipino; tratamiento de la hidrocefalia.
    course:
        Alrededor de un tercio de las personas mueren, y muchos supervivientes
        tienen secuelas cognitivas duraderas.
    prevalence:
        Se estima que el 3 % de los adultos tiene un aneurisma no roto; la
        mayoría nunca se rompe.
disease:epilepsy:
    name: Epilepsia
    short: Epilepsia
    aka:
        - epilepsia
        - epilepsia del lóbulo temporal
        - trastorno convulsivo
        - convulsiones
        - crisis epilépticas
    summary:
        La epilepsia es la tendencia a tener crisis epilépticas repetidas y no
        provocadas, que son descargas de actividad eléctrica anómala y
        sincronizada en el cerebro. Las crisis focales comienzan en un área; las
        generalizadas afectan a ambos hemisferios desde el inicio. La epilepsia
        del lóbulo temporal es el tipo focal más frecuente en adultos.
    overview:
        - La epilepsia es la tendencia a tener crisis epilépticas repetidas y no
          provocadas, que son descargas de actividad eléctrica anómala y
          sincronizada en el cerebro. Las crisis pueden ser focales, cuando
          comienzan en un área, o generalizadas, cuando afectan a ambos
          hemisferios desde el inicio.
        - La epilepsia del lóbulo temporal es el tipo focal más frecuente en
          adultos. Sus crisis suelen comenzar con un aura, como un déjà vu,
          miedo o una sensación ascendente en el estómago.
    brain:
        hippocampus:
            La esclerosis del hipocampo crea un circuito cicatrizado e
            hiperexcitable que genera crisis de forma repetida; es la causa más
            frecuente de epilepsia del lóbulo temporal farmacorresistente.
        amygdala: Las crisis aquí causan auras de miedo y emocionales.
        entorhinal: Forma parte de la red de las crisis.
        temporal: Es el lóbulo más frecuente de las crisis focales.
        antthal:
            Es una diana de estimulación cerebral profunda que puede interrumpir
            la propagación de las crisis.
    symptoms:
        - Episodios de mirada fija o breves pérdidas de conciencia
        - Movimientos de sacudida
        - Auras como déjà vu, miedo o una sensación ascendente en el estómago
        - Olores o sabores extraños
        - Confusión después de una crisis
    diagnosis:
        El EEG, la monitorización con video-EEG y la resonancia magnética ayudan
        a identificar el tipo y el origen de las crisis.
    causes:
        - Genética, lesiones cerebrales, ictus, infecciones, tumores,
          malformaciones del desarrollo y esclerosis del hipocampo. En alrededor
          de la mitad de los casos no se encuentra la causa.
    treatment:
        - "Los medicamentos anticrisis controlan las crisis en alrededor de dos
          tercios de las personas. Para la epilepsia farmacorresistente:
          cirugía, ablación con láser, estimulación del nervio vago,
          estimulación cerebral profunda y dieta cetogénica."
    course: Muchas personas quedan libres de crisis con tratamiento.
    prevalence: Alrededor de 50 millones de personas en todo el mundo.
disease:migraine:
    name: Migraña
    short: Migraña
    aka:
        - migraña
        - migrañas
        - jaqueca
        - jaquecas
    summary:
        La migraña es un trastorno neurológico frecuente con ataques recurrentes
        de dolor de cabeza pulsátil, de moderado a intenso y a menudo en un solo
        lado, acompañado de náuseas y sensibilidad a la luz y al sonido.
        Alrededor de un tercio de las personas tienen aura, alteraciones
        visuales o sensitivas temporales antes del dolor de cabeza.
    overview:
        - La migraña es un trastorno neurológico frecuente con ataques
          recurrentes de dolor de cabeza pulsátil, de moderado a intenso y a
          menudo en un solo lado, acompañado de náuseas y sensibilidad a la luz
          y al sonido. Alrededor de un tercio de las personas tienen aura.
        - "Un ataque es un evento cerebral con fases: pródromo, aura, dolor de
          cabeza y posdromo. El sistema trigeminovascular libera CGRP, que
          impulsa la inflamación y el dolor."
    brain:
        v1:
            Se cree que la depresión cortical propagada a través de la corteza
            visual causa el aura.
        hypothalamus:
            Su actividad durante el pródromo podría explicar los bostezos y los
            antojos.
        pons: Los núcleos del tronco encefálico se activan durante los ataques.
        ventthal:
            La sensibilización talámica contribuye a la sensibilidad a la luz y
            al dolor en la piel.
    symptoms:
        - "Pródromo: bostezos, antojos, cambios de humor"
        - "Aura: luces en zigzag o puntos ciegos"
        - Dolor de cabeza pulsátil que dura de 4 a 72 horas
        - Náuseas y vómitos
        - Sensibilidad a la luz, al sonido y a los olores
        - "Posdromo: sensación de agotamiento"
    diagnosis:
        Diagnóstico clínico mediante criterios como los de la Clasificación
        Internacional de las Cefaleas.
    causes:
        - Fuerte componente genético. Los desencadenantes incluyen el estrés,
          los cambios en el sueño, los cambios hormonales y saltarse comidas.
    treatment:
        - "Agudo: analgésicos, triptanes, gepantes y ditanes. Prevención:
          anticuerpos dirigidos contra el CGRP, gepantes, betabloqueantes,
          topiramato, amitriptilina y bótox para la migraña crónica."
    course: A menudo mejora con la edad y después de la menopausia.
    prevalence:
        Alrededor de 1.000 millones de personas en todo el mundo; es unas tres
        veces más frecuente en mujeres.
disease:cluster:
    name: Cefalea en racimos
    short: Cefalea en racimos
    aka:
        - cefalea en racimos
        - cefaleas en racimos
        - cefalea en brotes
        - cefalea de horton
    summary:
        La cefalea en racimos causa un dolor atroz y unilateral alrededor del
        ojo que dura de 15 minutos a 3 horas, a menudo a la misma hora cada día,
        durante periodos de «racimos» que duran semanas o meses.
    overview:
        - La cefalea en racimos causa un dolor atroz y unilateral alrededor del
          ojo, que dura de 15 minutos a 3 horas, a menudo a la misma hora cada
          día, durante periodos de «racimos» que duran semanas o meses y luego
          entran en remisión. Con frecuencia se describe como una de las
          afecciones más dolorosas que se conocen.
        - Su sincronía de reloj, tanto diaria como estacional, apunta al reloj
          interno del cerebro. A diferencia de las personas con migraña, que se
          quedan quietas, las personas con cefalea en racimos suelen estar
          inquietas y caminar de un lado a otro durante las crisis.
    brain:
        hypothalamus:
            El hipotálamo posterior se activa durante las crisis y podría
            desencadenarlas, lo que explica su horario regular y los síntomas
            autonómicos como el lagrimeo y la secreción nasal.
        scn:
            El reloj maestro podría fijar el horario circadiano y estacional de
            las crisis.
    symptoms:
        - Dolor intenso y punzante alrededor de un ojo
        - Lagrimeo, ojo enrojecido y secreción nasal del mismo lado
        - Párpado caído y pupila pequeña
        - Inquietud y caminar de un lado a otro
        - Crisis con una puntualidad de reloj
    diagnosis:
        Diagnóstico clínico basado en el patrón de las crisis; la resonancia
        magnética descarta otras causas.
    causes:
        - Desconocidas; se asocian el tabaquismo, el alcohol durante los
          periodos de racimos y los antecedentes familiares.
    treatment:
        - El oxígeno a alto flujo y los triptanes inyectados o nasales detienen
          las crisis. El verapamilo, el galcanezumab y los ciclos cortos de
          corticoides las previenen. La estimulación nerviosa es una opción en
          los casos crónicos.
    course:
        Episódica en la mayoría de las personas, con remisiones que duran meses
        o años; alrededor del 10–20 % tiene la forma crónica.
    prevalence: Alrededor de 1 de cada 1000 personas; más frecuente en hombres.
disease:tbi:
    name: Traumatismo craneoencefálico y conmoción cerebral
    short: TCE
    aka:
        - traumatismo craneoencefálico
        - tce
        - lesión cerebral traumática
        - conmoción cerebral
        - conmociones cerebrales
        - concusión
    summary:
        Un traumatismo craneoencefálico es un daño causado por una fuerza
        externa, como una caída, un choque, un impacto deportivo o una
        explosión. Una conmoción cerebral es un TCE leve. El cerebro se mueve
        dentro del cráneo, lo que contusiona su superficie y estira o desgarra
        las fibras nerviosas largas (lesión axonal difusa).
    overview:
        - Un traumatismo craneoencefálico es un daño causado por una fuerza
          externa, como una caída, un choque, un impacto deportivo o una
          explosión. Una conmoción cerebral es un TCE leve. El cerebro se mueve
          dentro del cráneo, lo que contusiona su superficie donde choca con las
          crestas óseas y estira las fibras nerviosas largas.
        - "Tras el impacto se produce una cascada de cambios químicos:
          desequilibrios iónicos, crisis energética e inflamación, por lo que el
          cerebro queda vulnerable durante días o semanas y por eso se
          recomienda reposo seguido de un retorno gradual a la actividad."
    brain:
        ofc:
            La cara inferior del lóbulo frontal roza contra el suelo óseo del
            cráneo, lo que causa contusiones que pueden alterar el juicio, el
            control de impulsos y la personalidad.
        tpole:
            La parte anterior del lóbulo temporal golpea la fosa media del
            cráneo, lo que afecta a la memoria y las emociones.
        callosum:
            Las fuerzas de rotación cizallan los axones largos (lesión axonal
            difusa), lo que enlentece la velocidad de procesamiento.
        brainstem:
            Las fuerzas de rotación intensas pueden lesionar el tronco
            encefálico y afectar al nivel de conciencia.
    symptoms:
        - Dolor de cabeza y mareo
        - Confusión y problemas de memoria
        - Náuseas
        - Sensibilidad a la luz y al ruido
        - Dificultad para concentrarse y dormir
        - Cambios de humor e irritabilidad
    diagnosis:
        La escala de coma de Glasgow gradúa la gravedad; la tomografía
        computarizada o la resonancia magnética detectan hemorragias o
        inflamación. La conmoción cerebral es un diagnóstico clínico, ya que las
        imágenes suelen ser normales.
    types:
        - TCE leve (conmoción cerebral), moderado y grave.
    causes:
        - Caídas, accidentes de tráfico, agresiones, deportes y explosiones
          militares.
    treatment:
        - "Conmoción cerebral: breve reposo relativo y luego retorno gradual a
          la actividad y a la escuela o el trabajo. TCE moderado o grave:
          atención de urgencia, control de la presión dentro del cráneo y
          después rehabilitación."
    course:
        La mayoría de las conmociones se resuelven en semanas; algunas personas
        tienen síntomas persistentes. La recuperación de un TCE moderado o grave
        puede llevar meses o años.
    prevalence: Decenas de millones de personas en todo el mundo cada año.
disease:cte:
    name: Encefalopatía traumática crónica
    short: ETC
    aka:
        - encefalopatía traumática crónica
        - etc
        - cte
        - demencia pugilística
    summary:
        La ETC es una enfermedad progresiva por tau vinculada a impactos
        repetidos en la cabeza, incluidos los que no causan síntomas de
        conmoción. Se ha encontrado en deportistas de contacto y veteranos
        militares. Solo puede confirmarse después de la muerte.
    overview:
        - La ETC es una enfermedad progresiva por tau vinculada a años de
          impactos repetidos en la cabeza, incluidos muchos que nunca causan
          síntomas de conmoción. Se ha encontrado en deportistas de deportes de
          contacto y en veteranos militares, y actualmente solo puede
          confirmarse después de la muerte.
        - Su sello distintivo es la acumulación de tau alrededor de pequeños
          vasos sanguíneos en el fondo de los surcos, los lugares que más sufren
          con los impactos.
    brain:
        frontal:
            La tau se acumula alrededor de los vasos sanguíneos en la
            profundidad de los surcos frontales, lo que afecta al juicio y al
            control de impulsos.
        amygdala:
            La tau en etapas avanzadas se asocia con cambios de humor y
            agresividad.
        hippocampus: Su afectación en etapas avanzadas causa pérdida de memoria.
        thalamus: Se afecta en etapas avanzadas.
        callosum: Adelgazamiento de la sustancia blanca.
    symptoms:
        - Problemas de memoria
        - Impulsividad y agresividad
        - Depresión y apatía
        - Confusión
        - Más tarde, demencia y parkinsonismo
    diagnosis:
        Solo se confirma mediante el examen del cerebro después de la muerte;
        los criterios del «síndrome de encefalopatía traumática» describen los
        casos probables en vida.
    causes:
        - Años de impactos repetidos en la cabeza.
    treatment:
        - No hay un tratamiento específico; se tratan los síntomas. Reducir los
          impactos en la cabeza es la principal forma de prevención.
    course: Progresiva a lo largo de años o décadas.
    prevalence:
        Desconocida en la población general; se ha encontrado en una alta
        proporción de cerebros donados por exjugadores profesionales de fútbol
        americano.
    fact:
        El patólogo Bennet Omalu describió por primera vez la ETC en un
        exjugador de la NFL en 2005.
disease:meningitis:
    name: Meningitis
    short: Meningitis
    aka:
        - meningitis
        - meningitis bacteriana
        - meningitis viral
    summary:
        La meningitis es la inflamación de las meninges, las membranas que
        recubren el cerebro y la médula espinal, generalmente por una infección.
        La meningitis bacteriana es una urgencia médica; la viral es más
        frecuente y suele ser más leve. Las meninges no se muestran en este
        modelo.
    overview:
        - La meningitis es la inflamación de las meninges, las membranas que
          recubren el cerebro y la médula espinal, causada generalmente por una
          infección. La meningitis bacteriana puede matar en cuestión de horas y
          es una urgencia médica; la viral es más frecuente y suele ser más
          leve.
        - Las meninges no se muestran en este modelo; las zonas resaltadas
          indican complicaciones frecuentes.
    brain:
        ventricles:
            La inflamación puede bloquear el flujo de LCR y causar hidrocefalia.
        frontal:
            La inflamación puede extenderse a la superficie del cerebro
            (meningoencefalitis).
    symptoms:
        - Fiebre
        - Dolor de cabeza intenso
        - Rigidez de nuca
        - Sensibilidad a la luz
        - Confusión
        - Erupción cutánea en la infección meningocócica
    diagnosis:
        Punción lumbar para analizar el líquido cefalorraquídeo, además de
        hemocultivos.
    causes:
        - Bacterias, virus y, con menos frecuencia, hongos.
    treatment:
        - "Bacteriana: antibióticos intravenosos urgentes y corticoides. Viral:
          tratamiento de soporte. Las vacunas previenen muchos tipos
          bacterianos."
    course:
        La meningitis bacteriana puede dejar pérdida auditiva o problemas
        cognitivos.
    prevalence:
        La meningitis bacteriana es mucho menos frecuente en los países con
        vacunación sistemática.
disease:hsve:
    name: Encefalitis por herpes simple
    short: Encefalitis por VHS
    aka:
        - encefalitis por herpes simple
        - encefalitis herpética
        - encefalitis
        - encefalitis por vhs
    summary:
        La encefalitis por herpes simple es la infección e inflamación del
        cerebro por el virus del herpes simple, generalmente el VHS-1. Suele
        afectar a los lóbulos temporales y frontales, sobre todo al sistema
        límbico. Es la causa más frecuente de encefalitis viral esporádica
        mortal.
    overview:
        - La encefalitis por herpes simple es la infección e inflamación del
          cerebro por el virus del herpes simple, generalmente el VHS-1. Suele
          afectar a los lóbulos temporales mediales, la ínsula y la corteza
          orbitofrontal, las regiones límbicas, y sin tratamiento a menudo es
          mortal.
    brain:
        hippocampus:
            La destrucción del hipocampo causa una pérdida de memoria duradera.
        entorhinal:
            El daño temporal medial interrumpe la entrada de información a la
            memoria.
        amygdala: El daño límbico puede alterar las emociones y la conducta.
        antinsula: Se afecta con frecuencia.
        ofc: Se afecta con frecuencia, lo que altera la conducta.
    symptoms:
        - Fiebre y dolor de cabeza
        - Confusión y cambios de personalidad
        - Convulsiones
        - Problemas de memoria
        - Alucinaciones olfativas o gustativas
    diagnosis:
        Resonancia magnética que muestra cambios en el lóbulo temporal y prueba
        de PCR del líquido cefalorraquídeo para detectar el VHS.
    causes:
        - Llegada del VHS-1 al cerebro, posiblemente a través de los nervios
          olfatorios o trigéminos.
    treatment:
        - Aciclovir intravenoso urgente, iniciado en cuanto se sospecha.
    course:
        Muchos supervivientes tienen problemas de memoria o de conducta
        duraderos.
    prevalence: Alrededor de 2–4 casos por millón de personas al año.
    fact:
        Clive Wearing, un músico que quedó con uno de los casos de amnesia más
        graves jamás registrados, perdió la memoria a causa de una encefalitis
        herpética en 1985.
disease:gbm:
    name: Glioblastoma
    short: Glioblastoma
    aka:
        - glioblastoma
        - gbm
        - glioma
        - glioblastoma multiforme
    summary:
        El glioblastoma es el cáncer cerebral primario más frecuente y agresivo
        en adultos. Crece a partir de las células gliales y se extiende al
        tejido cerebral circundante, lo que hace imposible extirparlo por
        completo.
    overview:
        - El glioblastoma es el cáncer cerebral primario más frecuente y
          agresivo en adultos. Crece a partir de las células gliales e infiltra
          el tejido cerebral circundante, por lo que no puede extirparse por
          completo.
    brain:
        frontal: Una de las localizaciones más frecuentes.
        temporal: Una de las localizaciones más frecuentes.
        callosum:
            Los tumores que lo atraviesan hacia ambos lados se llaman «gliomas
            en alas de mariposa».
    symptoms:
        - Dolores de cabeza, a menudo peores por la mañana
        - Convulsiones
        - Cambios de personalidad o de memoria
        - Debilidad o problemas del habla o de la visión, según la localización
        - Náuseas
    diagnosis:
        Resonancia magnética seguida de biopsia o cirugía; marcadores
        moleculares como el estado de IDH y MGMT orientan el tratamiento y el
        pronóstico.
    causes:
        - En su mayoría desconocidas; la radiación previa en la cabeza es un
          factor de riesgo conocido.
    treatment:
        - Cirugía, seguida de radioterapia y quimioterapia con temozolomida;
          campos eléctricos para el tratamiento de tumores en algunos pacientes.
    course: La supervivencia mediana es de unos 15 meses con tratamiento.
    prevalence:
        Alrededor de 3 por cada 100 000 personas al año; la supervivencia
        mediana es de unos 15 meses con tratamiento.
disease:meningioma:
    name: Meningioma
    short: Meningioma
    aka:
        - meningioma
        - meningiomas
    summary:
        Los meningiomas crecen a partir de las meninges, las membranas que
        rodean el cerebro. Son el tumor cerebral primario más frecuente, y la
        mayoría son de crecimiento lento y benignos. Causan síntomas al
        presionar el tejido cerebral cercano.
    overview:
        - Los meningiomas crecen a partir de las meninges. Son el tumor cerebral
          primario más frecuente; la mayoría son de crecimiento lento y benignos
          y causan síntomas al presionar el tejido cerebral cercano.
    brain:
        frontal:
            Los meningiomas de la convexidad y de la hoz suelen presionar los
            lóbulos frontales.
        olfactory:
            Los meningiomas del surco olfatorio causan pérdida del olfato.
    symptoms:
        - Dolores de cabeza
        - Convulsiones
        - Cambios en la visión
        - Cambios de personalidad con tumores frontales
        - Pérdida del olfato con tumores bajo el lóbulo frontal
    diagnosis:
        La resonancia magnética suele mostrar un tumor bien delimitado adherido
        a la duramadre.
    causes:
        - En su mayoría desconocidas; la radiación previa y la NF2 aumentan el
          riesgo.
    treatment:
        - Observación, cirugía o radioterapia.
    course: Generalmente con buenos resultados.
    prevalence: Alrededor del 40 % de los tumores cerebrales primarios.
disease:pitadenoma:
    name: Adenoma hipofisario
    short: Adenoma hipofisario
    aka:
        - adenoma hipofisario
        - adenoma de hipófisis
        - tumor hipofisario
        - tumor de hipófisis
        - adenoma pituitario
    summary:
        Los adenomas hipofisarios son tumores de la hipófisis, generalmente
        benignos. Algunos liberan demasiada cantidad de una hormona; los más
        grandes presionan estructuras cercanas, sobre todo el quiasma óptico.
    overview:
        - Los adenomas hipofisarios son tumores de la hipófisis, generalmente
          benignos. Algunos liberan demasiada hormona; los más grandes presionan
          el quiasma óptico situado encima, lo que causa pérdida de la visión
          periférica.
    brain:
        pituitary:
            El origen del tumor, que puede producir hormonas en exceso o en
            defecto.
        hypothalamus: Los tumores grandes pueden presionarlo desde abajo.
    symptoms:
        - Pérdida de la visión periférica
        - Dolor de cabeza
        - "Efectos hormonales: menstruaciones irregulares, producción de leche,
          cambios en el crecimiento o rasgos de Cushing"
        - Cansancio por déficit hormonal
    diagnosis:
        Resonancia magnética y análisis hormonales en sangre; pruebas del campo
        visual.
    causes:
        - En su mayoría desconocidas; unos pocos forman parte de síndromes
          hereditarios.
    treatment:
        - Medicamentos, cirugía a través de la nariz o radioterapia.
    course: Generalmente con buenos resultados.
    prevalence:
        Se encuentran de forma incidental en alrededor del 10 % de las imágenes
        cerebrales, aunque la mayoría no causa síntomas.
disease:hydrocephalus:
    name: Hidrocefalia
    short: Hidrocefalia
    aka:
        - hidrocefalia
        - hidrocefalia normotensiva
        - hidrocefalia de presión normal
    summary:
        "La hidrocefalia es una acumulación de líquido cefalorraquídeo que
        agranda los ventrículos y aumenta la presión sobre el cerebro. Puede
        estar presente al nacer o aparecer más tarde. La hidrocefalia
        normotensiva en adultos mayores causa una tríada clásica: problemas para
        caminar, incontinencia urinaria y deterioro cognitivo."
    overview:
        - La hidrocefalia es una acumulación de líquido cefalorraquídeo que
          agranda los ventrículos y aumenta la presión sobre el cerebro. Puede
          estar presente al nacer o aparecer más tarde.
        - "La hidrocefalia normotensiva en adultos mayores causa una tríada
          clásica: problemas para caminar, incontinencia urinaria y deterioro
          cognitivo, y es una de las pocas causas tratables de demencia."
    brain:
        latvent:
            Se agrandan a medida que se acumula el líquido, lo que estira la
            sustancia blanca cercana.
        thirdvent: Se agranda.
        aqueduct: El lugar de bloqueo más frecuente.
        fourthvent: Se agranda si el bloqueo está más abajo en el recorrido.
    symptoms:
        - "Lactantes: cabeza que crece rápidamente, fontanela abombada"
        - Dolor de cabeza, vómitos y visión borrosa
        - Dificultad para caminar
        - Urgencia o incontinencia urinaria
        - Problemas de memoria y de pensamiento
    diagnosis:
        La tomografía computarizada o la resonancia magnética muestran
        ventrículos agrandados; una prueba de drenaje lumbar predice la
        respuesta en la hidrocefalia normotensiva.
    causes:
        - Bloqueo del flujo de LCR, mala absorción tras una hemorragia o
          infección, o causas desconocidas.
    treatment:
        - Una derivación (válvula) para drenar el LCR o una ventriculostomía
          endoscópica del tercer ventrículo.
    course: Los resultados dependen de la causa y del momento del tratamiento.
    prevalence:
        Alrededor de 1 de cada 1000 nacimientos; la hidrocefalia normotensiva
        está infradiagnosticada en los adultos mayores.
disease:cp:
    name: Parálisis cerebral
    short: Parálisis cerebral
    aka:
        - parálisis cerebral
        - pci
        - parálisis cerebral infantil
    summary:
        La parálisis cerebral es un grupo de trastornos del movimiento y la
        postura de por vida, causados por un daño en el cerebro en desarrollo
        antes, durante o poco después del nacimiento. El daño no empeora, aunque
        sus efectos pueden cambiar con el crecimiento.
    overview:
        - La parálisis cerebral es un grupo de trastornos del movimiento y la
          postura de por vida, causados por un daño en el cerebro en desarrollo
          antes, durante o poco después del nacimiento. El daño no empeora,
          aunque sus efectos cambian con el crecimiento.
    brain:
        m1:
            El daño en las áreas motoras o en sus vías causa los tipos
            espásticos.
        latvent:
            La lesión de la sustancia blanca periventricular es frecuente en los
            bebés prematuros.
        putamen: Su daño causa los tipos discinéticos.
        thalamus: A menudo se daña junto con los ganglios basales.
        cerebhemi: Su daño causa los tipos atáxicos.
    symptoms:
        - Músculos rígidos (espasticidad)
        - Movimientos involuntarios (tipo discinético)
        - Mal equilibrio y coordinación (tipo atáxico)
        - Retraso en los hitos motores
        - A veces epilepsia, discapacidad intelectual o problemas de visión y
          audición
    diagnosis:
        Evaluación clínica y resonancia magnética; a menudo se confirma hacia
        los 2 años.
    causes:
        - Nacimiento prematuro, bajo peso al nacer, infecciones durante el
          embarazo, falta de oxígeno e ictus en el bebé.
    treatment:
        - Fisioterapia, terapia ocupacional y logopedia; toxina botulínica y
          baclofeno; cirugía ortopédica; dispositivos de apoyo.
    course: De por vida; muchas personas llevan una vida independiente.
    prevalence:
        Alrededor de 2–3 por cada 1000 niños; la discapacidad física más
        frecuente en la infancia.
disease:et:
    name: Temblor esencial
    short: Temblor esencial
    aka:
        - temblor esencial
        - temblor familiar
    summary:
        El temblor esencial causa un temblor rítmico, principalmente de ambas
        manos durante la acción, como al escribir o sostener una taza. La cabeza
        y la voz también pueden temblar. Es el trastorno del movimiento más
        frecuente.
    overview:
        - El temblor esencial causa un temblor rítmico, principalmente de ambas
          manos durante la acción. Es el trastorno del movimiento más frecuente
          y a menudo es hereditario en las familias.
    brain:
        cerebhemi:
            La disfunción de los circuitos cerebelosos produce la oscilación que
            genera el temblor.
        dentate: Salida cerebelosa anómala.
        ventthal:
            El núcleo ventral intermedio transmite la señal del temblor y es la
            diana del tratamiento.
    symptoms:
        - Temblor de las manos durante la acción
        - Temblor de la cabeza o de la voz
        - Empeora con el estrés, la cafeína y el cansancio
        - A menudo mejora temporalmente con el alcohol
    diagnosis: Diagnóstico clínico.
    causes:
        - Marcadamente familiar en aproximadamente la mitad de los casos.
    treatment:
        - Propranolol y primidona; estimulación cerebral profunda o ultrasonido
          focalizado en los casos graves.
    course: Lentamente progresivo.
    prevalence:
        Alrededor del 1 % de la población general y varios puntos porcentuales
        de los mayores de 65 años.
disease:dystonia:
    name: Distonía
    short: Distonía
    aka:
        - distonía
        - distonías
        - tortícolis espasmódica
        - calambre del escritor
    summary:
        La distonía causa contracciones musculares sostenidas o intermitentes
        que producen movimientos de torsión y posturas anómalas. Puede afectar a
        una sola zona, como el cuello (distonía cervical) o la mano (calambre
        del escritor), o a todo el cuerpo.
    overview:
        - La distonía causa contracciones musculares sostenidas o intermitentes
          que producen movimientos de torsión y posturas anómalas. Puede ser
          focal, como la distonía cervical o el calambre del escritor, o
          generalizada.
    brain:
        putamen:
            La señalización anómala de los ganglios basales altera la selección
            de la actividad muscular.
        gp:
            El globo pálido interno es la diana de la estimulación cerebral
            profunda.
        cerebhemi: Cada vez se implica más a los circuitos cerebelosos.
        s1: Mapas sensoriales del cuerpo alterados.
    symptoms:
        - Posturas de torsión o de tirón
        - Giro del cuello
        - Calambre de la mano al escribir
        - Cierre de los párpados (blefaroespasmo)
        - A menudo desencadenada por acciones específicas
    diagnosis:
        Diagnóstico clínico; pruebas genéticas en los casos de inicio temprano.
    causes:
        - Genética, lesiones cerebrales, medicamentos o causa desconocida.
    treatment:
        - Inyecciones de toxina botulínica; medicamentos; estimulación cerebral
          profunda.
    course: Varía según el tipo.
    prevalence: El tercer trastorno del movimiento más frecuente.
disease:ataxia:
    name: Ataxias cerebelosas hereditarias
    short: Ataxia cerebelosa
    aka:
        - ataxia espinocerebelosa
        - ataxia de friedreich
        - ataxia cerebelosa
        - ataxias hereditarias
        - aec
    summary:
        Este grupo de enfermedades hereditarias, que incluye las ataxias
        espinocerebelosas y la ataxia de Friedreich, causa una pérdida
        progresiva de la coordinación a medida que el cerebelo y sus conexiones
        degeneran.
    overview:
        - Este grupo de enfermedades hereditarias, que incluye las ataxias
          espinocerebelosas y la ataxia de Friedreich, causa una pérdida
          progresiva de la coordinación a medida que el cerebelo y sus
          conexiones degeneran.
    brain:
        cerebhemi: Su degeneración causa torpeza de las extremidades.
        vermis: Su degeneración causa una marcha inestable.
        dentate: Degeneración, sobre todo en la ataxia de Friedreich.
        pons: Se afecta en varios tipos de AEC.
    symptoms:
        - Marcha inestable y con base amplia
        - Manos torpes
        - Habla arrastrada
        - Movimientos oculares anómalos
    diagnosis: Resonancia magnética y pruebas genéticas.
    causes:
        - Mutaciones genéticas, a menudo expansiones de repeticiones.
    treatment:
        - Fisioterapia y logopedia; omaveloxolona para la ataxia de Friedreich.
    course: Progresivas a lo largo de años o décadas.
    prevalence: Raras; cada tipo afecta a unas pocas personas por cada 100 000.
disease:wks:
    name: Síndrome de Wernicke-Korsakoff
    short: Wernicke-Korsakoff
    aka:
        - síndrome de wernicke-korsakoff
        - síndrome de korsakoff
        - psicosis de korsakoff
        - encefalopatía de wernicke
    summary:
        El síndrome de Wernicke-Korsakoff es un daño cerebral causado por la
        deficiencia de tiamina (vitamina B1). La encefalopatía de Wernicke es la
        fase aguda, con confusión, problemas de los movimientos oculares y
        marcha inestable; sin tratamiento puede evolucionar al síndrome de
        Korsakoff, con una pérdida de memoria grave y duradera.
    overview:
        - El síndrome de Wernicke-Korsakoff es un daño cerebral causado por la
          deficiencia de tiamina. La fase aguda (encefalopatía de Wernicke)
          causa confusión, problemas de los movimientos oculares e
          inestabilidad; sin tratamiento puede evolucionar al síndrome de
          Korsakoff, con una pérdida de memoria grave y duradera y
          confabulación.
    brain:
        mammillary: Su atrofia altera el circuito de memoria de Papez.
        mdthal: Su daño contribuye a la amnesia.
        antthal: Altera el circuito de la memoria.
        fornix: Desconexión del circuito de la memoria.
        vermis: Su daño causa una marcha inestable.
        midbrain: El daño cerca del acueducto afecta a los movimientos oculares.
    symptoms:
        - Confusión
        - Movimientos oculares anómalos
        - Marcha inestable
        - Incapacidad grave para formar nuevos recuerdos
        - "Confabulación: rellenar las lagunas de memoria con historias
          inventadas"
    diagnosis:
        Diagnóstico clínico; la resonancia magnética puede mostrar cambios
        alrededor del tercer ventrículo y el acueducto.
    causes:
        - Deficiencia de tiamina por consumo excesivo de alcohol, desnutrición,
          vómitos o cirugía bariátrica.
    treatment:
        - Tiamina intravenosa a dosis altas de forma urgente.
    course:
        El tratamiento precoz puede revertir los síntomas de Wernicke; la
        pérdida de memoria de Korsakoff a menudo persiste.
    prevalence:
        Se encuentra en alrededor del 1–2 % de las autopsias; a menudo pasa
        desapercibido en vida.
disease:wilson:
    name: Enfermedad de Wilson
    short: Enfermedad de Wilson
    aka:
        - enfermedad de wilson
        - degeneración hepatolenticular
    summary:
        La enfermedad de Wilson es un trastorno hereditario en el que el cuerpo
        no puede eliminar el cobre, que se acumula en el hígado y el cerebro.
        Causa enfermedad hepática, trastornos del movimiento y síntomas
        psiquiátricos, y suele comenzar entre los 5 y los 35 años.
    overview:
        - La enfermedad de Wilson es un trastorno hereditario en el que el
          cuerpo no puede eliminar el cobre, que se acumula en el hígado y el
          cerebro, causando enfermedad hepática, trastornos del movimiento y
          síntomas psiquiátricos.
    brain:
        putamen:
            Los depósitos de cobre son más marcados aquí, lo que altera el
            control del movimiento.
        gp: Daño por cobre.
        caudate: Daño por cobre.
        midbrain:
            Puede producir el signo de la «cara de oso panda gigante» en la
            resonancia magnética.
        pons: Se afecta en algunos casos.
    symptoms:
        - Temblor, rigidez y movimientos anómalos
        - Habla arrastrada y babeo
        - Depresión, cambios de personalidad o psicosis
        - Problemas hepáticos
        - Anillos de color cobrizo alrededor de la córnea (anillos de
          Kayser-Fleischer)
    diagnosis:
        Ceruloplasmina en sangre, cobre en orina, examen ocular para detectar
        anillos de Kayser-Fleischer, biopsia hepática y pruebas genéticas.
    causes:
        - Mutaciones en ATP7B, heredadas con un patrón autosómico recesivo.
    treatment:
        - Quelación de por vida (penicilamina o trientina) o zinc, y una dieta
          baja en cobre.
    course: Con tratamiento precoz, la esperanza de vida puede ser casi normal.
    prevalence: Alrededor de 1 de cada 30 000 personas.
